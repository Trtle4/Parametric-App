<!-- The harness takes the app's OWN design tokens, fetched from index.html
     at boot rather than copied here. Two reasons it needs them at all, both
     found by mutation: text METRICS follow the font that actually resolves,
     so with --mono undefined a proportional fallback measures ~25% narrower
     and an overflowing line "fits"; and the PNG exporter inlines var(--x)
     from the live document, so with no tokens defined nothing resolves and
     the export pin cannot tell a working exporter from a broken one. Only
     the :root token block is pulled in — none of the layout CSS, which the
     skeleton deliberately does without. -->
<script>
  // synchronous on purpose: the tokens must be in the document BEFORE app.js
  // boots and before the first pin measures anything. A fetch would land after
  // both, and a pin reading an unstyled document is a pin that cannot fail.
  (function(){
    try{
      const x = new XMLHttpRequest();
      x.open('GET', '../index.html', false);
      x.send();
      const m = x.responseText.match(/:root\{[\s\S]*?\n\s*\}/);
      if(!m) throw new Error('no :root token block in index.html');
      const st = document.createElement('style');
      st.textContent = m[0];
      document.head.appendChild(st);
    }catch(e){ document.write('<h1>token load failed: ' + e.message + '</h1>'); }
  })();
</script>

<!--
  Prompt 18's point, made structural: lockinvariant.test.html asserted
  displayed === project at MOUNT time only. The bug (dims boxes frozen
  after a SIBLING control's edit, the 3D hierarchy view reading a stale
  build.js row cache) lived entirely in the gap BETWEEN mounts — a fresh
  mount was always correct, so a mount-time-only test could pass 12/12
  forever while the app was broken. This page boots the REAL app.js (the
  same wiring index.html loads) against a bare copy of its DOM, drives the
  REAL controls with real DOM events (never touches the project object
  directly), and asserts every displayed value the app owns still equals
  the project after each edit — not just right after a mount.
-->
<!--
  MOBILE FIXTURE. Every other pin in this file runs against the bare
  skeleton above, which — as its own comment elsewhere in this file says —
  deliberately loads no layout CSS: only :root tokens, for text metrics and
  var(--x) resolution. That is exactly why a reachability pin run only
  against it can never see a wrap, a clip, or an @media-hidden control: the
  CSS that does that clipping was never in the document to begin with. The
  perforation reachability pins passed while State sheet and exploded were
  unreachable on a phone for precisely this reason — desktop-shaped proof,
  nothing about a 390px screen.

  This iframe loads the REAL index.html — real CSS, real @media breakpoints,
  its own independent app.js boot — at 390x600: a genuine phone width and a
  post-browser-chrome height (Safari/Chrome's own toolbars eat ~150-250px of
  a ~800px device before the page ever sees it; testing at the full,
  chrome-less device height is the same mistake in miniature, and is exactly
  why an earlier manual check of this file's two header buttons at 390x844
  reported them reachable when 390x600 does not). Parked off-screen so it
  never overlaps the visible suite, but never display:none — an @media query
  needs real layout to evaluate against, and a non-rendered iframe computes
  none.
-->

// app.js is a wiring module with side effects only (no useful exports) —

await import('../src/ui/app.js');

const el = id => document.getElementById(id);
// Exceptions thrown inside a DOM event listener do NOT propagate out of
// dispatchEvent()/click() — the browser reports them via window.onerror
// instead — so a plain try/catch in t() would MISS a crash fired from a
// change/click handler and the test would falsely pass. Trap them here.
const uncaught = [];
window.addEventListener('error', e => uncaught.push(e.message || (e.error && e.error.message) || 'unknown error'));
const results = [];
/* t() runs the body SYNCHRONOUSLY, so an async body's throw becomes an
 * unhandled rejection and the pin reports PASS — a false green that looks
 * exactly like a passing test, for every assertion in it. Rather than teach
 * the runner to await (which would reorder every pin), an async body is
 * refused outright: put the awaits in the enclosing block and keep the pin
 * synchronous. Four pins in this file were already written that way. */
function t(name, fn){
  try{
    const r = fn();
    if(r && typeof r.then === 'function'){
      results.push(`FAIL  ${name}: async pin body — t() cannot await it, so every assertion inside is unchecked`);
      return;
    }
    results.push(`PASS  ${name}`);
  } catch(e){ results.push(`FAIL  ${name}: ${e.message || e}`); }
}
function approx(a, e, msg = '', tol = 1e-6){ if(Math.abs(a - e) > tol) throw new Error(`${msg} expected ${e}, got ${a}`); }
function eq(a, e, msg = ''){ if(a !== e) throw new Error(`${msg} expected ${JSON.stringify(e)}, got ${JSON.stringify(a)}`); }
function fire(node, type){ node.dispatchEvent(new Event(type, {bubbles: true})); }
async function settle(){ await new Promise(r => setTimeout(r, 0)); }

/** Wait for the RENDER, not just the model. Overlays (the Dims sheet) and the
 *  3D scene are painted from fold3d's frame loop, so anything read out of the
 *  DOM after a toggle needs the frame that draws it. Reading in the same
 *  synchronous turn is a race, and it is one the fixture loses under load: the
 *  Dims-split pin failed 3 runs in 4 with "Load/Total lines missing" before
 *  this existed. Polls one animation frame at a time; returns false on timeout
 *  so the caller reports a real failure rather than hanging. */
async function waitFrames(ready, ms = 3000){
  const t0 = performance.now();
  while(!ready()){
    if(performance.now() - t0 > ms) return false;
    await new Promise(r => requestAnimationFrame(r));
  }
  return true;
}

/* ---- THE INSTRUMENT, and its calibration ----
 * A pin is only as sharp as the comparison it measures with. Classifying a
 * rendered pixel by ABSOLUTE channel thresholds fails under lighting: a lit
 * purple (#8800ff) renders ~[72,0,135], and an absolute test buckets that as
 * blue — which is exactly how a palette pin once reported both of the pack's
 * bottom halves correct when one of them was wrong. A false pass looks
 * identical to a fixed bug.
 *
 * So a swatch is read by RATIO to the brightest channel (a chromaticity, which
 * lighting scales out) against the NEAREST palette entry, and every reading
 * certifies itself: the nearest entry must be both close enough AND clearly
 * closer than the runner-up. A sample that lands between two swatches — an
 * antialiased edge, a colour the palette cannot separate — comes back
 * AMBIGUOUS and fails loudly instead of picking one.
 *
 * The reader is then CALIBRATED against its own palette (see the pin below):
 * assuming an instrument discriminates is the same mistake one level down.
 */
function makeSwatchReader(palette){
  const norm = c => { const m = Math.max(...c); return m > 0 ? c.map(x => x/m) : [0, 0, 0]; };
  const ref = palette.map(p => ({name: p.name, n: norm(p.rgb)}));
  const read = (c, tol = 0.55, margin = 0.25) => {
    if(Math.max(...c) < 25) return 'BACKGROUND';
    const n = norm(c);
    let best = null, bd = Infinity, sd = Infinity;
    for(const q of ref){
      const d = Math.hypot(n[0] - q.n[0], n[1] - q.n[1], n[2] - q.n[2]);
      if(d < bd){ sd = bd; bd = d; best = q.name; } else if(d < sd) sd = d;
    }
    if(bd >= tol) return `?(${c.join(',')})`;
    if(sd - bd < margin) return `AMBIGUOUS between ${best} and its neighbour (${c.join(',')})`;
    return best;
  };
  read.entries = ref;
  return read;
}

/** The two palettes the render pins read. Kept here, beside the reader, so the
 *  calibration pin below covers exactly the swatches the pins actually use. */
const QUAD_PALETTE = [
  {name: 'RED', rgb: [255, 0, 0]}, {name: 'YELLOW', rgb: [255, 255, 0]},
  {name: 'BLUE', rgb: [0, 0, 255]}, {name: 'GREEN', rgb: [0, 255, 0]}
];
// Normalising by the brightest channel projects onto chromaticity, and that
// space holds only SEVEN mutually-distant colours (the saturated corners plus
// white, all 1.0 apart). Eight panels do not fit: the first attempt used
// orange for SIDE-hi, which the calibration pin below measured at 0.47 from
// RAMP's yellow — under the reader's own resolution. So the faces are covered
// in TWO passes with a well-separated palette each, rather than one pass with
// a palette the instrument cannot read.
const BAND_PALETTE = [                        // pass A — the girth walk + fin
  {name: 'BACK-lo', rgb: [0, 0, 255]},        // artMap faces[0]
  {name: 'SIDE-lo', rgb: [0, 255, 0]},        // faces[1]
  {name: 'FRONT',   rgb: [255, 0, 0]},        // faces[2]
  {name: 'SIDE-hi', rgb: [0, 255, 255]},      // faces[3]
  {name: 'BACK-hi', rgb: [255, 0, 255]},      // faces[4]
  {name: 'FIN',     rgb: [255, 255, 0]},      // the fin allowance band
  {name: 'COLUMN',  rgb: [255, 255, 255]}     // ramp/end columns — a stray sample must show
];
const COLUMN_PALETTE = [                      // pass B — the end allowances
  {name: 'RAMP', rgb: [255, 255, 0]}, {name: 'END', rgb: [255, 0, 255]},
  {name: 'BAND', rgb: [0, 0, 255]},           // every girth band, as one colour
  {name: 'FIN',  rgb: [0, 255, 255]}
];
const readQuad = makeSwatchReader(QUAD_PALETTE);
const readBand = makeSwatchReader(BAND_PALETTE);
const readColumn = makeSwatchReader(COLUMN_PALETTE);

t('swatch reader: every palette colour stays itself under real render lighting', () => {
  // Calibration, not a render test. The renderer's own shading attenuates a
  // swatch to roughly 0.45-1.0 of its authored value (measured off these very
  // pins: #0000ff comes back [0,0,134], #8800ff comes back ~[72,0,135]); this
  // sweeps wider than that and requires every entry to still read as itself.
  // The old absolute-threshold classifier fails this at the first step down.
  for(const [label, reader, palette] of [['quadrant', readQuad, QUAD_PALETTE],
                                         ['band', readBand, BAND_PALETTE],
                                         ['column', readColumn, COLUMN_PALETTE]]){
    for(const sw of palette){
      for(let k = 0.30; k <= 1.0001; k += 0.05){
        const lit = sw.rgb.map(x => Math.round(x*k));
        const got = reader(lit);
        if(got !== sw.name)
          throw new Error(`${label} palette: ${sw.name} at ${(k*100).toFixed(0)}% light reads "${got}" [${lit.join(',')}]`);
      }
    }
  }
});

t('swatch reader: no two palette colours collapse into each other', () => {
  // The separation the readings depend on, stated as a number. If a future
  // palette adds a colour too close to an existing one, this fails HERE rather
  // than by silently mis-bucketing a face somewhere downstream.
  for(const [label, reader] of [['quadrant', readQuad], ['band', readBand], ['column', readColumn]]){
    let worst = Infinity, pair = '';
    const e = reader.entries;
    for(let i = 0; i < e.length; i++) for(let j = i + 1; j < e.length; j++){
      const d = Math.hypot(e[i].n[0] - e[j].n[0], e[i].n[1] - e[j].n[1], e[i].n[2] - e[j].n[2]);
      if(d < worst){ worst = d; pair = `${e[i].name}/${e[j].name}`; }
    }
    // The reader answers only when the runner-up is 0.25 further away, and a
    // real sample carries error of its own (the fin's, contaminated by the
    // antialiased edge against the bottom face, measured 0.34 off ideal). A
    // pair must clear both: 0.25 + 2x0.34 ≈ 0.93. All three palettes here sit
    // at 1.0 — saturated corners — with room to spare.
    if(worst < 0.9)
      throw new Error(`${label} palette: ${pair} are only ${worst.toFixed(2)} apart — closer than the reader can resolve`);
  }
});

/** Deep snapshot / restore of the live project, for pins and blocks that must
 *  edit it. Restore is IN PLACE — the same object identities survive — because
 *  blocks capture references into the project (`const link1 = linkFor(...)`)
 *  and a wholesale replacement would leave those pointing at a dead object.
 *  Restores what was FOUND, never an assumed default: three fixtures "reset"
 *  a field to a hardcoded value that was never there (the case wall clearance
 *  went back as 0 against a real 1.5) and silently re-sized every later pin's
 *  case. */
const snapProject = () => JSON.parse(JSON.stringify(build.project));
function deepRestore(target, src){
  for(const k of Object.keys(target)) if(!(k in src)) delete target[k];
  for(const [k, v] of Object.entries(src)){
    const cur = target[k];
    if(v && typeof v === 'object' && cur && typeof cur === 'object' &&
       Array.isArray(v) === Array.isArray(cur)){
      if(Array.isArray(v) && v.length !== cur.length) target[k] = JSON.parse(JSON.stringify(v));
      else deepRestore(cur, v);
    }else{
      target[k] = (v && typeof v === 'object') ? JSON.parse(JSON.stringify(v)) : v;
    }
  }
}
/** Restore the project AND re-display it: recompute drives every registered
 *  consumer, and re-mounting the active level re-writes the rail fields from
 *  the restored values (a field left showing an edited number is a leak too).
 *  Pass `key` (from getSelectedCandidateKey() on the way in) to hand the
 *  candidate SELECTION back too — cycling commits, and a committed candidate
 *  resolves a different case for every pin after it. */
function restoreProject(snap, key){
  deepRestore(build.project, snap);
  build.recompute(key);          // undefined keeps the current pick; null clears it
  setLevel(el('style').value);
}

/** A pin that EDITS the project. Same contract as t(), plus: it snapshots on
 *  the way in and hands everything back on the way out — the project, the rail
 *  fields that display it, and the active level — whether the body passes,
 *  fails, or throws. ONE restore path rather than a hand-written `finally` per
 *  pin: the same reason the app has one recompute() notifier. Use it for any
 *  pin that types into a field or writes the project; keep plain t() for pins
 *  that only read. */
function tEdit(name, fn){
  t(name, () => {
    const snap = snapProject(), lvl = el('style').value, key = build.getSelectedCandidateKey();
    try{ fn(); }
    finally{ restoreProject(snap, key); if(el('style').value !== lvl) setLevel(lvl); }
  });
}

function setLevel(level){ el('style').value = level; fire(el('style'), 'change'); }

/** Drive the vertical-axis MULTI-SELECT to a SINGLE axis (the old select's
 *  behaviour): check the target first (so the "never zero axes" guard never
 *  fires mid-toggle), then clear the others. Mirrors how a user narrows the
 *  comparison back to one standing orientation. */
function setVertAxis(idp, axis){
  const tgt = el(idp + 'Ax' + axis);
  if(tgt && !tgt.checked){ tgt.checked = true; fire(tgt, 'change'); }
  for(const a of ['H', 'L', 'W']){
    if(a === axis) continue;
    const b = el(idp + 'Ax' + a);
    if(b && b.checked){ b.checked = false; fire(b, 'change'); }
  }
}

/** Read the currently-mounted dims boxes (mm), only for keys actually
 *  present as <input id="p_KEY"> — mirrors what a user looking at the
 *  rail would see. */
function shownDims(){
  const out = {};
  for(const input of document.querySelectorAll('#dimFields input[id^="p_"]')){
    const key = input.id.slice(2);
    out[key] = inputs.getUnit() === 'mm' ? +input.value : null;   // mm-unit test fixture stays in mm throughout
  }
  return out;
}

/* ==================================================================

   the link starts 'auto' (cartons/case) or explicit nx*ny*nz (wraps/

   was PURELY DERIVED (nx*ny*nz) and never read by the solver at all —
   typing into the count field had zero effect. The fix: typing a count
   always switches the link to 'auto' first, since a specific total and
   a fixed grid are mutually exclusive asks. The count control itself is

   field) — that two-control split was the exact seam this bug lived in.
   ================================================================== */
await (async () => {
  setLevel('carton'); el('tab2d').click(); await settle();
  const advisorySnap = snapProject();
  const link1 = linkFor(build.project, 'secondary');   // wraps-per-carton
  // earlier tests in this file may have left this link in either shape —
  // force it back to an EXPLICIT grid so this block tests what it says. Each
  // pin below re-runs this, so none of them inherits the previous one's shape.
  const fixGrid = () => {
    link1.arrangement = {nx: 1, ny: 4, nz: 2}; link1.count = 8;
    el('pInArr').value = 'explicit'; fire(el('pInArr'), 'change');
    // set a known grid through the real inputs (the Arr→explicit handler seeds
    // the tier's defaults, so drive nx/ny/nz to fix a value this block asserts on)
    el('pInNx').value = '1'; fire(el('pInNx'), 'input');
    el('pInNy').value = '4'; fire(el('pInNy'), 'input');
    el('pInNz').value = '2'; fire(el('pInNz'), 'input');
  };
  fixGrid(); await settle();
  const gridProduct = link1.arrangement.nx*link1.arrangement.ny*link1.arrangement.nz;   // 8
  // UAT #3: typing a count while a MANUAL grid is active must WARN, not
  // silently discard the grid. The switch is deferred to a deliberate choice.
  tEdit('custom count vs manual grid: typing a count does NOT silently discard the grid; it warns', () => {
    if(link1.arrangement === 'auto') throw new Error('test assumption violated: this link should start explicit');
    el('pInC').value = '5'; fire(el('pInC'), 'input');
    if(link1.arrangement === 'auto') throw new Error('grid silently discarded — the exact UAT #3 regression');
    if(!el('pInWarn').querySelector('.countwarn')) throw new Error('no count advisory shown');
  });
  // each of the three below OPENS THE ADVISORY ITSELF. They used to run as a
  // chain — "keep grid" clicked a #pInKeep that only existed because the pin
  // above it had typed a count, and "reaches the chain" asserted on a count a
  // third pin had set. Alone, the first threw `null.click()` and the second
  // read the old derived 8.
  const openAdvisory = () => {
    fixGrid();                                          // manual grid, known product
    el('pInC').value = '5'; fire(el('pInC'), 'input');   // typing a count opens it
    if(!el('pInKeep')) throw new Error('the count advisory did not open');
  };
  tEdit('count advisory "keep grid" preserves the manual arrangement', () => {

/* ==================================================================
   The count field is a bare <input type=number>, not a dropdown — so
   the browser's own numeric parsing is the only thing standing between
   a keystroke and a corrupted project. 0, negative, decimal, and empty
   must all clamp or revert to a valid value, never write 0 or NaN into
   link.count (which would propagate into a 0-child solve downstream).
   ================================================================== */
await (async () => {
  const invalidSnap = snapProject();
  setLevel('carton'); await settle();
  const link1 = linkFor(build.project, 'secondary');
  link1.arrangement = 'auto'; link1.count = 8; inputs.refreshCountArrangement('pIn', link1);

    el('pInC').value = '0'; fire(el('pInC'), 'input');
    if(!(Number.isInteger(link1.count) && link1.count >= 1)) throw new Error(`count corrupted: ${link1.count}`);
  });
  tEdit('invalid count at carton level: negative does not corrupt the project', () => {
    el('pInC').value = '-3'; fire(el('pInC'), 'input');
    if(!(Number.isInteger(link1.count) && link1.count >= 1)) throw new Error(`count corrupted: ${link1.count}`);
  });
  tEdit('invalid count at carton level: decimal rounds to an integer, never truncated to 0', () => {
    link1.count = 8;
    el('pInC').value = '5.6'; fire(el('pInC'), 'input');
    eq(link1.count, 6, 'rounds to nearest integer:');
  });
  tEdit('invalid count at carton level: empty reverts to the current valid value, not 0/NaN', () => {
    link1.count = 8;
    el('pInC').value = ''; fire(el('pInC'), 'input');
    eq(link1.count, 8, 'unchanged, not 0/NaN:');
  });

  setLevel('case'); await settle();
  const link0 = linkFor(build.project, 'tertiary');
  link0.arrangement = 'auto'; link0.count = 12; inputs.refreshCountArrangement('pIn', link0);
  tEdit('invalid count at case level: 0/negative/decimal/empty all clamp or revert, never 0/NaN', () => {
    el('pInC').value = '0'; fire(el('pInC'), 'input');
    if(!(Number.isInteger(link0.count) && link0.count >= 1)) throw new Error(`0 corrupted count: ${link0.count}`);
    el('pInC').value = '-9'; fire(el('pInC'), 'input');
    if(!(Number.isInteger(link0.count) && link0.count >= 1)) throw new Error(`negative corrupted count: ${link0.count}`);
    link0.count = 12;
    el('pInC').value = '3.2'; fire(el('pInC'), 'input');
    eq(link0.count, 3, 'decimal rounds:');
    link0.count = 12;
    el('pInC').value = ''; fire(el('pInC'), 'input');
    eq(link0.count, 12, 'empty reverts, not 0/NaN:');
  });
  restoreProject(invalidSnap);   // every pin here types into a real link — undo it
})();

/* ==================================================================
   Fix #1 (P0): disabling ANY single level must never throw, and must
   never blank a view that still has valid data.

   The regression: the 'railDims' refresh consumer read
   LEVELS.wrap.lockedOf(project) === project.primary.wrap.locked, which
   throws the instant the wrap goes null (disabled) while Wrap is the
   active level. Because refreshAll() ran every consumer in ONE loop,
   that first throw aborted every LATER consumer (chain string, 2D/3D,
   the pallet readout, autosave) for that edit — one bad read killed the
   whole notify cycle. The throw escaped through a DOM event handler, so
   it never surfaced as a catchable exception (hence the window-error
   trap above). Two fixes, tested here: guard the null read, AND isolate
   each consumer in refreshAll() so one throw can't abort the rest.
   ================================================================== */
await (async () => {
  // exercise the 3D hierarchy view explicitly: disabling a tier re-runs the
  // hierarchy render synchronously (setActiveLevel -> apply3dMode), a path the
  // refreshAll isolation does NOT wrap — disabling the wrap here used to deref
  // a null bundle.wraps in hierarchy3d and crash. Cover it directly.
  el('tab3d').click(); await settle();
  for(const lvl of ['wrap', 'carton', 'case']){
    setLevel(lvl); await settle();
    uncaught.length = 0;
    el('tierToggleBtn').click(); await settle();   // opens the "Disable ...?" confirmation
    confirmDisable(); await settle();

    t(`disable ${lvl} (as the active level): no uncaught error escapes the notify cycle`, () => {
      if(uncaught.length) throw new Error(`disabling ${lvl} threw: ${uncaught.join('; ')}`);
    });
    t(`disable ${lvl}: the chain still resolves to valid candidates (Build view not blanked)`, () => {
      if(build.getRows().length === 0) throw new Error(`getRows() empty after disabling ${lvl} — a downstream view has no data`);
    });
    // wrap/carton disabled leaves the CASE outermost — a valid tier still
    // rides the pallet, so its readout must not fall back to the '--'
    // no-geometry placeholder. (Case-disabled -> carton-outermost is
    // Fix #2's concern and is asserted in its own block below.)
    if(lvl !== 'case'){
      t(`disable ${lvl}: the pallet readout still shows a count (view not blanked)`, () => {
        if(el('palTot').textContent === '--') throw new Error(`pallet total blanked ('--') though the case still rides the pallet after disabling ${lvl}`);
      });
    }

    setLevel(lvl); await settle();                 // re-enable (no confirm needed) for the next iteration
    el('tierToggleBtn').click(); await settle();
  }
  t('after disabling/re-enabling every tier in turn, the full chain is restored', () => {
    eq(build.project.secondary.enabled, true, 'carton re-enabled:');
    eq(build.project.tertiary.enabled, true, 'case re-enabled:');
    if(!build.project.primary.wrap) throw new Error('wrap not restored');
  });
})();

/* refreshAll() isolation, tested directly: a consumer that throws must
   NOT stop a consumer registered after it from running, and the throw
   must be contained (logged), not surface as an uncaught error. */
await (async () => {
  let laterRan = false;
  notify.onRefresh('__uisync_thrower', () => { throw new Error('deliberate consumer failure'); });
  notify.onRefresh('__uisync_sentinel', () => { laterRan = true; });
  try{
    uncaught.length = 0;
    build.recompute();   // runs refreshAll() as its own last step
    t('refreshAll isolation: a consumer registered after a throwing one still runs', () => {
      if(!laterRan) throw new Error('sentinel consumer did not run — a thrown consumer aborted the rest');
    });
    t('refreshAll isolation: the thrown error is contained, not an uncaught window error', () => {
      if(uncaught.length) throw new Error(`isolation leaked an uncaught error: ${uncaught.join('; ')}`);
    });
  }finally{
    notify.offRefresh('__uisync_thrower');
    notify.offRefresh('__uisync_sentinel');
  }
})();

/* ==================================================================
   Fix #2 (P0): the pallet readout + 3D pallet render read the
   OUTERMOST enabled tier, not a hardcoded 'case'. With the case
   disabled the carton rides the pallet; refreshPal() hardcoded the
   (now-null) case geometry, which blanked the readout and the
   Palletize view even though the carton palletized fine, and the
   3D-Fold pallet depth dereferenced that null case geometry outright.
   ================================================================== */
await (async () => {

  t('palletize (case enabled): readout is populated and the title block names CASES', () => {
    if(!(totNum() > 0)) throw new Error(`pallet total not populated with case enabled: "${el('palTot').textContent}"`);
    if(!/\bcases\b/.test(el('tbPallet').textContent)) throw new Error(`title block should name cases: "${el('tbPallet').textContent}"`);
  });

  // disable the case -> the CARTON now rides the pallet directly
  el('tierToggleBtn').click(); await settle();      // "Disable case?" confirmation
  confirmDisable(); await settle();
  t('palletize (case disabled): readout is NOT blanked — the carton palletizes', () => {

      throw new Error(`pallet readout blanked with the case disabled (the exact Fix #2 regression): palTot="${el('palTot').textContent}"`);
  });
  t('palletize (case disabled): the title block names CARTONS, not cases (reads the outermost tier)', () => {
    if(!/\bcartons\b/.test(el('tbPallet').textContent))
      throw new Error(`title block should name cartons once the case is off: "${el('tbPallet').textContent}"`);
  });

  // the 3D-Fold pallet DEPTH must render the outermost tier without throwing
  uncaught.length = 0;
  el('tab3d').click(); await settle();
  el('d_pallet').click(); await settle();           // pallet depth, case still disabled
  t('palletize (case disabled): the 3D pallet depth renders without throwing', () => {
    if(uncaught.length) throw new Error(`3D pallet depth threw with the case disabled: ${uncaught.join('; ')}`);
    if(el('hierHud').style.display === 'none' || !el('hierHud').textContent)
      throw new Error('3D pallet hierarchy HUD is empty/hidden — buildPallet likely bailed on the null case geometry');
  });

  // restore for any later work / a clean end state
  el('tab2d').click(); setLevel('case'); await settle();
  el('tierToggleBtn').click(); await settle();       // re-enable the case (no confirm)
})();

/* ==================================================================
   Cases-per-pallet has ONE source. The right-rail readout, the title
   block, and the mobile spec must all show the SAME filled-case count as
   the resolved candidate row (row.casesPerPallet) — the number core
   computed — never an independent in-view re-pack. That second packer
   diverged: it stacked the resolved case at a layer pitch borrowed from
   an unrelated candidate row, reporting 132 filled cases where only 72
   physically fit (22 layers of a 114 mm case in a 1397 mm budget). Pinned
   to the default project's 72.
   ================================================================== */
await (async () => {
  // reset to a PRISTINE default so this genuinely pins the default project,

  setLevel('case'); el('tab2d').click(); await settle();
  const num = id => { const m = el(id).textContent.match(/(\d+)/); return m ? +m[1] : null; };
  // the resolved row (what every view renders when nothing is picked) is the
  // freight-optimal one — resolveActiveRow(null)'s max-cartonsPerPallet pick
  const resolved = build.getRows().reduce((a, b) => (b.cartonsPerPallet > (a ? a.cartonsPerPallet : -1) ? b : a), null);
  t('cases/pallet: right-rail total equals the resolved row\'s casesPerPallet (single source)', () => {
    eq(num('palTot'), resolved.casesPerPallet, 'palTot vs row.casesPerPallet:');

    eq(num('tbPallet'), num('palTot'), 'tbPallet vs palTot:');
    eq(num('msPallet'), num('palTot'), 'msPallet vs palTot:');
  });
  t('cases/pallet: default project pins to 60 filled cases, 12 layers (end-seal angles grew the default wrap from the old 72)', () => {
    eq(num('palTot'), 60, 'default cases/pallet:');
    eq(el('palCnt').textContent.replace(/\s/g, ''), '5×12', 'per-layer × layers:');
  });
  t('cases/pallet: the Build table shows that same count for the resolved row', () => {
    el('tabBuild').click();
    const heads = [...document.querySelectorAll('#bTable th')].map(x => x.textContent.trim());
    const ci = heads.findIndex(h => /Cases\/pallet/.test(h));
    const cells = [...document.querySelectorAll('#bTable tbody tr')]
      .map(tr => [...tr.querySelectorAll('td')][ci].textContent);
    if(!cells.some(c => new RegExp(`\\b${resolved.casesPerPallet}\\b`).test(c)))
      throw new Error(`no Build row shows ${resolved.casesPerPallet} cases/pallet; cells=${JSON.stringify(cells)}`);
    el('tab2d').click();
  });
})();

/* ==================================================================
   Part B (chain legibility): the chain strip, the arrangement badge +

await (async () => {

   * project.interlayer enum; the chain strip renders exactly one
   * "Interlayer" node with a None/Tray/U-board <select>, never two

  tEdit('interlayer slot: ONE node, a mode selector — never two independent chips', () => {

      throw new Error(`mode selector options: expected ["none","tray","uboard"], got ${JSON.stringify(optVals)}`);
    eq(sel.value, 'none', 'default mode:');
  });
  tEdit('interlayer exclusivity: picking U-board via the selector turns tray OFF, and vice versa — never both', () => {
    const sel = stripNode('Interlayer').querySelector('select');
    sel.value = 'tray'; fire(sel, 'change');
    eq(build.project.interlayer, 'tray', 'after picking Tray:');
    if(build.project.interlayer === 'uboard') throw new Error('U-board came on alongside tray — exclusivity broken');
    sel.value = 'uboard'; fire(sel, 'change');
    eq(build.project.interlayer, 'uboard', 'after picking U-board:');
    if(build.project.interlayer === 'tray') throw new Error('tray stayed on alongside U-board — exclusivity broken');
    // no reachable state has both: the model has exactly one field, so this
    // holds by construction, but confirm the CONTROL enforces it too — the
    // selector itself can only ever hold one value.
    eq(sel.value, 'uboard', 'selector reflects the single live mode:');
    sel.value = 'none'; fire(sel, 'change');
    eq(build.project.interlayer, 'none', 'back to none:');
  });

  /* ---- Phase B follow-up: the U-board DXF path. UNLIKE the tray (a
   * multiview with no cut/crease — no dieline, DXF stays disabled, STL
   * offered instead — see the pre-existing tray pin above), the U-board IS
   * a real rigid blank: DXF must be AVAILABLE for it, using the exact same
   * dependency-free buildDXF()/downloadDXF() every carton/case dieline
   * already uses (export/dxf.js imports nothing but core/units.js — no CDN,
   * no new dependency; the only CDN gap in this app is test/dxf.test.html's
   * OWN verification parser, unrelated to the production export path). And
   * it fails VISIBLY (a notice), never silently, in the disabled-button
   * edge case a synthesized click could still reach. */
  tEdit('U-board exports: DXF is available (unlike the tray); the DXF matches what is on screen', () => {
    const sel = stripNode('Interlayer').querySelector('select');
    sel.value = 'uboard'; fire(sel, 'change');
    setLevel('uboard');
    if(el('btnDXF').disabled) throw new Error('the U-board has a real dieline — DXF must be available');
    if(el('btnSTL').style.display !== 'none') throw new Error('STL (a 3D-part export) must not be offered for the U-board — it has a real dieline, use DXF');
    const ub = build.getRows().reduce((a, b) => (b.cartonsPerPallet > (a ? a.cartonsPerPallet : -1) ? b : a), null).uboard;

  tEdit('U-board exports: DXF is unavailable and disabled when the U-board is off', () => {
    const sel = stripNode('Interlayer').querySelector('select');
    sel.value = 'none'; fire(sel, 'change');
    setLevel('uboard');
    if(!el('btnDXF').disabled) throw new Error('no U-board in the chain — DXF must stay disabled');
  });

  /* ---- Phase B: cascade — a U-board contribution can legitimately change
   * downstream counts. This is correct behaviour (CLAUDE.md/task spec), not
   * a bug to suppress, so it is pinned as a real, observable change — read
   * off the resolved row the chain already computed (never re-derived here),
   * driven through the real chain-strip selector + the real U-board rail
   * inputs, the way a user would actually reach this state.
   *
   * cartons/case is normally a FIXED requested count (link.count), not
   * something that responds to size at all — so a pin against the DEFAULT
   * project would be pinning the wrong quantity, not a cascade. Cartons/case
   * only becomes a genuinely SOLVED-FOR-FIT quantity when the link carries a
   * RANGE (link.countMax — see CLAUDE.md's "Cartons-per-case is a RANGE"),
   * which is exactly the config this pin sets up: the freight-optimal pick
   * within 10..20 cartons/case, before and after the U-board.
   *
   * build.loadProject()'s own render pipeline settles over a tick (the
   * SAME reason the pre-existing "cases/pallet" pins above await settle()
   * after it) — these two blocks use plain awaits between steps rather than
   * t()/tEdit(), which refuse async bodies (see CLAUDE.md), then assert
   * synchronously once state has actually settled. */
  {
    const snap = snapProject(), lvl = el('style').value, key = build.getSelectedCandidateKey();
    const rangedProject = () => {
      const p = newProject();
      p.links[0] = {parent: 'tertiary', child: 'secondary', count: 10, arrangement: 'auto', countMax: 20, locked: false};
      return p;
    };
    try{
      build.loadProject({project: rangedProject(), selectedCandidate: null}); await settle();
      const bestOf = () => build.getRows().reduce((a, b) => (b.cartonsPerPallet > (a ? a.cartonsPerPallet : -1) ? b : a), null);
      const before = bestOf();
      const sel = stripNode('Interlayer').querySelector('select');
      sel.value = 'uboard'; fire(sel, 'change'); await settle();
      setLevel('uboard'); await settle();
      el('ub_caliper').value = '15'; fire(el('ub_caliper'), 'input'); await settle();
      el('ub_f').value = '80'; fire(el('ub_f'), 'input'); await settle();
      const after = bestOf();
      t('cascade: a large U-board contribution changes cartons/case (ranged link, freight-optimal pick)', () => {
        if(before.cartonsPerCase === after.cartonsPerCase)
          throw new Error(`expected cartonsPerCase to change; both are ${before.cartonsPerCase}`);
      });
      t('cascade: the same large U-board contribution changes cases/pallet', () => {
        if(before.casesPerPallet === after.casesPerPallet)
          throw new Error(`expected casesPerPallet to change; both are ${before.casesPerPallet}`);
      });
    }finally{
      restoreProject(snap, key); if(el('style').value !== lvl) setLevel(lvl);
    }
  }

  t('arrangement badge + inert facing: MANUAL disables the facing select with a hint; AUTO re-enables it', () => {
    const snap = snapProject(), lvl = el('style').value;

/* ==================================================================
   Item 3: length >= width, enforced on EDIT only, for the corrugated/
   folding-carton convention (cartons and cases) — never on load, never
   for a level outside the convention. Drives the REAL #p_L/#p_W fields
   through the real lock control, the way a user actually does it.
   ================================================================== */
await (async () => {
  const snap3 = snapProject(), key3 = build.getSelectedCandidateKey(), lvl3 = el('style').value;

  const unlock = () => {
    if(el('levelLockBtn').textContent.trim() === 'Unlock to edit') el('levelLockBtn').click();
  };
  const setDim = (id, mmVal) => { el(id).value = String(mmVal); fire(el(id), 'input'); fire(el(id), 'change'); };
  // Whatever the level's DERIVED dims happened to solve to before unlocking
  // (arbitrary — driven by the rest of the chain, and can itself already
  // have W > L) is not a safe starting point for a controlled swap test: a
  // single setDim could trigger an unintended swap before the pin's own
  // edit even runs. Seed a known baseline first, in an order that cannot
  // itself cross the L>=W boundary — W tiny, then L comfortably larger —
  // so every pin below starts from an identical, swap-free state.
  const seed = (safeL, safeW) => { setDim('p_W', 1); setDim('p_L', safeL); setDim('p_W', safeW); };

  setLevel('case'); await settle();
  unlock(); await settle();

  t('item 3: entering L < W on the case swaps the fields VISIBLY and pins L >= W', () => {
    if(el('p_L').readOnly) throw new Error('fixture not discriminating: the case L field is not editable (still locked)');
    seed(300, 1);                            // baseline: L=300, W=1 — no swap possible reaching it
    if(document.querySelector('.lwswap')) throw new Error('seeding itself should never cross the convention');
    setDim('p_W', 500);                      // NOW L(300) < W(500) — the edit under test
    eq(+el('p_L').value, 500, 'the L field now shows the swap:');
    eq(+el('p_W').value, 300, 'the W field now shows the swap:');
    eq(build.project.tertiary.params.L, 500, 'the model agrees with the field:');
    eq(build.project.tertiary.params.W, 300, 'the model agrees with the field:');
    if(!document.querySelector('.lwswap')) throw new Error('no visible swap notice — the swap must be seen happening, not silent');
  });

  t('item 3: the swapped result is geometry-identical to entering the same two numbers the other way round', () => {
    seed(300, 1); setDim('p_W', 500);        // reach L=500,W=300 THROUGH a swap
    const swappedGeo = resolveActiveRow(build.project, build.getRounding(), key3).geo.case;
    if(build.project.tertiary.params.L !== 500 || build.project.tertiary.params.W !== 300)
      throw new Error(`fixture reached via swap: expected L=500 W=300, got L=${build.project.tertiary.params.L} W=${build.project.tertiary.params.W}`);

    seed(500, 1); setDim('p_W', 300);        // reach the SAME L=500,W=300, but W was always <= L — no swap
    if(document.querySelector('.lwswap')) throw new Error('typing in convention order should never show a swap notice');
    if(build.project.tertiary.params.L !== 500 || build.project.tertiary.params.W !== 300)
      throw new Error(`fixture reached directly: expected L=500 W=300, got L=${build.project.tertiary.params.L} W=${build.project.tertiary.params.W}`);
    const directGeo = resolveActiveRow(build.project, build.getRounding(), key3).geo.case;

    // eq() is strict === and cannot compare arrays/objects by value (this
    // codebase's own idiom for that is JSON.stringify comparison — see the
    // dims-box and hierarchy-refresh pins elsewhere in this file).
    if(JSON.stringify(swappedGeo.cut) !== JSON.stringify(directGeo.cut)) throw new Error('cut path differs between swap and direct entry');
    if(JSON.stringify(swappedGeo.crease) !== JSON.stringify(directGeo.crease)) throw new Error('crease lines differ between swap and direct entry');
    if(JSON.stringify(swappedGeo.outer) !== JSON.stringify(directGeo.outer)) throw new Error('outer dims differ between swap and direct entry');
    if(JSON.stringify(swappedGeo.inner) !== JSON.stringify(directGeo.inner)) throw new Error('inner dims differ between swap and direct entry');
  });

  restoreProject(snap3, key3); setLevel(lvl3); await settle();
})();

/* ==================================================================
   Item 3, negative: a level OUTSIDE the corrugated/carton convention
   (the flow wrap — flexible film, length is the machine direction, not
   a plan proportion) is untouched. L < W stays exactly as typed.
   ================================================================== */

  t('item 3: a flow wrap keeps L < W exactly as typed — outside the convention', () => {
    // confirm the specimen before measuring it: a readonly field cannot be

  restoreProject(snap3b, key3b); setLevel(lvl3b); await settle();
})();

/* ==================================================================
   3D candidate cycle arrows — a SECOND control onto the same sorted
   candidate list + row-select. Stepping commits; the arrows, the table

   ================================================================== */
await (async () => {

  });

    el('d_case').click();

/* ==================================================================
   Thermoformed tray level: optional, OFF by default, and the shared
   cell-count field. The cell count is ONE stored value
   (project.tray.nCells) with TWO controls — the tray rail and the

  setLevel('tray'); await settle();

  t('tray: enabled defaults are 2 cells x 10 per cell, on edge', () => {

    const c = build.project.primary.collation;
    eq(c.pieceOrientation, 'on-edge', 'orientation:');

  });

  t('tray: rail exposes the envelope-driving inputs', () => {
    for(const id of ['tr_nCells', 'tr_cellLen', 'tr_cellWid', 'tr_cellH', 'tr_wall', 'tr_divider',
                     'tr_floor', 'tr_draftDeg', 'tr_stripL', 'tr_stripW', 'tr_lipH', 'tr_flangeT'])
      if(!el(id)) throw new Error(`tray rail missing ${id}`);
    if(!el('tr_longAxis')) throw new Error('tray rail missing the long-axis control');
  });

  t('tray: cell dims are auto, with the derived value shown as the placeholder', () => {
    eq(el('tr_cellLen').value, '', 'auto fields start empty:');
    if(!(+el('tr_cellLen').placeholder > 0)) throw new Error('auto placeholder must show the derived value');
    if(!(+el('tr_cellWid').placeholder > 0)) throw new Error('auto cellWid placeholder missing');
  });

  tEdit('tray: typing overrides, and reset-to-auto clears the override', () => {
    el('tr_cellWid').value = '80'; fire(el('tr_cellWid'), 'input');
    if(typeof build.project.tray.params.cellWid !== 'number')
      throw new Error('typing must store an override');
    setLevel('tray');                       // remount so the reset control appears
    if(!el('tr_cellWid_auto')) throw new Error('reset-to-auto control missing after an override');
    el('tr_cellWid_auto').click();
    if('cellWid' in build.project.tray.params)
      throw new Error('reset must DELETE the override (absence is the auto state)');
  });

  tEdit('SHARED CELL COUNT: tray rail -> collation rail (one stored value)', () => {
    setLevel('tray');
    el('tr_nCells').value = '5'; fire(el('tr_nCells'), 'input');
    eq(build.project.tray.nCells, 5, 'stored value after the tray edit:');
    setLevel('product');
    eq(el('cCells').value, '5', 'collation rail reflects it:');
  });

  tEdit('SHARED CELL COUNT: collation rail -> tray rail (the same one value)', () => {
    setLevel('product');
    el('cCells').value = '3'; fire(el('cCells'), 'input');
    eq(build.project.tray.nCells, 3, 'stored value after the collation edit:');
    setLevel('tray');
    eq(el('tr_nCells').value, '3', 'tray rail reflects it:');
  });

  t('SHARED CELL COUNT: exactly ONE stored value, no second copy', () => {
    const hits = [], seen = new Set();
    (function walk(o, path){
      if(!o || typeof o !== 'object' || seen.has(o)) return;
      seen.add(o);
      for(const [k, v] of Object.entries(o)){
        if(k === 'nCells' || /^(cellCount|numCells|cells)$/.test(k)) hits.push(path + '.' + k);
        walk(v, path + '.' + k);
      }
    })(build.project, 'project');
    eq(hits.join('|'), 'project.tray.nCells', 'the cell count must live in exactly one place:');
    if('perCell' in build.project.tray)
      throw new Error('tray must NOT store perCell — the collation owns products-per-cell');
  });

  /* ---- QUANTITIES: cells / products-per-cell / total, all three editable
     in BOTH rails. 3 fields x 2 rails = 6 entry points, each updating the
     other two. CELLS IS THE ANCHOR: it moves only when the user edits cells.
     Still only TWO stored values (tray.nCells + the collation grid) — total
     is derived and writable, resolving to a per-cell rather than becoming a
     third number. ---- */
  const RAILS = [
    ['tray',    {cells: 'tr_nCells', perCell: 'tr_perCell', total: 'tr_total'}],
    ['product', {cells: 'cCells',    perCell: 'cPerCell',   total: 'cTotal'}]
  ];
  const qcol = () => build.project.primary.collation;
  const perCellNow = () => { const c = qcol(); return c.perStack*c.nx*c.ny; };
  // per-cell is a PRODUCT (perStack x nx x ny); pin the exact-arithmetic case
  // with a 1x1 plan, and the rounding case separately below
  const setQ = (id, v) => { el(id).value = String(v); fire(el(id), 'input'); fire(el(id), 'change'); };

  tEdit('QUANTITIES: all three fields are editable on BOTH rails', () => {
    for(const [level, ids] of RAILS){
      setLevel(level);
      for(const f of ['cells', 'perCell', 'total']){
        const inp = el(ids[f]);
        if(!inp) throw new Error(`${level} rail: the ${f} field is missing`);
        if(inp.disabled) throw new Error(`${level} rail: ${f} must be editable`);
      }
    }
  });

  tEdit('QUANTITIES: no "Distribute by" selector survives (cells is the anchor)', () => {
    setLevel('tray');
    if(el('tr_distBy')) throw new Error('the Distribute-by selector should be gone');
    if('distributeBy' in build.project.tray) throw new Error('distributeBy should no longer be stored');
  });

  for(const [level, ids] of RAILS){
    tEdit(`QUANTITIES (${level} rail): edit CELLS -> per-cell holds, total follows`, () => {
      setLevel(level);
      Object.assign(qcol(), {nx: 1, ny: 1});
      setQ(ids.perCell, 6);
      const held = perCellNow();
      setQ(ids.cells, 5);
      eq(build.project.tray.nCells, 5, 'cells stored:');
      eq(perCellNow(), held, 'per-cell must HOLD:');
      eq(+el(ids.perCell).value, held, 'per-cell display holds:');
      eq(+el(ids.total).value, 5*held, 'total follows:');
    });

    tEdit(`QUANTITIES (${level} rail): edit PER-CELL -> cells hold, total follows`, () => {
      setLevel(level);
      Object.assign(qcol(), {nx: 1, ny: 1});
      setQ(ids.cells, 4);
      setQ(ids.perCell, 7);
      eq(build.project.tray.nCells, 4, 'cells must HOLD:');
      eq(perCellNow(), 7, 'per-cell written through the collation:');
      eq(+el(ids.cells).value, 4, 'cells display holds:');
      eq(+el(ids.total).value, 28, 'total follows:');
    });

    tEdit(`QUANTITIES (${level} rail): edit TOTAL -> cells hold, per-cell absorbs`, () => {
      setLevel(level);
      Object.assign(qcol(), {nx: 1, ny: 1});
      setQ(ids.cells, 4);
      setQ(ids.total, 28);
      eq(build.project.tray.nCells, 4, 'cells must HOLD — never absorb a total edit:');
      eq(perCellNow(), 7, 'per-cell absorbed it:');
      eq(+el(ids.perCell).value, 7, 'per-cell display follows:');
      eq(+el(ids.total).value, 28, 'total settles where it was asked:');
    });

    tEdit(`QUANTITIES (${level} rail): an impossible total is CORRECTED, not stored`, () => {
      setLevel(level);
      Object.assign(qcol(), {nx: 1, ny: 1});
      setQ(ids.cells, 3);
      setQ(ids.total, 80);                 // 80/3 -> per-cell 27 -> true total 81
      eq(build.project.tray.nCells, 3, 'cells hold:');
      eq(perCellNow(), 27, 'per-cell rounds to the NEAREST integer:');
      eq(+el(ids.perCell).value, 27, 'per-cell display:');
      eq(+el(ids.total).value, 81, 'the corrected total is shown, not the 80 typed:');
    });
  }

  tEdit('QUANTITIES: the two rails stay in lockstep (one derivation)', () => {
    setLevel('tray');
    Object.assign(qcol(), {nx: 1, ny: 1});
    setQ('tr_nCells', 6); setQ('tr_perCell', 9);
    setLevel('product');
    eq(+el('cCells').value, 6, 'cells across rails:');
    eq(+el('cPerCell').value, 9, 'per-cell across rails:');
    eq(+el('cTotal').value, 54, 'total across rails:');
    // and back the other way
    setQ('cTotal', 24);                    // 24/6 -> per-cell 4
    setLevel('tray');
    eq(+el('tr_nCells').value, 6, 'cells unchanged by a total edit:');
    eq(+el('tr_perCell').value, 4, 'per-cell absorbed it, seen from the tray rail:');
    eq(+el('tr_total').value, 24, 'total agrees:');
  });

  tEdit('QUANTITIES: the rail\'s Total agrees with the RESOLVED chain, not just with itself', () => {
    // the pin above compares cCells/cTotal to a hand-multiplied 6*9 — the
    // same expression trayQuantities() itself could be computing wrongly and
    // still satisfy. This one goes around the rail entirely: resolveActiveRow
    // walks the full chain through resolveWrapContents via a DIFFERENT call
    // path (solveBelowOutermost, not trayQuantities' resolvedWrapContents),
    // so the two can only agree if the rail is actually reading the
    // resolver's productCount rather than a second, silently-divergable copy.
    setLevel('tray');
    Object.assign(qcol(), {nx: 1, ny: 1});
    setQ('tr_nCells', 5); setQ('tr_perCell', 7);
    const resolved = resolveActiveRow(build.project, build.getRounding(), null);
    eq(resolved.tray.total, 35, 'fixture sanity, hand-checked:');
    eq(+el('tr_total').value, resolved.tray.total, 'rail Total === resolveActiveRow(...).tray.total:');
  });

  tEdit('QUANTITIES: rounding is NEAREST, so a total can round DOWN', () => {
    // 80/3 = 26.67 rounds to 27 under ceil AND nearest, so it cannot tell them
    // apart; 100/3 = 33.33 can. Without this the rule reads "round" and
    // behaves "ceil" — always growing the pack.
    setLevel('tray');
    Object.assign(qcol(), {nx: 1, ny: 1});
    setQ('tr_nCells', 3);
    setQ('tr_total', 100);                 // -> per-cell 33 (ceil would say 34)
    eq(perCellNow(), 33, 'per-cell rounds DOWN to the nearest:');
    eq(+el('tr_total').value, 99, 'corrected total:');
  });

  tEdit('QUANTITIES: siblings follow on INPUT; the typed field is left alone', () => {
    // the other two must move as you type, not only on blur — and the field
    // under the cursor must NOT be rewritten mid-edit, or "80" is untypeable
    // (the "8" would be corrected before the "0" lands)
    setLevel('tray');
    Object.assign(qcol(), {nx: 1, ny: 1});
    setQ('tr_nCells', 3); setQ('tr_perCell', 5);
    el('tr_total').value = '80'; fire(el('tr_total'), 'input');     // input only
    eq(+el('tr_perCell').value, 27, 'per-cell follows on input, not just on commit:');
    eq(el('tr_total').value, '80', 'the field being typed into is not rewritten mid-edit:');
    fire(el('tr_total'), 'change');
    eq(+el('tr_total').value, 81, 'and it settles to the true total on commit:');
  });

  t('QUANTITIES: still only TWO stored values — no third number', () => {
    const tr = build.project.tray;
    for(const k of ['total', 'perCell', 'qtyTotal', 'distributeBy'])
      if(k in tr) throw new Error(`tray must not store "${k}" — total is derived`);
  });

  tEdit('QUANTITIES: the collation grid fields move the derived pair', () => {
    setLevel('product');
    Object.assign(qcol(), {nx: 1, ny: 1});
    setQ('cCells', 2); setQ('cPerCell', 5);
    el('cNx').value = '3'; fire(el('cNx'), 'input');
    eq(perCellNow(), 15, 'per-cell is perStack x nx x ny:');
    eq(+el('cPerCell').value, 15, 'per-cell display follows a grid edit:');
    eq(+el('cTotal').value, 30, 'total follows a grid edit:');
    el('cNx').value = '1'; fire(el('cNx'), 'input');
  });

  tEdit('tray: the envelope reaches the wrap (downstream actually re-solves)', () => {
    const before = resolveActiveRow(build.project, build.getRounding(), null).wrapOuter.W;
    el('tr_nCells') || setLevel('tray');
    setLevel('tray');
    el('tr_nCells').value = '6'; fire(el('tr_nCells'), 'input');
    const after = resolveActiveRow(build.project, build.getRounding(), null).wrapOuter.W;
    if(!(after > before)) throw new Error(`more cells must widen the wrap: ${before} -> ${after}`);
  });

  /* ---- render + STL (stage 4) ---- */
  t('tray render: the tray depth builds meshes', () => {
    el('tab3d').click();
    el('d_tray').click();
    if(el('d_tray').disabled) throw new Error('tray depth must be reachable while the tier is on');
    if(hier.renderedMeshCount() === 0) throw new Error('tray depth rendered nothing');
  });

  t('tray render: the part is visibly TAPERED — wider at the flange than the base', () => {
    // measure the built geometry, not the parameters: the render must AGREE
    // with the envelope, which is pinned to the flange (max cross-section).
    // A straight-sided box here would silently contradict the chain.
    const pivot = getPivot();
    const v = new THREE.Vector3();
    let yMin = Infinity, yMax = -Infinity;
    pivot.traverse(o => {
      if(!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
      o.updateWorldMatrix(true, false);
      const pos = o.geometry.attributes.position;
      for(let i = 0; i < pos.count; i++){
        v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
        if(v.y < yMin) yMin = v.y;
        if(v.y > yMax) yMax = v.y;
      }
    });
    const band = (yMax - yMin)*0.12;
    let loMin = Infinity, loMax = -Infinity, hiMin = Infinity, hiMax = -Infinity;
    pivot.traverse(o => {
      if(!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
      const pos = o.geometry.attributes.position;
      for(let i = 0; i < pos.count; i++){
        v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
        if(v.y <= yMin + band){ if(v.x < loMin) loMin = v.x; if(v.x > loMax) loMax = v.x; }
        if(v.y >= yMax - band){ if(v.x < hiMin) hiMin = v.x; if(v.x > hiMax) hiMax = v.x; }
      }
    });
    const base = loMax - loMin, top = hiMax - hiMin;
    if(!(top > base + 1))
      throw new Error(`tray must render tapered: base ${base.toFixed(1)} vs top ${top.toFixed(1)}`);
    // and the wide end must be the FLANGE the envelope uses, not merely "some" wider band
    const row = resolveActiveRow(build.project, build.getRounding(), null);
    if(Math.abs(top - row.tray.params.outerL) > 1.5)
      throw new Error(`the widest section should be the flange ${row.tray.params.outerL}, got ${top.toFixed(1)}`);
  });

  t('tray render: products sit at the COLLATION placements, not an even spread', () => {
    // buildTray3d is handed the collation's real placements and used to drop
    // them, spreading products evenly at cellLen/perCell instead — which
    // smears the end clearance BETWEEN every product (12.3mm apart where they
    // are really 12.0mm and the slack pools at the ends of the run).
    const row = resolveActiveRow(build.project, build.getRounding(), null);
    const col = build.project.primary.collation;
    const c = collate(col);
    const {group} = buildTray3d(row.tray.params,
      {piece: col.piece, stackAxis: col.stackAxis, perCell: c.count, pieces: c.placements});
    let inst = null;
    group.traverse(o => { if(o.isInstancedMesh) inst = o; });
    if(!inst) throw new Error('no product instances in the tray render');
    const M = new THREE.Matrix4(), v = new THREE.Vector3(), xs = new Set();
    for(let i = 0; i < inst.count; i++){ inst.getMatrixAt(i, M); v.setFromMatrixPosition(M); xs.add(+v.x.toFixed(6)); }
    const drawn = [...xs].sort((a, b) => a - b);
    const want = c.placements.map(q => +q.x.toFixed(6)).sort((a, b) => a - b);
    eq(drawn.length, want.length, 'distinct along-cell positions:');
    for(let i = 0; i < want.length; i++) approx(drawn[i], want[i], `product ${i} along-cell x:`);
    // guard the fixture: with no end clearance the even spread would coincide
    if(Math.abs(row.tray.params.cellLen/want.length - (want[1] - want[0])) < 1e-9)
      throw new Error('vacuous fixture: the even spread equals the real pitch (endClearance 0?)');
  });

  t('tray STL: well-formed triangles whose bbox is the tray box', () => {
    const row = resolveActiveRow(build.project, build.getRounding(), null);
    const {group} = buildTray3d(row.tray.params);
    const stl = trayToSTL(group, 'cookie-tray');
    const facets = (stl.match(/facet normal/g) || []).length;
    const verts = (stl.match(/vertex /g) || []).length;
    if(!stl.startsWith('solid cookie-tray')) throw new Error('missing STL header');
    if(!stl.trimEnd().endsWith('endsolid cookie-tray')) throw new Error('missing STL footer');
    if(facets < 20) throw new Error(`too few facets: ${facets}`);
    eq(verts, facets*3, 'three vertices per facet:');
    if(/NaN|Infinity/.test(stl)) throw new Error('STL contains non-finite coordinates');
    let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity, mnz = Infinity, mxz = -Infinity;
    const re = /vertex ([-\d.eE+]+) ([-\d.eE+]+) ([-\d.eE+]+)/g;
    let m;
    while((m = re.exec(stl))){
      const x = +m[1], y = +m[2], z = +m[3];
      if(x < mnx) mnx = x; if(x > mxx) mxx = x;
      if(y < mny) mny = y; if(y > mxy) mxy = y;
      if(z < mnz) mnz = z; if(z > mxz) mxz = z;
    }
    const p = row.tray.params;
    if(Math.abs((mxx - mnx) - p.outerL) > 0.01) throw new Error(`STL L ${(mxx-mnx).toFixed(2)} != ${p.outerL}`);
    if(Math.abs((mxz - mnz) - p.outerW) > 0.01) throw new Error(`STL W ${(mxz-mnz).toFixed(2)} != ${p.outerW}`);
    if(Math.abs((mxy - mny) - p.overallH) > 0.01) throw new Error(`STL H ${(mxy-mny).toFixed(2)} != ${p.overallH}`);
  });

  /* ---- the tray's 2D multiview ----
   * Read what the drawing RENDERED (the labels it emitted, by name), never
   * what a layout function would have returned — a pin that recomputes the
   * layout agrees with a bug as readily as with a fix. */
  /** Put the tray's 2D drawing on screen, hand the body a `redraw` it can call
   *  after an edit, and give back the level AND the 2D/3D tab it found. */
  function withTrayDrawing(fn){
    const lvl = el('style').value, was3d = el('tab3d').classList.contains('on');
    const redraw = () => { setLevel('tray'); el('tab2d').click(); return el('svg'); };
    try{ redraw(); return fn(redraw); }
    finally{ if(was3d) el('tab3d').click(); if(el('style').value !== lvl) setLevel(lvl); }
  }
  const dimText = k => {
    const n = el('svg').querySelector(`[data-dim="${k}"]`);
    if(!n) throw new Error(`the drawing has no "${k}" dimension`);
    return n.textContent;
  };
  const trayNow = () => resolveActiveRow(build.project, build.getRounding(), null).tray;

  t('tray 2D: a third-angle multiview, and still no die to export', () => {
    withTrayDrawing(() => {
      const names = [...el('svg').querySelectorAll('text')].map(n => n.textContent);
      for(const v of ['TOP', 'FRONT', 'RIGHT'])
        if(!names.includes(v)) throw new Error(`the drawing is missing its ${v} view`);
      eq(el('tab2d').textContent, '2D Drawing', 'the tab must not call it a dieline:');
      if(!el('btnDXF').disabled)
        throw new Error('a thermoformed tray has no cut path — DXF must stay disabled');
    });
  });

  t('2D legend: names what the level actually draws, dieline or drawing', () => {

      setLevel('case');

  t('tray 2D: overall L/W are the MAX CROSS-SECTION, never the tapered base', () => {
    // THE pin. The tray is drafted, so its base is smaller than its flange, and
    // the flange is what trayOuter() hands the wrap. A drawing dimensioned off
    // the base would undersize every level above it and still look right.
    withTrayDrawing(() => {
      const tr = trayNow(), p = tr.params, u = inputs.getUnit();
      if(!(p.outerL - p.bottomL > 2) || !(p.outerW - p.bottomW > 2))
        throw new Error(`vacuous fixture: flange ${p.outerL}x${p.outerW} barely differs ` +
                        `from base ${p.bottomL}x${p.bottomW} — no draft to catch`);
      eq(dimText('overallL'), fmtLen(tr.outer.L, u), 'drawn overall L = the envelope handoff:');
      eq(dimText('overallW'), fmtLen(tr.outer.W, u), 'drawn overall W = the envelope handoff:');
      const rot = p.longAxis === 'Y';
      const baseL = rot ? p.bottomW : p.bottomL, baseW = rot ? p.bottomL : p.bottomW;
      if(dimText('overallL') === fmtLen(baseL, u)) throw new Error('overall L is the tapered BASE');
      if(dimText('overallW') === fmtLen(baseW, u)) throw new Error('overall W is the tapered BASE');
    });
  });

    // The complement of the pin above: a drawing that dimensioned the flange

      const hit = [...el('svg').querySelectorAll('rect')].some(r =>

  /** Is there a drawn rectangle of exactly this size? Reads the emitted plan,

      eq(dimText('pitch'), `PITCH ${fmtLen(p.pitch, u)}`, 'cell pitch (centre to centre):');

  t('tray 2D: the title block states the base AS the base, in the pallet family', () => {
    // The block replaced a prose caption, and carries the values a callout

  t("date stamp: dated in the reader's zone, so a sheet is never dated tomorrow", () => {
    // THE defect, reported from the field: a sheet stamped with tomorrow's
    // date. getFullYear/getMonth/getDate read the HOST's zone, and a machine
    // running UTC rolls over five hours (four in daylight time) before the
    // reader does. Pinned on fixed instants rather than the clock, so the
    // rollover is testable at any hour of the day.
    // 02:00 UTC on the 13th is 22:00 on the 12th in Eastern daylight time
    eq(dateStamp(new Date('2026-08-13T02:00:00Z')), '2026-08-12', 'summer evening, still the 12th:');
    eq(dateStamp(new Date('2026-08-13T12:00:00Z')), '2026-08-13', 'summer midday, the 13th:');
    // the offset is -4 in summer and -5 in winter; a hardcoded offset would be
    // an hour out for eight months of the year, so the winter side is pinned too
    eq(dateStamp(new Date('2026-01-13T02:00:00Z')), '2026-01-12', 'winter evening, still the 12th:');
    eq(dateStamp(new Date('2026-01-13T06:00:00Z')), '2026-01-13', 'winter 1am Eastern, the 13th:');
    // and the DAYLIGHT rule has to be live, not a hardcoded -5: at 04:30 UTC in
    // August it is 00:30 on the 13th in Eastern (-4) but still the 12th under a
    // fixed -5, so this instant is the one that separates the two
    eq(dateStamp(new Date('2026-08-13T04:30:00Z')), '2026-08-13',
       'summer, just past midnight Eastern (a fixed -5 offset would say the 12th):');
    // the name comes LAST, so a wrong zone fails on what it DOES first
    eq(STAMP_ZONE, 'America/New_York', 'the zone is NAMED, never inherited:');
    // the fixture only bites where the two zones DISAGREE
    if(new Date('2026-08-13T02:00:00Z').getUTCDate() !== 13)
      throw new Error('vacuous fixture: pick an instant that has already rolled over in UTC');
  });

  t('tray 2D: EVERY callout is labelled, and nothing runs off the sheet', () => {
    // Two legibility failures that are invisible to a value assertion.
    // (1) An unnamed number beside another of similar size is ambiguous: a
    // bare 50 under an elevation reads as an overall. Only the envelope L/W
    // may go bare. (2) SVG neither wraps nor grows: text past the sheet edge
    // is silently clipped — value-correct and invisible, the blank-GRID-field
    // failure. Measure against the SHEET (view2d.base), never the live
    // viewBox: that carries the shared zoom, so an earlier pin leaving the
    // view zoomed out would make an overflowing line "fit" (measured — it did).
    withTrayDrawing(() => {
      const svg = el('svg'), vb = view2d.base;
      const BARE = new Set(['overallL', 'overallW']);
      const dims = [...svg.querySelectorAll('[data-dim]')];
      if(dims.length < 8) throw new Error(`only ${dims.length} callouts — the sheet lost dimensions`);
      for(const d of dims){
        const k = d.getAttribute('data-dim');
        const named = /[A-Z]{2,}/.test(d.textContent);
        if(BARE.has(k)){
          if(named) throw new Error(`${k} is the envelope and should read bare: "${d.textContent}"`);
        }else if(!named){
          throw new Error(`callout "${k}" is unlabelled: "${d.textContent}" — ambiguous beside its neighbours`);
        }
      }
      // nothing — callout, leader, title block or legend — past the sheet edge
      for(const n of svg.querySelectorAll('text, tspan')){
        const bb = n.getBBox();
        // certify the instrument: an unmeasurable node reports a zero box and
        // every bounds test below would pass vacuously, which looks exactly
        // like a fitting sheet
        if(!(bb.width > 0)) throw new Error(`cannot measure "${n.textContent}" — the check would be vacuous`);
        if(bb.x < vb[0] - 0.01 || bb.x + bb.width > vb[0] + vb[2] + 0.01 ||
           bb.y < vb[1] - 0.01 || bb.y + bb.height > vb[1] + vb[3] + 0.01)
          throw new Error(`"${n.textContent}" runs off the sheet: ` +
            `${bb.x.toFixed(1)},${bb.y.toFixed(1)} to ${(bb.x + bb.width).toFixed(1)},` +
            `${(bb.y + bb.height).toFixed(1)} of ${vb[2].toFixed(1)}x${vb[3].toFixed(1)}`);
      }
    });
  });

  t('2D PNG export: every design token resolves, so no line goes missing', () => {
    // A standalone SVG inherits no custom properties: a var() the exporter
    // fails to inline is INVALID, and an invalid stroke falls back to `none`.
    // The line does not go wrong, it disappears — in the export only, which is
    // where nobody looks. The hand-maintained token list this pin replaced had
    // already gone stale on --accent: the exported sheet dropped every cell
    // boundary and the legend swatch naming them.
    withTrayDrawing(() => {
      const markup = el('svg').innerHTML;
      const used = [...new Set(markup.match(/var\(--[a-zA-Z0-9-]+\)/g) || [])];
      if(used.length < 2)
        throw new Error(`vacuous fixture: the drawing uses ${used.length} tokens`);
      const out = inlineTokens(markup);
      const left = [...new Set(out.match(/var\(--[a-zA-Z0-9-]+\)/g) || [])];
      if(left.length)
        throw new Error(`unresolved in the export: ${left.join(', ')} (drawing uses ${used.join(', ')})`);
    });
  });

  t('tray 2D: three line types, distinguishable, and the legend names them', () => {
    // Dashed used to mean both "hidden" and "cell boundary", which is why the
    // dividers vanished at four cells. The cell must be visually SEPARATE
    // from the hidden edge — measured as different ink, not assumed — and the
    // legend must name exactly what the drawing draws.
    withTrayDrawing(() => {
      const svg = el('svg');
      const style = sel => {
        const n = [...svg.querySelectorAll(sel)];
        return n.map(x => `${x.getAttribute('stroke')}|${x.getAttribute('stroke-dasharray') || ''}`);
      };
      const all = new Set(style('rect, polygon, path'));
      if(all.size < 3) throw new Error(`only ${all.size} line styles in the drawing: ${[...all].join(' , ')}`);
      // the plan's cell mouths must not be drawn as hidden edges

      const cell = [...svg.querySelectorAll('rect')].find(r =>
        Math.abs(+r.getAttribute('width') - p.cellLen) < 0.01 &&

      if(cell.getAttribute('stroke') === base.getAttribute('stroke') &&
         (cell.getAttribute('stroke-dasharray') || '') === (base.getAttribute('stroke-dasharray') || ''))
        throw new Error('cell boundaries and hidden edges are drawn identically — ' +
          'the dividers cannot read against the base outline');
      // the legend is a claim about the ink: it must name every type, and the
      // rail's legend is fed from the SAME list, so they cannot disagree
      const keys = [...svg.querySelectorAll('text.tray2dKey')].map(n => n.textContent);
      for(const t of TRAY_LINE_TYPES)
        if(!keys.includes(t.label)) throw new Error(`the sheet legend omits "${t.label}"`);
      const rail = el('hud2dKeys').textContent;

    });

  tEdit('tray 2D: the long-axis rotation reaches the drawing, L and W together', () => {
    // `longAxis: 'Y'` rotates the part in plan; trayOuter() swaps L and W to

      const tr = trayNow(), p = tr.params, u = inputs.getUnit();

      if(!(Math.abs(p.outerL - p.outerW) > 2))
        throw new Error('vacuous fixture: a square tray cannot show the swap');
      eq(dimText('overallL'), fmtLen(tr.outer.L, u), 'rotated overall L follows the envelope:');
      eq(dimText('overallW'), fmtLen(tr.outer.W, u), 'rotated overall W follows the envelope:');
      eq(dimText('overallL'), fmtLen(p.outerW, u), "rotated, the placed L is the tray's own W:");

      if(!hasRect(p.topW, p.topL))
        throw new Error('rotated: the rim outline is still drawn in the tray\'s own frame');
      if(!hasRect(p.cellWid, p.cellLen))
        throw new Error('rotated: the plan cells still run along the placed L');
    });
  });

  tEdit('WRAP RENDER: with a tray, the film mesh matches renderedOuter, not the collation', () => {
    // The regression this pins (fixed in 212e4a9): buildWrapOpened lofted the
    // pillow around bundle.wraps.envelope — the bare COLLATION — while the
    // chain had already sized the film around the TRAY. The drawn pack was a
    // long thin sleeve contradicting its own dims box. Nothing but this test
    // stops that coming back.
    el('tab3d').click();
    el('d_wrap').click();
    if(el('d_wrap').disabled) throw new Error('wrap depth must be reachable with a wrap in the chain');
    const shown = hier.renderedOuter();
    if(!shown) throw new Error('no rendered subject at wrap depth');

    // measure the ACTUAL drawn mesh in world space
    const pivot = getPivot();
    const v = new THREE.Vector3();
    let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity, mnz = Infinity, mxz = -Infinity;
    pivot.traverse(o => {
      if(!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
      o.updateWorldMatrix(true, false);
      const pos = o.geometry.attributes.position;
      for(let i = 0; i < pos.count; i++){
        v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
        if(v.x < mnx) mnx = v.x; if(v.x > mxx) mxx = v.x;
        if(v.y < mny) mny = v.y; if(v.y > mxy) mxy = v.y;
        if(v.z < mnz) mnz = v.z; if(v.z > mxz) mxz = v.z;
      }
    });
    const drawnL = mxx - mnx, drawnW = mxz - mnz;

    const row = resolveActiveRow(build.project, build.getRounding(), null);
    const trayW = row.tray.outer.W;
    const colW = collate(build.project.primary.collation).envelope.W;
    if(!(trayW > colW + 20))
      throw new Error(`fixture is not discriminating: tray W ${trayW} must clearly exceed collation W ${colW}`);

    // the film is drawn around what the film was SIZED around
    if(Math.abs(drawnW - shown.W) > 2)
      throw new Error(`wrap mesh W ${drawnW.toFixed(1)} != renderedOuter W ${shown.W.toFixed(1)} — ` +
        `the film is not drawn around the envelope it was cut for`);
    if(Math.abs(drawnL - shown.L) > 3)
      throw new Error(`wrap mesh L ${drawnL.toFixed(1)} != renderedOuter L ${shown.L.toFixed(1)}`);
    // ...and explicitly NOT around the bare collation, the exact old failure
    if(Math.abs(drawnW - colW) < 2)
      throw new Error(`wrap mesh W ${drawnW.toFixed(1)} equals the COLLATION width ${colW} — ` +
        `the tray was skipped in the render (the 212e4a9 regression)`);
  });

  tEdit('tray exports: STL only at tray level; DXF stays unavailable (no dieline)', () => {
    setLevel('tray');
    if(el('btnSTL').style.display === 'none') throw new Error('STL must be offered at tray level');
    if(!el('btnDXF').disabled) throw new Error('a tray has no dieline — DXF must stay disabled');
    setLevel('case');
    if(el('btnSTL').style.display !== 'none') throw new Error('STL must not be offered away from the tray');
    setLevel('tray');
  });

  /* ---- Cookie-Tray link IMPORT, driven through the real "Apply link" UI —
   * #tr_link / #tr_linkImport, the same elements a user types into and
   * clicks. Cookie-Tray's own encoder omits any field equal to its default
   * (encodeGroup), so a realistic pasted link is SPARSE; encodeProductLikeCookieTray
   * reproduces that omission rule rather than hand-writing a complete key
   * set (a fixture with every key present never reaches the omission bug —
   * CLAUDE.md's fixture-hygiene rule), matching the encoder already proven
   * against the deployed Cookie-Tray build in cookietray.test.html. */
  const encodeProductLikeCookieTray = spec => {
    const out = new URLSearchParams();
    for(const [long, short] of Object.entries(PRODUCT_KEYS)){
      if(!(long in spec)) continue;
      const v = spec[long], d = PRODUCT_DEFAULTS[long];
      if(typeof v === 'number' && typeof d === 'number' && Math.abs(v - d) < 1e-9) continue;
      if(typeof v === 'string' && v === d) continue;
      out.set(short, typeof v === 'number' ? String(v) : v);
    }
    return out.toString();
  };
  const importLink = qs => { el('tr_link').value = `?n=2&${qs}`; el('tr_linkImport').click(); };
  const pieceNow = () => build.project.primary.collation.piece;

  tEdit('Cookie-Tray link import: a round product AT their exact defaults resolves to 45x12, never stale prior state', () => {
    setLevel('tray');
    // seed a piece that looks NOTHING like the defaults, so a fallback to
    // "whatever was there" would be visibly wrong, not accidentally right
    Object.assign(build.project.primary.collation, {piece: {kind: 'cylinder', diameter: 999, thickness: 999}});
    const qs = encodeProductLikeCookieTray({
      productType: 'round', cookieDiameter: 45, cookieThickness: 12,
      qtyTotal: 24, nCellsProduct: 3, distributeBy: 'nCells'
    });
    if(/pdia=|pthk=/.test(qs)) throw new Error(`fixture does not exhibit the omitted-defaults condition: ${qs}`);
    importLink(qs);
    const piece = pieceNow();
    eq(piece.kind, 'cylinder', 'kind:');
    eq(piece.diameter, 45, 'diameter falls back to Cookie-Tray default, not stale 999:');
    eq(piece.thickness, 12, 'thickness falls back to Cookie-Tray default, not stale 999:');
  });
  tEdit('Cookie-Tray link import: a rectangle AT their exact defaults resolves to 12/45/20, never 90', () => {
    setLevel('tray');
    Object.assign(build.project.primary.collation, {piece: {kind: 'box', L: 999, W: 999, H: 999}});
    const qs = encodeProductLikeCookieTray({
      productType: 'rectangle', productWidth: 45, productHeight: 20, productThickness: 12,
      qtyTotal: 24, nCellsProduct: 3, distributeBy: 'nCells'
    });
    if(/ptk=|pw=|ph=/.test(qs)) throw new Error(`fixture does not exhibit the omitted-defaults condition: ${qs}`);
    importLink(qs);
    const piece = pieceNow();
    eq(piece.kind, 'box', 'kind:');
    eq(piece.L, 12, 'thickness falls back to Cookie-Tray default (not the old || 90 fallback):');
    eq(piece.W, 45, 'width falls back to Cookie-Tray default:');
    eq(piece.H, 20, 'height falls back to Cookie-Tray default (not the old || 20 fallback landing right by accident):');
  });
  tEdit('Cookie-Tray link import: ATOMIC REPLACEMENT — link B leaves no field of link A', () => {
    setLevel('tray');
    const qsA = encodeProductLikeCookieTray({
      productType: 'round', cookieDiameter: 60, cookieThickness: 20,
      qtyTotal: 24, nCellsProduct: 3, distributeBy: 'nCells'
    });
    importLink(qsA);
    const a = JSON.stringify(pieceNow());
    if(a !== JSON.stringify({kind: 'cylinder', diameter: 60, thickness: 20}))
      throw new Error(`link A did not apply cleanly: ${a}`);
    const qsB = encodeProductLikeCookieTray({
      productType: 'rectangle', productWidth: 30, productHeight: 15, productThickness: 8,
      qtyTotal: 24, nCellsProduct: 3, distributeBy: 'nCells'
    });
    importLink(qsB);
    const b = pieceNow();
    if(JSON.stringify(b) !== JSON.stringify({kind: 'box', L: 8, W: 30, H: 15}))
      throw new Error(`link B produced a hybrid, not a clean replacement: ${JSON.stringify(b)}`);
    // no trace of A's round shape or its dimensions anywhere in the new piece
    if('diameter' in b || b.kind === 'cylinder')
      throw new Error(`link A survived alongside link B: ${JSON.stringify(b)}`);
  });

  tEdit('Cookie-Tray link import: an unrecognized key surfaces a visible warning in the SAME status note, and the import still succeeds', () => {
    setLevel('tray');
    Object.assign(build.project.primary.collation, {piece: {kind: 'cylinder', diameter: 999, thickness: 999}});
    // a link with one real, recognized key plus one this app has never heard
    // of -- driven through the exact DOM path a user pastes a link with
    // (fill #tr_link, click #tr_linkImport), never calling parseTrayLink
    // directly.
    el('tr_link').value = '?n=2&pdia=60&pthk=20&zzq=999';
    el('tr_linkImport').click();
    const note = el('tr_linkNote').textContent;
    if(!note.includes('zzq')) throw new Error(`warning must name the unrecognized key: "${note}"`);
    if(!/doesn't understand|does not understand/.test(note)) throw new Error(`warning must say this app doesn't understand it: "${note}"`);
    // the rest of the import still worked -- a warning is not a failure
    const piece = pieceNow();
    eq(piece.diameter, 60, 'the recognized keys still applied:');
    eq(piece.thickness, 20);
  });
  tEdit('Cookie-Tray link import: a link with only recognized keys shows NO unknown-key warning', () => {
    setLevel('tray');
    el('tr_link').value = '?n=2&pdia=60&pthk=20';
    el('tr_linkImport').click();
    const note = el('tr_linkNote').textContent;
    if(/doesn't understand|does not understand/.test(note)) throw new Error(`unexpected warning with no unrecognized keys: "${note}"`);
  });

  // restore what this block FOUND — tray state, the collation, the quantities
  // it walked through. This used to write back an ASSUMED default collation
  // ({perStack 2, nx 3, ny 1}), which is a second source of truth for "the
  // default project" and wrong the moment that project changes.
  el('tab2d').click();
  restoreProject(traySnap);
  setLevel('case'); await settle();
})();

/* ==================================================================
   ORBIT is UNCLAMPED vertically: a drag carries on THROUGH the pole and
   down the far side, with `up` flipping in step so the view never snaps
   through 180° of roll. The old ±1.35 rad drag clamp (a wall short of
   both poles) existed only to dodge that flip; handling the pole is what
   makes removing it safe. MUTATION-TESTED by reinstating the clamp.
   ================================================================== */
await (async () => {
  setLevel('case'); await settle();
  el('tab3d').click(); await settle();

  const cv = getDomElement();
  const capture = cv.setPointerCapture;
  cv.setPointerCapture = () => {};              // synthetic pointers have no real capture
  const ev = (type, y) => cv.dispatchEvent(new PointerEvent(type,
    {pointerId: 1, pointerType: 'mouse', button: 0, clientX: 200, clientY: y, bubbles: true}));

  t('a vertical drag passes THROUGH the pole — no wall', () => {
