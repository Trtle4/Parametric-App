      caseGeo: row.geo.case, cartonGeo: row.geo.carton, wrapGeo: null, tray: null,
      cases: {placements: cases.placements, count: cases.count, deck: cases.deck,
              loadH: DECLARED, unitStackH: row.unitStackH},
      cartons: {placements: cartons.placements}, wraps: null, counts: {}, art: {}
    }, 'pallet', {}, true);
    approx(hier.renderedOuter().H, cases.deck.baseH + DECLARED,
           'rendered pallet height must be deck + the load height it was GIVEN:');
    el('d_pallet').click();      // rebuild the REAL scene; later pins read renderedOuter()
  });

  t('SHELF: the sellable unit is carton, else WRAP, else case', () => {
    // The rule used to be "carton if enabled, else case", which merchandised
    // the SHIPPER for a tray -> wrap -> case chain. A shrink-wrapped tray of
    // product is the retail unit; the tray makes that chain ordinary, which is
    // what exposed the gap. Asserts the DISPLAYED noun, across every shape.
    const proj = build.project;
    // snapshot the WHOLE project, not a hand-listed subset: the old restore
    // Object.assign'd a saved collation back, which cannot DELETE a key the
    // body added — `pieceOrientation: 'on-edge'` survived every run.
    const saved = snapProject();
    const trayCollation = () => Object.assign(proj.primary.collation,
      {pieceOrientation: 'on-edge', stackAxis: 'X', perStack: 10, nx: 1, ny: 1});
    const unitFor = (setup) => {
      setup();
      build.recompute();
      el('tabShelf').click();
      const u = el('spUnit').textContent.trim();
      el('tab2d').click();
      return u;
    };
    try{
      const wrapObj = saved.primary.wrap || {styleId: 'flowwrap', params: {}, locked: false};
      const chains = [
        ['tray -> wrap -> case',           () => { proj.tray.enabled = true; trayCollation(); proj.primary.wrap = wrapObj; proj.secondary.enabled = false; }, 'wraps'],
        ['tray -> wrap -> carton -> case', () => { proj.tray.enabled = true; trayCollation(); proj.primary.wrap = wrapObj; proj.secondary.enabled = true;  }, 'cartons'],
        ['wrap -> carton -> case',         () => { proj.tray.enabled = false; proj.primary.wrap = wrapObj; proj.secondary.enabled = true;  }, 'cartons'],
        ['wrap -> case',                   () => { proj.tray.enabled = false; proj.primary.wrap = wrapObj; proj.secondary.enabled = false; }, 'wraps'],
        ['carton -> case',                 () => { proj.tray.enabled = false; proj.primary.wrap = null;    proj.secondary.enabled = true;  }, 'cartons'],
        ['case only',                      () => { proj.tray.enabled = false; proj.primary.wrap = null;    proj.secondary.enabled = false; }, 'cases']
      ];
      for(const [label, setup, want] of chains)
        eq(unitFor(setup), want, `${label} must merchandise the ${want.slice(0, -1)}:`);
    } finally {
      restoreProject(saved);
      // restore the 3D pallet context the pins below this one assume
      el('tab3d').click(); el('d_pallet').click();
    }
  });

  // The hierarchy group is only HIDDEN when the shelf is up (visible=false, not
  // removed), so a bare pivot traverse measures the pallet and calls it the
  // shelf. Everything below counts only what is actually drawn.
  const isShown = o => { for(let n = o; n; n = n.parent) if(!n.visible) return false; return true; };

  t('SHELF: a wrapped tray presents its OPEN FACE, drawn as the real pack', () => {
    // Two faults, one chain (tray -> wrap -> case, carton off). The shelf's
    // front-panel default was a flat 'LWH' — the printed panel of an upright
    // tube carton — so a wrapped tray came to the shelf standing on its long
    // edge: 49mm of film end to the shopper, the open face with the product in
    // it pointing at the ceiling. And every facing but the opened one was a
    // plain BoxGeometry, which is not what a film pillow looks like.
    //
    // MEASURED, not asserted from the code: the facings' world extents against
    // the wrap's own outer, and the drawn geometry's type. Both are read off
    // the built scene.
    const saved = snapProject(), savedFront = el('shFront').value;
    try{
      const proj = build.project;
      proj.tray.enabled = true; proj.tray.nCells = 3;
      Object.assign(proj.primary.collation,
        {pieceOrientation: 'on-edge', stackAxis: 'X', perStack: 10, nx: 1, ny: 1});
      proj.secondary.enabled = false;                 // carton off -> the WRAP is sellable
      build.recompute();
      el('shFront').value = 'auto'; fire(el('shFront'), 'change');
      el('tabShelf').click();

      const row = resolveActiveRow(build.project, build.getRounding(), null);
      const wo = row.geo.wrap.outer;
      // the fixture only has teeth while the pack is clearly NOT square: the
      // open face (L x W) must be plainly bigger than the film end (L x H)
      if(!(wo.W > wo.H + 40)) throw new Error(`fixture not discriminating: W ${wo.W} vs H ${wo.H}`);

      // measure what is STOCKED on the shelf, never the shelf fixture itself,
      // and count a pack part whether it is instanced or not (so this pin says
      // what it means about SHAPE, and the draw-call pin below owns instancing)
      const box = new THREE.Box3(), M = new THREE.Matrix4();
      const parts = [];
      getPivot().updateMatrixWorld(true);
      getPivot().traverse(o => {
        if(!isShown(o) || o.name === 'shelfFixture') return;
        if(!o.isInstancedMesh && !o.isMesh) return;
        if(!o.geometry || !o.geometry.attributes.position) return;
        parts.push({verts: o.geometry.attributes.position.count, count: o.count || 1});
        o.geometry.computeBoundingBox();
        const gb = o.geometry.boundingBox;
        if(o.isInstancedMesh)
          for(let i = 0; i < o.count; i++){ o.getMatrixAt(i, M); M.premultiply(o.matrixWorld); box.union(gb.clone().applyMatrix4(M)); }
        else box.union(gb.clone().applyMatrix4(o.matrixWorld));
      });
      if(!parts.length) throw new Error('no facing packs rendered on the shelf');
      const up = box.max.y - box.min.y, deep = box.max.z - box.min.z;
      // the UP extent must be a whole number of W (the open face's height),
      // never of H — that is what "the open face is forward" means on the shelf
      // whole multiples of `unit`, with 2mm of slack for the cosmetic pack seam —
      // enough that a stand-in BOX (drawn PACK_GAP under-size) still SATISFIES
      // this test, so the "is it the real pack" assertions below are the ones
      // that have to catch a stand-in, not this one by accident
      const nearMultiple = (v, unit) => v >= unit - 2 && Math.abs(v - Math.round(v/unit)*unit) <= 2;
      if(!nearMultiple(up, wo.W))
        throw new Error(`the open face must stand UP the shelf: up ${up.toFixed(1)} is not a multiple of W ${wo.W}`);
      if(nearMultiple(deep, wo.W) && !nearMultiple(deep, wo.H))
        throw new Error(`depth ${deep.toFixed(1)} reads as W — the pack is presenting an end`);

      // ...and it is the OPEN side of that face pointing at the shopper, not the
      // underside. The right axis with the wrong sign looks identical to every
      // extent measurement above — orientation strings carry no front/back
      // parity — and it is what shipped: the tray's open top faced the back
      // wall and the shopper got the bottom of the tray, cookies hidden.
      // Measured as a DIRECTION: the pack's +frontFace axis against the side of
      // the shelf the back wall is on.
      const frontAxis = row.geo.wrap.meta.frontFace;
      if(!frontAxis) throw new Error('the wrap style must declare its display face (meta.frontFace)');
      const AXIS = {L: [1, 0, 0], H: [0, 1, 0], W: [0, 0, 1]}[frontAxis];
      let backZ = 0, faceZ = null;
      getPivot().traverse(o => {
        if(o.name === 'shelfFixture'){
          const wp = new THREE.Vector3(); o.getWorldPosition(wp);
          if(Math.abs(wp.z) > Math.abs(backZ)) backZ = wp.z;      // the back wall, not the deck
          return;
        }
        if(faceZ !== null || !o.isInstancedMesh || !isShown(o)) return;
        const m = new THREE.Matrix4(), q = new THREE.Quaternion();
        o.getMatrixAt(0, m); m.premultiply(o.matrixWorld);
        m.decompose(new THREE.Vector3(), q, new THREE.Vector3());
        faceZ = new THREE.Vector3(...AXIS).applyQuaternion(q).z;
      });
      if(faceZ === null) throw new Error('no facing pack to take a facing direction from');
      if(!backZ) throw new Error('no shelf back wall found to orient against');
      if(faceZ*backZ > 0)
        throw new Error(`the pack's ${frontAxis} face points at the BACK WALL — the shopper sees its underside`);
      // ...and the facings are the REAL pack, not a stand-in box. A filmed wrap
      // is drawn as SEVERAL parts (lofted body, two ramp tapers, two crimp
      // tabs, the fin); the stand-in was ONE instanced BoxGeometry, so both the
      // part count and the body's vertex count separate them. Crimp tabs ARE
      // boxes, so "no BoxGeometry" would be the wrong test — asserting a lofted
      // body is the one that means what it says.
      if(parts.length < 5)
        throw new Error(`the pack is drawn as ${parts.length} part(s) — a film pillow is body + tapers + crimps`);
      if(!parts.some(p => p.verts > 24))
        throw new Error('no lofted body among the facing parts — still a stand-in box (24 verts)');
    } finally {
      el('tab2d').click();
      el('shFront').value = savedFront; fire(el('shFront'), 'change');
      restoreProject(saved);
      el('tab3d').click(); el('d_pallet').click();
    }
  });

  // A PRINTED wrap is the SAME pack as an unprinted one — the texture is a
  // material, not a shape. The art used to fork the shelf onto packArtGeometry
  // (the flat-pattern art tube: cross-section built from the artMap's girth
  // BAND WIDTHS in template mm, crimped ends open), so printed facings drew as
  // hollow planes while unprinted facings were correct pillows. The arrangement
  // (upload, decode, a re-render) lives out here rather than inside the pins.
  const printSnap = snapProject(), printKey = build.getSelectedCandidateKey();
  let printSrc = null;
  const packMeshes = () => {
    const hits = [];
    getPivot().traverse(o => { if(o.isInstancedMesh && isShown(o) && o.name !== 'shelfFixture') hits.push(o); });
    return hits;
  };
  const shelfPartStats = () => packMeshes().map(o => ({
    verts: o.geometry.attributes.position.count,
    count: o.count,
    mapped: (Array.isArray(o.material) ? o.material : [o.material]).some(m => m && m.map)
  }));
  // UNPRINTED baseline first — same chain, no artwork
  {
    const proj = build.project;
    proj.tray.enabled = true; proj.tray.nCells = 3;
    Object.assign(proj.primary.collation,
      {pieceOrientation: 'on-edge', stackAxis: 'X', perStack: 10, nx: 1, ny: 1});
    proj.secondary.enabled = false;
    build.recompute();
    el('shFront').value = 'auto'; fire(el('shFront'), 'change');
    el('tabShelf').click();
  }
  await waitFrames(() => packMeshes().length > 0);
  const plainStats = shelfPartStats();
  // now the artwork
  {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#c33'; g.fillRect(0, 0, 64, 32);
    g.fillStyle = '#36c'; g.fillRect(0, 32, 64, 32);
    build.project.artwork = build.project.artwork || {};
    printSrc = c.toDataURL('image/png');
    build.project.artwork.wrap = {src: printSrc, fit: 'fill'};
    build.recompute();
  }
  // The app caches ONE Image per src and only the FIRST caller's decode
  // callback ever fires — wait for the app's OWN cached image, then ask the
  // shelf to re-render so the texture is actually in the build.
  await waitFrames(() => artImage(printSrc).complete && artImage(printSrc).naturalWidth > 0);
  fire(el('shFront'), 'change');
  const printReady = await waitFrames(() => shelfPartStats().some(x => x.mapped));
  const printedStats = shelfPartStats();

  t('SHELF: printed facings are the SAME pack as unprinted — texture is a material, not a shape', () => {
    // Compare the printed build against the unprinted baseline measured moments
    // ago on the same chain: identical part count, identical geometry (vertex
    // counts), identical instance counts — plus the texture. Under the old art
    // tube this read 1 part vs 6 and a fraction of the vertices.
    if(!printReady) throw new Error('the artwork never reached the shelf facings');
    if(printedStats.length !== plainStats.length)
      throw new Error(`printed facings are ${printedStats.length} part(s), unprinted are ${plainStats.length} — the art forked the geometry`);
    const key = st => st.map(x => `${x.verts}x${x.count}`).sort().join('|');
    if(key(printedStats) !== key(plainStats))
      throw new Error(`printed and unprinted facings differ in geometry: ${key(printedStats)} vs ${key(plainStats)}`);
    if(!printedStats.every(x => x.mapped))
      throw new Error('every part of a printed pack must carry the texture (film prints continuously)');
  });
  el('tab2d').click();
  restoreProject(printSnap, printKey);
  el('tab3d').click(); el('d_pallet').click();

  t('SHELF: real-pack facings stay INSTANCED — draw calls flat in the facing count', () => {
    // The pillow is six part geometries where the box was one, so this is the
    // pin that stops "draw the real pack" from quietly becoming a mesh per
    // facing. Measured at two shelf sizes: the OBJECT count must not move.
    const saved = snapProject(), savedFront = el('shFront').value;
    const savedShelf = {w: el('shWidth').value, d: el('shDepth').value, h: el('shHeight').value};
    // objects = what the renderer issues a draw for. packs = the app's OWN
    // reported facing count, read off the shelf readout — an independent
    // source, so "more packs" can't be inferred from the same objects it is
    // being compared against.
    const drawObjects = () => {
      let n = 0;
      getPivot().traverse(o => { if(isShown(o) && (o.isMesh || o.isInstancedMesh)) n++; });
      const m = el('shReadout').textContent.match(/(\d+)/);
      return {n, packs: m ? +m[1] : 0};
    };
    const setShelf = (w, d, h) => {
      el('shWidth').value = String(w); fire(el('shWidth'), 'input');
      el('shDepth').value = String(d); fire(el('shDepth'), 'input');
      el('shHeight').value = String(h); fire(el('shHeight'), 'input');
    };
    try{
      const proj = build.project;
      proj.tray.enabled = true; proj.tray.nCells = 3;
      Object.assign(proj.primary.collation,
        {pieceOrientation: 'on-edge', stackAxis: 'X', perStack: 10, nx: 1, ny: 1});
      proj.secondary.enabled = false;
      build.recompute();
      el('shFront').value = 'auto'; fire(el('shFront'), 'change');
      el('tabShelf').click();
      setShelf(1000, 500, 300);
      const small = drawObjects();
      setShelf(4000, 2000, 1200);
      const big = drawObjects();
      if(!(big.packs > small.packs*5))
        throw new Error(`fixture not discriminating: ${small.packs} -> ${big.packs} packs`);
      eq(big.n, small.n, `draw objects must not follow the facing count (${small.packs} -> ${big.packs} packs):`);
    } finally {
      setShelf(savedShelf.w, savedShelf.d, savedShelf.h);
      el('tab2d').click();
      el('shFront').value = savedFront; fire(el('shFront'), 'change');
      restoreProject(saved);
      el('tab3d').click(); el('d_pallet').click();
    }
  });

  t('the drawn deck is built to baseH — load rests ON it, never floats', () => {
    // L2's visual half. buildPallet stacks the load from the chain's baseH
    // while the timber mesh was a fixed 127, so at baseH 140 the load floated
    // 13mm above its own deck. Numbers right, render wrong — the same shape as
    // the double-stack float. Pinned at a NON-DEFAULT baseH: at 127 the two
    // agree and a default-only pin proves nothing.
    const saved = build.project.pallet.baseH;
    try{
      build.project.pallet.baseH = 140;
      build.recompute();
      el('d_pallet').click();
      getPivot().updateMatrixWorld(true);
      const M = new THREE.Matrix4();
      let deck = null, load = null;
      getPivot().traverse(o => {
        if(o.name === 'gmaPallet'){
          const b = new THREE.Box3().setFromObject(o);
          deck = deck ? deck.union(b) : b;
          return;
        }
        if(o.isInstancedMesh && o.userData && o.userData.tierName === 'pallet'){
          o.geometry.computeBoundingBox();
          const gb = o.geometry.boundingBox, b = new THREE.Box3();
          for(let i = 0; i < o.count; i++){ o.getMatrixAt(i, M); M.premultiply(o.matrixWorld); b.union(gb.clone().applyMatrix4(M)); }
          load = load ? load.union(b) : b;
        }
      });
      if(!deck || !load) throw new Error('no deck or no load units in the pallet scene');
      approx(deck.max.y - deck.min.y, 140, 'the drawn deck must be baseH tall:');
      const gap = load.min.y - deck.max.y;
      // only the 1mm cosmetic case seam may show; a whole deck's worth of
      // float (13mm at baseH 140) is the regression
      if(!(gap >= -1e-6 && gap <= 1.5))
        throw new Error(`the load must rest on the drawn deck: gap ${gap.toFixed(2)}mm`);
    } finally {
      build.project.pallet.baseH = saved; build.recompute(); el('d_pallet').click();
    }
  });

  // The Dims-split arrangement runs OUT HERE, in the block's async body, so the
  // overlay can be waited for: it is drawn from fold3d's frame loop, and the
  // pin used to toggle it and read it in the same synchronous turn. That race
  // cost the suite 3 runs in 4 ("Load/Total lines missing") — the assertion was
  // right and the fixture never gave it a frame to be right about.
  const dimsSnap = snapProject();
  build.project.pallet.baseH = 140;                 // NON-DEFAULT — see the pin
  build.recompute();
  el('d_case').click(); el('d_pallet').click();     // rebuild THIS depth
  const dimsWasOn = el('m3dims').classList.contains('on');
  {
    const b = el('m3dims');                         // fresh overlay for THIS build
    if(dimsWasOn) b.click();
    b.click();
  }
  const dimsReady = await waitFrames(() => /Total/.test(el('dimsOverlay').textContent || ''));
  const dimsTxt = (el('dimsOverlay').textContent || '').replace(/\s+/g, ' ');
  const dimsRow = resolveActiveRow(build.project, build.getRounding(), build.getSelectedCandidateKey());

  t('Dims split reads the CHAIN deck height, not the mesh constant', () => {
    // MUST be pinned at a NON-DEFAULT baseH: pallet.baseH and palletmesh's
    // PALLET_HEIGHT are two independent 127s, so at the default the wrong one
    // still reads right and a default-only pin proves nothing. At baseH 140
    // the overlay read Pallet 254 / Load 2316 against a true 280 / 2290 —
    // Total correct, the error a pure transfer between the two lines.
    // Reads the RENDERED overlay text, not a recomputation of the split here:
    // asserting my own arithmetic would pass whichever constant the app used.
    if(!dimsReady) throw new Error(`the Dims overlay never drew: "${dimsTxt.slice(0, 120)}"`);
    const m = dimsTxt.match(/Pallet\s*([\d.]+)/);
    if(!m) throw new Error(`no Pallet line in the Dims overlay: "${dimsTxt.slice(0, 120)}"`);
    approx(+m[1], 140, 'the Pallet line must be the CHAIN deck height (baseH), not 127:');
    const ml = dimsTxt.match(/Load\s*([\d.]+)/), mt = dimsTxt.match(/Total\s*([\d.]+)/);
    if(!ml || !mt) throw new Error('Load/Total lines missing from the overlay');
    approx(+m[1] + +ml[1], +mt[1], 'Pallet + Load must sum to Total:');
    approx(+ml[1], dimsRow.loadH, 'the Load line must be the chain load height:');
  });
  if(!dimsWasOn && el('m3dims').classList.contains('on')) el('m3dims').click();   // leave the overlay as found
  restoreProject(dimsSnap); el('d_pallet').click();

  t('the deck-height INPUT reaches the chain — value, budget and boundary note', () => {
    // baseH used to be invisible: a project field with no field. Both bugs that
    // hid in it (M-1's Dims split, L2's floating load) were only findable
    // because something else surfaced the number. Now it is typed, so the pin
    // is on the INPUT path — the two above set project.pallet.baseH directly
    // and would pass with the field wired to nothing at all.
    const savedH = build.project.pallet.baseH, savedField = el('palBaseH').value;
    const pu = inputs.getPalUnit();
    const type = v => { el('palBaseH').value = String(v); fire(el('palBaseH'), 'input'); };
    const inField = mm => pu === 'mm' ? mm : mm/25.4;      // the field speaks the rail's unit
    try{
      // 1. the typed value lands in the project, through the unit read
      type(inField(127));
      approx(build.project.pallet.baseH, 127, 'a typed deck height must reach project.pallet.baseH:', 1e-9);

      // 2. the FIT budget follows the field. Not a restatement of the solver:
      //    a taller deck must leave strictly fewer case layers, and the load
      //    must still fit the declared max height at both ends.
      const layersNow = () => {
        const row = resolveActiveRow(build.project, build.getRounding(), build.getSelectedCandidateKey());
        return {layers: row.caseLayers, loadH: row.loadH};
      };
      const lo = layersNow();
      const tallDeck = build.project.pallet.maxH * 0.66;   // eats two thirds of the budget
      type(inField(tallDeck));
      approx(build.project.pallet.baseH, tallDeck, 'the tall deck must reach the project:', 1e-6);
      const hi = layersNow();
      if(!(hi.layers < lo.layers))
        throw new Error(`a taller deck must cost layers: ${lo.layers} at 127mm, ${hi.layers} at ${tallDeck.toFixed(0)}mm`);
      for(const [label, r, h] of [['127', lo, 127], ['tall', hi, tallDeck]])
        if(r.loadH + h > build.project.pallet.maxH + 1e-6)
          throw new Error(`deck+load must fit maxH (${label}): ${h.toFixed(0)} + ${r.loadH} > ${build.project.pallet.maxH}`);

      // 3. the miniature-timber boundary note tracks the field, both ways.
      //    Derived from the exported constant, not a copy of 80: the note must
      //    follow wherever the faithful-shape floor moves to.
      type(inField(MIN_FAITHFUL_DECK_H + 5));
      if(el('palBaseHNote').style.display !== 'none')
        throw new Error('the miniature-timber note must be hidden above the faithful floor');
      type(inField(MIN_FAITHFUL_DECK_H - 5));
      if(el('palBaseHNote').style.display === 'none')
        throw new Error('the miniature-timber note must show below the faithful floor');

      // 4. blank/zero holds the last good deck rather than collapsing it
      type('');
      approx(build.project.pallet.baseH, MIN_FAITHFUL_DECK_H - 5,
             'a blank field must keep the last good deck height:', 1e-6);
    } finally {
      build.project.pallet.baseH = savedH;
      el('palBaseH').value = savedField; fire(el('palBaseH'), 'input');
      build.project.pallet.baseH = savedH; build.recompute();
      el('d_pallet').click();
    }
  });

  t('pallet render stays INSTANCED at scale — draw calls flat, no unit dropped', () => {
    // The deleted Palletize renderer capped instances at 4000 and silently
    // dropped every unit past it; that cap died with it (5e103c6). Measured, it
    // should stay dead: instancing keeps DRAW CALLS CONSTANT (23 meshes at 120
    // cases and at 12,000), so a large pallet costs geometry, not draw calls —
    // and 4000 was already below an ordinary small case (60mm -> 4284), so the
    // guard would have hidden real cases rather than saved a real frame.
    // What must never regress is the instancing itself: swap InstancedMesh for
    // a Mesh per unit and draw calls scale with the pallet instead.
    const p = newProject();
    Object.assign(p.primary.collation, {piece: {kind: 'box', L: 40, W: 40, H: 40},
      perStack: 1, nx: 1, ny: 1, stackAxis: 'Z', pieceGap: 0, stackGap: 0});
    p.primary.wrap = null;
    p.links[0].count = 1; p.links[1].count = 1; p.links[1].arrangement = {nx: 1, ny: 1, nz: 1};
    const row = resolveActiveRow(p, '1mm', null);
    const {cases, cartons} = row.arr;
    if(!(row.casesPerPallet > 5000))
      throw new Error(`vacuous fixture: only ${row.casesPerPallet} cases, wanted a large pallet`);
    hier.buildHierarchy({
      caseGeo: row.geo.case, cartonGeo: row.geo.carton, wrapGeo: null, tray: null,
      cases: {placements: cases.placements, count: cases.count, deck: cases.deck,
              loadH: row.loadH, unitStackH: row.unitStackH},
      cartons: {placements: cartons.placements}, wraps: null, counts: {}, art: {}
    }, 'pallet', {}, true);                       // solid: every unit closed, the heavy path
    let meshes = 0, unitInstances = 0;
    getPivot().traverse(o => {
      if(o.isInstancedMesh || o.isMesh) meshes++;
      if(o.isInstancedMesh && o.userData && o.userData.tierName === 'pallet') unitInstances += o.count;
    });
    eq(unitInstances, row.casesPerPallet, 'every case on the pallet must be drawn, none capped away:');
    if(meshes > 60)
      throw new Error(`draw calls must not scale with the pallet: ${meshes} meshes for ${row.casesPerPallet} cases`);
    el('d_pallet').click();                       // restore the real scene for later pins
  });

  t('rendered pallet height == deck + the CHAIN\'s layer count x unit height', () => {
    // the render must not recompute the layer count: a Math.round() on each
    // unit's CENTRE z read every layer one too high (12 layers -> 13) and
    // overstated the load by exactly one unit height. Tie the drawn height to
    // row.caseLayers — the chain's own count, the one the readout shows.
    const row = resolveActiveRow(build.project, build.getRounding(), build.getSelectedCandidateKey());
    const coH = row.geo.case.outer.H, layers = row.caseLayers, deckH = build.project.pallet.baseH;
    const expect = deckH + layers*coH;
    if(Math.abs(hier.renderedOuter().H - expect) > 1e-9)
      throw new Error(`rendered pallet H ${hier.renderedOuter().H} != deck ${deckH} + ${layers} layers x ${coH} = ${expect}`);
  });

  el('tab2d').click(); await settle();
})();

/* ==================================================================
   Cartons-per-case RANGE: min–max feeds one more dimension into the SAME
   candidate list. min==max reproduces single-count; a range yields
   multiple counts ranked together; the display caps at the top 50.
   ================================================================== */
await (async () => {
  const rangeSnap = snapProject(), rangeKey = build.getSelectedCandidateKey();
  setLevel('case'); await settle();
  const tLink = build.project.links.find(l => l.parent === 'tertiary');

  t('range: case level shows min + max count inputs', () => {
    if(!el('pInC') || !el('pInCmax')) throw new Error('cartons-per-case min/max inputs missing at case level');
  });

  tEdit('range: min==max reproduces the single-count candidate set', () => {
    tLink.count = 12; tLink.countMax = undefined; build.recompute();
    const single = build.getRows().length;
    el('pInCmax').value = '12'; fire(el('pInCmax'), 'input');   // max==min → still single
    if(build.getRows().length !== single) throw new Error(`min==max changed the set: ${single} → ${build.getRows().length}`);
    if(build.getRows().some(r => r.cartonsPerCase !== 12)) throw new Error('single-count set has a stray count');
  });

  tEdit('range: a min–max spread yields multiple counts, ranked, capped at 50', () => {
    el('pInC').value = '5'; fire(el('pInC'), 'input');
    el('pInCmax').value = '20'; fire(el('pInCmax'), 'input');
    const rows = build.getRows();
    const counts = new Set(rows.map(r => r.cartonsPerCase));
    if(counts.size < 2) throw new Error(`range did not produce multiple counts: ${[...counts]}`);
    if(rows.length > 50) throw new Error(`display cap exceeded: ${rows.length} rows`);
    // capped set is the best by cartons/pallet — the max in the set equals the
    // global max (nothing better was dropped)
    const maxCpp = Math.max(...rows.map(r => r.cartonsPerPallet || 0));
    if(!(maxCpp > 0)) throw new Error('no positive cartons/pallet in the ranked set');
    // reset
    el('pInC').value = '12'; fire(el('pInC'), 'input');
    el('pInCmax').value = '12'; fire(el('pInCmax'), 'input');
  });

  t('range: Cartons/case column present in the Build table', () => {
    el('tabBuild').click();
    const heads = [...document.querySelectorAll('#bTable thead th')].map(t => t.textContent.trim());
    if(!heads.some(h => /cartons?\/case/i.test(h))) throw new Error(`no Cartons/case column: ${heads.join(', ')}`);
    el('tab3d').click();
  });

  // the block pins count/countMax on a real link and re-ranks the candidate
  // list — hand both, and the selection the re-rank commits, back
  restoreProject(rangeSnap, rangeKey);
})();

/* ==================================================================
   Disabled-level RENDER MATRIX (closes the fixed-chain-assumption class):
   for every enabled/disabled combination of the optional levels (wrap,
   carton, case), no enabled level with valid geometry may blank a view.
   Drives the REAL app through 2D / 3D-hierarchy / palletize and asserts:
     - the resolved row carries geometry for every enabled level AND the
       product pieces (renderable), and
     - every reachable 3D depth renders meshes with no uncaught error, and
     - the 2D dieline for each enabled level shows geometry (not the empty
       "no dieline" message), and the pallet readout is populated.
   Let the matrix find gaps that weren't hand-enumerated.
   ================================================================== */
await (async () => {
  const defaultWrap = JSON.parse(JSON.stringify(build.project.primary.wrap));
  const clone = o => JSON.parse(JSON.stringify(o));
  const svgHasGeometry = () => /<(path|polygon|line|rect|circle)/.test(el('svg').innerHTML) &&
    !/No dieline|No piece|does not fit/.test(el('svg').textContent || '');

  for(const wrapOn of [true, false]) for(const cartonOn of [true, false]) for(const caseOn of [true, false]){
    if(!cartonOn && !caseOn) continue;   // guard: at least one packaging level stays enabled
    const tag = `wrap:${wrapOn?'on':'off'} carton:${cartonOn?'on':'off'} case:${caseOn?'on':'off'}`;
    // set the combo directly on the model, then rebuild the active level
    build.project.primary.wrap = wrapOn ? clone(defaultWrap) : null;
    build.project.secondary.enabled = cartonOn;
    build.project.tertiary.enabled = caseOn;
    build.recompute();

    // model invariant: the resolved row exposes renderable data for every
    // enabled level and for the product pieces
    t(`matrix [${tag}]: resolved row carries geometry for every enabled level + product`, () => {
      const row = resolveActiveRow(build.project, build.getRounding(), null);
      if(!row) throw new Error('no resolved row');
      if(!row.arr.pieces) throw new Error('product pieces not retained — innermost view would blank');
      if(wrapOn && !row.geo.wrap) throw new Error('wrap enabled but no wrap geometry');
      // wrap OFF: product feeds the carton directly — no film geometry, the
      // pieces themselves ARE the carton's contents (the carton->case render
      // bug this matrix guards against was exactly a missing-wrap deref).
      if(!wrapOn && row.geo.wrap) throw new Error('wrap disabled but wrap geometry present — product should feed the carton directly');
      if(cartonOn && !row.geo.carton) throw new Error('carton enabled but no carton geometry');
      if(caseOn && !row.geo.case) throw new Error('case enabled but no case geometry');
    });

    // 2D dieline for each ENABLED style level shows real geometry
    for(const lvl of ['wrap', 'carton', 'case']){
      const on = lvl === 'wrap' ? wrapOn : lvl === 'carton' ? cartonOn : caseOn;
      if(!on) continue;
      setLevel(lvl); el('tab2d').click(); await settle();
      t(`matrix [${tag}]: 2D ${lvl} dieline renders geometry (not blank)`, () => {
        if(!svgHasGeometry()) throw new Error(`2D ${lvl} blank: ${el('svg').innerHTML.slice(0, 80)}`);
      });
    }

    // 3D hierarchy: every reachable depth renders meshes, no uncaught error
    el('tab3d').click(); await settle();
    for(const depth of ['product', 'wrap', 'carton', 'case', 'pallet']){
      if(el('d_' + depth).disabled) continue;   // depth not reachable for this combo
      uncaught.length = 0;
      el('d_' + depth).click(); await settle();
      t(`matrix [${tag}]: 3D ${depth} depth renders meshes, no throw`, () => {
        if(uncaught.length) throw new Error(`3D ${depth} threw: ${uncaught.join('; ')}`);
        if(hier.renderedMeshCount() === 0) throw new Error(`3D ${depth} rendered nothing (blank) for ${tag}`);
      });
    }

    // palletize: the outermost enabled tier is on the pallet, readout populated.
    // The readout updates on every recompute (no Palletize view to visit).
    t(`matrix [${tag}]: palletize readout populated (outermost tier on the pallet)`, () => {
      if(el('palTot').textContent === '--') throw new Error(`pallet readout blank for ${tag}`);
    });
    el('tab2d').click(); await settle();
  }

  // restore the default all-enabled chain for any later work
  build.project.primary.wrap = clone(defaultWrap);
  build.project.secondary.enabled = true;
  build.project.tertiary.enabled = true;
  build.recompute();
  setLevel('case'); await settle();
})();

/* ==================================================================
   Product-depth piece orientation shares ONE source with the deeper views:
   the same pieceGeo(piece, stackAxis) drives how a Round piece lies. In Pile
   pack it stands (thickness up); in On Edge it lies on its side (thickness
   along the run, diameter tall) — the bare-piece view must not hardcode a
   separate upright. Asserted via the hierarchy's rendered oriented extent.
   ================================================================== */
await (async () => {
  const setSeg = (id, v) => [...el(id).querySelectorAll('button')].find(b => b.dataset.v === v).click();
  const productOuter = async mode => {
    setLevel('product'); await settle();
    setSeg('cShape', 'round'); await settle();
    setSeg('cMode', mode); await settle();
    el('tab3d').click(); await settle();
    el('d_product').click(); await settle();
    return hier.renderedOuter();
  };
  const pile = await productOuter('pile');
  const edge = await productOuter('onedge');
  t('product depth: a Round piece STANDS in Pile pack (thickness up, round face in plan)', () => {
    if(!(Math.abs(pile.L - pile.W) < 1e-6 && pile.H < pile.L))
      throw new Error(`not a standing coin: ${JSON.stringify(pile)}`);
  });
  t('product depth: a Round piece lies ON ITS SIDE in On Edge (same source as deeper views)', () => {
    if(!(edge.L < edge.H && Math.abs(edge.W - edge.H) < 1e-6))
      throw new Error(`not on its side: ${JSON.stringify(edge)}`);
    if(edge.L === pile.L) throw new Error('On Edge did not re-orient the bare piece at product depth');
  });
  // restore a clean default state
  setLevel('product'); await settle(); setSeg('cMode', 'pile'); await settle();
  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ==================================================================
   The wrap's TWO states, one material rule. Solid draws a CLOSED pack —
   what ships: opaque, nothing showing through, no seal colouring, plain
   unprinted film unless there is artwork. Cutaway is the look-inside view
   and is unchanged. Every site that draws a closed wrap takes the same
   materials, so Solid cannot be white at wrap depth and teal inside a case.
   ================================================================== */
await (async () => {
  const wmSnap = snapProject();
  let wmSrc = null;
  const hex = name => (LEGEND.find(l => l.name === name) || {}).hex.toLowerCase();
  const FILM = hex('Film'), SEAL = hex('Fin seal'), PLAIN = hex('Unprinted film'), PRODUCT = hex('Product');
  // every material actually drawn, by colour/transparency/texture — the render,
  // not the code that chose it
  const drawn = () => {
    const out = [];
    getPivot().traverse(o => {
      if(!(o.isMesh || o.isInstancedMesh) || o.name === 'shelfFixture') return;
      for(let n = o; n; n = n.parent) if(!n.visible) return;
      for(const m of (Array.isArray(o.material) ? o.material : [o.material]))
        if(m) out.push({hex: '#' + m.color.getHexString().toLowerCase(),
                        clear: !!m.transparent && (m.opacity ?? 1) < 1, map: !!m.map, n: o.count || 1});
    });
    return out;
  };
  const has = (list, h) => list.some(x => x.hex === h);

  setLevel('wrap'); el('tab3d').click(); await settle();
  el('d_wrap').click(); await settle();
  el('m3solid').click();
  const solidReady = await waitFrames(() => drawn().length > 0 && !drawn().some(x => x.clear));
  const solidMats = drawn();
  el('m3cut').click();
  const cutReady = await waitFrames(() => drawn().some(x => x.clear));
  const cutMats = drawn();

  t('wrap SOLID is the closed pack — opaque, no seal colour, no contents', () => {
    // Solid used to fall through to the cutaway whenever there was no artwork,
    // so an unprinted pack had two identical modes and the crimp zones showed
    // orange on a pack that was meant to be plain film.
    if(!solidReady || !solidMats.length) throw new Error('nothing drawn at wrap depth in Solid');
    const clear = solidMats.filter(x => x.clear);
    if(clear.length) throw new Error(`${clear.length} translucent material(s) in Solid — the pack must be opaque`);
    if(has(solidMats, SEAL)) throw new Error('the seal zones are still coloured in Solid');
    if(has(solidMats, FILM)) throw new Error('the cutaway film colour is still in Solid');
    if(has(solidMats, PRODUCT)) throw new Error('product is visible through a closed pack');
    if(!solidMats.every(x => x.hex === PLAIN || x.map))
      throw new Error(`Solid must be plain film (or artwork) end to end: ${[...new Set(solidMats.map(x => x.hex))].join(', ')}`);
  });

  t('wrap CUTAWAY is unchanged — translucent film, seal zones coloured, contents visible', () => {
    if(!cutReady) throw new Error('no translucent film at wrap depth in Cutaway');
    if(!cutMats.some(x => x.clear && x.hex === FILM)) throw new Error('the film must stay translucent in Cutaway');
    if(!has(cutMats, SEAL)) throw new Error('the seal zones must stay coloured in Cutaway');
    if(!has(cutMats, PRODUCT)) throw new Error('the contents must stay visible in Cutaway');
  });

  // the SAME rule at every other site a closed wrap is drawn: the non-hero
  // packs inside an opened case, and the shelf facings
  el('d_case').click(); el('m3cut').click(); await settle();
  const insideCase = await waitFrames(() => drawn().some(x => x.hex === PLAIN));
  const caseMats = drawn();
  const casePlain = caseMats.filter(x => x.hex === PLAIN).reduce((a, x) => a + x.n, 0);

  t('closed wraps inside a case follow the same rule — plain film, one hero cut away', () => {
    if(!insideCase) throw new Error('no closed wrap parts drawn inside the opened case');
    if(!(casePlain > 5)) throw new Error(`only ${casePlain} plain-film parts — the non-hero packs are not following the rule`);
    // exactly ONE pack is opened, so the cutaway colours appear once, not per pack
    const clearFilm = caseMats.filter(x => x.clear && x.hex === FILM).reduce((a, x) => a + x.n, 0);
    if(clearFilm !== 1) throw new Error(`${clearFilm} translucent film bodies — only the ONE opened pack may be see-through`);
  });

  // the shelf sells the CARTON while there is one — turn it off so the WRAP is
  // the sellable pack and the facings are actually wraps (this pin is about the
  // wrap's material rule, so the fixture has to put a wrap on the shelf)
  build.project.secondary.enabled = false;
  build.recompute();
  el('tabShelf').click();
  const shelfReady = await waitFrames(() => drawn().length > 0 && drawn().every(x => x.hex === PLAIN));
  const shelfMats = drawn();

  t('shelf facings follow the same rule — a shelf of plain film packs', () => {
    if(!shelfReady || !shelfMats.length) throw new Error('no facings drawn on the shelf');
    const stray = [...new Set(shelfMats.filter(x => x.hex !== PLAIN).map(x => x.hex))];
    if(stray.length) throw new Error(`shelf facings are not plain film: ${stray.join(', ')}`);
  });

  // ARTWORK beats white: white stands in for UNPRINTED film, so an uploaded
  // graphic must still show in Solid — hiding it would defeat the feature.
  // The upload decodes asynchronously and only the FIRST caller's decode
  // callback fires, so wait for the app's own cached image and re-render.
  {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#c33'; g.fillRect(0, 0, 64, 32);
    g.fillStyle = '#36c'; g.fillRect(0, 32, 64, 32);
    wmSrc = c.toDataURL('image/png');
    build.project.artwork = build.project.artwork || {};
    build.project.artwork.wrap = {src: wmSrc, fit: 'fill'};
    build.recompute();
  }
  el('tab3d').click(); setLevel('wrap'); await settle();
  el('d_wrap').click(); el('m3solid').click(); await settle();
  await waitFrames(() => artImage(wmSrc).complete && artImage(wmSrc).naturalWidth > 0);
  build.recompute();                                   // re-render now it has decoded
  const printedReady = await waitFrames(() => drawn().some(x => x.map));
  const printedMats = drawn();

  t('wrap SOLID shows ARTWORK where there is artwork — on EVERY part, seals included', () => {
    if(!printedReady) throw new Error('the printed body never reached the render');
    if(!printedMats.some(x => x.map)) throw new Error('Solid hid the artwork — white must be the NO-artwork default only');
    if(printedMats.some(x => x.clear)) throw new Error('a printed pack must still be opaque');
    if(has(printedMats, SEAL)) throw new Error('no seal DIAGRAM colouring on a printed pack (that is cutaway-only)');
    // printed film runs CONTINUOUSLY through the ramp and into the crimp — the
    // ramps and crimp tabs carry the same texture, mapped into the template's
    // RAMP/END SEAL columns, or a printed pack shows a bare white band before
    // each crimp (bug 3). "Plain film there" was the old rule, and wrong.
    if(!printedMats.every(x => x.map))
      throw new Error(`every part of a printed pack must carry the texture: ${printedMats.filter(x => !x.map).length} plain part(s)`);
  });

  // ---- The print reads like the TEMPLATE — up is up, left is left ----
  // Quadrant canvas over the FULL artMap canvas (template space: TL red,
  // TR yellow, BL blue, BR green), sampled off the RENDERED pixels at an
  // elevated FRONT view. The first mapping rendered the template rotated
  // exactly 180° — every corner colour sat diagonally opposite — and had
  // been eyeballed as correct from an angle where a 180° turn looks
  // plausible. Only a pixel-level comparison of render vs template pins
  // this; every extent/material measure is blind to it.
  let qSrc = null;
  {
    const am0 = resolveActiveRow(build.project, build.getRounding(), null).geo.wrap.meta.artMap;
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#ff0000'; g.fillRect(0, 0, 64, 64);
    g.fillStyle = '#ffff00'; g.fillRect(64, 0, 64, 64);
    g.fillStyle = '#0000ff'; g.fillRect(0, 64, 64, 64);
    g.fillStyle = '#00ff00'; g.fillRect(64, 64, 64, 64);
    qSrc = c.toDataURL('image/png');
    build.project.artwork.wrap = {src: qSrc, fit: 'none', rect: {x: 0, y: 0, w: am0.canvas.w, h: am0.canvas.h}};
    build.recompute();
  }
  await waitFrames(() => artImage(qSrc).complete && artImage(qSrc).naturalWidth > 0);
  el('d_wrap').click(); el('m3solid').click(); build.recompute();
  const savedPose = getOrbit();
  setOrbit(0.9, 0, 1.3);                       // straight elevated FRONT — unambiguous axes
  let qCam = null;
  const offFrame = onFrame(c2 => { qCam = c2; });
  await waitFrames(() => !!qCam && drawn().some(x => x.map));
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const quadSamples = (() => {
    const env = resolveActiveRow(build.project, build.getRounding(), null).geo.wrap.inner;
    const cv = getDomElement();
    const g2 = document.createElement('canvas'); g2.width = cv.width; g2.height = cv.height;
    const cx2 = g2.getContext('2d'); cx2.drawImage(cv, 0, 0);
    const samp = (wx, wy, wz) => {
      const v = new THREE.Vector3(wx, wy, wz).project(qCam);
      const d = cx2.getImageData(Math.round((v.x + 1)/2*cv.width), Math.round((1 - v.y)/2*cv.height), 1, 1).data;
      return [d[0], d[1], d[2]];
    };
    const hH = env.H/2 + 0.1, L = env.L, W = env.W;
    return {nLnW: samp(-L/4, hH, -W/4), pLnW: samp(L/4, hH, -W/4),
            nLpW: samp(-L/4, hH, W/4),  pLpW: samp(L/4, hH, W/4)};
  })();
  offFrame && offFrame();
  setOrbit(savedPose.rotX, savedPose.rotY, savedPose.dist);

  t('artwork on the 3D pack reads like the TEMPLATE — quadrants land where the template puts them', () => {
    const hue = c => {
      const [r, g, bl] = c;
      if(r > 150 && g > 150 && bl < 120) return 'YELLOW';
      if(r > 150 && g < 130 && bl < 130) return 'RED';
      if(g > 130 && r < 130 && bl < 130) return 'GREEN';
      if(bl > 150 && r < 130) return 'BLUE';
      return `?(${c.join(',')})`;
    };
    // at the elevated FRONT view, screen-left = −L and the face's reading-up =
    // the far edge (−W): template top-left must land at (−L, −W), and so on
    // around. The 180°-rotated mapping put every colour diagonally opposite.
    const want = {nLnW: 'RED', pLnW: 'YELLOW', nLpW: 'BLUE', pLpW: 'GREEN'};
    for(const [k, exp] of Object.entries(want)){
      const got = hue(quadSamples[k]);
      if(got !== exp) throw new Error(`${k}: template says ${exp}, render shows ${got} — the print does not read like the template`);
    }
  });

  // ---- FACE COVERAGE ----
  // The quadrant pin above samples the TOP face only, and that is exactly how
  // the seam smear survived three rounds of artwork work: the body ring had no
  // vertex at the seam, so the girth walk interpolated its whole range across
  // the ONE segment spanning the bottom — the bottom rendered a squashed
  // SIDE-FRONT-SIDE sweep and the template's two BACK half-bands and its fin
  // allowance never appeared on the pack at all. A pin that samples one face
  // cannot see a defect on the opposite one.
  //
  // So every panel gets its own colour — the two BACK halves and the two SIDEs
  // SEPARATELY, since a shared colour would hide a swap between them — and
  // every face is sampled from a view where it is front-facing. Two passes,
  // because the reader cannot resolve eight colours at once (see
  // BAND_PALETTE/COLUMN_PALETTE): pass A reads the girth walk and the fin,
  // pass B the ramp and end-seal columns.
  const hexOf = rgb => '#' + rgb.map(x => x.toString(16).padStart(2, '0')).join('');
  const paint = (bandCols, rampCol, endCol, finCol) => {
    const am0 = resolveActiveRow(build.project, build.getRounding(), null).geo.wrap.meta.artMap;
    const CW = am0.canvas.w, CH = am0.canvas.h, k = 4;
    const c = document.createElement('canvas'); c.width = Math.round(CW*k); c.height = Math.round(CH*k);
    const g = c.getContext('2d');
    // template space is v-UP, canvas px are y-DOWN
    const band = (v0, v1, rgb) => { g.fillStyle = hexOf(rgb); g.fillRect(0, (CH - v1)*k, CW*k, (v1 - v0)*k); };
    const colm = (u0, u1, rgb) => { g.fillStyle = hexOf(rgb); g.fillRect(u0*k, 0, (u1 - u0)*k, CH*k); };
    band(0, CH, finCol);                                   // fin allowance, above and below the bands
    am0.faces.forEach((f, i) => band(f.v0, f.v1, bandCols[i]));
    if(am0.ends){                                          // full-height u columns, outermost last
      colm(am0.ends[0].u1, am0.product.x0, rampCol);
      colm(am0.product.x1, am0.ends[1].u0, rampCol);
      colm(0, am0.ends[0].u1, endCol);
      colm(am0.ends[1].u0, CW, endCol);
    }
    const src = c.toDataURL('image/png');
    build.project.artwork.wrap = {src, fit: 'none', rect: {x: 0, y: 0, w: CW, h: CH}};
    build.recompute();
    return src;
  };
  const named = (palette, n) => palette.find(x => x.name === n).rgb;

  // sample a set of world points from a given orbit, once the frame has drawn
  const savedPose2 = getOrbit();
  const sampleAt = async (rotX, rotY, pick) => {
    setOrbit(rotX, rotY, 1.3);
    let cam = null;
    const offF = onFrame(c2 => { cam = c2; });
    await waitFrames(() => !!cam && drawn().some(x => x.map));
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    offF && offF();
    const row = resolveActiveRow(build.project, build.getRounding(), null);
    const env = row.geo.wrap.inner, seal = row.geo.wrap.meta.seal;
    const cv = getDomElement();
    const g2 = document.createElement('canvas'); g2.width = cv.width; g2.height = cv.height;
    const cx2 = g2.getContext('2d'); cx2.drawImage(cv, 0, 0);
    const proj = (wx, wy, wz) => new THREE.Vector3(wx, wy, wz).project(cam);
    const samp = (wx, wy, wz) => {
      const v = proj(wx, wy, wz);
      const d = cx2.getImageData(Math.round((v.x + 1)/2*cv.width), Math.round((1 - v.y)/2*cv.height), 1, 1).data;
      return [d[0], d[1], d[2]];
    };
    return pick({env, seal, samp, proj});
  };
  const endPoints = ({env, seal, samp}) => {
    const hH = env.H/2 + 0.05, jaw = seal.jawClearance, flat = seal.sealFlatLength;
    const lay = (90 - (seal.externalAngle == null ? 90 : seal.externalAngle))*Math.PI/180;
    const tab = (sign, t) => { const d = t*flat;
      return [sign*(env.L/2 + jaw) + sign*d*Math.cos(lay), d*Math.sin(lay), 0]; };
    return {rampPos: samp(env.L/2 + jaw*0.5, (hH + 0.1)/2, 0),
            rampNeg: samp(-(env.L/2 + jaw*0.5), (hH + 0.1)/2, 0),
            tabPos: samp(...tab(1, 0.5)), tabNeg: samp(...tab(-1, 0.5))};
  };

  // ---- pass A: the girth walk and the fin ----
  const bandHits = {};
  {
    const src = paint(['BACK-lo', 'SIDE-lo', 'FRONT', 'SIDE-hi', 'BACK-hi'].map(n => named(BAND_PALETTE, n)),
                      named(BAND_PALETTE, 'COLUMN'), named(BAND_PALETTE, 'COLUMN'), named(BAND_PALETTE, 'FIN'));
    await waitFrames(() => artImage(src).complete && artImage(src).naturalWidth > 0);
    el('d_wrap').click(); el('m3solid').click(); build.recompute();
    await sampleAt(0.9, 0, ({env, samp}) => { bandHits.top = samp(0, env.H/2 + 0.05, 0); });
    await sampleAt(-0.9, 0, ({env, samp}) => {              // from BELOW
      const y = -env.H/2 - 0.05, W = env.W;
      bandHits.botNegW = samp(0, y, -W*0.32);
      bandHits.botPosW = samp(0, y, W*0.32);
      bandHits.fin     = samp(0, -env.H/2 - 0.3, 0);        // the fin lies over the seam
    });
    // the SIDES: both sample points project onto whichever side is NEAR, so the
    // near one is identified by NDC depth and only that one is trusted — and the
    // two views between them must cover both signs, or a side goes untested.
    for(const ry of [0, Math.PI])
      await sampleAt(0.1, ry, ({env, samp, proj}) => {
        const W = env.W;
        const sign = proj(0, 0, -W/2 - 0.05).z < proj(0, 0, W/2 + 0.05).z ? -1 : 1;
        bandHits[sign < 0 ? 'sideNegW' : 'sidePosW'] = samp(0, 0, sign*(W/2 + 0.05));
      });
  }

  // ---- pass B: the ramp and end-seal columns ----
  const colHits = {};
  {
    const blue = named(COLUMN_PALETTE, 'BAND');
    const src = paint([blue, blue, blue, blue, blue],
                      named(COLUMN_PALETTE, 'RAMP'), named(COLUMN_PALETTE, 'END'), named(COLUMN_PALETTE, 'FIN'));
    await waitFrames(() => artImage(src).complete && artImage(src).naturalWidth > 0);
    el('d_wrap').click(); el('m3solid').click(); build.recompute();
    Object.assign(colHits, await sampleAt(0.9, 0, endPoints));
  }
  setOrbit(savedPose2.rotX, savedPose2.rotY, savedPose2.dist);

  t('the pack BOTTOM carries the two BACK halves — no seam smear, no discarded artwork', () => {
    const a = readBand(bandHits.botNegW), b2 = readBand(bandHits.botPosW);
    // the girth walk puts one BACK half either side of the seam. The smear
    // rendered SIDE-FRONT-SIDE here and the BACK bands nowhere at all.
    if(!/^BACK-/.test(a)) throw new Error(`bottom at −W reads ${a}, must be a BACK half`);
    if(!/^BACK-/.test(b2)) throw new Error(`bottom at +W reads ${b2}, must be a BACK half`);
    if(a === b2) throw new Error(`both bottom halves read ${a} — the seam is not splitting the walk`);
    // −W is the half the walk enters first (v descending from the seam), so it
    // takes the HIGH back band; +W closes the walk on the low one
    eq(a, 'BACK-hi', 'bottom −W half:');
    eq(b2, 'BACK-lo', 'bottom +W half:');
  });

  t('every FACE carries its own panel — sides, ramps, crimps and fin, not just the top', () => {
    if(!bandHits.sideNegW || !bandHits.sidePosW)
      throw new Error('the two side views did not cover both sides — one side went untested');
    // the girth walk from the seam is BACK-hi → SIDE-hi → FRONT → SIDE-lo →
    // BACK-lo, so each physical face is determined; the ramps and crimps take
    // their own template columns, and the fin its allowance band
    const got = {
      top: readBand(bandHits.top),
      sideNegW: readBand(bandHits.sideNegW), sidePosW: readBand(bandHits.sidePosW),
      fin: readBand(bandHits.fin),
      rampPos: readColumn(colHits.rampPos), rampNeg: readColumn(colHits.rampNeg),
      tabPos: readColumn(colHits.tabPos), tabNeg: readColumn(colHits.tabNeg)
    };
    const want = {top: 'FRONT', sideNegW: 'SIDE-hi', sidePosW: 'SIDE-lo', fin: 'FIN',
                  rampPos: 'RAMP', rampNeg: 'RAMP', tabPos: 'END', tabNeg: 'END'};
    const bad = Object.entries(want).filter(([k, v]) => got[k] !== v)
      .map(([k, v]) => `${k}: want ${v}, render shows ${got[k]}`);
    if(bad.length) throw new Error(bad.join('; '));
    if(got.sideNegW === got.sidePosW)
      throw new Error('both sides read the same band — a side/side swap would be invisible');
  });

  // ---- Crimp density continuity ----
  // The tab used to stretch the WHOLE canvas height across its width: the
  // right region at the right u span (the diagnostic proved that), but 2.3x
  // the texel density of the ramp it joins, so a real graphic read as a
  // blown-up crop at a hard scale jump on the crimp line. Measured on the
  // BUILT geometry — template-mm of v per mm of surface, along the girth on
  // each side of the join — because that ratio IS the visible artefact and no
  // colour or extent check can see it.
  const crimpDensities = (() => {
    const am0 = resolveActiveRow(build.project, build.getRounding(), null).geo.wrap.meta.artMap;
    const CH = am0.canvas.h;
    let parts = null;
    getPivot().traverse(o => {
      if(parts || !o.isGroup) return;
      for(let n = o; n; n = n.parent) if(!n.visible) return;
      const kids = o.children.filter(x => x.isMesh && x.geometry.attributes.uv);
      if(kids.length >= 5) parts = kids;
    });
    if(!parts) return null;
    // walk one ring of a loft: the vertices sharing the extreme machine coord.
    // loftGeometry lays the rings first and appends two cap centroids, so the
    // last two vertices are excluded.
    const ringDensity = (m, wantMax) => {
      const pos = m.geometry.attributes.position, uv = m.geometry.attributes.uv;
      const n = pos.count - 2;
      let lo = Infinity, hi = -Infinity;
      for(let i = 0; i < n; i++){ const x = pos.getX(i); if(x < lo) lo = x; if(x > hi) hi = x; }
      const target = wantMax ? hi : lo;
      let arc = 0, dv = 0, prev = -1;
      for(let i = 0; i < n; i++){
        if(Math.abs(pos.getX(i) - target) > 1e-4) continue;
        if(prev >= 0){
          const d = Math.hypot(pos.getX(i) - pos.getX(prev), pos.getY(i) - pos.getY(prev), pos.getZ(i) - pos.getZ(prev));
          const s2 = Math.abs(uv.getY(i) - uv.getY(prev))*CH;
          if(s2 <= CH*0.5){ arc += d; dv += s2; }      // skip the seam discontinuity
        }
        prev = i;
      }
      return arc > 0 ? dv/arc : 0;
    };
    // the tab's own top face, walked across its width
    const tabDensity = (m) => {
      const pos = m.geometry.attributes.position, uv = m.geometry.attributes.uv;
      let hy = -Infinity;
      for(let i = 0; i < pos.count; i++) hy = Math.max(hy, pos.getY(i));
      const ids = [];
      for(let i = 0; i < pos.count; i++) if(Math.abs(pos.getY(i) - hy) < 1e-6) ids.push(i);
      ids.sort((a2, b2) => pos.getZ(a2) - pos.getZ(b2));
      let arc = 0, dv = 0;
      for(let k = 1; k < ids.length; k++){
        const d = Math.abs(pos.getZ(ids[k]) - pos.getZ(ids[k - 1]));
        if(d < 1e-9) continue;
        arc += d; dv += Math.abs(uv.getY(ids[k]) - uv.getY(ids[k - 1]))*CH;
      }
      return arc > 0 ? dv/arc : 0;
    };
    return {body: ringDensity(parts[0], true), rampCrimp: ringDensity(parts[1], true), tab: tabDensity(parts[3])};
  })();

  t('the print does not jump scale at the crimp line — tab density continues the ramp', () => {
    const d = crimpDensities;
    if(!d) throw new Error('no printed wrap parts to measure');
    if(!(d.body > 0 && d.rampCrimp > 0 && d.tab > 0))
      throw new Error(`densities not measurable: ${JSON.stringify(d)}`);
    // the gather is REAL: the section collapses along the ramp, so the ramp's
    // crimp end is denser than the body. What must not exist is a STEP at the
    // join, where the film is one continuous web.
    const step = d.tab/d.rampCrimp;
    if(!(step > 0.8 && step < 1.25))
      throw new Error(`density steps ${step.toFixed(2)}x across the crimp line ` +
        `(body ${d.body.toFixed(2)}, ramp-at-crimp ${d.rampCrimp.toFixed(2)}, tab ${d.tab.toFixed(2)})`);
    // and the fixture is only discriminating while the ramp actually gathers
    if(!(d.rampCrimp > d.body*1.2))
      throw new Error(`fixture not discriminating: ramp ${d.rampCrimp.toFixed(2)} vs body ${d.body.toFixed(2)}`);
  });

  el('tab3d').click();
  restoreProject(wmSnap);
  setLevel('case'); await settle();
})();

/* ==================================================================
   The shelf presents the pack's declared face THE RIGHT WAY UP, and a
   printed wrap keeps its face selector. Two gaps in the same convention:
   an orientation string names axes only, so it fixes which face is
   forward but not which way is up on it (the wrap stood on its head);
   and the selector locked on "has artwork" alone, which took the control
   away from wraps whose art rides the real geometry and orients freely.
   ================================================================== */
await (async () => {
  const shSnap = snapProject(), shKey = build.getSelectedCandidateKey();
  const savedFront = el('shFront').value, savedPose3 = getOrbit();
  const packMeshes3 = () => {
    const hits = [];
    getPivot().traverse(o => {
      if(!o.isInstancedMesh || o.name === 'shelfFixture') return;
      for(let n = o; n; n = n.parent) if(!n.visible) return;
      hits.push(o);
    });
    return hits;
  };
  const printedFacings = () => packMeshes3().some(m =>
    (Array.isArray(m.material) ? m.material : [m.material]).some(x => x && x.map));

  // ---- a PRINTED WRAP on the shelf, artwork with an unmistakable up/left ----
  let quadSrc = null;
  {
    const proj = build.project;
    proj.tray.enabled = true; proj.tray.nCells = 3;
    Object.assign(proj.primary.collation,
      {pieceOrientation: 'on-edge', stackAxis: 'X', perStack: 10, nx: 1, ny: 1});
    proj.secondary.enabled = false;                  // carton off -> the WRAP is sellable
    const am0 = resolveActiveRow(build.project, build.getRounding(), null).geo.wrap.meta.artMap;
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#ff0000'; g.fillRect(0, 0, 64, 64);      // template TOP-LEFT
    g.fillStyle = '#ffff00'; g.fillRect(64, 0, 64, 64);     // TOP-RIGHT
    g.fillStyle = '#0000ff'; g.fillRect(0, 64, 64, 64);     // BOTTOM-LEFT
    g.fillStyle = '#00ff00'; g.fillRect(64, 64, 64, 64);    // BOTTOM-RIGHT
    quadSrc = c.toDataURL('image/png');
    proj.artwork = {wrap: {src: quadSrc, fit: 'none', rect: {x: 0, y: 0, w: am0.canvas.w, h: am0.canvas.h}}};
    build.recompute();
  }
  await waitFrames(() => artImage(quadSrc).complete && artImage(quadSrc).naturalWidth > 0);
  el('shFront').value = 'auto'; fire(el('shFront'), 'change');
  el('tabShelf').click(); build.recompute();
  const shPrinted = await waitFrames(() => printedFacings());

  // sample ONE facing pack's front face at a straight FRONT view. Screen up is
  // the shelf's up and screen right is the shopper's right, so the template's
  // own corners must land in the matching screen corners — which catches an
  // upside-down pack AND a mirrored one, neither of which moves any extent.
  setOrbit(0, 0, 1.15);
  let shCam = null;
  const offF3 = onFrame(c2 => { shCam = c2; });
  await waitFrames(() => !!shCam && printedFacings());
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  offF3 && offF3();
  const shCorners = (() => {
    const mesh = packMeshes3()[0];
    if(!mesh) return null;
    const cv = getDomElement();
    const g2 = document.createElement('canvas'); g2.width = cv.width; g2.height = cv.height;
    const cx2 = g2.getContext('2d'); cx2.drawImage(cv, 0, 0);
    const M = new THREE.Matrix4();
    mesh.getMatrixAt(0, M); M.premultiply(mesh.matrixWorld);
    const centre = new THREE.Vector3().setFromMatrixPosition(M);
    const o = resolveActiveRow(build.project, build.getRounding(), null).geo.wrap.outer;
    const scr = v => { const q = v.clone().project(shCam);
      return [Math.round((q.x + 1)/2*cv.width), Math.round((1 - q.y)/2*cv.height)]; };
    const samp = (x, y) => { const d = cx2.getImageData(x, y, 1, 1).data; return [d[0], d[1], d[2]]; };
    const c0 = scr(centre);
    // a quarter of the face across and up, in SCREEN terms (the shelf group's
    // own 180° turn is already in the projection, so this needs no unpicking)
    const dx = Math.abs(scr(centre.clone().add(new THREE.Vector3(o.L/4, 0, 0)))[0] - c0[0]);
    const dy = Math.abs(scr(centre.clone().add(new THREE.Vector3(0, o.W/4, 0)))[1] - c0[1]);
    if(dx < 3 || dy < 3) return null;
    return {UL: samp(c0[0] - dx, c0[1] - dy), UR: samp(c0[0] + dx, c0[1] - dy),
            LL: samp(c0[0] - dx, c0[1] + dy), LR: samp(c0[0] + dx, c0[1] + dy)};
  })();
  setOrbit(savedPose3.rotX, savedPose3.rotY, savedPose3.dist);

  // ---- is the selector usable, and honoured? ----
  const wrapFrontState = {disabled: el('shFront').disabled, fills: {}};
  for(const f of ['auto', 'LWH', 'WLH', 'LHW']){
    el('shFront').value = f; fire(el('shFront'), 'change');
    wrapFrontState.fills[f] = (el('shReadout').textContent || '').replace(/\s+/g, ' ').slice(0, 60);
  }
  el('shFront').value = 'auto'; fire(el('shFront'), 'change');

  // ---- and a printed TUBE pack stays pinned (its art is pre-laid-out) ----
  let cartonPinned = null;
  {
    const proj = build.project;
    proj.tray.enabled = false; proj.secondary.enabled = true;
    Object.assign(proj.primary.collation,
      {pieceOrientation: 'flat', stackAxis: 'Z', perStack: 2, nx: 3, ny: 1});
    const cGeo = resolveActiveRow(build.project, build.getRounding(), null).geo.carton;
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'); g.fillStyle = '#c33'; g.fillRect(0, 0, 64, 64);
    const csrc = c.toDataURL('image/png');
    proj.artwork = {carton: {src: csrc, fit: 'fill'}};
    build.recompute();
    await waitFrames(() => artImage(csrc).complete && artImage(csrc).naturalWidth > 0);
    fire(el('shFront'), 'change');
    await waitFrames(() => printedFacings());
    cartonPinned = {disabled: el('shFront').disabled, hasArtMap: !!(cGeo && cGeo.meta.artMap)};
  }

  t('shelf AUTO stands the wrap the right way up — the declared face AND its declared up', () => {
    // meta.frontFace gets the display face forward; on its own that leaves the
    // print 180° out, because an orientation string names axes with no notion
    // of which way is up on the face it selects. meta.frontUp closes it. The
    // symptom was a shelf of upside-down packs that Rotate had to correct by
    // hand — and it moves NO extent, so only the rendered pixels can see it.
    if(!shPrinted) throw new Error('the artwork never reached the shelf facings');
    if(!shCorners) throw new Error('could not sample a facing pack front face');
    const want = {UL: 'RED', UR: 'YELLOW', LL: 'BLUE', LR: 'GREEN'};
    const bad = Object.entries(want)
      .filter(([k, v]) => readQuad(shCorners[k]) !== v)
      .map(([k, v]) => `${k}: template says ${v}, shelf shows ${readQuad(shCorners[k])}`);
    if(bad.length) throw new Error(bad.join('; '));
  });

  t('face selection stays available for a printed WRAP, and pinned for a printed tube pack', () => {
    // A wrap's art rides the real pillow geometry, which orients like anything
    // else, so every face stays selectable; a tube pack's art is built already
    // laid out for one front, so it stays pinned. The old rule locked on "has
    // artwork" alone and took the control away from both.
    if(wrapFrontState.disabled)
      throw new Error('the face selector is locked for a printed wrap');
    const fills = wrapFrontState.fills;
    // ...and the pick is HONOURED: a different face packs the shelf differently
    if(fills.LWH === fills.WLH && fills.WLH === fills.LHW)
      throw new Error(`every face gives the same fill — the selection is not reaching the solve: ${fills.LWH}`);
    eq(fills.auto, fills.LHW, 'Auto must resolve to the wrap\'s declared face (LHW):');
    if(!cartonPinned.hasArtMap)
      throw new Error('fixture not discriminating: the carton carries no artMap');
    if(!cartonPinned.disabled)
      throw new Error('a printed TUBE pack must keep its front pinned — its art is pre-laid-out');
  });

  el('tab2d').click();
  el('shFront').value = savedFront; fire(el('shFront'), 'change');
  restoreProject(shSnap, shKey);
  setLevel('case'); await settle();
})();

/* ==================================================================
   Retail shelf: units reach the shelf readouts (single source), and the
   facings block stays centred on the shelf at every count (bugfix pass).
   ================================================================== */
await (async () => {
  const shelfInstX = () => {   // distinct world-x of the shelf's facing packs
    const THREE = window.THREE, box = getPivot(), xs = new Set();
    const m = new THREE.Matrix4(), v = new THREE.Vector3();
    box.traverse(o => { if(o.isInstancedMesh){ for(let i = 0; i < o.count; i++){ o.getMatrixAt(i, m); v.setFromMatrixPosition(m).applyMatrix4(o.matrixWorld); xs.add(+v.x.toFixed(1)); } } });
    return [...xs].sort((a, b) => a - b);
  };
  el('units').value = 'mm'; el('units').dispatchEvent(new Event('change')); await settle();
  el('tabShelf').click(); await settle();

  t('shelf units: switching to inches converts the shelf fields + labels (one unit source)', () => {
    try{
      const mmVal = el('shWidth').value, mmUnit = el('uShW').textContent;
      el('units').value = 'in'; el('units').dispatchEvent(new Event('change'));
      const inVal = el('shWidth').value, inUnit = el('uShW').textContent;
      if(mmUnit !== 'mm' || inUnit !== 'in') throw new Error(`unit label did not switch: ${mmUnit}->${inUnit}`);
      if(!(Math.abs(+inVal - +mmVal/25.4) < 0.01)) throw new Error(`shelf width did not convert: ${mmVal}mm -> ${inVal}in`);
    } finally {
      el('units').value = 'mm'; el('units').dispatchEvent(new Event('change'));
    }
  });

  await settle();
  t('shelf facings: the block is centred on the shelf at 1, 2, 3 and an even count', () => {
    const front0 = el('shFront').value, facings0 = el('shFacings').value;
    try{
    el('shFront').value = 'LWH'; el('shFront').dispatchEvent(new Event('change'));
    for(const f of [1, 2, 3, 4]){
      el('shFacings').value = String(f); el('shFacings').dispatchEvent(new Event('input'));
      const xs = shelfInstX();
      if(!xs.length) throw new Error(`no facings rendered at count ${f}`);
      const centre = (xs[0] + xs[xs.length - 1]) / 2;
      if(Math.abs(centre) > 1.0) throw new Error(`facings not centred at ${f}: block centre x=${centre}, xs=${JSON.stringify(xs)}`);
    }
    } finally {   // shelf VIEW state is not the project, but it is still state
      el('shFront').value = front0; el('shFront').dispatchEvent(new Event('change'));
      el('shFacings').value = facings0; el('shFacings').dispatchEvent(new Event('input'));
    }
  });
  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ==================================================================
   Material cost — rates x the quantities the chain already solved.
   The point of every pin here: there is ONE cost, derived with the other
   chain values, and the panel / the level readout / the Build column are
   three views of it. A second multiplication anywhere is the bug.
   ================================================================== */
await (async () => {
  setLevel('case'); await settle();
  el('tab2d').click(); await settle();

  const readout = () => {
    const out = {};
    for(const st of document.querySelectorAll('#costReadout .stat'))
      out[st.querySelector('.lab').textContent] = st.querySelector('.val').textContent;
    const n = document.querySelector('#costReadout .bnote');
    out.note = n ? n.textContent : '';
    return out;
  };
  const money = txt => +String(txt).replace(/[$,]/g, '');
  const rowNow = () => resolveActiveRow(build.project, build.getRounding(), build.getSelectedCandidateKey());

  t('cost: the panel is rendered from the chain\'s ONE derivation', () => {
    const r = readout(), row = rowNow();
    if(!row.cost || row.cost.packCost == null) throw new Error('no cost on the resolved row');
    const packLab = Object.keys(r).find(k => /^Material \/ (pack|unit)$/.test(k));
    if(!packLab) throw new Error(`no per-pack readout (got: ${Object.keys(r).join(', ')})`);
    // The rendered ROLL-UP against the pack cost the chain derived. Comparing
    // the two RENDERED figures instead cannot work: the per-pack readout is
    // quantised to a tenth of a cent, which is coarser than the error a wrong
    // roll-up multiplier introduces at that magnitude (measured — a x1024
    // roll-up passed that version of this check). The roll-up is the sharper
    // instrument, so it is the one read.
    const per1000Lab = Object.keys(r).find(k => /1000/.test(k));
    approx(money(r[per1000Lab]), row.cost.packCost*1000, 'the rendered per-1000 is 1000 packs:', 5e-3);
  });

  t('cost: quantity x rate, with the quantity READ from the chain', () => {
    // The one absolute anchor. The quantities come off the row — the chain's
    // own numbers, never re-measured here — and the rates off COST_DEFAULTS.
    // Every term is checked, so a wrong divisor in any of them fails.
    const row = rowNow(), c = row.cost;
    // FIRST: the quantities are the chain's OWN, not ones cost measured for
    // itself. Checking the cost against row.cartonBoardM2 alone cannot see
    // this — both sides move together — so the areas are anchored to numbers
    // that existed before cost did: the Build table's board column for the
    // case, and the rail's own board-area readout for the carton.
    eq(row.caseBoardM2, row.boardAreaM2, 'the case area IS the chain\'s board area:');
    const lvl0 = el('style').value;
    setLevel('carton');
    const shownArea = +(el('area').textContent.match(/[\d.]+/) || [])[0];
    setLevel(lvl0);
    approx(row.cartonBoardM2, shownArea, 'the carton area IS the blank the rail shows:', 5e-4);

    approx(c.perUnit.carton, row.cartonBoardM2*COST_DEFAULTS.cartonBoardPerM2, 'one carton:', 1e-12);
    approx(c.perUnit.case, row.caseBoardM2*COST_DEFAULTS.caseBoardPerM2, 'one case:', 1e-12);
    approx(c.perUnit.film, row.filmKgPerPack*COST_DEFAULTS.filmPerKg, 'film for one pack:', 1e-12);
    approx(c.perPack.carton, c.perUnit.carton/row.packsPerCarton, 'carton share per pack:', 1e-12);
    approx(c.perPack.case, c.perUnit.case/(row.cartonsPerCase*row.packsPerCarton), 'case share per pack:', 1e-12);
    approx(c.perPack.pallet, COST_DEFAULTS.palletPerTrip/row.packsPerPallet, 'pallet share per pack:', 1e-12);
    // ...and the roll-ups put the pallet trip on exactly once
    approx(c.perPallet - (c.packCost - c.perPack.pallet)*row.packsPerPallet,
           COST_DEFAULTS.palletPerTrip, 'one trip per pallet, no more:', 1e-9);
    // the fixture must actually exercise every term
    if(c.missing.includes('carton') || c.missing.includes('case') || c.missing.includes('film'))
      throw new Error(`vacuous fixture: terms missing (${c.missing.join(',')})`);
  });

  t('cost: the RENDERED readout is that same number, not a second one', () => {
    const r = readout(), c = rowNow().cost;
    const packLab = Object.keys(r).find(k => /^Material \/ (pack|unit)$/.test(k));
    const caseLab = Object.keys(r).find(k => /^Material \/ case$/.test(k));
    const palLab = Object.keys(r).find(k => /pallet/i.test(k));
    approx(money(r[packLab]), c.packCost, 'per pack:', 5e-4);
    approx(money(r[caseLab]), c.perCase, 'per case:', 5e-3);
    approx(money(r[palLab]), c.perPallet, 'per pallet:', 0.5);
    // the breakdown names the terms that are actually in the number
    for(const k of c.terms)
      if(!r.note.includes(k)) throw new Error(`the breakdown omits the ${k} term: "${r.note}"`);
  });

  t('cost: the Build column is the rollup for the row it is on', () => {
    const cols = [...document.querySelectorAll('#bTable th')].map(h => h.textContent.replace(/[\u25be\u25b4]/g, '').trim());
    const ci = cols.findIndex(h => /1000 packs/.test(h));
    if(ci < 0) throw new Error(`no cost column (got: ${cols.join(' | ')})`);
    const trs = [...document.querySelectorAll('#bTable tbody tr')];
    if(!trs.length) throw new Error('no candidate rows');
    const sel = trs.find(tr => tr.classList.contains('sel')) || trs[0];
    const shown = money(sel.querySelectorAll('td')[ci].textContent.replace('\u2605', '').trim());
    const sorted = build.sortedRows ? null : null;
    // the row the table highlights is the row every view renders
    approx(shown, rowNow().cost.per1000Packs, 'column vs the resolved row:', 5e-3);
  });

  t('cost: ranking by cost genuinely reorders the candidates', () => {
    // THE point of the column. Rows tied on every count column are not tied
    // on cost, so a count ranking cannot choose between them and a cost
    // ranking can. If this ever stops being true the column is decoration.
    // its OWN fixture: a fresh default project, so the claim is about the
    // feature rather than about whatever state the previous pin left behind
    // (measured: on an inherited state only two candidates tied, 1.5% apart,
    // and the pin read as a failure of the column rather than of the fixture)
    const rows = candidateCases(newProject(), '1mm');
    if(rows.length < 4) throw new Error(`only ${rows.length} candidates`);
    const top = Math.max(...rows.map(r => r.piecesPerPallet || 0));
    const tied = rows.filter(r => (r.piecesPerPallet || 0) === top);
    if(tied.length < 2) throw new Error('vacuous fixture: no two candidates tie on pieces/pallet');
    const costs = tied.map(r => r.cost.per1000Packs);
    const lo = Math.min(...costs), hi = Math.max(...costs);
    if(!(hi > lo*1.05))
      throw new Error(`cost cannot separate the ${tied.length} tied candidates: $${lo.toFixed(2)}..$${hi.toFixed(2)}`);
  });

  tEdit('cost: a rate override moves every dependent number, and resets back', () => {
    const before = rowNow().cost.packCost;
    const beforeShown = readout();
    const packLab = Object.keys(beforeShown).find(k => /^Material \/ (pack|unit)$/.test(k));
    const f = el('cost_filmPerKg');
    if(!f) throw new Error('no film rate field');
    f.value = String(COST_DEFAULTS.filmPerKg*3); fire(f, 'input');
    eq(build.project.cost.filmPerKg, COST_DEFAULTS.filmPerKg*3, 'the override is stored canonically:');
    const after = rowNow().cost;
    approx(after.perUnit.film, rowNow().filmKgPerPack*COST_DEFAULTS.filmPerKg*3, 'film term follows the rate:', 1e-12);
    if(!(after.packCost > before)) throw new Error('the pack cost did not follow the rate');
    approx(money(readout()[packLab]), after.packCost, 'and the RENDERED readout followed:', 5e-4);
    // reset-to-auto: the key is DELETED, absence being the auto state
    fire(f, 'change');                       // commit, so the reset link mounts
    const rst = el('cost_filmPerKg_auto');
    if(!rst) throw new Error('no reset-to-auto control after an override');
    rst.click();
    if('filmPerKg' in build.project.cost)
      throw new Error('reset must DELETE the key — absence IS the auto state');
    approx(rowNow().cost.packCost, before, 'and the cost is back where it started:', 1e-12);
  });

  t('cost: rates store canonically and only the DISPLAY converts', () => {
    // $/m2 stored, $/ft2 shown in an inch project. A converted number written
    // back into the project would be the classic two-units-one-field bug.
    const r = COST_DEFAULTS.cartonBoardPerM2;
    approx(rateToDisplay(r, 'area', 'mm'), r, 'mm shows the canonical rate:', 1e-12);
    approx(rateToDisplay(r, 'area', 'in'), r/FT2_PER_M2, 'inches show per ft2:', 1e-12);
    approx(rateFromDisplay(rateToDisplay(r, 'area', 'in'), 'area', 'in'), r, 'round trip:', 1e-12);
    // mass and per-each rates have no unit system to follow
    approx(rateToDisplay(3.2, 'mass', 'in'), 3.2, 'film stays $/kg in inches:', 1e-12);
    approx(rateToDisplay(12, 'trip', 'in'), 12, 'pallet stays $/trip in inches:', 1e-12);
    if(Math.abs(FT2_PER_M2 - 10.7639) > 0.001)
      throw new Error(`the ft2 factor is wrong: ${FT2_PER_M2}`);
  });

  t('cost: a level absent from the chain contributes no term and says so', () => {
    // The default chain has no tray, so the tray term must be ABSENT and
    // named — never a silent zero that reads like a free tray.
    const c = rowNow().cost;
    const hasTray = !!(build.project.tray && build.project.tray.enabled);
    if(hasTray) throw new Error('fixture: the tray is enabled here, this pin needs it off');
    if('tray' in c.perPack) throw new Error('a chain with no tray must not carry a tray term');
    if(!c.missing.includes('tray')) throw new Error('the missing tray term is not reported');
    if(el('cost_trayEach')) throw new Error('the rate panel asks for a tray rate the chain has no use for');
  });
})();

/* ==================================================================
   Stage background (Grid default / White) + the pallet summary PDF.
   ONE mechanism: White is the renderer's own opaque clear colour, so the
   screen and every capture read the same pixels; the PDF capture sets it
   through the same setStageBackground the toggle uses and hands back
   whatever the user had.
   ================================================================== */
await (async () => {
  setLevel('case'); el('tab3d').click(); el('d_pallet').click(); await settle();

  // corner pixel of the renderer's own readback — the capture IS the screen
  const cornerPixel = async () => {
    const url = capturePNG(1);
    if(!url) return null;
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const c = document.createElement('canvas'); c.width = c.height = 4;
    const g = c.getContext('2d');
    g.clearRect(0, 0, 4, 4);
    g.drawImage(img, 0, 0);
    const d = g.getImageData(1, 1, 1, 1).data;
    return [d[0], d[1], d[2], d[3]];
  };
