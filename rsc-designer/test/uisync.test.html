  const pxGrid = await cornerPixel();
  el('bgWhite').click(); await waitFrames(() => true); await settle();
  const pxWhite = await cornerPixel();
  const whiteSync = {m3: el('bgWhite').classList.contains('on'), sh: el('shBgWhite').classList.contains('on')};
  el('bgGrid').click(); await settle();
  const pxBack = await cornerPixel();

  t('stage background: Grid is default and transparent; White is the capture-visible clear colour', () => {
    // read off the RENDERER'S OWN readback, because that is the one-mechanism
    // claim: what toDataURL sees is what the screen shows. Grid mode clears
    // transparent (the page grid shows through); White clears opaque white.
    if(!pxGrid || !pxWhite || !pxBack) throw new Error('no capture from the 3D canvas');
    if(pxGrid[3] !== 0) throw new Error(`default must be GRID (transparent clear): corner alpha ${pxGrid[3]}`);
    if(!(pxWhite[0] > 250 && pxWhite[1] > 250 && pxWhite[2] > 250 && pxWhite[3] === 255))
      throw new Error(`White must clear to opaque white: corner [${pxWhite.join(',')}]`);
    if(!whiteSync.m3 || !whiteSync.sh)
      throw new Error('the two toolbars\' toggles must reflect the ONE background state');
    if(pxBack[3] !== 0) throw new Error('toggling back to Grid must restore the transparent clear');
  });

  // ---- the PDF: intercept the export event, read the actual bytes ----
  let pdf = null;
  const grab = e => { e.preventDefault(); pdf = e.detail; };
  document.addEventListener('palletpdf:generated', grab);
  try{ el('btnPdf').click(); }
  finally{ document.removeEventListener('palletpdf:generated', grab); }
  const pdfText = pdf ? Array.from(pdf.bytes, b => String.fromCharCode(b)).join('') : '';
  const pxAfter = await cornerPixel();

  t('pallet PDF: one portrait letter page, three views, the readouts\' own numbers', () => {
    // Reads the EXPORTED bytes (the content stream is uncompressed for exactly
    // this), and takes its expectations from the app's own displayed readouts
    // and resolved row — the sheet must never recompute a number.
    if(!pdf) throw new Error('no palletpdf:generated event — the export did not run');
    if(!/^%PDF-1\.4/.test(pdfText)) throw new Error('not a PDF');
    eq((pdfText.match(/\/Type \/Page(?![s])/g) || []).length, 1, 'exactly one page:');
    if(!pdfText.includes('/MediaBox [0 0 612 792]')) throw new Error('page must be portrait US Letter (612x792pt)');
    eq((pdfText.match(/\/DCTDecode/g) || []).length, 3, 'three captured views embedded:');

    // the pallet readout, verbatim: "60 cases" -> the count must be on the sheet
    const tot = (el('palTot').textContent.match(/(\d+)/) || [])[1];
    if(!tot) throw new Error('no pallet readout to compare against');
    if(!pdfText.includes(`(${tot}) Tj`)) throw new Error(`the readout count ${tot} is not on the sheet`);

    // the case OD — the resolved row's OUTER dims through the app formatter
    const row = resolveActiveRow(build.project, build.getRounding(), build.getSelectedCandidateKey());
    const u = el('units').value;
    const f = v => (+(v/(u === 'mm' ? 1 : 25.4)).toFixed(u === 'mm' ? 0 : 2)).toString();
    const od = row.geo.case.outer;
    const odStr = `${f(od.L)} \u00d7 ${f(od.W)} \u00d7 ${f(od.H)} ${u}`;
    if(!pdfText.includes(`(${odStr})`))
      throw new Error(`case outside dims "${odStr}" not on the sheet`);

    // the date, generated today
    const now = new Date();
    const iso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    if(!pdfText.includes(iso)) throw new Error(`generation date ${iso} not on the sheet`);
    // units line follows the app setting
    if(!pdfText.includes(`(All dimensions in ${u})`)) throw new Error('units line missing or wrong');
    // ...and the export hands back the background it found (Grid here)
    if(!pxAfter || pxAfter[3] !== 0)
      throw new Error('the export must restore the stage background it found');
  });

  // ---- the capture honours the per-frame cutaway suppression ----
  // The near-panel hiding is a frame hook: it only ever ran inside the RAF
  // loop, against the ON-SCREEN camera. A synchronous capture that skips it
  // renders whatever visibility the last live frame left behind — the PDF's
  // cutaway came out a closed box with an end gap, open toward a camera
  // nobody was using. The pin: park the LIVE camera at the BACK, then capture
  // from the FRONT — the result must be identical to a capture taken once the
  // live camera has actually been at the front, i.e. the suppression is
  // computed against the CAPTURE camera, never inherited from the live one.
  el('d_case').click();
  if(!el('m3cut').classList.contains('on')) el('m3cut').click();
  await settle();
  const F = HOME_ORBIT, CAP = [F.rotX, F.rotY, 1.35, 320, 260];
  setOrbit(F.rotX, F.rotY + Math.PI, 1.35);            // live camera at the BACK
  await waitFrames(() => true); await settle();        // let the loop suppress for the back
  const capFromBackParked = captureOrbitPNG(...CAP);   // capture from the FRONT
  setOrbit(F.rotX, F.rotY, 1.35);                      // live camera to the front
  await waitFrames(() => true); await settle();
  const capFromFrontParked = captureOrbitPNG(...CAP);  // ground truth: live == capture
  const capBackView = captureOrbitPNG(F.rotX, F.rotY + Math.PI, 1.35, 320, 260);

  t('print capture computes the cutaway suppression against ITS OWN camera', () => {
    if(!capFromBackParked || !capFromFrontParked) throw new Error('no capture from the 3D canvas');
    // the fixture only discriminates if the two angles genuinely render
    // different open faces
    if(capBackView === capFromFrontParked)
      throw new Error('fixture not discriminating: front and back captures are identical');
    if(capFromBackParked !== capFromFrontParked)
      throw new Error('capture inherited the LIVE camera\'s suppression — ' +
        'the walls in the print view were hidden for a camera nobody was using');
  });

  el('tab2d').click(); setLevel('case'); await settle();
})();

save.clearAutosave();
save.cancelAutosave();

const fails = results.filter(r => r.startsWith('FAIL')).length;
document.getElementById('out').textContent =
  `${results.length - fails}/${results.length} passed\n\n` + results.join('\n');
window.__tests = {total: results.length, fails, results};
</script>
</body>
</html>
