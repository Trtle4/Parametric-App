    eq(g.getAttribute('stroke'), AUX_LAYERS.SCORE_HALF.color, 'stroke from the map:');
    if(probe.querySelector('g[data-aux="PERF"]')) throw new Error('a perf layer appeared from nowhere');
    eq(auxLegendRows(geo).length, 1, 'legend rows:');
    eq(auxLegendRows(geo)[0][2], AUX_LAYERS.SCORE_HALF.label, 'legend label:');
  });
  t('aux renderer: an UNSTYLED layer still renders, loudly, and warns once', () => {
    resetAuxWarnings();
    const warns = [];
    const real = console.warn;
    console.warn = (...a) => warns.push(a.join(' '));
    try{
      const geo = {...gCaseLive, aux: {WIDGET_SLOT: band}};
      draw2d(probe, geo, 'mm', '', null);
      draw2d(probe, geo, 'mm', '', null);            // twice: still one warning
      const g = probe.querySelector('g[data-aux="WIDGET_SLOT"]');
      if(!g) throw new Error('an unstyled layer was silently dropped — the failure this hook exists to avoid');
      eq(g.getAttribute('stroke'), '#FF00A0', 'fallback ink:');
      eq(auxLegendRows(geo)[0][2], 'WIDGET_SLOT (unstyled)', 'legend names it:');
      eq(warns.length, 1, `warned ${warns.length} times:`);
      if(!/WIDGET_SLOT/.test(warns[0])) throw new Error(`warning does not name the layer: ${warns[0]}`);
      if(/perf/i.test(warns[0])) throw new Error('the generic path mentions perf');
    } finally { console.warn = real; }
  });
  t('aux renderer: no aux, no group and no legend row', () => {
    draw2d(probe, gCaseLive, 'mm', '', null);
    if(probe.querySelector('g[data-aux]')) throw new Error('an aux group with no aux');
    eq(auxLegendRows(gCaseLive).length, 0, 'legend rows:');
    eq(auxLayerNames({EMPTY: []}).length, 0, 'an empty layer is not present');
  });

  // A DASH PATTERN RESTARTS AT EVERY ELEMENT. A polygonised curve drawn as one
  // <line> per segment renders SOLID — measured on the 236-segment "Front
  // removed" preset, which came out as a continuous green rule and stopped
  // reading as a perforation at all. The renderer must chain a contiguous
  // path into ONE stroked run. Mutation: emitting a line per segment gives
  // 236 elements here instead of 1.
  t('aux renderer: a contiguous path is ONE stroked run, so the dash survives', () => {
    // an all-profiled girth: the tear really is one continuous line, so one
    // run is the correct answer. (A `full` panel breaks it deliberately — see
    // the pin below.)
    const H = perfFrame(gCaseLive).H;
    const curvy = normalizePerf({enabled: true, radius: 14,
      cornerH: [0.8*H, 0.8*H, 0.3*H, 0.3*H],
      panels: {back: {}, right: {transition: 'scurve'}, front: {bow: -0.12*H}, left: {transition: 'scurve'}}
    }, gCaseLive);
    const path = buildPerfPath(gCaseLive, curvy);
    if(!(path.segments.length > 100)) throw new Error(`expected a polygonised curve, got ${path.segments.length} segments`);
    draw2d(probe, withPerforation(gCaseLive, curvy), 'mm', '', null);
    const g = probe.querySelector('g[data-aux="PERF"]');
    eq(g.querySelectorAll('line').length, 0, 'no per-segment lines:');
    eq(g.querySelectorAll('polyline').length, 1, 'runs for one continuous tear:');
    // and the run really carries every point, not a simplified subset
    eq(g.querySelector('polyline').getAttribute('points').trim().split(/\s+/).length,
       path.segments.length + 1, 'points in the run:');
    // a layer whose segments do NOT chain still draws them all
    const split = {...gCaseLive, aux: {SCORE_HALF: [[0, 10, 50, 10], [200, 10, 250, 10]]}};
    draw2d(probe, split, 'mm', '', null);
    eq(probe.querySelector('g[data-aux="SCORE_HALF"]').querySelectorAll('polyline').length, 2, 'disjoint runs:');
  });

  // ---- artwork template: the tear is a GUIDE ------------------------------
  t('template: the perf guide is exported, named, and marked do-not-print', () => {
    const tplOff = buildArtworkSVG(gCaseLive, 'mm');
    const tplOn = buildArtworkSVG(withPerforation(gCaseLive, perfRound), 'mm');
    if(tplOff.includes(PERF_INK)) throw new Error('perf ink in the template with perf off');
    if(!tplOn.includes(PERF_INK)) throw new Error('perf guide missing from the template');
    if(!tplOn.includes('DO NOT PRINT ACROSS')) throw new Error('the guide is not marked as a guide');
    if(!tplOn.includes(AUX_LAYERS.PERF.label.toLowerCase())) throw new Error('header legend does not name it');
    // the guide is stroked as runs, not per-segment, for the same reason the
    // dieline is: a dash pattern restarts at every element, and the template's
    // guide idiom IS a dashed line
    const H = perfFrame(gCaseLive).H;
    const curvy = withPerforation(gCaseLive, normalizePerf({enabled: true, radius: 14,
      cornerH: [0.8*H, 0.8*H, 0.3*H, 0.3*H],
      panels: {back: {}, right: {transition: 'scurve'}, front: {}, left: {transition: 'scurve'}}
    }, gCaseLive));
    const tplCurvy = buildArtworkSVG(curvy, 'mm');
    eq((tplCurvy.match(/<polyline/g) || []).length, 1, 'guide runs:');
    // it is lettered over the FRONT panel, which sits at a different girth
    // position per style — taken from artMap, so both levels letter the
    // PRINTED panel rather than whichever panel happens to sit at x3.
    for(const geo of [gCaseLive, gCartonLive]){
      const f = perfFrame(geo), front = geo.meta.artMap.faces.find(x => x.panel === 'front');
      const tpl = buildArtworkSVG(withPerforation(geo, applyPerfPreset('angled', geo, {enabled: true})), 'mm');
      const m = tpl.match(/<text x="([\d.]+)"[^>]*>PERF — GUIDE/);
      if(!m) throw new Error(`${geo.meta.style}: guide label missing`);
      const mid = (front.u0 + front.u1)/2, margin = Math.max(geo.bbox.maxX, geo.bbox.maxY)*0.08 + 20;
      approx(+m[1], mid + margin, `${geo.meta.style} label over the front panel:`, 0.6);
      eq(f.panels[2].name, 'front', 'girth index of the front:');
    }
  });
  t('template: the guide is not in the artwork, and the round trip is unchanged', () => {
    const on = withPerforation(gCaseLive, perfRound);
    // the art the app maps onto the pack is the uploaded image and nothing
    // else — no template furniture rides along with it
    const art = {...defaultFit(), src: 'data:image/png;base64,iVBORw0KGgo='};
    const svg = artImageSVG(art, gCaseLive.bbox.maxX, gCaseLive.bbox.maxY, x => x, y => y, 'probeClip');
    if(svg.includes(PERF_INK)) throw new Error('perf ink reached the printed artwork');
    // and registration is identical with perf on and off: the canvas is the
    // blank, which a tear line does not resize
    eq(JSON.stringify(artRect(art, on.bbox.maxX, on.bbox.maxY)),
       JSON.stringify(artRect(art, gCaseLive.bbox.maxX, gCaseLive.bbox.maxY)), 'art placement:');
    eq(JSON.stringify(on.meta.artMap.canvas), JSON.stringify(gCaseLive.meta.artMap.canvas), 'template canvas:');
  });

  // ---- not applicable ------------------------------------------------------
  t('perf: the styles with no girth emit no aux and claim no legend row', () => {
    const enabled = {enabled: true, state: 'display', cornerH: [10, 10, 10, 10], radius: 0};
    const others = [
      ['tray', trayGeometry({L: 139, W: 99, H: 25, caliper: 1.5, glueTab: 12})],
      ['flowwrap', flowwrap({L: 141, W: 47, H: 24, filmThickness: 0.03, finSeal: 6, endSealWidth: 10,
                             internalAngle: 45, externalAngle: 0, finFace: 'bottom'})],
      ['shrinkbundle', shrinkBundle({L: 200, W: 150, H: 100, filmThickness: 0.05, shrinkAllowance: 8})]
    ];
    for(const [id, geo] of others){
      eq(perfAux(geo, enabled), null, `${id} aux:`);
      eq(withPerforation(geo, enabled), geo, `${id} geometry must come back the SAME object:`);
      eq(auxLegendRows(geo).length, 0, `${id} legend rows:`);
    }
  });
  // ...and the wrap level, in the app, has no perf field to switch on at all
  setLevel('wrap'); el('tab2d').click(); await settle();
  t('perf: the wrap level shows no perforation legend row', () => {
    eq(build.project.primary.perf, undefined, 'the wrap carries no perf field:');
    if(legendText().includes(AUX_LAYERS.PERF.label)) throw new Error('wrap legend claims a perforation');
  });

  build.project.tertiary.perf = {}; build.project.secondary.perf = {};
  build.recompute(build.getSelectedCandidateKey());
  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ============ PERFORATION — display state, rigidity, BCT ==================
 * Step 3 RENDERS the step-1 path and GATES a number on it. Nothing here may
 * derive a height, a curve or a silhouette of its own, so the pins compare
 * the rendered mesh against the path itself and the BCT text against the
 * number the app produced before perf existed.
 */
await (async () => {
  const geoAt = lvl => levelGeometry(build.project, lvl, build.getRounding(), build.getSelectedCandidateKey());
  const setPerf3 = (levelKey, presetId, state) => {
    const geo = geoAt(levelKey === 'tertiary' ? 'case' : 'carton');
    build.project[levelKey].perf = presetId
      ? applyPerfPreset(presetId, geo, {enabled: true, state}) : {};
    build.recompute(build.getSelectedCandidateKey());
  };
  /** Every vertex of a BufferGeometry as [x,y,z] triples. */
  const verts = g => {
    const a = g.getAttribute('position'), out = [];
    for(let i = 0; i < a.count; i++) out.push([a.getX(i), a.getY(i), a.getZ(i)]);
    return out;
  };

  setLevel('case'); el('tab2d').click(); await settle();
  const gPlain = geoAt('case');

  // THE DISPLAY BODY IS THE STEP-1 PATH, not a re-derivation. Every point of
  // every panel's profile must appear as a vertex of the mesh — checked
  // exactly, on a BOWED front and S-CURVED sides where any independently
  // derived silhouette would land somewhere else. Mutation: building the wall
  // top as a straight line between the two corner heights keeps the corners
  // right and fails everywhere between them.
  t('perf 3D: the display body is built from the drawn path, point for point', () => {
    const H = perfFrame(gPlain).H;
    const perf = normalizePerf({enabled: true, state: 'display', radius: 12,
      cornerH: [0.8*H, 0.8*H, 0.35*H, 0.35*H],
      panels: {back: {}, right: {transition: 'scurve'}, front: {bow: -0.12*H}, left: {transition: 'stepped', steps: 4}}
    }, gPlain);
    const geo = withPerforation(gPlain, perf);
    const mesh = perfBodyGeometry(geo);
    if(!mesh) throw new Error('no display body built');
    const V = verts(mesh), sec = geo.meta.artMap.section, yBody = -geo.inner.H/2;
    let checked = 0;
    for(const p of geo.perf.path.panels){
      const a = sec[p.fromCorner], b = sec[p.toCorner];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const d = [(b[0] - a[0])/len, (b[1] - a[1])/len];
      for(const [s, h] of p.pts){
        const x = a[0] + d[0]*s, z = a[1] + d[1]*s, y = yBody + h;
        // the wall has thickness, so the point exists on the inner face and
        // again t outward; either is proof the mesh went through it
        const hit = V.some(v => Math.abs(v[1] - y) < 1e-4 &&
          Math.hypot(v[0] - x, v[2] - z) < (geo.outer.L - geo.inner.L)/2 + 1e-3);
        if(!hit) throw new Error(`${p.name}: profile point (${s.toFixed(2)}, ${h.toFixed(2)}) is not on the mesh`);
        checked++;
      }
    }
    if(checked < 30) throw new Error(`only ${checked} profile points — the fixture is too simple to discriminate`);
  });

  // ...and it follows the BUILDER'S chord tolerance, which is the same pin the
  // DXF side leans on. A 3D that re-polygonised would not move with it.
  t('perf 3D: the silhouette follows the builder\'s chord tolerance', () => {
    const H = perfFrame(gPlain).H;
    const mk = tol => {
      const perf = normalizePerf({enabled: true, state: 'display', radius: 14,
        cornerH: [0.8*H, 0.8*H, 0.3*H, 0.3*H],
        panels: {back: {}, right: {transition: 'scurve'}, front: {}, left: {transition: 'scurve'}}
      }, gPlain);
      return withPerforation(gPlain, perf, {chordTol: tol});
    };
    const fine = perfBodyGeometry(mk(0.02)), coarse = perfBodyGeometry(mk(1.2));
    const nf = fine.getAttribute('position').count, nc = coarse.getAttribute('position').count;
    if(!(nf > nc*1.5))
      throw new Error(`3D is not following the tolerance: ${nf} vertices at 0.02 mm, ${nc} at 1.2 mm`);
    // and each one carries exactly the points its own path has
    eq(nf > 0 && nc > 0, true, 'both built:');
  });

  // RIGIDITY. Trimming `geo.crease` must not unhinge the corner: the crease
  // array answers "what rule does the diemaker set", and fold topology is
  // built independently from inner dims and meta. Pinned on the RENDERED fold
  // scene — same hinge count, same hinge positions, with and without the
  // perforation — and on the closed body being ONE continuous shell.
  // Mutation: using the display body in shipping state, or splitting a wall at
  // cornerH, fails both halves.
  // RIGIDITY, pinned at the SOURCE of fold topology rather than at a view.
  // `geo.crease` answers "what rule does the diemaker set"; what rotates about
  // what is answered independently by render/folds/*.js from inner dims and
  // meta. Shortening a crease must therefore change nothing about the erected
  // pack — the corner above cornerH stays rigid in shipping state — and the
  // way to hold that is to drive the fold builders with a perforated geometry
  // and an unperforated one and compare every hinge and every wall.
  // Mutation: having a builder read geo.crease to place its walls or hinges
  // fails immediately; so does splitting a wall at cornerH.
  const foldSig = geo => {
    const rec = [];
    const ctx = {
      t: 1, kraft: null, kraft2: null,
      makeFlap: (hinge, axis, closedAngle) => {
        rec.push(`FLAP ${hinge.map(v => v.toFixed(3)).join(',')} ${axis} ${closedAngle.toFixed(4)}`);
        const g = new THREE.Group(); g.userData = {axis, closedAngle, phase: 0}; return g;
      },
      makeTextMaterial: () => null
    };
    const built = foldBuilders[geo.meta.style](geo, '', {}, ctx);
    for(const part of built.parts){
      const p = part.geometry && part.geometry.parameters || {};
      rec.push(`PART ${part.position.toArray().map(v => v.toFixed(3)).join(',')} ` +
               `${[p.width, p.height, p.depth].map(v => (v || 0).toFixed(3)).join('x')}`);
    }
    return rec.sort().join(' | ');
  };
  t('perf: the perforation changes no hinge and no wall of the erected pack', () => {
    // BOTH levels use a preset that really trims — measured: with a preset that
    // trims nothing on the case, a mutation making fefco201's fold builder read
    // geo.crease for its wall height passed, because that level's creases were
    // never touched. A rigidity pin whose fixture leaves the crease intact is
    // not a rigidity pin.
    // A `full` back at mid height on BOTH levels — the configuration the
    // crease split exists for, rather than a preset. Measured twice: a preset
    // that trims nothing on the case let a mutation making fefco201's fold
    // builder read geo.crease pass, and the revised `open-front` (back
    // profiled, front removed at the lip) trims nothing either now that its
    // corners already sit at minRetainedH. A rigidity pin whose fixture
    // leaves the crease intact is not a rigidity pin.
    const setFullBack = (key, lvl, state) => {
      const geo = geoAt(lvl), H = perfFrame(geo).H;
      build.project[key].perf = normalizePerf({enabled: true, state, radius: 0,
        cornerH: [0.5*H, 0.5*H, 0.5*H, 0.5*H],
        panels: {back: {mode: 'full'}, right: {}, front: {}, left: {}}}, geo);
      build.recompute(build.getSelectedCandidateKey());
    };
    for(const [lvl, key] of [['case', 'tertiary'], ['carton', 'secondary']]){
      setPerf3(key, null, 'closed');
      const plain = geoAt(lvl), sigPlain = foldSig(plain);
      setFullBack(key, lvl, 'closed');
      const ship = geoAt(lvl);
      if(JSON.stringify(ship.crease) === JSON.stringify(plain.crease))
        throw new Error(`${lvl}: the fixture did not trim a crease, so rigidity is untested`);
      eq(foldSig(ship), sigPlain, `${lvl} shipping topology:`);
      setFullBack(key, lvl, 'display');
      eq(foldSig(geoAt(lvl)), sigPlain, `${lvl} display topology (the BLANK is the same blank):`);
      setPerf3(key, null, 'closed');
    }
    if(!foldSig(geoAt('case'))) throw new Error('the fold builders produced nothing to compare');
  });
  t('perf 3D: the shipping body is intact, with the tear as a surface line', () => {
    setPerf3('tertiary', 'angled', 'closed');            // this pin's own precondition
    const geo = geoAt('case');
    eq(isDisplayGeo(geo), false, 'shipping is not a display geometry:');
    // the body is the closed shell, not the profiled one
    if(perfBodyGeometry(geo) === null) throw new Error('the path is missing entirely');
    const line = perfLineGeometry(geo);
    if(!line) throw new Error('no surface line for a shipping perforation');
    // the line rides OUTSIDE the wall, so it can never read as a gap
    const t0 = (geo.outer.L - geo.inner.L)/2;
    const V = verts(line);
    const maxX = Math.max(...V.map(v => Math.abs(v[0])));
    if(!(maxX > geo.inner.L/2 + t0*0.9))
      throw new Error(`the line sits inside the board: ${maxX} vs wall at ${geo.inner.L/2 + t0}`);
    setPerf3('tertiary', null, 'closed');
  });

  // BCT GATING. Display suppresses the number and says why; shipping is
  // bit-identical to what the app produced before perf touched anything.
  const bctText = () => el('bctRatio').textContent + ' | ' + el('bctVal').textContent;
  setPerf3('tertiary', null, 'closed'); await settle();
  const bctPlain = bctText();
  setPerf3('tertiary', 'angled', 'closed'); await settle();
  const bctShip = bctText();
  setPerf3('tertiary', 'angled', 'display'); await settle();
  const bctDisp = el('bctRatio').textContent, bctNote = el('bctNote').textContent;
  t('perf BCT: display state reports not applicable, and says why', () => {
    if(!/not applicable/i.test(bctDisp)) throw new Error(`expected a refusal, got "${bctDisp}"`);
    if(/\d\s*:\s*1/.test(bctDisp)) throw new Error('a ratio survived into display state');
    if(!/McKee/.test(bctNote)) throw new Error('the refusal does not say why');
    if(!/closed box/.test(bctNote)) throw new Error('the refusal does not name the assumption it breaks');
    eq(el('bctVal').textContent, '--', 'the BCT value is cleared too:');
  });
  t('perf BCT: shipping state is unchanged by the perforation', () => {
    eq(bctShip, bctPlain, 'shipping BCT:');
    if(!/\d+\.\d+ : 1/.test(bctShip)) throw new Error(`the fixture produced no baseline ratio: "${bctShip}"`);
  });

  // THE WIRING, read off the SCENE. Calling the builder proves the builder
  // works and nothing about whether the app calls it — measured: mutations
  // that made the hierarchy shell and the shelf facings both ignore display
  // state passed a pin written that way. These count the tagged geometry that
  // is actually in the rendered tree.
  // VISIBLE ones only. The pivot holds every view's group at once and toggles
  // visibility, so an unscoped count sees the 3D tab's leftovers while the
  // shelf is on screen — which is how this pin first reported a torn facing
  // that was not on screen at all.
  const visible = o => { for(let n = o; n; n = n.parent) if(!n.visible) return false; return true; };
  const displayMeshes = () => {
    let n = 0;
    getPivot().traverse(o => {
      if(o.geometry && o.geometry.userData && o.geometry.userData.perfDisplay && visible(o)) n++;
    });
    return n;
  };
  setPerf3('tertiary', 'angled', 'display'); await settle();
  el('tab3d').click(); await settle();
  await waitFrames(() => getPivot().children.length > 0);
  const hierDisplay = displayMeshes();
  setPerf3('tertiary', 'angled', 'closed'); await settle();
  await waitFrames(() => getPivot().children.length > 0);
  const hierShipping = displayMeshes();
  t('perf 3D: the hierarchy renders the display body, and only in display state', () => {
    if(hierDisplay < 1) throw new Error('display state rendered no torn body');
    eq(hierShipping, 0, 'shipping state must render none:');
  });

  // The SHELF renders display state when the container is set to it.
  setPerf3('tertiary', null, 'closed');
  setPerf3('secondary', 'angled', 'display'); await settle();
  el('tabShelf').click(); await settle();
  await waitFrames(() => displayMeshes() > 0);
  const shelfDisplay = displayMeshes();
  setPerf3('secondary', 'angled', 'closed'); await settle();
  await waitFrames(() => displayMeshes() === 0);
  const shelfShipping = displayMeshes();
  t('perf 3D: the shelf shows the pack in display state', () => {
    if(shelfDisplay < 1) throw new Error('the shelf drew no torn facings in display state');
    eq(shelfShipping, 0, 'shipping facings must be intact:');
  });

  // ...AND IT IS DRAWABLE. Counting tagged geometry proves the right builder
  // ran, not that the result renders: the facings were handed `[packMats,
  // packMats]` — two ARRAYS where two materials belong, because packMats is
  // the six-face list a BoxGeometry needs — and drew nothing at all while this
  // count stayed correct. Found by looking at the first compare capture.
  setPerf3('secondary', 'angled', 'display'); await settle();
  el('tabShelf').click(); await settle();
  await waitFrames(() => displayMeshes() > 0);
  const facingMats = [];
  getPivot().traverse(o => {
    if(o.geometry && o.geometry.userData && o.geometry.userData.perfDisplay && visible(o))
      facingMats.push({groups: (o.geometry.groups || []).length,
                       mats: Array.isArray(o.material) ? o.material.length : 1,
                       nested: Array.isArray(o.material) && o.material.some(m => Array.isArray(m))});
  });
  setPerf3('secondary', null, 'closed'); await settle();
  t('perf 3D: a torn facing has a real material for every group', () => {
    if(!facingMats.length) throw new Error('no torn facing on the shelf to inspect');
    for(const f of facingMats){
      if(f.nested) throw new Error('a material slot holds an array — the facing cannot draw');
      if(f.groups > 1 && f.mats < f.groups)
        throw new Error(`${f.groups} geometry groups but ${f.mats} material(s)`);
    }
  });
  t('perf 3D: the torn facing is the retained pack, not a full-height one', () => {
    setPerf3('secondary', 'angled', 'display');
    const carton = geoAt('carton');
    eq(isDisplayGeo(carton), true, 'the sellable pack is in display state:');
    const body = perfBodyGeometry(carton);
    if(!body) throw new Error('no display body for the shelf pack');
    const topY = Math.max(...verts(body).map(v => v[1]));
    const full = carton.outer.H/2;
    if(!(topY < full - 1))
      throw new Error(`the shelf pack still reaches full height: ${topY.toFixed(2)} vs ${full.toFixed(2)}`);
    approx(topY, -carton.inner.H/2 + Math.max(...carton.perf.path.cornerH), 'retained height:', 0.01);
    setPerf3('secondary', null, 'closed');
  });

  // Perf OFF: no display body, no line, and the BCT is the plain number.
  setPerf3('secondary', null, 'closed'); setPerf3('tertiary', null, 'closed'); await settle();
  t('perf 3D: with no perforation there is no display body and no line', () => {
    for(const lvl of ['case', 'carton']){
      const g = geoAt(lvl);
      eq(g.perf, undefined, `${lvl} carries no perf:`);
      eq(perfBodyGeometry(g), null, `${lvl} display body:`);
      eq(perfLineGeometry(g), null, `${lvl} surface line:`);
      eq(isDisplayGeo(g), false, `${lvl} display gate:`);
    }
  });

  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ============ PERFORATION x EXPLODED — the cross-feature gap ==============
 * Perf and exploded were each pinned thoroughly, at length, and never
 * together. A display-state shell's Y explode offset used `geo.outer.H` —
 * the closed container's full height — when the retained tray it actually
 * draws is far shorter; the gap sized off the wrong dimension sent the tray
 * many multiples of its own visible size away from the contents that never
 * moved, at any nonzero factor. This checks the RENDERED SCENE — mesh
 * bounding boxes, not `explodeTier`'s return value — because the earlier
 * bugs this file's other cross-checks caught were all "the builder is
 * right and the app never calls it right" in one shape or another.
 */
await (async () => {
  const geoAt = lvl => levelGeometry(build.project, lvl, build.getRounding(), build.getSelectedCandidateKey());
  const setPerf5 = (levelKey, presetId, state) => {
    const geo = geoAt(levelKey === 'tertiary' ? 'case' : 'carton');
    build.project[levelKey].perf = presetId
      ? applyPerfPreset(presetId, geo, {enabled: true, state}) : {};
    build.recompute(build.getSelectedCandidateKey());
  };

  setLevel('case'); el('tab2d').click(); await settle();
  setPerf5('secondary', null, 'closed');       // carton perf off — keep the case the one variable
  setPerf5('tertiary', 'angled', 'display');   // case: perforated, DISPLAY state
  await settle();
  el('tab3d').click(); await settle();
  el('d_case').click(); await settle();
  if(!el('m3cut').classList.contains('on')) el('m3cut').click();
  await settle();
  await waitFrames(() => getPivot().children.length > 0);

  // Every carton instance's own world Y centre + its own Y extent (its outer
  // H in whatever orientation it is placed), and the shell's own world Y —
  // read straight off the rendered scene. Per-instance Box3/matrix, the same
  // idiom the pallet-deck pins above use (setFromObject alone only sees the
  // untransformed prototype for an InstancedMesh).
  const cartonYs = () => {
    const out = [];
    getPivot().updateMatrixWorld(true);
    getPivot().traverse(o => {
      if(!(o.isInstancedMesh && o.userData && o.userData.tierName === 'carton')) return;
      o.geometry.computeBoundingBox();
      const gb = o.geometry.boundingBox, M = new THREE.Matrix4();
      for(let i = 0; i < o.count; i++){
        o.getMatrixAt(i, M);
        const b = gb.clone().applyMatrix4(M.clone().premultiply(o.matrixWorld));
        out.push({y: (b.min.y + b.max.y)/2, extentY: b.max.y - b.min.y});
      }
    });
    return out;
  };
  const trayY = () => {
    let y = null;
    getPivot().updateMatrixWorld(true);
    getPivot().traverse(o => { if(o.geometry && o.geometry.userData && o.geometry.userData.perfDisplay && o.visible) y = o.position.y; });
    return y;
  };

  // FIXTURE PRECONDITION: a shell and content actually rendered, and the
  // retained tray is genuinely much shorter than the closed container it
  // came from — the exact shape the bug needs to be visible at all.
  const cartons0 = cartonYs(), trayY0 = trayY();
  const fullH = geoAt('case').outer.H, retainedH = displayBodyExtentY(geoAt('case'));
  if(!cartons0.length) throw new Error('no carton content rendered — fixture is broken, not the feature');
  if(trayY0 === null) throw new Error('no display-body shell rendered — fixture is broken, not the feature');
  if(!(retainedH < fullH*0.9)) throw new Error(`fixture proves nothing: retained height ${retainedH.toFixed(1)} is not meaningfully shorter than the closed height ${fullH.toFixed(1)}`);

  t('display x exploded, factor 0: the shell has not moved — factor zero is identity here too', () => {
    eq(trayY(), trayY0, 'shell Y:');
  });

  // ISOLATE Y: 'y (vertical)' only, so the shell's world-Y position IS
  // `ex.shell.y` alone — no X/Z cross-talk to confound the comparison below.
  el('m3explodeAxis').value = 'y'; fire(el('m3explodeAxis'), 'change'); await settle();
  el('m3explodeToggle').click(); await settle();
  el('m3explodeFactor').value = 100; fire(el('m3explodeFactor'), 'input');
  await waitFrames(() => trayY() !== trayY0);
  const trayY1 = trayY();

  // What the app's OWN, unmodified formula (explode.js) predicts for the
  // shell's Y offset, fed the REAL content ranks read off the scene —
  // computed TWO ways: with the dimension the fix uses (the retained tray's
  // own real height) and with the dimension the bug used (`geo.outer.H`,
  // the full closed height). This is "run the wrong implementation against
  // the fixture" (CLAUDE.md): if the buggy prediction did not differ from
  // the correct one here, this pin could not tell a fixed shell from a
  // broken one.
  const positions = cartons0.map(c => c.y), unit = Math.max(...cartons0.map(c => c.extentY));
  const ranks = rankOffsets(positions);
  const predictedFixed = shellOffset(ranks, unit, retainedH, 1);
  const predictedBuggy = shellOffset(ranks, unit, fullH, 1);
  t('display x exploded, factor 1: the buggy and fixed predictions actually differ, or this pin proves nothing', () => {
    if(Math.abs(predictedBuggy - predictedFixed) < 5)
      throw new Error(`fixture too weak: buggy (${predictedBuggy.toFixed(1)}) and fixed (${predictedFixed.toFixed(1)}) predictions barely differ`);
  });
  t('display x exploded, factor 1: the shell moves by a gap sized to the RETAINED tray, not the full closed height', () => {
    const observed = trayY1 - trayY0;
    // Tolerance is generous relative to the reading, not the effect: the
    // scene reads bounding boxes (corner-overlap padding, line lift) while
    // the prediction reads solved outer dims, a few mm of drift on a ~300mm
    // offset — still two orders of magnitude tighter than the >150mm gap
    // between the fixed and buggy predictions this fixture requires above.
    approx(observed, predictedFixed, 'observed shell Y offset vs the retained-height prediction:', 15);
    if(Math.abs(observed - predictedBuggy) < Math.abs(observed - predictedFixed))
      throw new Error(`observed offset ${observed.toFixed(1)} is closer to the BUGGY (full-height) prediction ${predictedBuggy.toFixed(1)} than the fixed one ${predictedFixed.toFixed(1)} — the packs are not sitting in the retained tray`);
  });

  el('m3explodeFactor').value = 0; fire(el('m3explodeFactor'), 'input');
  el('m3explodeToggle').click(); await settle();
  el('m3explodeAxis').value = 'all'; fire(el('m3explodeAxis'), 'change'); await settle();
  setPerf5('tertiary', null, 'closed');
  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ============ PERFORATION — openability warning and spec sheet ============
 * The warning is a REPORT, not a gate, and the spec sheet is TEXT. So the
 * pins read the app's own readout and the app's own PDF bytes, and check that
 * nothing computed moves.
 */
await (async () => {
  const geoAt = lvl => levelGeometry(build.project, lvl, build.getRounding(), build.getSelectedCandidateKey());
  const setPerf4 = (levelKey, perf) => {
    build.project[levelKey].perf = perf || {};
    build.recompute(build.getSelectedCandidateKey());
  };
  const fullBack = (levelKey, lvl) => {
    const geo = geoAt(lvl), H = perfFrame(geo).H;
    return normalizePerf({enabled: true, state: 'closed', radius: 0,
      cornerH: [0.5*H, 0.5*H, 0.5*H, 0.5*H],
      panels: {back: {mode: 'full'}, right: {}, front: {}, left: {}}}, geo);
  };

  /** The PDF the app actually wrote, as a latin-1 string. */
  const grabPdf = () => {
    let got = null;
    const grab = e => { e.preventDefault(); got = e.detail; };
    document.addEventListener('palletpdf:generated', grab);
    try{ el('btnPdf').click(); }
    finally{ document.removeEventListener('palletpdf:generated', grab); }
    return got ? Array.from(got.bytes, b => String.fromCharCode(b)).join('') : '';
  };
  /** The CONTENT streams, in page order, resolved through the page tree —
   *  not by pattern-matching every stream in the file, which also catches the
   *  JPEGs (a binary image happily contains the bytes "BT"). */
  const streams = pdf => {
    const body = n => (new RegExp(`\\n${n} 0 obj\\n([\\s\\S]*?)\\nendobj`).exec(pdf) || [])[1] || '';
    const kids = /\/Kids \[([^\]]*)\]/.exec(pdf);
    if(!kids) return [];
    return kids[1].trim().split(/\s+0 R\s*/).filter(Boolean).map(Number).map(pn => {
      const cn = /\/Contents (\d+) 0 R/.exec(body(pn));
      if(!cn) return '';
      const st = /stream\n([\s\S]*)\nendstream/.exec(body(+cn[1]));
      return st ? st[1] : '';
    });
  };

  setLevel('case'); el('tab2d').click(); await settle();

  // THE READOUT WARNS, and only when the pack will not open. Read off the
  // rendered rail, not off the function — the function is pinned in
  // perf.test.html; this is about whether the app shows it.
  const warnNode = () => el('styleStats').querySelector('[data-warn="openability"]');
  setPerf4('tertiary', null); await settle();
  const warnOff = !!warnNode();
  setPerf4('tertiary', applyPerfPreset('angled', geoAt('case'), {enabled: true})); await settle();
  const warnOk = !!warnNode();
  setPerf4('tertiary', fullBack('tertiary', 'case')); await settle();
  const warnBad = warnNode() && warnNode().textContent;
  t('openability: the rail warns for a pack that will not open, and not otherwise', () => {
    eq(warnOff, false, 'no perforation, no warning:');
    eq(warnOk, false, 'a preset that opens must not warn:');
    if(!warnBad) throw new Error('a full back on a 201 must warn on the rail');
    if(!/will not separate/.test(warnBad)) throw new Error(`unexpected wording: ${warnBad}`);
    if(!/major flap/.test(warnBad)) throw new Error('the warning must name the part that stays');
    if(!/tape/.test(warnBad)) throw new Error('the warning must name what joins the lid');
  });

  // WARN, NEVER BLOCK — at the app level. The warned configuration is still
  // solved, still drawn, still exported.
  t('openability: the warned configuration is still solved and still exported', () => {
    const g = geoAt('case');
    if(!(g && g.aux && g.aux.PERF.length > 0)) throw new Error('the perforation is not on the geometry');
    const dxf = buildDXF(g, 'mm');
    if(!/\r\n2\r\nPERF\r\n/.test(dxf)) throw new Error('the DXF refused a warned configuration');
    if(!(el('blank').textContent || '').length) throw new Error('the level readout went blank');
  });

  // THE SPEC SHEET. Perf off must be byte-identical to the sheet the app
  // produced before perforation existed; the PDF embeds JPEG captures, so the
  // comparison is over the text objects, which is where sections live.
  const textOf = pdf => (pdf.match(/BT[\s\S]*?ET/g) || []).join('\n');
  setPerf4('tertiary', null); setPerf4('secondary', null); await settle();
  const rawPlain = grabPdf(); const pdfPlain = textOf(rawPlain);
  setPerf4('tertiary', applyPerfPreset('angled', geoAt('case'), {enabled: true})); await settle();
  const pdfPerf = textOf(grabPdf());
  setPerf4('tertiary', fullBack('tertiary', 'case')); await settle();
  const rawWarn = grabPdf(); const pdfWarn = textOf(rawWarn);
  setPerf4('tertiary', null); await settle();
  const pdfAgain = textOf(grabPdf());

  t('spec: with no perforation the sheet is unchanged, on and off again', () => {
    if(!pdfPlain.length) throw new Error('no PDF text captured — the export did not run');
    if(/PERFORATION/.test(pdfPlain)) throw new Error('an unperforated sheet mentions perforation');
    eq(pdfAgain, pdfPlain, 'the sheet returns to exactly what it was:');
  });
  t('spec: a perforated level adds one block, naming its own numbers', () => {
    if(!/PERFORATION/.test(pdfPerf)) throw new Error('the perforation block is missing');
    if(pdfPerf === pdfPlain) throw new Error('the sheet did not change');
    // one block, not one per row
    eq((pdfPerf.match(/PERFORATION/g) || []).length, 1, 'block count:');
    for(const frag of ['Perforated', 'Rule', 'Minimum', 'Tear'])
      if(!pdfPerf.includes(frag)) throw new Error(`the block is missing "${frag}"`);
  });
  // AND IT IS LEGIBLE. A row value used to be assumed short enough for the
  // column and ran straight off the page when it wasn't — an openability
  // warning is a sentence. Measured with the renderer's own metrics against
  // the renderer's own column width, so a line that passes here is a line
  // that fits when it is drawn. Mutation: dropping the wrap leaves the
  // warning as one text run wider than the column.
  t('spec: a long value is wrapped to the column it is drawn in', () => {
    const long = 'Panels back are retained to full height, so the back panel\'s major flap ' +
      'stays on the base while the rest of the closure leaves with the lid.';
    const lines = pdfWrap(long, SECTION_COL_W, 10);
    if(lines.length < 3) throw new Error(`expected a wrapped sentence, got ${lines.length} line(s)`);
    for(const ln of lines){
      const w = pdfTextWidth(ln, 10);
      if(w > SECTION_COL_W) throw new Error(`"${ln}" is ${w.toFixed(1)}pt in a ${SECTION_COL_W}pt column`);
    }
    if(pdfTextWidth(long, 10) <= SECTION_COL_W)
      throw new Error('the fixture string fits unwrapped, so this pin proves nothing');
    // the measure must describe what is DRAWN: a transliterated arrow is two
    // characters wide, and measuring the source instead under-counts every
    // line that carries one
    approx(pdfTextWidth('a \u2192 b', 10), pdfTextWidth('a -> b', 10), 'transliterated width:', 0.01);
    // ...and NOTHING the sheet actually drew in that column overflows it.
    // Read out of the content stream: each text run carries its own font
    // size and its own x, so a run in the section column can be measured
    // with the renderer's metrics at the size it was drawn. Counting "runs
    // containing the warning's words" is not enough — other rows say
    // "retained" too, and the count stayed above the threshold with the wrap
    // removed. Measured; corrected.
    const SECTION_X = 396;                       // dx = M + isoW + 20
    let widest = 0, worst = '';
    for(const blk of pdfWarn.match(/BT[\s\S]*?ET/g) || []){
      const sz = /\/F\d (\d+(?:\.\d+)?) Tf/.exec(blk);
      const tm = /1 0 0 1 (-?\d+(?:\.\d+)?) /.exec(blk);
      const tj = /\((.*)\) Tj/.exec(blk);
      if(!sz || !tm || !tj) continue;
      if(Math.abs(+tm[1] - SECTION_X) > 1) continue;       // not the section column
      const w = pdfTextWidth(tj[1].replace(/\\([()\\])/g, '$1'), +sz[1]);
      if(w > widest){ widest = w; worst = tj[1]; }
    }
    if(!widest) throw new Error('no section-column text found — the fixture read the wrong PDF');
    if(widest > SECTION_COL_W)
      throw new Error(`"${worst}" is ${widest.toFixed(1)}pt in a ${SECTION_COL_W}pt column`);
  });

  // THE COLUMN HAS A FLOOR, and the sheet respects it. The section column
  // shares its x-range with the bottom-right image, so a block that outgrew
  // it drew over a photograph and over its caption — the first perforation
  // block did exactly that. Read out of the file: every text run in that
  // column on page 1, against the top of the image below it, both taken from
  // the content stream's own operators.
  t('spec: a long block continues on a second page instead of over the image', () => {
    const rawPlainPages = streams(rawPlain).length, rawWarnPages = streams(rawWarn).length;
    eq(rawPlainPages, 1, 'a short sheet stays one page:');
    if(rawWarnPages !== 2) throw new Error(`expected a continuation page, got ${rawWarnPages}`);
    const p1 = streams(rawWarn)[0];
    // the bottom-right image: "w 0 0 h x y cm" then "/Im3 Do"
    const im = /([\d.]+) 0 0 ([\d.]+) ([\d.]+) ([\d.]+) cm\n\/Im3 Do/.exec(p1);
    if(!im) throw new Error('could not find the cutaway image in the page stream');
    const imTop = +im[4] + +im[2];                     // PDF y is up
    let lowest = Infinity;
    for(const blk of p1.match(/BT[\s\S]*?ET/g) || []){
      const tm = /1 0 0 1 (-?[\d.]+) (-?[\d.]+) Tm/.exec(blk);
      if(!tm || Math.abs(+tm[1] - 396) > 1) continue;   // not the section column
      lowest = Math.min(lowest, +tm[2]);
    }
    if(lowest === Infinity) throw new Error('no section-column text on page 1');
    if(lowest < imTop) throw new Error(`a section row sits at y=${lowest} over an image whose top is ${imTop}`);
    // and the block really did land on page 2
    if(/PERFORATION/.test(p1)) throw new Error('the block stayed on page 1');
    if(!/PERFORATION/.test(streams(rawWarn)[1])) throw new Error('the block is on neither page');
  });

  // THE FILE IS VALID, and its text is encodable. /WinAnsiEncoding is declared
  // and the file is written a byte at a time, so a code point above U+00FF is
  // TRUNCATED into a different glyph — an arrow came out as a right quote.
  t('spec: the PDF is a valid two-page file with encodable text', () => {
    // PDF arrays are space separated; a comma made every reader reject the
    // file with "non-page object in page tree", and one page needs no
    // separator so it was invisible until the second one existed.
    const kids = /\/Kids \[([^\]]*)\]/.exec(rawWarn);
    if(!kids) throw new Error('no page tree');
    if(kids[1].includes(',')) throw new Error(`Kids is not a PDF array: [${kids[1]}]`);
    const refs = kids[1].trim().split(/\s+0 R\s*/).filter(Boolean).map(Number);
    eq(refs.length, 2, 'two kids:');
    for(const n of refs){
      const obj = new RegExp(`\\n${n} 0 obj\\n([\\s\\S]*?)\\nendobj`).exec(rawWarn);
      if(!obj) throw new Error(`object ${n} is missing`);
      if(!/\/Type \/Page\b/.test(obj[1])) throw new Error(`object ${n} is not a page: ${obj[1].slice(0, 60)}`);
    }
    // The DRAWN text, not the helper: the sheet's Panels row states two
    // heights with an arrow between them, and the file must carry it as the
    // spelled-out form. Checking only that every code point fits a byte
    // proves nothing — the writer masks with & 0xff, so it always does, and
    // that is exactly how an arrow became a right quote (0x2192 & 0xff).
    const drawn = (streams(rawWarn).join('\n').match(/\((.*)\) Tj/g) || []).join('\n');
    if(!/->/.test(drawn)) throw new Error('the arrow was not spelled out in the drawn text');
    if(/\u0092|\u2192|\u26a0/.test(drawn)) throw new Error('a truncated or unencodable glyph reached the file');
    // and the em dash IS in WinAnsi, so it survives as its own byte
    if(!/\u0097/.test(drawn)) throw new Error('the em dash lost its WinAnsi byte');
    // the transliteration, directly
    eq(winAnsi('a \u2192 b'), 'a -> b', 'arrow:');
    eq(winAnsi('\u26a0 warn'), '! warn', 'warning mark:');
    eq(winAnsi('a \u2014 b'), 'a \x97 b', 'em dash maps to its WinAnsi byte:');
    eq(winAnsi('1 \u00d7 2 \u00b7 3'), '1 \u00d7 2 \u00b7 3', 'latin-1 passes through:');
    eq(winAnsi('\u4e2d'), '?', 'unmappable becomes a visible gap:');
  });

  t('spec: an active warning reaches the sheet', () => {
    if(!/separate/.test(pdfWarn)) throw new Error('the openability warning is not on the sheet');
    if(/separate/.test(pdfPerf)) throw new Error('a pack that opens carries a warning');
  });

  // NOTHING ON THE BLOCK FEEDS A CALCULATION. Change the cut/tie spec — the
  // one field that is pure text — and no computed output may move: not the
  // blank, not the area, not the cost, not the pallet count, not the DXF.
  t('spec: no spec-sheet value feeds a calculation', () => {
    const base = applyPerfPreset('angled', geoAt('case'), {enabled: true});
    setPerf4('tertiary', base);
    const g0 = geoAt('case');
    const before = {
      blank: [g0.bbox.maxX, g0.bbox.maxY], outer: {...g0.outer},
      dxf: buildDXF(g0, 'mm').length,
      row: JSON.stringify(resolveActiveRow(build.project, build.getRounding(), build.getSelectedCandidateKey()).cost)
    };
    setPerf4('tertiary', normalizePerf({...base, spec: {cut: 22, tie: 9}}, g0));
    const g1 = geoAt('case');
    const after = {
      blank: [g1.bbox.maxX, g1.bbox.maxY], outer: {...g1.outer},
      dxf: buildDXF(g1, 'mm').length,
      row: JSON.stringify(resolveActiveRow(build.project, build.getRounding(), build.getSelectedCandidateKey()).cost)
    };
    // the TEXT moved...
    const rows = perfSpecRows(g1, build.project.tertiary.perf);
    if(!(rows.find(r => r[0] === 'Rule') || [])[1].includes('22'))
      throw new Error('the spec text did not follow the edit, so this pin proves nothing');
    // ...and nothing computed did
    eq(JSON.stringify(after), JSON.stringify(before), 'a computed value moved:');
  });

  setPerf4('tertiary', null); setPerf4('secondary', null);
  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ================= CAPTURE SHEET COMPOSER — a general primitive ==========
 * Determinism is the property the whole thing rests on, so the pins compare
 * BYTES, and they compare them across the things a screenshot would follow:
 * viewport size, active tab, and whatever was rendered before.
 */
await (async () => {
  const pivot = getPivot();
  const oneScene = () => ({show: () => { hier.show(true); }});
  const sheetSpec = extra => ({
    title: 'Determinism', subtitle: 'fixture', footer: 'fixture',
    grid: {cols: 2}, cell: {w: 220, h: 160},
    scenes: [{...oneScene(), caption: 'a'}, {...oneScene(), caption: 'b'}],
    ...extra
  });

  // the fixture has to have a scene to capture at all
  setLevel('case'); el('tab3d').click(); await settle();
  await waitFrames(() => getPivot().children.length > 0);

  const a = await composeSheet(sheetSpec());
  const bytesA = a.png();

  // ...same again, nothing changed
  const b = await composeSheet(sheetSpec());
  const bytesB = b.png();

  // ...with the viewport a different size
  const wrap = el('cvWrap') || el('canvasWrap') || document.querySelector('#cv') || document.body;
  const prevW = wrap.style.width, prevH = wrap.style.height;
  wrap.style.width = '420px'; wrap.style.height = '300px';
  window.dispatchEvent(new Event('resize'));
  await waitFrames(() => true); await settle();
  const c = await composeSheet(sheetSpec());
  const bytesC = c.png();
  wrap.style.width = prevW; wrap.style.height = prevH;
  window.dispatchEvent(new Event('resize'));
  await settle();

  // ...and from a different tab, with a different view last rendered
  el('tabShelf').click(); await settle();
  const d = await composeSheet(sheetSpec());
  const bytesD = d.png();
  el('tab3d').click(); await settle();
  await waitFrames(() => getPivot().children.length > 0);

  t('sheet: the same descriptors give byte-identical output', () => {
    if(bytesA.length < 2000) throw new Error('the fixture composed nothing to compare');
    eq(bytesB === bytesA, true, 'a second run differs');
    eq(bytesC === bytesA, true, 'a different viewport size changed the output');
    eq(bytesD === bytesA, true, 'a different active tab changed the output');
    // ...and the sheet's own dimensions are the fixed ones, not the window's
    eq(a.width, 26*2 + 2*220 + 18, 'sheet width:');
    eq(a.height, 26*2 + 78 + 160 + 34 + 30, 'sheet height:');
  });

  t('sheet: a named camera resolves the same after the user orbits', () => {
    const before = JSON.stringify(cameraByName('home'));
    const live = getOrbit();
    try{
      setOrbit(live.rotX + 1.1, live.rotY - 0.7, 2.4);
      eq(JSON.stringify(cameraByName('home')), before, 'home moved with the live view:');
      eq(JSON.stringify(cameraByName('plan')), JSON.stringify(cameraByName('plan')), 'plan is stable:');
      // an unknown name is refused, not quietly framed some other way
      let threw = false;
      try{ cameraByName('nosuchcamera'); }catch(e){ threw = /unknown camera/.test(e.message); }
      if(!threw) throw new Error('an unknown camera name was accepted');
      // ...and a literal override is honoured
      eq(cameraByName({rotX: 9}).rotX, 9, 'override:');
    } finally { setOrbit(live.rotX, live.rotY, live.d === undefined ? 1.35 : live.d); }
  });

  // the async guards, awaited properly (t() bodies stay synchronous)
  let mismatchMsg = '', emptyMsg = '';
  try{ await composeSheet(sheetSpec({captions: ['only one']})); }catch(e){ mismatchMsg = e.message; }
  try{ await composeSheet({scenes: []}); }catch(e){ emptyMsg = e.message; }
  t('sheet: mismatched captions and empty scene lists are refused', () => {
    if(!/2 scenes but 1 captions/.test(mismatchMsg)) throw new Error(`no mismatch guard: "${mismatchMsg}"`);
    if(!/no scenes/.test(emptyMsg)) throw new Error(`no empty guard: "${emptyMsg}"`);
  });

  t('sheet: any grid composes — 1xN, Nx1 and irregular', () => {
    const s = n => Array.from({length: n}, () => ({}));
    eq(layoutGrid(s(4), 1).rows, 4, 'Nx1 rows:');
    eq(layoutGrid(s(4), 1).cells.map(c => c.c).join(''), '0000', 'Nx1 columns:');
    eq(layoutGrid(s(4), 4).rows, 1, '1xN rows:');
    eq(layoutGrid(s(4), 4).cells.map(c => c.c).join(''), '0123', '1xN columns:');
    eq(layoutGrid(s(4), 2).rows, 2, '2x2 rows:');
    // irregular: a double-wide cell first, then three singles
    const irr = layoutGrid([{w: 2}, {}, {}, {}], 3);
    eq(irr.rows, 2, 'irregular rows:');
    eq(JSON.stringify(irr.cells.map(c => [c.r, c.c, c.w])),
       JSON.stringify([[0,0,2],[0,2,1],[1,0,1],[1,1,1]]), 'irregular placement:');
    // a span wider than the grid is clamped rather than dropped
    eq(layoutGrid([{w: 9}], 2).cells[0].w, 2, 'clamped span:');
  });

  // NON-INTERFERENCE: composing must leave the live view exactly as it was.
  //
  // THE FIXTURE HAS TO EXHIBIT THE CONDITION. Measured twice: with only the
  // hierarchy visible, a composer that never restored visibility left exactly
  // the state it found — because the scene turns that same group back on. And
  // with the stage already white (a pallet PDF earlier in this file leaves it
  // so), a composer that forgot to restore the background was indetectable.
  // So a BYSTANDER is made visible that no scene shows, and the background is
  // set to a known value first.
  const bystander = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial());
  pivot.add(bystander); bystander.visible = true;
  setStageBackground('grid');
  const orbBefore = JSON.stringify(getOrbit());
  const visBefore = pivot.children.map(o => o.visible).join(',');
  const bgBefore = getStageBackground();
  await composeSheet(sheetSpec());
  const orbAfter = JSON.stringify(getOrbit());
  const visAfter = pivot.children.map(o => o.visible).join(',');
  const bgAfter = getStageBackground();
  pivot.remove(bystander); bystander.geometry.dispose(); bystander.material.dispose();
  t('sheet: composing leaves the live camera, scene and stage untouched', () => {
    if(!visBefore.includes('true')) throw new Error('the fixture had nothing visible, so this proves nothing');
    if(bgBefore !== 'grid') throw new Error('the fixture could not establish a non-white stage');
    eq(orbAfter, orbBefore, 'the live orbit moved:');
    eq(visAfter, visBefore, 'the visible objects changed:');
    eq(bgAfter, bgBefore, 'the stage background was left white:');
  });

  // SCOPED CAPTURE. The pivot holds every view's group at once, so a capture
  // that did not blank first picks up another tab's leftovers — measured, it
  // did exactly that to two pins in the perforation work. A marker object is
  // left VISIBLE in the pivot and must not reach the sheet.
  const marker = new THREE.Mesh(
    new THREE.BoxGeometry(1e5, 1e5, 1e5),
    new THREE.MeshBasicMaterial({color: 0xff0000, depthTest: false}));
  marker.renderOrder = 999;
  pivot.add(marker);
  let redFrac = -1;
  try{
    const scoped = await composeSheet(sheetSpec());
    const g2 = scoped.canvas.getContext('2d');
    const px = g2.getImageData(0, 0, scoped.width, scoped.height).data;
    let red = 0, total = 0;
    for(let i = 0; i < px.length; i += 4){
      total++;
      if(px[i] > 150 && px[i + 1] < 90 && px[i + 2] < 90) red++;
    }
    redFrac = red/total;
  } finally {
    pivot.remove(marker); marker.geometry.dispose(); marker.material.dispose();
  }
  t('sheet: a capture contains only the scene it was asked for', () => {
    if(redFrac < 0) throw new Error('the scoped capture did not run');
    if(!(redFrac < 0.001))
      throw new Error(`a foreign object left visible in the pivot reached the sheet (${(redFrac*100).toFixed(1)}% of it)`);
  });

  // THE SPAN IS THE SCENE'S, and it counts instances. A framing distance that
  // followed the last builder's camSpan made the same descriptors compose
  // differently depending on which tab was open before (measured). And an
  // InstancedMesh's geometry bounds describe ONE unit, so a pallet of 48
  // instanced cases would measure as one case.
  const probeGroup = new THREE.Group();
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(10, 10, 10),
    new THREE.MeshBasicMaterial(), 2);
  const mm = new THREE.Matrix4();
  inst.setMatrixAt(0, mm.makeTranslation(-500, 0, 0));
  inst.setMatrixAt(1, mm.makeTranslation(500, 0, 0));
  inst.instanceMatrix.needsUpdate = true;
  probeGroup.add(inst);
  pivot.add(probeGroup);
  const wasVis = pivot.children.map(o => o.visible);
  pivot.children.forEach(o => { o.visible = false; });
  probeGroup.visible = true;
  const spanInstanced = visibleSpan(pivot);
  probeGroup.visible = false;
  const spanBlank = visibleSpan(pivot);
  pivot.children.forEach((o, i) => { if(i < wasVis.length) o.visible = wasVis[i]; });
  pivot.remove(probeGroup); inst.geometry.dispose(); inst.material.dispose();
  t('sheet: the span measures the visible scene, instances included', () => {
    // two 10 mm cubes 1000 mm apart: 1010, not 10
    approx(spanInstanced, 1010, 'instanced span:', 0.01);
    eq(spanBlank, 0, 'nothing visible measures nothing:');
  });

  // NO CALLER KNOWLEDGE. The composer is a primitive: it must not name a
  // feature. Read its own source. Mutation: having it read `perf` fails here.
  const src = await (await fetch('../src/render/sheet.js')).text();
  t('sheet: the composer names no caller', () => {
    if(src.length < 1000) throw new Error('could not read the composer source');
    const body = src.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '');
    for(const word of ['perf', 'exploded', 'shelf', 'carton', 'pallet', 'dieline'])
      if(new RegExp(word, 'i').test(body))
        throw new Error(`the composer refers to "${word}" outside a comment`);
  });

  // AND IT EMBEDS. The jpeg() record is the shape export/palletpdf.js already
  // takes, so a sheet reaches a document with no second path built later.
  const embed = (await composeSheet(sheetSpec())).jpeg();
  t('sheet: the output embeds in the PDF pipeline as it stands', () => {
    eq(Object.keys(embed).sort().join(','), 'data,h,w', 'record shape:');
    if(!/^data:image\/jpeg;base64,/.test(embed.data)) throw new Error('not a JPEG data URL');
    eq(embed.w, a.width, 'width:'); eq(embed.h, a.height, 'height:');
  });

  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ================= EXPLODED VIEW — the composer's third caller ===========
 * The offset MATH (even gaps, factor-zero identity, shell clearance,
 * axis modes) is pinned in test/explode.test.html, where it can run without
 * a scene. These pins are the ones that need the REAL app: does the
 * rendered tree actually move, does toggling it leave the solved chain
 * alone, does the sheet's per-scene camera override actually differ.
 */
await (async () => {
  el('tab3d').click(); await settle();
  el('d_case').click(); await settle();
  if(!el('m3cut').classList.contains('on')) el('m3cut').click();
  await settle();
  await waitFrames(() => getPivot().children.length > 0);

  // FIXTURE PRECONDITION: there must be a real rendered scene to explode, or
  // every pin below proves nothing (CLAUDE.md: confirm the specimen, not
  // just the instrument).
  const spanAssembled = visibleSpan(getPivot());
  if(!(spanAssembled > 0)) throw new Error('no rendered scene at case depth — fixture is broken, not the feature');

  // NO RE-SOLVE. Toggling explode must not touch the solved chain: same row
  // count, same selected candidate, same casesPerPallet/cartonsPerCase.
  // Mutate explosion to call the solver and this is what would catch it.
  const snapChain = () => {
    const key = build.getSelectedCandidateKey();
    const row = resolveActiveRow(build.project, build.getRounding(), key);
    return JSON.stringify({rows: build.getRows().length, key,
      cases: row.casesPerPallet, cartons: row.cartonsPerCase});
  };
  const chainBefore = snapChain();

  el('m3explodeToggle').click(); await settle();
  const factorEnabledOn = !el('m3explodeFactor').disabled;
  el('m3explodeFactor').value = 100; fire(el('m3explodeFactor'), 'input');
  await waitFrames(() => visibleSpan(getPivot()) !== spanAssembled);
  const spanExploded = visibleSpan(getPivot());
  const chainAfter = snapChain();

  t('exploded view: the toggle enables the factor/axis controls', () => {
    if(!factorEnabledOn) throw new Error('factor slider stayed disabled after the toggle');
  });
  t('exploded view: case depth actually spreads the rendered geometry', () => {
    if(!(spanExploded > spanAssembled*1.5))
      throw new Error(`span did not grow enough: ${spanAssembled} -> ${spanExploded}`);
  });
  t('exploded view: toggling it leaves the solved chain untouched (no re-solve)', () => {
    eq(chainAfter, chainBefore, 'chain state moved:');
  });

  // FACTOR ZERO IS IDENTITY, against the REAL render — not just the pure
  // math module. Back to 0 and the visible span must return EXACTLY to the
  // assembled value.
  el('m3explodeFactor').value = 0; fire(el('m3explodeFactor'), 'input');
  await waitFrames(() => visibleSpan(getPivot()) !== spanExploded);
  const spanZero = visibleSpan(getPivot());
  t('exploded view: factor 0 renders bit-identical to assembled', () => {
    approx(spanZero, spanAssembled, 'span at factor 0 vs assembled:', 1e-6);
  });
  el('m3explodeToggle').click(); await settle();   // off — clean depth switch below

  // LEVELS: the pallet explodes too, measured as its own precondition — not
  // assumed from the case result above. If only one level were wired this
  // is where it would show.
  el('d_pallet').click(); await settle();
  if(!el('m3cut').classList.contains('on')) el('m3cut').click();
  await settle();
  await waitFrames(() => getPivot().children.length > 0);
  const spanPalletAssembled = visibleSpan(getPivot());
  if(!(spanPalletAssembled > 0)) throw new Error('no rendered scene at pallet depth — fixture is broken, not the feature');
  const rowsBeforePallet = build.getRows().length;
  const defaultAxis = el('m3explodeAxis').value;
  el('m3explodeToggle').click(); await settle();
  el('m3explodeFactor').value = 100; fire(el('m3explodeFactor'), 'input');
  await waitFrames(() => visibleSpan(getPivot()) !== spanPalletAssembled);
  const spanPalletExploded = visibleSpan(getPivot());
  t('exploded view: pallet depth also spreads (both levels wired, not just case)', () => {
    if(!(spanPalletExploded > spanPalletAssembled*1.3))
      throw new Error(`pallet span did not grow enough: ${spanPalletAssembled} -> ${spanPalletExploded}`);
    eq(build.getRows().length, rowsBeforePallet, 'pallet explode must not re-solve either:');
  });
  t('exploded view: pallet defaults to the vertical axis, not all', () => {
    eq(defaultAxis, 'y', 'pallet default axis:');
  });
  el('m3explodeToggle').click(); await settle();   // OFF — restore before leaving this block

  // CAMERA OVERRIDES DIFFER. Same idiom the composer's own "names no caller"
  // pin uses — read the deployed source. The exploded sheet's two scene
  // descriptors must not share one camera literal, or "framed for what it
  // shows" is unverified. Mutation: setting both scenes to camera:'home'
  // fails this.
  const appSrc = await (await fetch('../src/ui/app.js')).text();
  const explodedFnBody = (appSrc.match(/async function explodedSheet\(\)\{[\s\S]*?\n\}/) || [''])[0];
  t('exploded sheet: the two scenes use different camera overrides', () => {
    if(explodedFnBody.length < 100) throw new Error('could not locate explodedSheet() in app.js source');
    const cams = [...explodedFnBody.matchAll(/camera:\s*('[\w]+'|\{[^}]*\})/g)].map(m => m[1]);
    eq(cams.length, 2, 'expected exactly 2 camera fields:');
    if(cams[0] === cams[1]) throw new Error(`both scenes use the same camera literal: ${cams[0]}`);
  });

  // DETERMINISM — the same property every other composer caller is held to.
  el('d_case').click(); await settle();
  if(!el('m3cut').classList.contains('on')) el('m3cut').click();
  await settle();
  const captureExplodedSheet = () => new Promise(resolve => {
    document.addEventListener('explodedsheet:composed', e => { e.preventDefault(); resolve(e.detail.sheet.png()); }, {once: true});
    el('btnExplodedSheet').click();
  });
  const png1 = await captureExplodedSheet();
  const png2 = await captureExplodedSheet();
  t('exploded sheet: same descriptors give byte-identical output', () => {
    if(png1.length < 2000) throw new Error('the sheet composed nothing to compare');
    eq(png2, png1, 'a second export differs:');
  });

  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ================= PERFORATION CONTROL PANEL — driven like a user ========
 * Every perf pin above this line constructs `level.perf` directly, via
 * applyPerfPreset/normalizePerf — which is exactly why a feature with 49
 * passing pins and no way to reach it shipped to production undetected.
 * These pins click the checkbox, pick a preset from the select, flip the
 * state toggle, type into the corner fields — the DOM path a real user
 * takes — and read back through the SAME geoAt/DXF/BCT consumers the
 * pins above already trust. See CLAUDE.md: "a feature is not done until
 * a pin drives it the way a user does."
 */
await (async () => {
  const geoAt = lvl => levelGeometry(build.project, lvl, build.getRounding(), build.getSelectedCandidateKey());
  const styleOptions = () => [...el('levelStyleSel').options].map(o => o.value);
  const setStyle = id => { el('levelStyleSel').value = id; fire(el('levelStyleSel'), 'change'); };
  const PERF_LEVELS2 = [['case', 'tertiary'], ['carton', 'secondary']];

  // REACHABILITY. From a default load, on each level x style this feature
  // is documented to support, the enable control exists and is visible.
  // This is the pin whose absence caused the deploy report.
  const APPLICABLE = {case: ['fefco201', 'a6120', 'sealend'], carton: ['fefco201', 'a6120', 'sealend']};
  for(const [level] of PERF_LEVELS2){
    setLevel(level); await settle();
    const origStyle = el('levelStyleSel').value;
    try{
      for(const styleId of APPLICABLE[level]){
        if(!styleOptions().includes(styleId)) continue;
        setStyle(styleId); await settle();
        t(`perforation reachability: ${level}/${styleId} shows the enable control`, () => {
          if(getComputedStyle(el('perfPanel')).display === 'none') throw new Error('perfPanel is hidden');
          if(getComputedStyle(el('perfBody')).display === 'none') throw new Error('perfBody is hidden — reads as unsupported, not reachable');
          const box = el('perfEnable');
          if(getComputedStyle(box).display === 'none' || box.offsetParent === null) throw new Error('the enable checkbox is not visible');
        });
      }
    } finally { setStyle(origStyle); await settle(); }
  }

  // AT THE WIDTH THE USER DOES IT. Same assertions, same levels, same
  // styles — against the mobile fixture's real CSS at 390x600 instead of
  // this document's CSS-free skeleton. CLAUDE.md: "a feature is not done
  // until a pin drives it the way a user does — at the width the user
  // does it."
  const mframe = document.getElementById('mobileFixture');
  await new Promise(resolve => {
    const ready = () => mframe.contentDocument && mframe.contentDocument.getElementById('style')
      && mframe.contentDocument.getElementById('style').options.length > 0;
    if(ready()) return resolve();
    mframe.addEventListener('load', async () => {
      const start = Date.now();
      while(!ready() && Date.now() - start < 8000) await new Promise(r => setTimeout(r, 50));
      resolve();
    }, {once: true});
  });
  const mdoc = () => mframe.contentDocument;
  const mel = id => mdoc().getElementById(id);
  const mcs = node => mframe.contentWindow.getComputedStyle(node);
  const mfire = (node, type) => node.dispatchEvent(new Event(type, {bubbles: true}));
  const msettle = () => new Promise(r => setTimeout(r, 80));   // a real app + real recompute, not a bare microtask
  const mSetLevel = level => { mel('style').value = level; mfire(mel('style'), 'change'); };
  const mSetStyle = id => { mel('levelStyleSel').value = id; mfire(mel('levelStyleSel'), 'change'); };
  // "reachable" means on-screen, not merely `display !== 'none'` — a
  // control positioned or clipped off the viewport reads display:block and
  // would pass a display-only check while still being unreachable.
  const onScreen = node => {
    const r = node.getBoundingClientRect();
    return r.width > 0 && r.height > 0
      && r.top >= 0 && r.left >= 0
      && r.bottom <= mframe.contentWindow.innerHeight && r.right <= mframe.contentWindow.innerWidth;
  };

  for(const [level] of PERF_LEVELS2){
    mSetLevel(level); await msettle();
    const origStyle = mel('levelStyleSel').value;
    try{
      for(const styleId of APPLICABLE[level]){
        if(![...mel('levelStyleSel').options].map(o => o.value).includes(styleId)) continue;
        mSetStyle(styleId); await msettle();
        t(`perforation reachability at 390px: ${level}/${styleId} shows the enable control`, () => {
          if(mcs(mel('perfPanel')).display === 'none') throw new Error('perfPanel is hidden');
          if(mcs(mel('perfBody')).display === 'none') throw new Error('perfBody is hidden — reads as unsupported, not reachable');
          const box = mel('perfEnable');
          if(mcs(box).display === 'none' || box.offsetParent === null) throw new Error('the enable checkbox is not visible');
        });
      }
    } finally { mSetStyle(origStyle); await msettle(); }
  }

  // STATE SHEET / EXPLODED SHEET at 390px. Both are export buttons in the
  // header — gated, respectively, on the active level carrying an enabled
  // perforation and on the active level being carton/case/pallet. Neither
  // gate is width-dependent, so once satisfied the only remaining question
  // is layout: is the button actually on screen, not just `display:block`.
  mSetLevel('case'); await msettle();
  mSetStyle('fefco201'); await msettle();
  if(!mel('perfEnable').checked){ mel('perfEnable').click(); await msettle(); }
  t('State sheet at 390px: reachable once its gate (an enabled perforation) is satisfied', () => {
    if(mcs(mel('btnStateSheet')).display === 'none') throw new Error('still display:none after satisfying the gate');
    if(!onScreen(mel('btnStateSheet'))) throw new Error('rendered but off-screen/clipped at 390px');
  });
  t('Exploded sheet at 390px: reachable at the default level (case is in EXPLODE_LEVELS)', () => {
    if(mcs(mel('btnExplodedSheet')).display === 'none') throw new Error('display:none at a level EXPLODE_LEVELS includes');
    if(!onScreen(mel('btnExplodedSheet'))) throw new Error('rendered but off-screen/clipped at 390px');
  });
  if(mel('perfEnable').checked){ mel('perfEnable').click(); await msettle(); }

  // THE EXPLODE TOGGLE ITSELF, at the depth that actually stressed it: the
  // toolbar floats absolutely inside `.stage`, which clips (overflow:hidden,
  // needed to mask the canvas at its own edges) — at 390x600 with Pallet
  // depth's extra cycle-arrow row, the toolbar's own content is taller than
  // the room .stage has. Mutate the CSS fix (drop `.mode3d`'s `bottom`/
  // `overflow-y:auto` at the mobile breakpoint) and this is what catches it.
  mel('tab3d').click(); await msettle();
  mel('d_pallet').click(); await msettle();
  t('Explode toggle at 390px, Pallet depth: the toolbar is never clipped by .stage, and any overflow is scrollable, not lost', () => {
    const stage = mdoc().querySelector('.stage'), toolbar = mel('mode3d');
    const sr = stage.getBoundingClientRect(), tr = toolbar.getBoundingClientRect();
    // .mode3d's OWN box must fit inside .stage's clip region — a box that
    // exceeds it is silently cut off by .stage's overflow:hidden, exactly
    // the mechanism that lost the Grid/White row before the CSS fix.
    if(tr.bottom > sr.bottom + 0.5)
      throw new Error(`toolbar bottom (${tr.bottom.toFixed(0)}) exceeds .stage's clip region (${sr.bottom.toFixed(0)}) — rows below the edge are clipped, not scrollable`);
    // when the toolbar's OWN content (Fold/depth/cycle/viewmode/explode/
    // dims/bg — Pallet depth's full row set) is taller than the box .stage
    // has room for, overflow-y must let a user reach the rest by scrolling
    // the toolbar — not leave it clipped with no way in.
    if(toolbar.scrollHeight > toolbar.clientHeight + 1 && mcs(toolbar).overflowY !== 'auto' && mcs(toolbar).overflowY !== 'scroll')
      throw new Error(`toolbar content (${toolbar.scrollHeight}px) exceeds its box (${toolbar.clientHeight}px) and overflow-y is "${mcs(toolbar).overflowY}" — the overflow is clipped, not reachable`);
    // and the specific controls this defect was reported against must be
    // present somewhere inside that scrollable content (not merely display:
    // none'd away as a wholly separate failure mode).
    for(const id of ['m3explodeToggle', 'm3explodeFactor', 'm3explodeAxis'])
      if(mcs(mel(id)).display === 'none') throw new Error(`#${id} is display:none at Pallet depth`);
  });
  mel('tab2d').click(); await msettle();

  // outerFlaps TASK — THE INVERSION, LIVE, AT 390px. Flip the real
  // #p_outerFlaps control (mountLevel's generic options field) and the
  // rail's openability verdict (#perfWarn, the SAME call the styleStats
  // readout and the spec sheet make) flips with it — no confirmation
  // argument, no not-evaluated state, just the live build read straight
  // off geometry(). Retaining the BACK panel (a length panel, panel 0)
  // warns under the default 'L' build and must stop warning the instant
  // outerFlaps flips to 'W', with no other change.
  mSetLevel('case'); await msettle();
  mSetStyle('fefco201'); await msettle();
  if(!mel('perfEnable').checked){ mel('perfEnable').click(); await msettle(); }
  mel('perfAdvanced') && (mel('perfAdvanced').open = true);
  mel('perfPerPanel').open = true;
  mel('perfMode_back').value = 'full'; mfire(mel('perfMode_back'), 'change'); await msettle();
  t('outerFlaps at 390px: retaining the back panel warns under the default L build', () => {
    if(mcs(mel('perfWarn')).display === 'none') throw new Error('no warning shown for a retained major-flap panel under the default build');
    if(!/separate/i.test(mel('perfWarn').textContent)) throw new Error(`#perfWarn does not read a real verdict: "${mel('perfWarn').textContent}"`);
  });
  mel('p_outerFlaps').value = 'W'; mfire(mel('p_outerFlaps'), 'change'); await msettle();
  t('outerFlaps at 390px: flipping the control to W flips the rail verdict — same back panel, no longer warns', () => {
    if(mcs(mel('perfWarn')).display !== 'none') throw new Error(`still warning after outerFlaps flipped to W: "${mel('perfWarn').textContent}"`);
  });
  mel('p_outerFlaps').value = 'L'; mfire(mel('p_outerFlaps'), 'change'); await msettle();
  t('outerFlaps at 390px: flipping back to L restores the warning — the same live read, not a one-way latch', () => {
    if(mcs(mel('perfWarn')).display === 'none') throw new Error('warning did not return after flipping outerFlaps back to L');
  });
  mel('perfMode_back').value = 'profiled'; mfire(mel('perfMode_back'), 'change'); await msettle();
  if(mel('perfEnable').checked){ mel('perfEnable').click(); await msettle(); }

  // Work the rest of this block on Case/FEFCO201, the exact combination the
  // deploy report used.
  setLevel('case'); await settle();
  const origCaseStyle = el('levelStyleSel').value;
  setStyle('fefco201'); await settle();

  // ENABLE THROUGH THE CONTROL. Not normalizePerf returning an object — the
  // app rendering a tear line, read the SAME geoAt().aux.PERF the DXF/SVG
  // pins above already trust.
  if(el('perfEnable').checked){ el('perfEnable').click(); await settle(); }   // start OFF
  t('perforation: fixture starts disabled, or this pin proves nothing', () => {
    if(geoAt('case').aux) throw new Error('perf was already on before the pin started');
  });
  el('perfEnable').click(); await settle();
  t('perforation: clicking Enable produces a real tear line in the rendered geometry', () => {
    const g = geoAt('case');
    if(!g.aux || !g.aux.PERF || !g.aux.PERF.length) throw new Error('no PERF aux layer after enabling through the control');
  });
  t('perforation: enabling with no prior configuration applies the Angled sides default, not an empty one', () => {
    eq(el('perfPreset').value, 'angled', 'preset select after first enable:');
  });

  // PRESET CLICK CHANGES THE RENDER. All five, pairwise distinct — a pin
  // that only checked "the click doesn't throw" would pass on a picker
  // wired to nothing.
  const pathsByPreset = {};
  for(const p of PERF_PRESETS){
    el('perfPreset').value = p.id; fire(el('perfPreset'), 'change'); await settle();
    pathsByPreset[p.id] = JSON.stringify(buildPerfPath(geoAt('case'), build.project.tertiary.perf).segments);
  }
  t('perforation: every preset produces a genuinely different tear path', () => {
    const ids = PERF_PRESETS.map(p => p.id);
    for(let i = 0; i < ids.length; i++) for(let j = i + 1; j < ids.length; j++)
      if(pathsByPreset[ids[i]] === pathsByPreset[ids[j]]) throw new Error(`${ids[i]} and ${ids[j]} produced identical paths`);
  });

  // STATE TOGGLE. Flips the 3D display/shipping geometry AND BCT.
  el('perfPreset').value = 'angled'; fire(el('perfPreset'), 'change'); await settle();
  t('perforation: state defaults to Shipping, BCT is a real number', () => {
    if(isDisplayGeo(geoAt('case'))) throw new Error('fixture is already in display state');
    if(!/\d/.test(el('bctVal').textContent)) throw new Error('BCT has no number to begin with — fixture proves nothing');
  });
  el('perfStateDisplay').click(); await settle();
  t('perforation: the state toggle switches the 3D to display geometry and BCT to not-applicable', () => {
    if(!isDisplayGeo(geoAt('case'))) throw new Error('geometry did not switch to display state');
    const bctText = el('bctVal').textContent + el('bctRatio').textContent + (el('bctNote') ? el('bctNote').textContent : '');
    if(!/not applicable/i.test(bctText)) throw new Error(`BCT did not read not-applicable in display state: "${bctText}"`);
  });
  el('perfStateClosed').click(); await settle();

  // NOT APPLICABLE. tray/flowwrap/shrinkbundle read the message, not a
  // silently missing control — a missing control and an unsupported style
  // must never look the same.
  for(const styleId of ['tray', 'flowwrap', 'shrinkbundle']){
    if(!styleOptions().includes(styleId)) continue;
    setStyle(styleId); await settle();
    t(`perforation: ${styleId} shows "not applicable", not an empty space`, () => {
      if(getComputedStyle(el('perfPanel')).display === 'none') throw new Error('the whole panel is hidden — indistinguishable from a missing control');
      if(getComputedStyle(el('perfNA')).display === 'none') throw new Error('no not-applicable message shown');
      if(!/not applicable/i.test(el('perfNA').textContent)) throw new Error('message does not say not applicable');
      if(getComputedStyle(el('perfBody')).display !== 'none') throw new Error('the enable checkbox is still showing on an unsupported style');
    });
  }
  setStyle('fefco201'); await settle();
  if(!el('perfEnable').checked){ el('perfEnable').click(); await settle(); }

  // CUSTOM LABEL. The only observable is the picker's own selected value.
  el('perfPreset').value = 'bowed'; fire(el('perfPreset'), 'change'); await settle();
  t('perforation: selecting a preset labels it by name', () => {
    eq(el('perfPreset').value, 'bowed', 'preset select value:');
  });
  el('perfAdvanced').open = true;
  el('perfCorner0').value = 7; fire(el('perfCorner0'), 'change'); await settle();
  t('perforation: editing after a preset relabels to Custom', () => {
    eq(el('perfPreset').value, '', 'preset select value after edit:');
  });

  // ONE WRITER. The write-time clamp (normalizePerf) is what EVERY control
  // must pass through — an out-of-range value typed into either the
  // advanced OR the simple field comes back clamped, never stored raw.
  // Mutate a control to assign level.perf directly and this is what would
  // catch it.
  el('perfCorner0').value = 99999; fire(el('perfCorner0'), 'change'); await settle();
  t('perforation: the advanced corner control is clamped by the one writer, not a second path', () => {
    const H = perfFrame(geoAt('case')).H, stored = build.project.tertiary.perf.cornerH[0];
    if(stored >= 99999) throw new Error(`stored value ${stored} was not clamped — advanced wrote around normalizePerf`);
    if(!(stored <= H)) throw new Error(`stored value ${stored} exceeds the container height ${H}`);
  });
  el('perfBack').value = -99999; fire(el('perfBack'), 'change'); await settle();
  t('perforation: the simple back-height control is clamped by the same one writer', () => {
    const stored = build.project.tertiary.perf.cornerH[0];
    if(stored <= -99999) throw new Error(`stored value ${stored} was not clamped — simple wrote around normalizePerf`);
    if(!(stored >= 0)) throw new Error(`stored value ${stored} is negative`);
  });

  // MIRROR SIDES, on by default: editing right propagates to left (SWAPPED
  // flats — the two side panels run opposite directions around the girth),
  // and stops propagating once the toggle is off.
  el('perfPerPanel').open = true;
  if(!el('perfMirror').checked) el('perfMirror').click();
  el('perfFlatFrom_right').value = 22; fire(el('perfFlatFrom_right'), 'change'); await settle();
  t('perforation: mirror sides propagates right onto left, flats swapped', () => {
    const panels = build.project.tertiary.perf.panels;
    approx(panels.right.flatA, 22, 'right.flatA:', 0.01);
    approx(panels.left.flatB, 22, 'left.flatB (mirrored):', 0.01);
  });
  el('perfMirror').click(); await settle();
  el('perfFlatFrom_right').value = 41; fire(el('perfFlatFrom_right'), 'change'); await settle();
  t('perforation: with mirror off, editing right leaves left untouched', () => {
    const panels = build.project.tertiary.perf.panels;
    approx(panels.right.flatA, 41, 'right.flatA:', 0.01);
    approx(panels.left.flatB, 22, 'left.flatB (unchanged):', 0.01);
  });

  // restore: disable perforation and the level/style this block started
  // from, so nothing leaks into whatever runs after.
  if(el('perfEnable').checked){ el('perfEnable').click(); await settle(); }
  setStyle(origCaseStyle); await settle();
  el('tab2d').click(); setLevel('case'); await settle();
})();

save.clearAutosave();
save.cancelAutosave();

const fails = results.filter(r => r.startsWith('FAIL')).length;
document.getElementById('out').textContent =
  `${results.length - fails}/${results.length} passed\n\n` + results.join('\n');
window.__tests = {total: results.length, fails, results};
</script>
</body>
</html>
