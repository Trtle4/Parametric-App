          const s2 = Math.abs(uv.getY(i) - uv.getY(prev))*CH;
          if(s2 <= CH*0.5){ arc += d; dv += s2; }      // skip the seam discontinuity
        }
        prev = i;
      }
      return arc > 0 ? dv/arc : 0;
    };
    // the tab's own top face, walked across its width
    const tabDensity = (m) => {
      const pos = m.geometry.attributes.position, uv = m.geometry.attributes.uv;
      let hy = -Infinity;
      for(let i = 0; i < pos.count; i++) hy = Math.max(hy, pos.getY(i));
      const ids = [];
      for(let i = 0; i < pos.count; i++) if(Math.abs(pos.getY(i) - hy) < 1e-6) ids.push(i);
      ids.sort((a2, b2) => pos.getZ(a2) - pos.getZ(b2));
      let arc = 0, dv = 0;
      for(let k = 1; k < ids.length; k++){
        const d = Math.abs(pos.getZ(ids[k]) - pos.getZ(ids[k - 1]));
        if(d < 1e-9) continue;
        arc += d; dv += Math.abs(uv.getY(ids[k]) - uv.getY(ids[k - 1]))*CH;
      }
      return arc > 0 ? dv/arc : 0;
    };
    return {body: ringDensity(parts[0], true), rampCrimp: ringDensity(parts[1], true), tab: tabDensity(parts[3])};
  })();

  t('the print does not jump scale at the crimp line — tab density continues the ramp', () => {
    const d = crimpDensities;
    if(!d) throw new Error('no printed wrap parts to measure');
    if(!(d.body > 0 && d.rampCrimp > 0 && d.tab > 0))
      throw new Error(`densities not measurable: ${JSON.stringify(d)}`);
    // the gather is REAL: the section collapses along the ramp, so the ramp's
    // crimp end is denser than the body. What must not exist is a STEP at the
    // join, where the film is one continuous web.
    const step = d.tab/d.rampCrimp;
    if(!(step > 0.8 && step < 1.25))
      throw new Error(`density steps ${step.toFixed(2)}x across the crimp line ` +
        `(body ${d.body.toFixed(2)}, ramp-at-crimp ${d.rampCrimp.toFixed(2)}, tab ${d.tab.toFixed(2)})`);
    // and the fixture is only discriminating while the ramp actually gathers
    if(!(d.rampCrimp > d.body*1.2))
      throw new Error(`fixture not discriminating: ramp ${d.rampCrimp.toFixed(2)} vs body ${d.body.toFixed(2)}`);
  });

  el('tab3d').click();
  restoreProject(wmSnap);
  setLevel('case'); await settle();
})();

/* ==================================================================
   The shelf presents the pack's declared face THE RIGHT WAY UP, and a
   printed wrap keeps its face selector. Two gaps in the same convention:
   an orientation string names axes only, so it fixes which face is
   forward but not which way is up on it (the wrap stood on its head);
   and the selector locked on "has artwork" alone, which took the control
   away from wraps whose art rides the real geometry and orients freely.
   ================================================================== */
await (async () => {
  const shSnap = snapProject(), shKey = build.getSelectedCandidateKey();
  const savedFront = el('shFront').value, savedPose3 = getOrbit();
  const packMeshes3 = () => {
    const hits = [];
    getPivot().traverse(o => {
      if(!o.isInstancedMesh || o.name === 'shelfFixture') return;
      for(let n = o; n; n = n.parent) if(!n.visible) return;
      hits.push(o);
    });
    return hits;
  };
  const printedFacings = () => packMeshes3().some(m =>
    (Array.isArray(m.material) ? m.material : [m.material]).some(x => x && x.map));

  // ---- a PRINTED WRAP on the shelf, artwork with an unmistakable up/left ----
  let quadSrc = null;
  {
    const proj = build.project;
    proj.interlayer = 'tray'; proj.tray.nCells = 3;
    Object.assign(proj.primary.collation,
      {pieceOrientation: 'on-edge', stackAxis: 'X', perStack: 10, nx: 1, ny: 1});
    proj.secondary.enabled = false;                  // carton off -> the WRAP is sellable
    const am0 = resolveActiveRow(build.project, build.getRounding(), null).geo.wrap.meta.artMap;
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#ff0000'; g.fillRect(0, 0, 64, 64);      // template TOP-LEFT
    g.fillStyle = '#ffff00'; g.fillRect(64, 0, 64, 64);     // TOP-RIGHT
    g.fillStyle = '#0000ff'; g.fillRect(0, 64, 64, 64);     // BOTTOM-LEFT
    g.fillStyle = '#00ff00'; g.fillRect(64, 64, 64, 64);    // BOTTOM-RIGHT
    quadSrc = c.toDataURL('image/png');
    proj.artwork = {wrap: {src: quadSrc, fit: 'none', rect: {x: 0, y: 0, w: am0.canvas.w, h: am0.canvas.h}}};
    build.recompute();
  }
  await waitFrames(() => artImage(quadSrc).complete && artImage(quadSrc).naturalWidth > 0);
  el('shFront').value = 'auto'; fire(el('shFront'), 'change');
  el('tabShelf').click(); build.recompute();
  const shPrinted = await waitFrames(() => printedFacings());

  // sample ONE facing pack's front face at a straight FRONT view. Screen up is
  // the shelf's up and screen right is the shopper's right, so the template's
  // own corners must land in the matching screen corners — which catches an
  // upside-down pack AND a mirrored one, neither of which moves any extent.
  setOrbit(0, 0, 1.15);
  let shCam = null;
  const offF3 = onFrame(c2 => { shCam = c2; });
  await waitFrames(() => !!shCam && printedFacings());
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  offF3 && offF3();
  const shCorners = (() => {
    const mesh = packMeshes3()[0];
    if(!mesh) return null;
    const cv = getDomElement();
    const g2 = document.createElement('canvas'); g2.width = cv.width; g2.height = cv.height;
    const cx2 = g2.getContext('2d'); cx2.drawImage(cv, 0, 0);
    const M = new THREE.Matrix4();
    mesh.getMatrixAt(0, M); M.premultiply(mesh.matrixWorld);
    const centre = new THREE.Vector3().setFromMatrixPosition(M);
    const o = resolveActiveRow(build.project, build.getRounding(), null).geo.wrap.outer;
    const scr = v => { const q = v.clone().project(shCam);
      return [Math.round((q.x + 1)/2*cv.width), Math.round((1 - q.y)/2*cv.height)]; };
    const samp = (x, y) => { const d = cx2.getImageData(x, y, 1, 1).data; return [d[0], d[1], d[2]]; };
    const c0 = scr(centre);
    // a quarter of the face across and up, in SCREEN terms (the shelf group's
    // own 180° turn is already in the projection, so this needs no unpicking)
    const dx = Math.abs(scr(centre.clone().add(new THREE.Vector3(o.L/4, 0, 0)))[0] - c0[0]);
    const dy = Math.abs(scr(centre.clone().add(new THREE.Vector3(0, o.W/4, 0)))[1] - c0[1]);
    if(dx < 3 || dy < 3) return null;
    return {UL: samp(c0[0] - dx, c0[1] - dy), UR: samp(c0[0] + dx, c0[1] - dy),
            LL: samp(c0[0] - dx, c0[1] + dy), LR: samp(c0[0] + dx, c0[1] + dy)};
  })();
  setOrbit(savedPose3.rotX, savedPose3.rotY, savedPose3.dist);

  // ---- is the selector usable, and honoured? ----
  const wrapFrontState = {disabled: el('shFront').disabled, fills: {}};
  for(const f of ['auto', 'LWH', 'WLH', 'LHW']){
    el('shFront').value = f; fire(el('shFront'), 'change');
    wrapFrontState.fills[f] = (el('shReadout').textContent || '').replace(/\s+/g, ' ').slice(0, 60);
  }
  el('shFront').value = 'auto'; fire(el('shFront'), 'change');

  // ---- and a printed TUBE pack keeps front/rotate LIVE (item 1: artwork
  // designates which panel carries the print; shelf front designates which
  // panel faces the shopper — two different facts, so both controls stay
  // live under artwork, exactly like the wrap above) ----
  let cartonFixture = null;
  {
    const proj = build.project;
    proj.interlayer = 'none'; proj.secondary.enabled = true;
    Object.assign(proj.primary.collation,
      {pieceOrientation: 'flat', stackAxis: 'Z', perStack: 2, nx: 3, ny: 1});
    const cGeo = resolveActiveRow(build.project, build.getRounding(), null).geo.carton;
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'); g.fillStyle = '#c33'; g.fillRect(0, 0, 64, 64);
    const csrc = c.toDataURL('image/png');

    // the mesh's OWN rendered extent, rotation-only (translation stripped) —
    // the observable quantity the prior double-apply bug moved: measured, it
    // put a printed wrap 49mm tall where it should be 172.
    const meshExtents = () => {
      const mesh = packMeshes3().find(m => m.isInstancedMesh);
      if(!mesh) return null;
      if(!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
      const bb = mesh.geometry.boundingBox;
      const M = new THREE.Matrix4(); mesh.getMatrixAt(0, M);
      const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
      M.decompose(pos, quat, scl);
      const R = new THREE.Matrix4().makeRotationFromQuaternion(quat);
      const pts = [];
      for(const x of [bb.min.x, bb.max.x]) for(const y of [bb.min.y, bb.max.y]) for(const z of [bb.min.z, bb.max.z])
        pts.push(new THREE.Vector3(x, y, z).applyMatrix4(R));
      const lo = pts[0].clone(), hi = pts[0].clone();
      pts.forEach(p => { lo.min(p); hi.max(p); });
      return {x: hi.x - lo.x, y: hi.y - lo.y, z: hi.z - lo.z};
    };
    // a quarter of the pack's own front face, screen-projected — the same
    // corner-sampling idiom as shCorners above, so a swap can be told from a
    // mere repaint. Panel colours differ from the wrap's template (this is a
    // FLAT single colour here) — used only to confirm the print is STILL
    // THERE and covering the whole visible face, not to read a specific quadrant.
    const facingPresent = () => printedFacings();

    const COMBOS = [];
    for(const front of ['auto', 'LWH', 'WLH', 'LHW']) for(const rot of [0, 90, 180, 270]) COMBOS.push({front, rot});

    const runFor = async printed => {
      proj.artwork = printed ? {carton: {src: csrc, fit: 'fill'}} : {};
      build.recompute();
      if(printed) await waitFrames(() => artImage(csrc).complete && artImage(csrc).naturalWidth > 0);
      const out = [];
      for(const {front, rot} of COMBOS){
        el('shFront').value = front; fire(el('shFront'), 'change');
        build.project.shelf.rot = rot; build.recompute();
        await waitFrames(() => packMeshes3().length > 0);
        out.push({front, rot, ext: meshExtents(), disabled: el('shFront').disabled,
                   fillText: (el('shReadout').textContent || '').replace(/\s+/g, ' ').trim()});
      }
      return out;
    };

    const printedRuns = await runFor(true);
    const boardRuns = await runFor(false);
    cartonFixture = {hasArtMap: !!(cGeo && cGeo.meta.artMap), printedRuns, boardRuns};
    proj.artwork = {carton: {src: csrc, fit: 'fill'}};
    build.recompute();
    el('shFront').value = 'auto'; fire(el('shFront'), 'change');
    build.project.shelf.rot = 0; build.recompute();
    await waitFrames(() => facingPresent());
  }

  t('shelf AUTO stands the wrap the right way up — the declared face AND its declared up', () => {
    // meta.frontFace gets the display face forward; on its own that leaves the
    // print 180° out, because an orientation string names axes with no notion
    // of which way is up on the face it selects. meta.frontUp closes it. The
    // symptom was a shelf of upside-down packs that Rotate had to correct by
    // hand — and it moves NO extent, so only the rendered pixels can see it.
    if(!shPrinted) throw new Error('the artwork never reached the shelf facings');
    if(!shCorners) throw new Error('could not sample a facing pack front face');
    const want = {UL: 'RED', UR: 'YELLOW', LL: 'BLUE', LR: 'GREEN'};
    const bad = Object.entries(want)
      .filter(([k, v]) => readQuad(shCorners[k]) !== v)
      .map(([k, v]) => `${k}: template says ${v}, shelf shows ${readQuad(shCorners[k])}`);
    if(bad.length) throw new Error(bad.join('; '));
  });

  t('face selection stays available for a printed WRAP, and for a printed tube pack too', () => {
    // A wrap's art rides the real pillow geometry, and a tube pack's art
    // rides packArtGeometry's tube — both compose through faceShopperQuat
    // now, ONE mechanism, so both stay selectable. The old rule locked the
    // tube pack on "has artwork" alone because a naive composition there
    // once double-applied the orientation; the fix is in the composition
    // (verified below), not in re-imposing the lock.
    if(wrapFrontState.disabled)
      throw new Error('the face selector is locked for a printed wrap');
    const fills = wrapFrontState.fills;
    if(fills.LWH === fills.WLH && fills.WLH === fills.LHW)
      throw new Error(`every face gives the same fill — the selection is not reaching the solve: ${fills.LWH}`);
    eq(fills.auto, fills.LHW, 'Auto must resolve to the wrap\'s declared face (LHW):');
    if(!cartonFixture.hasArtMap)
      throw new Error('fixture not discriminating: the carton carries no artMap');
    if(cartonFixture.printedRuns.some(r => r.disabled))
      throw new Error('the face selector is locked for a printed tube pack — item 1 regression');
  });

  t('printed tube pack: changing front AND changing rot both change the render', () => {
    const runs = cartonFixture.printedRuns;
    const fills = new Set(runs.map(r => r.fillText));
    if(fills.size < 2)
      throw new Error(`every front/rot combination renders the same readout — neither control is reaching the render: ${[...fills][0]}`);
    // isolate each control: holding the OTHER fixed, it alone must still move
    // the rendered mesh's own extents — not just the fit readout, which (being
    // computed independently in shelfFill) could keep moving even if the
    // render itself had gone back to ignoring one of the two controls.
    const byFront = f => runs.filter(r => r.front === f);
    const byRot = r => runs.filter(r2 => r2.rot === r);
    const varies = list => new Set(list.map(r => JSON.stringify(r.ext))).size > 1;
    if(!['auto', 'LWH', 'WLH', 'LHW'].some(f => varies(byFront(f))))
      throw new Error('rotate changes nothing in the RENDERED mesh for a printed tube pack, at any front — item 1 regression');
    if(![0, 90, 180, 270].some(r => varies(byRot(r))))
      throw new Error('front changes nothing in the RENDERED mesh for a printed tube pack, at any rot — item 1 regression');
  });

  t('printed tube pack: rendered extents match the unprinted pack\'s, for every front/rot combination', () => {
    // THE pin for the exact prior failure. packArtGeometry and the board
    // BoxGeometry are built two completely different ways, but they describe
    // the SAME physical carton — their rendered world extents must agree at
    // every (front, rot). A double-applied orientation moves this (measured:
    // 49mm where it should be 172); a merely-repainted pack never does.
    const TOL = 3; // mm — comfortably above the ~1.5mm PACK_GAP cosmetic inset,
                   // far below the ~120mm the historical double-apply produced
    const bad = [];
    cartonFixture.printedRuns.forEach((p, i) => {
      const b = cartonFixture.boardRuns[i];
      if(!p.ext || !b.ext){ bad.push(`${p.front}/${p.rot}: missing extent (printed=${!!p.ext}, board=${!!b.ext})`); return; }
      for(const ax of ['x', 'y', 'z']){
        if(Math.abs(p.ext[ax] - b.ext[ax]) > TOL)
          bad.push(`${p.front}/${p.rot} axis ${ax}: printed=${p.ext[ax].toFixed(1)} board=${b.ext[ax].toFixed(1)}`);
      }
    });
    if(bad.length) throw new Error(bad.join('; '));
  });

  el('tab2d').click();
  el('shFront').value = savedFront; fire(el('shFront'), 'change');
  restoreProject(shSnap, shKey);
  setLevel('case'); await settle();
})();

/* ==================================================================
   Item 1, at the width the user does it: front/rotate stay reachable
   and enabled for a printed tube pack in the real-CSS mobile fixture,
   not just against this file's CSS-free skeleton.
   ================================================================== */
await (async () => {
  const mframe = document.getElementById('mobileFixture');
  await new Promise(resolve => {
    const ready = () => mframe.contentDocument && mframe.contentDocument.getElementById('shFront')
      && mframe.contentDocument.getElementById('shFront').options.length > 0;
    if(ready()) return resolve();
    mframe.addEventListener('load', async () => {
      const start = Date.now();
      while(!ready() && Date.now() - start < 8000) await new Promise(r => setTimeout(r, 50));
      resolve();
    }, {once: true});
  });
  const mdoc = mframe.contentDocument;
  const mel = id => mdoc.getElementById(id);
  const mfire = (node, type) => node.dispatchEvent(new Event(type, {bubbles: true}));
  const mcs = node => mframe.contentWindow.getComputedStyle(node);
  const msettle = () => new Promise(r => setTimeout(r, 80));

  // upload artwork through the REAL control (#artFileInput), inside the
  // iframe's own realm — a File built in the OUTER realm fails an
  // `instanceof File` check the app's own code may run inside the iframe.
  // No window.build hook exists in either realm, so success/cleanup are
  // read and driven through the same DOM the user would use: #artControls'
  // visibility (updateArtPanel) is the app's own "artwork present" signal,
  // and #btnArtRemove is the real undo.
  mel('tab2d').click();                              // updateArtPanel only runs on 2d/3d
  mel('style').value = 'carton'; mfire(mel('style'), 'change'); await msettle();
  const c = mdoc.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = '#3c3'; g.fillRect(0, 0, 64, 64);
  const blob = await new Promise(res => c.toBlob(res, 'image/png'));
  const mWin = mframe.contentWindow;
  const file = new mWin.File([blob], 'art.png', {type: 'image/png'});
  const dt = new mWin.DataTransfer();
  dt.items.add(file);
  mel('artFileInput').files = dt.files;
  mfire(mel('artFileInput'), 'change');
  // FileReader + Image decode is async and, in this harness's swiftshader
  // Chromium, sometimes slower than a fixed short poll — generous timeout,
  // not a tighter assertion, since decode SPEED was never what this pin tests.
  const uploaded = await (async () => {
    const t0 = Date.now();
    while(mcs(mel('artControls')).display === 'none'){
      if(Date.now() - t0 > 8000) return false;
      await new Promise(r => setTimeout(r, 50));
    }
    return true;
  })();

  mel('tabShelf').click(); await msettle();

  t('shelf at 390px: front + rotate stay reachable and enabled for a printed tube pack', () => {
    if(!uploaded) throw new Error('fixture: artwork upload never reached #artControls — nothing to test');
    // "reachable" here means rendered with a real layout box, not clipped to
    // zero/hidden by CSS — NOT "already in the viewport without scrolling":
    // both controls sit well down the right rail's own internal scroll
    // (`.rail{overflow:auto}`), which is normal mobile layout, not a defect.
    const reachable = node => { const r = node.getBoundingClientRect(); return r.width > 0 && r.height > 0 && !!node.offsetParent; };
    const front = mel('shFront'), rotate = mel('shRotate');
    if(mcs(front).display === 'none') throw new Error('front selector hidden at 390px');
    if(!reachable(front)) throw new Error('front selector clipped to zero size at 390px');
    if(front.disabled) throw new Error('front selector disabled under artwork at 390px — item 1 regression');
    if(mcs(rotate).display === 'none') throw new Error('rotate button hidden at 390px');
    if(!reachable(rotate)) throw new Error('rotate button clipped to zero size at 390px');
    if(rotate.disabled) throw new Error('rotate button disabled under artwork at 390px');
  });

  mel('tab2d').click(); await msettle();
  if(uploaded){ mel('btnArtRemove').click(); await msettle(); }
})();

/* ==================================================================
   Retail shelf: units reach the shelf readouts (single source), and the
   facings block stays centred on the shelf at every count (bugfix pass).
   ================================================================== */
await (async () => {
  const shelfInstX = () => {   // distinct world-x of the shelf's facing packs
    const THREE = window.THREE, box = getPivot(), xs = new Set();
    const m = new THREE.Matrix4(), v = new THREE.Vector3();
    box.traverse(o => { if(o.isInstancedMesh){ for(let i = 0; i < o.count; i++){ o.getMatrixAt(i, m); v.setFromMatrixPosition(m).applyMatrix4(o.matrixWorld); xs.add(+v.x.toFixed(1)); } } });
    return [...xs].sort((a, b) => a - b);
  };
  el('units').value = 'mm'; el('units').dispatchEvent(new Event('change')); await settle();
  el('tabShelf').click(); await settle();

  t('shelf units: switching to inches converts the shelf fields + labels (one unit source)', () => {
    try{
      const mmVal = el('shWidth').value, mmUnit = el('uShW').textContent;
      el('units').value = 'in'; el('units').dispatchEvent(new Event('change'));
      const inVal = el('shWidth').value, inUnit = el('uShW').textContent;
      if(mmUnit !== 'mm' || inUnit !== 'in') throw new Error(`unit label did not switch: ${mmUnit}->${inUnit}`);
      if(!(Math.abs(+inVal - +mmVal/25.4) < 0.01)) throw new Error(`shelf width did not convert: ${mmVal}mm -> ${inVal}in`);
    } finally {
      el('units').value = 'mm'; el('units').dispatchEvent(new Event('change'));
    }
  });

  await settle();
  t('shelf facings: the block is centred on the shelf at 1, 2, 3 and an even count', () => {
    const front0 = el('shFront').value, facings0 = el('shFacings').value;
    try{
    el('shFront').value = 'LWH'; el('shFront').dispatchEvent(new Event('change'));
    for(const f of [1, 2, 3, 4]){
      el('shFacings').value = String(f); el('shFacings').dispatchEvent(new Event('input'));
      const xs = shelfInstX();
      if(!xs.length) throw new Error(`no facings rendered at count ${f}`);
      const centre = (xs[0] + xs[xs.length - 1]) / 2;
      if(Math.abs(centre) > 1.0) throw new Error(`facings not centred at ${f}: block centre x=${centre}, xs=${JSON.stringify(xs)}`);
    }
    } finally {   // shelf VIEW state is not the project, but it is still state
      el('shFront').value = front0; el('shFront').dispatchEvent(new Event('change'));
      el('shFacings').value = facings0; el('shFacings').dispatchEvent(new Event('input'));
    }
  });
  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ==================================================================
   Shelf compare — two complete designs, two identical bays.
   The rule under every pin: design B is a SNAPSHOT solved through its own
   chain, and nothing about it may reach design A. A comparison that moves
   A's numbers is not a comparison.
   ================================================================== */
await (async () => {
  const CMP_SLOT = 5;                      // a slot the other pins do not use
  const shelfNums = () => {
    const t = el('shReadout').textContent.replace(/\s+/g, ' ').trim();
    return t;
  };
  /** A's numbers, from every place the app reports them. */
  const aNumbers = () => {
    const row = resolveActiveRow(build.project, build.getRounding(), build.getSelectedCandidateKey());
    return JSON.stringify({
      cases: row.casesPerPallet, pieces: row.piecesPerPallet, cartons: row.cartonsPerPallet,
      cost: row.cost.per1000Packs, board: row.boardAreaM2,
      rows: build.getRows().length, sel: build.getSelectedCandidateKey()
    });
  };
  const cmpCells = () => [...document.querySelectorAll('#shReadout .cmp > div')].map(d => d.textContent.trim());
  const enter = slot => {
    el('shCmpSlot').value = String(slot); fire(el('shCmpSlot'), 'change');
    el('shCompare').click();
  };

  el('tabShelf').click(); await settle();

  t('compare: with no saved design the control says so instead of failing', () => {
    for(let i = 1; i <= 5; i++) save.clearSlot(i);
    el('tabShelf').click();                            // remount the control
    if(!el('shCompare').disabled) throw new Error('Compare must be disabled with no saved designs');
    if(!/saved/i.test(el('shCmpSlot').textContent)) throw new Error('the picker should say there is nothing to compare');
  });

  // save the CURRENT design as B, so both bays describe the same design: any
  // difference between the columns is then a fault in B's independent path,
  // not a difference between two designs
  save.saveToSlot(CMP_SLOT, 'Pinned B', {project: build.project, rounding: build.getRounding(),
                                         selectedCandidate: null, unit: 'mm', palUnit: 'in'});
  el('tabShelf').click(); await settle();

  t('compare: both bays render, and B goes through its own solve to the same answer', () => {
    el('tabShelf').click();
    const single = shelfNums();
    enter(CMP_SLOT);
    // LEAVE COMPARE WHATEVER HAPPENS. Without this, an assertion below threw
    // with compare still on and the NEXT pin's Compare click exited instead of
    // entering — it then measured one bay and reported a scene fault that was
    // not there. A cascade around one real failure is how a suite loses its
    // credibility (CLAUDE.md), and this file has now seen it twice.
    try{
      const cells = cmpCells();
      if(!cells.length) throw new Error('no comparison table');
      // 3 columns x (1 header + 6 rows)
      if(cells.length !== 21) throw new Error(`comparison table is ${cells.length} cells, expected 21`);
      // B is the same design as A, deserialized and solved independently, so
      // every row must agree — a wrong project, a wrong row, or a contaminated
      // cache would show here
      for(let i = 3; i < cells.length; i += 3)
        eq(cells[i + 2], cells[i + 1], `row "${cells[i]}" — B's independent solve vs A:`);
      if(!/A · current/.test(cells[1])) throw new Error('bay A is not labelled');
      if(!/Pinned B/.test(cells[2])) throw new Error("bay B is not labelled with its slot's name");
    } finally { if(el('shCompare').classList.contains('on')) el('shCompare').click(); }
    eq(shelfNums(), single, 'exit restores the single shelf exactly:');
  });

  t('compare: TWO bays are actually built, and exit disposes the second', () => {
    // the readout could be right while the scene is wrong; count the fixtures
    // (base/back/ceiling/label are named 'shelfFixture') on stage
    // buildShelf adds its group synchronously, so no frame wait is needed —
    // and must not be used: an async pin body is unchecked (see t()).
    const fixtures = () => { let n = 0; getPivot().traverse(o => { if(o.name === 'shelfFixture') n++; }); return n; };
    el('tabShelf').click();
    const one = fixtures();
    if(!one) throw new Error('no shelf on stage');
    enter(CMP_SLOT);
    const two = fixtures();
    if(two < one*2) throw new Error(`two bays should roughly double the fixtures: ${one} -> ${two}`);
    el('shCompare').click();
    eq(fixtures(), one, 'exit disposes the second bay:');
  });

  tEdit('compare: A\'s numbers are IDENTICAL before, during and after', () => {
    // THE isolation pin. B is a separate object graph solved through the same
    // pure core; if any part of it wrote to the live project or to build.js's
    // caches, A would move here and nowhere else would notice.
    //
    // A HAS TO DIFFER FROM B ON EVERY ROW for this to bite. Measured: with A
    // and B the same design, a mutation that wrote B's pallet spec straight
    // into the live project passed — the leak was real and invisible, because
    // the value leaked in was the value already there. Shortening A's pallet
    // was not enough either: it moves no SHELF row, so five of the six columns
    // still matched. So A is given a bigger carton (which moves the count, the
    // arrangement, the occupancy, the utilisation and the cost) AND a display
    // perforation (which moves the shelf-ready row), and the fixture refuses
    // to run unless all six really differ.
    build.project.pallet.maxH -= 200;
    // the PRODUCT drives the carton, which is the pack being merchandised: one
    // more piece across resizes it, and every geometric row follows.
    build.project.primary.collation.nx += 1;
    build.recompute(null);
    const cartonGeo = levelGeometry(build.project, 'carton', build.getRounding(), build.getSelectedCandidateKey());
    build.project.secondary.perf = applyPerfPreset('angled', cartonGeo, {enabled: true, state: 'display'});
    build.recompute(null);
    const bPallet = save.loadFromSlot(CMP_SLOT).project.pallet.maxH;
    if(Math.abs(bPallet - build.project.pallet.maxH) < 1)
      throw new Error('vacuous fixture: A and B share a pallet spec, so a leak could not show');
    el('tabShelf').click();
    const before = aNumbers();
    enter(CMP_SLOT);
    try{
      // the fixture, asserted: every comparison row must separate the two
      const cells = cmpCells();
      if(cells.length !== 21) throw new Error(`comparison table is ${cells.length} cells, expected 21`);
      const same = [];
      for(let i = 3; i < cells.length; i += 3) if(cells[i + 1] === cells[i + 2]) same.push(cells[i]);
      if(same.length)
        throw new Error(`vacuous fixture: A and B agree on ${same.join(', ')} — a leak in those rows could not show`);
      // the shelf-ready row states A's FRONT retained height, read off the
      // resolved path. Mutation: reading panels[0] (the back) or never
      // reporting display state keeps A and B different, so the vacuity check
      // above passes — only a pin on the VALUE catches either.
      const geoA = levelGeometry(build.project, 'carton', build.getRounding(), build.getSelectedCandidateKey());
      const frontA = geoA.perf.path.panels.find(x => x.name === 'front');
      const backA = geoA.perf.path.panels.find(x => x.name === 'back');
      const hFront = Math.max(...frontA.pts.map(v => v[1]));
      const hBack = Math.max(...backA.pts.map(v => v[1]));
      if(Math.abs(hFront - hBack) < 1)
        throw new Error('vacuous fixture: front and back retain the same height, so a wrong panel would not show');
      const readyRow = cells[cells.indexOf('Shelf-ready') + 1];
      if(!/display/.test(readyRow)) throw new Error(`A is in display state but the row says "${readyRow}"`);
      if(!readyRow.includes(fmtLen(hFront, 'mm')))
        throw new Error(`the row should state the FRONT retained height ${fmtLen(hFront, 'mm')}: "${readyRow}"`);
      const during = aNumbers();
      eq(during, before, "A's numbers during compare:");
    } finally { if(el('shCompare').classList.contains('on')) el('shCompare').click(); }
    eq(aNumbers(), before, "A's numbers after compare:");
  });

  tEdit('compare: editing A recomputes A only; B holds still', () => {
    enter(CMP_SLOT);
    try{
      const before = cmpCells();
      // a real edit to the live design, and one that reaches the SHELF: the
      // carton's own wall clearance grows the carton, which is the pack being
      // merchandised. (The case's clearance re-solves the chain but leaves the
      // carton — and therefore the shelf — untouched, which is why the first
      // version of this pin reported its own fixture as vacuous.)
      const clr = build.project.secondary.clearance;
      const was = clr.wall;
      clr.wall = was + 12;
      build.recompute();
      const after = cmpCells();
      const col = i => after.filter((_, k) => k % 3 === i);
      if(JSON.stringify(col(1)) === JSON.stringify(before.filter((_, k) => k % 3 === 1)))
        throw new Error('vacuous fixture: the edit did not change A at all');
      eq(JSON.stringify(col(2)), JSON.stringify(before.filter((_, k) => k % 3 === 2)),
         "B's column must not move when A is edited:");
      clr.wall = was;
    } finally { el('shCompare').click(); }
  });

  // AMENDMENT 1: the export goes through the capture composer. One scene per
  // bay, captions from the two designs' own names, the readout in the chrome.
  //
  // AMENDMENT 2 asked for the two bays to be ONE scene, on the reasoning that
  // the composer's blanking assumes a single visible scene. Measured, that
  // premise does not hold: blanking is a FLOOR, not a cap — a capture contains
  // exactly what `show()` turned on, one pivot child or several — so each
  // scene here simply turns on its own bay. (The single-root restructure was
  // built and reverted: it destabilised the headless run, and it bought
  // nothing the descriptor could not say for itself. Reported.)
  //
  // The scoping is pinned where it actually happens: the bays' visibility is
  // sampled AT CAPTURE TIME, through fold3d's per-frame hook, which runs
  // against the capture camera.
  el('tabShelf').click(); enter(CMP_SLOT); await settle();
  let cmpSheet = null, cmpErr = '';
  const seenVis = [];
  // sample only the CAPTURE frames: the hook also runs on every live frame,
  // where both bays are legitimately visible. The capture camera is the one
  // with the sheet cell's aspect, which is how a frame can be told apart.
  const CELL_ASPECT = 660/460;
  const offVis = onFrame(cam => {
    if(!cam || Math.abs(cam.aspect - CELL_ASPECT) > 0.01) return;
    const a = shelfBay('A'), b = shelfBay('B');
    if(a && b) seenVis.push(`${a.group.visible ? 'A' : ''}${b.group.visible ? 'B' : ''}`);
  });
  const cmpBefore = {orbit: JSON.stringify(getOrbit())};
  const grabCmp = e => { e.preventDefault(); cmpSheet = e.detail.sheet; };
  document.addEventListener('comparesheet:composed', grabCmp);
  try{ el('shCmpSheet').click(); await waitFrames(() => !!cmpSheet, 8000); }
  catch(e){ cmpErr = e.message; }
  finally{ document.removeEventListener('comparesheet:composed', grabCmp); offVis(); }
  const bayPosAfter = ['A', 'B'].map(id => { const b = shelfBay(id); return b ? b.group.position.x : null; });
  const bayVisAfter = ['A', 'B'].map(id => { const b = shelfBay(id); return b ? b.group.visible : null; });
  if(el('shCompare').classList.contains('on')) el('shCompare').click();

  t('compare: the export is a 1x2 capture sheet, not a screenshot', () => {
    if(cmpErr) throw new Error(cmpErr);
    if(!cmpSheet) throw new Error('no comparesheet:composed event — the export did not run');
    // 1x2 at the composer's own cell size: two cells across, one row down
    eq(cmpSheet.width, 26*2 + 2*660 + 18, 'sheet width — two cells:');
    eq(cmpSheet.height, 26*2 + 78 + 460 + 34 + 30, 'sheet height — one row:');
    // and it embeds where the PDF pipeline already takes images
    const rec = cmpSheet.jpeg();
    if(!/^data:image\/jpeg;base64,/.test(rec.data)) throw new Error('not an embeddable record');
    eq(rec.w, cmpSheet.width, 'embed width:');
  });

  t('compare: each capture contains ONE bay, sampled at capture time', () => {
    if(!cmpSheet) throw new Error('the export did not run, so this proves nothing');
    if(seenVis.length < 2)
      throw new Error(`the frame hook saw ${seenVis.length} capture frames, expected at least 2`);
    if(seenVis.some(v => v === 'AB'))
      throw new Error('both bays were visible for a capture — the two cells would be identical');
    if(!seenVis.includes('A') || !seenVis.includes('B'))
      throw new Error(`each bay must get its own capture; saw ${[...new Set(seenVis)].join(',') || 'nothing'}`);
  });

  t('compare: the export puts both bays back where it found them', () => {
    if(!cmpSheet) throw new Error('the export did not run, so this proves nothing');
    // each bay is moved to the origin for its own capture, because the camera
    // orbits the origin and a bay left at its aisle offset renders off-centre
    if(bayPosAfter[0] === bayPosAfter[1])
      throw new Error(`both bays came back at ${bayPosAfter[0]} — the aisle offset was not restored`);
    eq(bayVisAfter.join(','), 'true,true', 'both bays visible again:');
    eq(JSON.stringify(getOrbit()), cmpBefore.orbit, 'the live orbit moved:');
  });

  save.clearSlot(CMP_SLOT);
  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ==================================================================
   Shelf compare — front-panel designation and rotation are PER SLOT.
   The isolation pin above asserts B never contaminates A's READOUTS
   (facings, cost, sellable unit) — it says nothing about VIEW STATE, and
   front-panel designation/rotation leaked through exactly that gap: both
   bays used to read the one shared `shelf.front`/`shelf.rot` regardless of
   which project shelfFill was handed. They are per-DESIGN now
   (project.shelf), chosen when a design is saved and restored from its
   slot — never harmonized to whatever the live control currently shows.
   Camera/orbit is deliberately NOT part of this: comparing two packs from
   two different viewpoints is not a comparison, so it stays shared and is
   pinned that way below, not made per-bay alongside front/rot.
   ================================================================== */
await (async () => {
  const PRES_SLOT = 4;                      // a slot the other compare pins do not use
  const enter = slot => { el('shCmpSlot').value = String(slot); fire(el('shCmpSlot'), 'change'); el('shCompare').click(); };
  const exit = () => { if(el('shCompare').classList.contains('on')) el('shCompare').click(); };
  const cmpCells = () => [...document.querySelectorAll('#shReadout .cmp > div')].map(d => d.textContent.trim());
  const setShelfState = (front, rot) => { build.project.shelf.front = front; build.project.shelf.rot = rot; build.recompute(); };
  const packCount = bay => { let n = 0; bay.group.traverse(o => { if(o.isInstancedMesh) n = Math.max(n, o.count); }); return n; };
  const saveSlot = (i, name, proj) => save.saveToSlot(i, name,
    {project: proj, rounding: build.getRounding(), selectedCandidate: null, unit: 'mm', palUnit: 'in'});

  el('tabShelf').click(); await settle();
  const original = {...build.project.shelf};

  // THE FIXTURE. A and B must differ on BOTH axes, or nothing below is
  // falsifiable — a pin that passed with A.front === B.front, or
  // A.rot === B.rot, could not tell "restored independently" from
  // "harmonized to whichever side happens to match." Hand-checked against
  // this file's default project (a6120 100x60x150 carton on a 1000x500x300
  // shelf, measured live, not assumed): front auto/rot 0 -> 50 packs
  // (5 facings x 5 high x 2 deep); front WLH/rot 90 -> 38 packs
  // (19 x 1 x 2) — the two differ, and measured BEFORE trusting either
  // number below.
  const A_FRONT = 'auto', A_ROT = 0;
  const B_FRONT = 'WLH', B_ROT = 90;
  if(A_FRONT === B_FRONT || A_ROT === B_ROT)
    throw new Error('fixture does not differ on both axes — the pins below would prove nothing');
  setShelfState(A_FRONT, A_ROT);
  const A_COUNT = +((el('shReadout').textContent.match(/^(\d+)/) || [])[1] || NaN);
  setShelfState(B_FRONT, B_ROT);
  const B_COUNT = +((el('shReadout').textContent.match(/^(\d+)/) || [])[1] || NaN);
  if(!(A_COUNT > 0) || !(B_COUNT > 0)) throw new Error('fixture broken: no sellable pack on this project');
  if(A_COUNT === B_COUNT)
    throw new Error(`vacuous fixture: A and B both resolve to ${A_COUNT} packs — a swap could not show`);

  // Save B under ITS OWN presentation (still live from the measurement
  // above), independent of whatever A is about to be set to.
  saveSlot(PRES_SLOT, 'Presentation B', build.project);

  // Now give A a DIFFERENT presentation.
  setShelfState(A_FRONT, A_ROT);
  el('tabShelf').click(); await settle();

  t('shelf compare: A unchanged — entering and leaving compare does not alter A\'s front-panel/rotation', () => {
    enter(PRES_SLOT);
    try{
      eq(JSON.stringify(build.project.shelf), JSON.stringify({front: A_FRONT, rot: A_ROT}), 'A\'s project.shelf during compare:');
      eq(el('shFront').value, A_FRONT, 'the control still shows A\'s front:');
      eq(el('shRotVal').textContent, A_ROT + '°', 'the control still shows A\'s rotation:');
    } finally { exit(); }
    eq(JSON.stringify(build.project.shelf), JSON.stringify({front: A_FRONT, rot: A_ROT}), 'A\'s project.shelf after compare:');
  });

  t('shelf compare: B renders with its OWN saved front-panel/rotation, not A\'s (round trip)', () => {
    enter(PRES_SLOT);
    try{
      const cells = cmpCells();
      if(cells.length !== 21) throw new Error(`comparison table is ${cells.length} cells, expected 21`);
      eq(cells[4], `${A_COUNT} cartons`, 'A column, On shelf:');
      eq(cells[5], `${B_COUNT} cartons`, 'B column, On shelf — B\'s own count, not A\'s:');
      // and the SCENE itself — what the export will actually photograph —
      // carries the same two counts, not just the text readout, since the
      // capture takes whatever these groups already contain (see the
      // export pins below).
      eq(packCount(shelfBay('A')), A_COUNT, 'A\'s rendered instance count:');
      eq(packCount(shelfBay('B')), B_COUNT, 'B\'s rendered instance count — B\'s own, not A\'s:');
    } finally { exit(); }
  });

  t('shelf compare: both directions — the non-default presentation can be in EITHER slot', () => {
    // Swap roles: the SLOT now carries the presentation A had a moment ago
    // (A_FRONT/A_ROT), and A is given B's presentation instead. A fix that
    // just made "B always wins" (or "the slot's value always wins") would
    // still pass the round-trip pin above but fail here.
    setShelfState(A_FRONT, A_ROT);
    saveSlot(PRES_SLOT, 'Presentation A-as-slot', build.project);
    setShelfState(B_FRONT, B_ROT);
    enter(PRES_SLOT);
    try{
      const cells = cmpCells();
      if(cells.length !== 21) throw new Error(`comparison table is ${cells.length} cells, expected 21`);
      eq(cells[4], `${B_COUNT} cartons`, 'A column (now holds the non-default presentation):');
      eq(cells[5], `${A_COUNT} cartons`, 'B column (now the default, from its own slot) — not A\'s value:');
    } finally { exit(); }
    // restore PRES_SLOT to B's own (non-default) presentation for the pins
    // below — save it WHILE the project actually holds it, not after
    // resetting A back to default first.
    setShelfState(B_FRONT, B_ROT);
    saveSlot(PRES_SLOT, 'Presentation B', build.project);
    setShelfState(A_FRONT, A_ROT);   // back to A's own presentation
  });

  t('shelf compare: the camera/orbit is ONE shared value — never per-bay', () => {
    enter(PRES_SLOT);
    try{
      if(setOrbit.length !== 3)
        throw new Error(`setOrbit takes ${setOrbit.length} args, expected exactly (rotX, rotY, dist) — no bay parameter to abuse`);
      const before = getOrbit();
      setOrbit(0.11, -0.22, 987);
      eq(JSON.stringify(getOrbit()), JSON.stringify({rotX: 0.11, rotY: -0.22, dist: 987}), 'the one shared orbit updates:');
      // structurally: neither bay carries its own camera/orbit-shaped
      // field — there is nowhere for a per-bay override to even live.
      // Mutate: give a bay object a `.camera`/`.orbit` key and this fails.
      for(const id of ['A', 'B']){
        const bay = shelfBay(id);
        if(!bay) throw new Error(`bay ${id} did not build`);
        for(const k of Object.keys(bay))
          if(/camera|orbit/i.test(k)) throw new Error(`bay ${id} carries its own ${k} — the camera is no longer shared`);
      }
      setOrbit(before.rotX, before.rotY, before.dist);
    } finally { exit(); }
  });

  // EXPORT MATCHES THE SCREEN. compareSheet() builds no geometry of its own —
  // it only toggles visibility/position on the SAME bay groups refreshCompare
  // already built (see its own comment) — so the counts the capture
  // photographs are exactly what's asserted above, sampled again right
  // before the capture to be sure entering compare via the sheet button's
  // own path didn't rebuild anything differently.
  enter(PRES_SLOT);
  let cmpSheet2 = null, cmpErr2 = '';
  const grabCmp2 = e => { e.preventDefault(); cmpSheet2 = e.detail.sheet; };
  document.addEventListener('comparesheet:composed', grabCmp2);
  try{ el('shCmpSheet').click(); await waitFrames(() => !!cmpSheet2, 8000); }
  catch(e){ cmpErr2 = e.message; }
  finally{ document.removeEventListener('comparesheet:composed', grabCmp2); }
  const sceneCountsAtExport = {A: packCount(shelfBay('A')), B: packCount(shelfBay('B'))};
  exit();

  t('shelf compare export: the composed sheet is built from each bay\'s OWN presentation, not a shared one', () => {
    if(cmpErr2) throw new Error(cmpErr2);
    if(!cmpSheet2) throw new Error('no comparesheet:composed event — the export did not run');
    eq(JSON.stringify(sceneCountsAtExport), JSON.stringify({A: A_COUNT, B: B_COUNT}), 'scene state at export time:');
  });

  t('shelf compare at 390px: B keeps its own front-panel/rotation through the real-CSS mobile fixture', () => {
    const mframe = document.getElementById('mobileFixture');
    if(!mframe || !mframe.contentDocument) throw new Error('mobile fixture not available');
    const mdoc = mframe.contentDocument;
    const mel = id => mdoc.getElementById(id);
    const mfire = (node, type) => node.dispatchEvent(new Event(type, {bubbles: true}));
    const mCmpCells = () => [...mdoc.querySelectorAll('#shReadout .cmp > div')].map(d => d.textContent.trim());
    const mCount = () => +((mel('shReadout').textContent.match(/^(\d+)/) || [])[1] || NaN);

    // B: a fresh, explicit project with the non-default presentation,
    // saved through the OUTER page's save.js directly (pure JS/
    // localStorage — the Save-to-slot BUTTON opens a blocking prompt()
    // this harness cannot answer). Deliberately NOT cross-checked against
    // this file's own A_COUNT/B_COUNT: those were measured against the
    // OUTER page's build.project, which earlier pins in this suite have
    // since resized — a real, independent instance, not the same fixture.
    const bProject = newProject();
    bProject.shelf = {front: B_FRONT, rot: B_ROT};
    saveSlot(PRES_SLOT, '390 B', bProject);

    mel('tabShelf').click();
    const aCountBefore = mCount();
    mel('shCmpSlot').value = String(PRES_SLOT); mfire(mel('shCmpSlot'), 'change');
    mel('shCompare').click();
    let bFromCompare;
    try{
      const cells = mCmpCells();
      if(cells.length !== 21) throw new Error(`comparison table at 390px is ${cells.length} cells, expected 21`);
      bFromCompare = cells[5];
      eq(cells[4], `${aCountBefore} cartons`, '390px, A column unaffected by entering compare:');
    } finally { if(mel('shCompare').classList.contains('on')) mel('shCompare').click(); }

    // Cross-check bFromCompare against B's OWN design loaded DIRECTLY (not
    // through compare at all) — B's true single-view rendering, the same
    // "does B match its own independent solve" idiom the desktop isolation
    // pin above uses. #btnSlotLoad triggers no prompt() (only Save-to-slot
    // does), so this is drivable through the real controls.
    mel('slotSel').value = String(PRES_SLOT); mfire(mel('slotSel'), 'change');
    mel('btnSlotLoad').click();
    mel('tabShelf').click();
    const bAlone = `${mCount()} cartons`;
    if(bAlone !== bFromCompare)
      throw new Error(`B via compare read "${bFromCompare}" but B loaded directly reads "${bAlone}" — compare is not showing B's own presentation`);
    if(bAlone === `${aCountBefore} cartons`)
      throw new Error(`fixture vacuous at 390px: B's own count equals A's original count (${aCountBefore}) — cannot tell them apart`);
  });

  save.clearSlot(PRES_SLOT);
  build.project.shelf.front = original.front; build.project.shelf.rot = original.rot;
  build.recompute();
  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ==================================================================
   Material cost — rates x the quantities the chain already solved.
   The point of every pin here: there is ONE cost, derived with the other
   chain values, and the panel / the level readout / the Build column are
   three views of it. A second multiplication anywhere is the bug.
   ================================================================== */
await (async () => {
  setLevel('case'); await settle();
  el('tab2d').click(); await settle();

  const readout = () => {
    const out = {};
    for(const st of document.querySelectorAll('#costReadout .stat'))
      out[st.querySelector('.lab').textContent] = st.querySelector('.val').textContent;
    const n = document.querySelector('#costReadout .bnote');
    out.note = n ? n.textContent : '';
    return out;
  };
  const money = txt => +String(txt).replace(/[$,]/g, '');
  const rowNow = () => resolveActiveRow(build.project, build.getRounding(), build.getSelectedCandidateKey());

  t('cost: the panel is rendered from the chain\'s ONE derivation', () => {
    const r = readout(), row = rowNow();
    if(!row.cost || row.cost.packCost == null) throw new Error('no cost on the resolved row');
    const packLab = Object.keys(r).find(k => /^Material \/ (pack|unit)$/.test(k));
    if(!packLab) throw new Error(`no per-pack readout (got: ${Object.keys(r).join(', ')})`);
    // The rendered ROLL-UP against the pack cost the chain derived. Comparing
    // the two RENDERED figures instead cannot work: the per-pack readout is
    // quantised to a tenth of a cent, which is coarser than the error a wrong
    // roll-up multiplier introduces at that magnitude (measured — a x1024
    // roll-up passed that version of this check). The roll-up is the sharper
    // instrument, so it is the one read.
    const per1000Lab = Object.keys(r).find(k => /1000/.test(k));
    approx(money(r[per1000Lab]), row.cost.packCost*1000, 'the rendered per-1000 is 1000 packs:', 5e-3);
  });

  t('cost: quantity x rate, with the quantity READ from the chain', () => {
    // The one absolute anchor. The quantities come off the row — the chain's
    // own numbers, never re-measured here — and the rates off COST_DEFAULTS.
    // Every term is checked, so a wrong divisor in any of them fails.
    const row = rowNow(), c = row.cost;
    // FIRST: the quantities are the chain's OWN, not ones cost measured for
    // itself. Checking the cost against row.cartonBoardM2 alone cannot see
    // this — both sides move together — so the areas are anchored to numbers
    // that existed before cost did: the Build table's board column for the
    // case, and the rail's own board-area readout for the carton.
    eq(row.caseBoardM2, row.boardAreaM2, 'the case area IS the chain\'s board area:');
    const lvl0 = el('style').value;
    setLevel('carton');
    const shownArea = +(el('area').textContent.match(/[\d.]+/) || [])[0];
    setLevel(lvl0);
    approx(row.cartonBoardM2, shownArea, 'the carton area IS the blank the rail shows:', 5e-4);

    approx(c.perUnit.carton, row.cartonBoardM2*COST_DEFAULTS.cartonBoardPerM2, 'one carton:', 1e-12);
    approx(c.perUnit.case, row.caseBoardM2*COST_DEFAULTS.caseBoardPerM2, 'one case:', 1e-12);
    approx(c.perUnit.film, row.filmKgPerPack*COST_DEFAULTS.filmPerKg, 'film for one pack:', 1e-12);
    approx(c.perPack.carton, c.perUnit.carton/row.packsPerCarton, 'carton share per pack:', 1e-12);
    approx(c.perPack.case, c.perUnit.case/(row.cartonsPerCase*row.packsPerCarton), 'case share per pack:', 1e-12);
    approx(c.perPack.pallet, COST_DEFAULTS.palletPerTrip/row.packsPerPallet, 'pallet share per pack:', 1e-12);
    // ...and the roll-ups put the pallet trip on exactly once
    approx(c.perPallet - (c.packCost - c.perPack.pallet)*row.packsPerPallet,
           COST_DEFAULTS.palletPerTrip, 'one trip per pallet, no more:', 1e-9);
    // the fixture must actually exercise every term
    if(c.missing.includes('carton') || c.missing.includes('case') || c.missing.includes('film'))
      throw new Error(`vacuous fixture: terms missing (${c.missing.join(',')})`);
  });

  t('cost: the RENDERED readout is that same number, not a second one', () => {
    const r = readout(), c = rowNow().cost;
    const packLab = Object.keys(r).find(k => /^Material \/ (pack|unit)$/.test(k));
    const caseLab = Object.keys(r).find(k => /^Material \/ case$/.test(k));
    const palLab = Object.keys(r).find(k => /pallet/i.test(k));
    approx(money(r[packLab]), c.packCost, 'per pack:', 5e-4);
    approx(money(r[caseLab]), c.perCase, 'per case:', 5e-3);
    approx(money(r[palLab]), c.perPallet, 'per pallet:', 0.5);
    // the breakdown names the terms that are actually in the number
    for(const k of c.terms)
      if(!r.note.includes(k)) throw new Error(`the breakdown omits the ${k} term: "${r.note}"`);
  });

  t('cost: the Build column is the rollup for the row it is on', () => {
    const cols = [...document.querySelectorAll('#bTable th')].map(h => h.textContent.replace(/[\u25be\u25b4]/g, '').trim());
    const ci = cols.findIndex(h => /1000 packs/.test(h));
    if(ci < 0) throw new Error(`no cost column (got: ${cols.join(' | ')})`);
    const trs = [...document.querySelectorAll('#bTable tbody tr')];
    if(!trs.length) throw new Error('no candidate rows');
    const sel = trs.find(tr => tr.classList.contains('sel')) || trs[0];
    const shown = money(sel.querySelectorAll('td')[ci].textContent.replace('\u2605', '').trim());
    const sorted = build.sortedRows ? null : null;
    // the row the table highlights is the row every view renders
    approx(shown, rowNow().cost.per1000Packs, 'column vs the resolved row:', 5e-3);
  });

  t('cost: ranking by cost genuinely reorders the candidates', () => {
    // THE point of the column. Rows tied on every count column are not tied
    // on cost, so a count ranking cannot choose between them and a cost
    // ranking can. If this ever stops being true the column is decoration.
    // its OWN fixture: a fresh default project, so the claim is about the
    // feature rather than about whatever state the previous pin left behind
    // (measured: on an inherited state only two candidates tied, 1.5% apart,
    // and the pin read as a failure of the column rather than of the fixture)
    const rows = candidateCases(newProject(), '1mm');
    if(rows.length < 4) throw new Error(`only ${rows.length} candidates`);
    const top = Math.max(...rows.map(r => r.piecesPerPallet || 0));
    const tied = rows.filter(r => (r.piecesPerPallet || 0) === top);
    if(tied.length < 2) throw new Error('vacuous fixture: no two candidates tie on pieces/pallet');
    const costs = tied.map(r => r.cost.per1000Packs);
    const lo = Math.min(...costs), hi = Math.max(...costs);
    if(!(hi > lo*1.05))
      throw new Error(`cost cannot separate the ${tied.length} tied candidates: $${lo.toFixed(2)}..$${hi.toFixed(2)}`);
  });

  tEdit('cost: a rate override moves every dependent number, and resets back', () => {
    const before = rowNow().cost.packCost;
    const beforeShown = readout();
    const packLab = Object.keys(beforeShown).find(k => /^Material \/ (pack|unit)$/.test(k));
    const f = el('cost_filmPerKg');
    if(!f) throw new Error('no film rate field');
    f.value = String(COST_DEFAULTS.filmPerKg*3); fire(f, 'input');
    eq(build.project.cost.filmPerKg, COST_DEFAULTS.filmPerKg*3, 'the override is stored canonically:');
    const after = rowNow().cost;
    approx(after.perUnit.film, rowNow().filmKgPerPack*COST_DEFAULTS.filmPerKg*3, 'film term follows the rate:', 1e-12);
    if(!(after.packCost > before)) throw new Error('the pack cost did not follow the rate');
    approx(money(readout()[packLab]), after.packCost, 'and the RENDERED readout followed:', 5e-4);
    // reset-to-auto: the key is DELETED, absence being the auto state
    fire(f, 'change');                       // commit, so the reset link mounts
    const rst = el('cost_filmPerKg_auto');
    if(!rst) throw new Error('no reset-to-auto control after an override');
    rst.click();
    if('filmPerKg' in build.project.cost)
      throw new Error('reset must DELETE the key — absence IS the auto state');
    approx(rowNow().cost.packCost, before, 'and the cost is back where it started:', 1e-12);
  });

  t('cost: rates store canonically and only the DISPLAY converts', () => {
    // $/m2 stored, $/ft2 shown in an inch project. A converted number written
    // back into the project would be the classic two-units-one-field bug.
    const r = COST_DEFAULTS.cartonBoardPerM2;
    approx(rateToDisplay(r, 'area', 'mm'), r, 'mm shows the canonical rate:', 1e-12);
    approx(rateToDisplay(r, 'area', 'in'), r/FT2_PER_M2, 'inches show per ft2:', 1e-12);
    approx(rateFromDisplay(rateToDisplay(r, 'area', 'in'), 'area', 'in'), r, 'round trip:', 1e-12);
    // mass and per-each rates have no unit system to follow
    approx(rateToDisplay(3.2, 'mass', 'in'), 3.2, 'film stays $/kg in inches:', 1e-12);
    approx(rateToDisplay(12, 'trip', 'in'), 12, 'pallet stays $/trip in inches:', 1e-12);
    if(Math.abs(FT2_PER_M2 - 10.7639) > 0.001)
      throw new Error(`the ft2 factor is wrong: ${FT2_PER_M2}`);
  });

  t('cost: a level absent from the chain contributes no term and says so', () => {
    // The default chain has no tray, so the tray term must be ABSENT and
    // named — never a silent zero that reads like a free tray.
    const c = rowNow().cost;
    const hasTray = build.project.interlayer === 'tray';
    if(hasTray) throw new Error('fixture: the tray is enabled here, this pin needs it off');
    if('tray' in c.perPack) throw new Error('a chain with no tray must not carry a tray term');
    if(!c.missing.includes('tray')) throw new Error('the missing tray term is not reported');
    if(el('cost_trayEach')) throw new Error('the rate panel asks for a tray rate the chain has no use for');
  });
})();

/* ==================================================================
   Phase B follow-up: the U-board's blank area feeds materialCost as its
   OWN term (uboardAreaM2 * uboardBoardPerM2), distinct from carton/case
   board — never a free size change. Without this, enabling a U-board
   changes case and pallet counts (a real, pinned cascade) with no cost
   consequence, which is wrong: more board is more cost. Driven through
   the real chain-strip selector + U-board rail inputs, reading row.cost
   (never re-derived here) — same idiom as the cascade pins above.
   ================================================================== */
await (async () => {
  const snap = snapProject(), lvl = el('style').value, key = build.getSelectedCandidateKey();
  const stripNode2 = label => [...el('chainString').querySelectorAll('.cs-node')]
    .find(n => n.querySelector('.cs-lvl').textContent === label);
  const rowNow = () => resolveActiveRow(build.project, build.getRounding(), build.getSelectedCandidateKey());
  try{
    build.loadProject({project: newProject(), selectedCandidate: null}); await settle();
    setLevel('case'); el('tab2d').click(); await settle();

    t('cost: the default chain (no U-board) carries no uboard term, and says so', () => {
      const c = rowNow().cost;
      if('uboard' in c.perPack) throw new Error('a chain with no U-board must not carry a uboard term');
      if(!c.missing.includes('uboard')) throw new Error('the missing uboard term is not reported');
    });

    const sel = stripNode2('Interlayer').querySelector('select');
    sel.value = 'uboard'; fire(sel, 'change'); await settle();
    setLevel('uboard'); await settle();
    el('ub_caliper').value = '1'; fire(el('ub_caliper'), 'input'); await settle();
    el('ub_f').value = '20'; fire(el('ub_f'), 'input'); await settle();
    const rowLowF = rowNow();

    t('cost: enabling the U-board adds a distinct uboard term = its own blank area x its own rate', () => {
      const c = rowLowF.cost;
      if(!('uboard' in c.perPack)) throw new Error('U-board enabled but no uboard cost term appeared');
      if(c.missing.includes('uboard')) throw new Error('uboard still reported missing while enabled');
      approx(c.perUnit.uboard, rowLowF.uboardAreaM2*COST_DEFAULTS.uboardBoardPerM2, 'uboard unit cost = its own area x its own rate:', 1e-12);
      // NEVER the carton/case rate — the whole point of a separate input
      if(Math.abs(c.perUnit.uboard - rowLowF.uboardAreaM2*COST_DEFAULTS.cartonBoardPerM2) < 1e-9 &&
         COST_DEFAULTS.uboardBoardPerM2 !== COST_DEFAULTS.cartonBoardPerM2)
        throw new Error('uboard cost matches the CARTON board rate, not its own — aliasing suspected');
    });
    // "cost rises / scales with f" is pinned in project.test.html against a
    // LOCKED case: the "best" row here can legitimately RE-SELECT a different
    // candidate once the U-board grows the envelope (the same cascade pinned
    // above for cartons/case and cases/pallet), which can move OTHER cost
    // terms either way — a real effect, not a bug, but it confounds a direct
    // before/after total-cost comparison against the resolved-best row. A
    // locked case has no candidate to re-select, so it isolates the U-board's
    // own additive term cleanly.
  }finally{
    restoreProject(snap, key); if(el('style').value !== lvl) setLevel(lvl);
  }
})();

/* ==================================================================
   Stage background (Grid default / White) + the pallet summary PDF.
   ONE mechanism: White is the renderer's own opaque clear colour, so the
   screen and every capture read the same pixels; the PDF capture sets it
   through the same setStageBackground the toggle uses and hands back
   whatever the user had.
   ================================================================== */
await (async () => {
  setLevel('case'); el('tab3d').click(); el('d_pallet').click(); await settle();

  // corner pixel of the renderer's own readback — the capture IS the screen
  const cornerPixel = async () => {
    const url = capturePNG(1);
    if(!url) return null;
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const c = document.createElement('canvas'); c.width = c.height = 4;
    const g = c.getContext('2d');
    g.clearRect(0, 0, 4, 4);
    g.drawImage(img, 0, 0);
    const d = g.getImageData(1, 1, 1, 1).data;
    return [d[0], d[1], d[2], d[3]];
  };

  const pxGrid = await cornerPixel();
  el('bgWhite').click(); await waitFrames(() => true); await settle();
  const pxWhite = await cornerPixel();
  const whiteSync = {m3: el('bgWhite').classList.contains('on'), sh: el('shBgWhite').classList.contains('on')};
  el('bgGrid').click(); await settle();
  const pxBack = await cornerPixel();

  t('stage background: Grid is default and transparent; White is the capture-visible clear colour', () => {
    // read off the RENDERER'S OWN readback, because that is the one-mechanism
    // claim: what toDataURL sees is what the screen shows. Grid mode clears
    // transparent (the page grid shows through); White clears opaque white.
    if(!pxGrid || !pxWhite || !pxBack) throw new Error('no capture from the 3D canvas');
    if(pxGrid[3] !== 0) throw new Error(`default must be GRID (transparent clear): corner alpha ${pxGrid[3]}`);
    if(!(pxWhite[0] > 250 && pxWhite[1] > 250 && pxWhite[2] > 250 && pxWhite[3] === 255))
      throw new Error(`White must clear to opaque white: corner [${pxWhite.join(',')}]`);
    if(!whiteSync.m3 || !whiteSync.sh)
      throw new Error('the two toolbars\' toggles must reflect the ONE background state');
    if(pxBack[3] !== 0) throw new Error('toggling back to Grid must restore the transparent clear');
  });

  // ---- the PDF: intercept the export event, read the actual bytes ----
  // ...and record the LENS each shot is taken through. captureOrbitPNG runs
  // the per-frame hooks against its own capture camera before rendering, so a
  // hook is the one place a test can see the camera a capture actually used.
  const shots = [];
  const offLens = onFrame(cam => shots.push({fov: cam.fov, dist: cam.position.length()}));
  let pdf = null;
  const grab = e => { e.preventDefault(); pdf = e.detail; };
  document.addEventListener('palletpdf:generated', grab);
  try{ el('btnPdf').click(); }
  finally{ document.removeEventListener('palletpdf:generated', grab); offLens(); }
  const pdfText = pdf ? Array.from(pdf.bytes, b => String.fromCharCode(b)).join('') : '';
  const pxAfter = await cornerPixel();

  t('pallet PDF: the PLAN view is shot through a long lens, so the pallet is in it', () => {
    // THE defect: at the normal 38° lens a 1.4m load seen from overhead is
    // magnified against the deck a metre below it and covers a pallet only 3%
    // wider than itself. Measured by hiding the deck meshes and diffing the
    // capture: the deck contributed ZERO pixels at 38°, and 6285 at 2.2°. So
    // the plan is taken through a narrow lens, which compresses the divergence
    // toward the orthographic projection a plan view is supposed to be.
    if(!shots.length) throw new Error('no capture camera was seen — the frame hook did not run');
    const narrow = shots.filter(s2 => s2.fov < 10);
    if(!narrow.length)
      throw new Error(`no shot used a long lens; fovs seen: ${[...new Set(shots.map(s2 => s2.fov))].join(', ')}`);
    // ...and the FRAMING is unchanged by it: a narrow lens without the matching
    // distance compensation would simply zoom in and crop the load out.
    // tan(fov/2)*distance is the visible half-extent at the subject plane, and
    // it must match the wide shots' — that relation IS the compensation.
    const T = f => Math.tan(f*Math.PI/360);
    const wide = shots.filter(s2 => s2.fov > 30);
    if(!wide.length) throw new Error('no normal-lens shot to compare the framing against');
    const extent = s2 => T(s2.fov)*s2.dist;
    const w0 = Math.max(...wide.map(extent)), n0 = Math.max(...narrow.map(extent));
    if(!(n0 > w0*0.5 && n0 < w0*1.6))
      throw new Error(`the long lens changed the framing: visible extent ${n0.toFixed(0)} vs ${w0.toFixed(0)} — ` +
        'the distance compensation is missing or wrong');
    // the fixture only means anything if the lens really is much narrower
    const nf = Math.min(...narrow.map(s2 => s2.fov)), wf = Math.max(...wide.map(s2 => s2.fov));
    if(!(wf/nf > 4)) throw new Error(`vacuous fixture: lenses too similar (${wf}° vs ${nf}°)`);
  });

  t('pallet PDF: one portrait letter page, three views, the readouts\' own numbers', () => {
    // Reads the EXPORTED bytes (the content stream is uncompressed for exactly
    // this), and takes its expectations from the app's own displayed readouts
    // and resolved row — the sheet must never recompute a number.
    if(!pdf) throw new Error('no palletpdf:generated event — the export did not run');
    if(!/^%PDF-1\.4/.test(pdfText)) throw new Error('not a PDF');
    eq((pdfText.match(/\/Type \/Page(?![s])/g) || []).length, 1, 'exactly one page:');
    if(!pdfText.includes('/MediaBox [0 0 612 792]')) throw new Error('page must be portrait US Letter (612x792pt)');
    eq((pdfText.match(/\/DCTDecode/g) || []).length, 3, 'three captured views embedded:');

    // the pallet readout, verbatim: "60 cases" -> the count must be on the sheet
    const tot = (el('palTot').textContent.match(/(\d+)/) || [])[1];
    if(!tot) throw new Error('no pallet readout to compare against');
    if(!pdfText.includes(`(${tot}) Tj`)) throw new Error(`the readout count ${tot} is not on the sheet`);

    // the case OD — the resolved row's OUTER dims through the app formatter
    const row = resolveActiveRow(build.project, build.getRounding(), build.getSelectedCandidateKey());
    const u = el('units').value;
    const f = v => (+(v/(u === 'mm' ? 1 : 25.4)).toFixed(u === 'mm' ? 0 : 2)).toString();
    const od = row.geo.case.outer;
    const odStr = `${f(od.L)} \u00d7 ${f(od.W)} \u00d7 ${f(od.H)} ${u}`;
    if(!pdfText.includes(`(${odStr})`))
      throw new Error(`case outside dims "${odStr}" not on the sheet`);

    // The date, from the app's OWN stamper. This used to build "today" out of
    // the host clock, which is the very defect core/stamp.js exists to fix: on
    // a UTC machine between 8pm and midnight Eastern the two disagree, and the
    // pin failed for being right (measured, at 00:0x UTC on the 14th against a
    // sheet correctly stamped the 13th). What the zone DOES is pinned on fixed
    // instants beside stamp.js; this only asserts the sheet uses it.
    const iso = dateStamp();
    if(!pdfText.includes(iso)) throw new Error(`generation date ${iso} not on the sheet`);
    // units line follows the app setting
    if(!pdfText.includes(`(All dimensions in ${u})`)) throw new Error('units line missing or wrong');
    // ...and the export hands back the background it found (Grid here)
    if(!pxAfter || pxAfter[3] !== 0)
      throw new Error('the export must restore the stage background it found');
  });

  // ---- the capture honours the per-frame cutaway suppression ----
  // The near-panel hiding is a frame hook: it only ever ran inside the RAF
  // loop, against the ON-SCREEN camera. A synchronous capture that skips it
  // renders whatever visibility the last live frame left behind — the PDF's
  // cutaway came out a closed box with an end gap, open toward a camera
  // nobody was using. The pin: park the LIVE camera at the BACK, then capture
  // from the FRONT — the result must be identical to a capture taken once the
  // live camera has actually been at the front, i.e. the suppression is
  // computed against the CAPTURE camera, never inherited from the live one.
  el('d_case').click();
  if(!el('m3cut').classList.contains('on')) el('m3cut').click();
  await settle();
  const F = HOME_ORBIT, CAP = [F.rotX, F.rotY, 1.35, 320, 260];
  setOrbit(F.rotX, F.rotY + Math.PI, 1.35);            // live camera at the BACK
  await waitFrames(() => true); await settle();        // let the loop suppress for the back
  const capFromBackParked = captureOrbitPNG(...CAP);   // capture from the FRONT
  setOrbit(F.rotX, F.rotY, 1.35);                      // live camera to the front
  await waitFrames(() => true); await settle();
  const capFromFrontParked = captureOrbitPNG(...CAP);  // ground truth: live == capture
  const capBackView = captureOrbitPNG(F.rotX, F.rotY + Math.PI, 1.35, 320, 260);

  t('print capture computes the cutaway suppression against ITS OWN camera', () => {
    if(!capFromBackParked || !capFromFrontParked) throw new Error('no capture from the 3D canvas');
    // the fixture only discriminates if the two angles genuinely render
    // different open faces
    if(capBackView === capFromFrontParked)
      throw new Error('fixture not discriminating: front and back captures are identical');
    if(capFromBackParked !== capFromFrontParked)
      throw new Error('capture inherited the LIVE camera\'s suppression — ' +
        'the walls in the print view were hidden for a camera nobody was using');
  });

  el('tab2d').click(); setLevel('case'); await settle();
})();

/* ================= PERFORATION — 2D dieline, DXF, template ==================
 * Step 2 RENDERS AND EXPORTS what core/perf.js produced; it computes nothing.
 * So every pin here reads what the app actually DREW or WROTE — the rendered
 * SVG, the DXF bytes, the template markup — never a recomputed expectation.
 */
await (async () => {
  // the two levels that can carry a perforation, and the project key each is
  // edited through. The wrap is deliberately absent: it has no perf field.
  const PERF_LEVELS = [['case', 'tertiary'], ['carton', 'secondary']];

  /** Read the DXF back as {layer: [entity, ...]} — what the file SAYS, not
   *  what we think we asked for. */
  function dxfEntities(dxf){
    const L = dxf.split('\r\n'), out = {};
    for(let i = 0; i < L.length - 15; i++){
      if(L[i] !== '0' || L[i + 1] !== 'LINE' || L[i + 2] !== '8') continue;
      const layer = L[i + 3];
      (out[layer] = out[layer] || []).push(L.slice(i + 4, i + 16).join('|'));
    }
    return out;
  }
  const svgNow = () => el('svg').innerHTML;
  const perfGroup = () => el('svg').querySelector('g[data-aux="PERF"]');
  const legendText = () => el('hud2dKeys').textContent;
  /** Every rendered x on the PERF layer, and every rendered x on a VERTICAL
   *  crease — both read out of the DOM the app just painted. */
  const renderedPerfX = () => [...(perfGroup() ? perfGroup().querySelectorAll('polyline') : [])]
    .flatMap(n => n.getAttribute('points').trim().split(/\s+/).map(p => +p.split(',')[0]));
  const renderedCreaseX = () => [...el('svg').querySelectorAll('line')]
    .filter(n => (n.getAttribute('stroke') || '').includes('--crease') &&
                 Math.abs(+n.getAttribute('x1') - +n.getAttribute('x2')) < 1e-6)
    .map(n => +n.getAttribute('x1'));
  const geoAt = lvl => levelGeometry(build.project, lvl, build.getRounding(), build.getSelectedCandidateKey());

  const setPerf = (levelKey, presetId) => {
    const geo = geoAt(levelKey === 'tertiary' ? 'case' : 'carton');
    build.project[levelKey].perf = presetId
      ? applyPerfPreset(presetId, geo, {enabled: true, state: 'display'})
      : {};
    build.recompute(build.getSelectedCandidateKey());
  };

  for(const [level, key] of PERF_LEVELS){
    setLevel(level); el('tab2d').click(); await settle();
    const geo0 = geoAt(level);
    const svg0 = svgNow(), dxf0 = buildDXF(geo0, 'mm'), legend0 = legendText();
    setPerf(key, 'angled-flat'); await settle();
    // `.perf`, NOT the level. A Level also carries `enabled` (the tier flag),
    // so normalizePerf(level) quietly yields a VALID default perforation.
    // Written that way, this pin compared the DXF against a path built from
    // the wrong object and PASSED ON LUCK — the preset it used happens to emit
    // the same five segments as that default. Measured while capturing the
    // entity counts; corrected here, and the preset is now one whose counts
    // differ (25 against 5), so the wrong object can no longer agree.
    const geoOn = geoAt(level), perfOn = build.project[key].perf;
    const svgOn = svgNow(), dxfOn = buildDXF(geoOn, 'mm'), legendOn = legendText();
    setPerf(key, null); await settle();
    const geo1 = geoAt(level);
    const svg1 = svgNow(), dxf1 = buildDXF(geo1, 'mm'), legend1 = legendText();

    t(`perf ${level}: turning it on changes the render and the DXF`, () => {
      if(svgOn === svg0) throw new Error('the dieline did not change');
      if(dxfOn === dxf0) throw new Error('the DXF did not change');
    });
    // BYTE identity, not equivalence. Anchored to the bytes the app produced
    // BEFORE perf was ever switched on in this session.
    t(`perf ${level}: off again is byte-identical, dieline and DXF`, () => {
      eq(geo1.aux, undefined, 'aux must be absent:');
      if(svg1 !== svg0) throw new Error('dieline bytes differ after off');
      if(dxf1 !== dxf0) throw new Error('DXF bytes differ after off');
      eq(legend1, legend0, 'legend text:');
    });
    // LAYER PURITY: perf adds a layer and touches nothing else. The CUT and
    // CREASE entity sets are compared against the perf-OFF file, so a
    // renderer that nudged a crease to make room would fail.
    t(`perf ${level}: CUT and CREASE entities are untouched by perf`, () => {
      const a = dxfEntities(dxf0), b = dxfEntities(dxfOn);
      eq(JSON.stringify(b.CUT), JSON.stringify(a.CUT), 'CUT entities:');
      eq(JSON.stringify(b.CREASE), JSON.stringify(a.CREASE), 'CREASE entities:');
      eq(a.PERF, undefined, 'no PERF with perf off:');
      eq(b.PERF.length, buildPerfPath(geoOn, perfOn).segments.length, 'PERF entity count:');
      eq(Object.keys(b).sort().join(','), 'CREASE,CUT,PERF', 'layers present:');
    });
    // LAYER PURITY ON THE RENDER TOO, not just in the DXF. Strip the aux
    // groups out of the perforated dieline and what is left must be the
    // unperforated one, BYTE for byte — so a renderer that nudged a crease
    // or re-scaled the sheet to make room for the tear line fails here.
    // Mutation: shifting the crease layer by 0.5 when aux is present passes
    // every other pin in this file (the DXF is untouched, and the perf-off
    // render never sees the branch) and fails only this one.
    t(`perf ${level}: the rest of the dieline is byte-identical under the tear line`, () => {
      const stripped = svgOn.replace(/<g\b[^>]*\bdata-aux=[^>]*>[\s\S]*?<\/g>/g, '');
      if(stripped === svgOn) throw new Error('no aux group found to strip');
      if(stripped !== svg0) throw new Error('the drawing under the perf layer moved');
    });
    // LEGEND GATING, from the app's own HUD.
    t(`perf ${level}: the legend gains exactly the layer that is present`, () => {
      if(!legendOn.includes(AUX_LAYERS.PERF.label)) throw new Error(`legend lacks the perf row: "${legendOn}"`);
      if(legendOn.includes(AUX_LAYERS.SCORE_HALF.label))
        throw new Error('legend claims a layer the blank does not carry');
      if(legend0.includes(AUX_LAYERS.PERF.label)) throw new Error('perf row present with perf off');
    });

    setPerf(key, 'angled'); await settle();
    // FLAP SPAN, read off the RENDER: the leftmost perforated x must sit left
    // of the leftmost vertical crease, i.e. out on the joint flap. Both
    // numbers come out of the DOM the app painted.
    t(`perf ${level}: the drawn path crosses the manufacturer's joint flap`, () => {
      const px = renderedPerfX(), cx = renderedCreaseX();
      if(!px.length) throw new Error('no PERF lines rendered');
      if(!cx.length) throw new Error('no vertical creases found to compare against');
      const minP = Math.min(...px), minC = Math.min(...cx);
      if(!(minP < minC - 0.01))
        throw new Error(`perf starts at ${minP.toFixed(2)}, first crease at ${minC.toFixed(2)} — flap not crossed`);
    });
    // DRAW ORDER: a tear line under the cut reads as absent.
    t(`perf ${level}: the perf layer paints after the cut outline`, () => {
      const html = svgNow();
      const cut = html.indexOf('<polygon'), perf = html.indexOf('data-aux="PERF"');
      if(cut < 0 || perf < 0) throw new Error('cut or perf missing from the render');
      if(!(perf > cut)) throw new Error('perf is painted before the cut outline');
    });
    setPerf(key, null); await settle();
  }

  // ---- the exporter owns no tolerance -------------------------------------
  // Vary the BUILDER's chord tolerance and watch the DXF entity count follow.
  // If it doesn't, the exporter is fitting curves of its own, which is the
  // one-polygonisation rule broken.
  setLevel('case'); await settle();
  const gCaseLive = geoAt('case');
  const gCartonLive = geoAt('carton');
  const perfRound = applyPerfPreset('angled-flat', gCaseLive, {enabled: true, state: 'display'});
  // the tolerance pin needs a CURVE, not just fillets: a shallow fillet is
  // held at the minimum-segment floor, where a coarser tolerance changes
  // nothing. The s-curve sides are sampled without a floor.
  const perfCurved = applyPerfPreset('open-front', gCaseLive, {enabled: true, state: 'display'});
  t('perf: the DXF entity count follows the BUILDER\'s chord tolerance', () => {
    const count = tol => dxfEntities(buildDXF({...gCaseLive, aux: perfAux(gCaseLive, perfCurved, {chordTol: tol})}, 'mm')).PERF.length;
    const fine = count(0.01), mid = count(PERF_CHORD_TOL), coarse = count(1.2);
    if(!(fine > mid && mid > coarse))
      throw new Error(`exporter is not transcribing: ${fine} / ${mid} / ${coarse} at 0.01 / ${PERF_CHORD_TOL} / 1.2 mm`);
    // and each one is exactly what the builder handed over — no re-fitting
    eq(mid, buildPerfPath(gCaseLive, perfCurved).segments.length, 'entity count vs builder segments:');
  });

  // ---- the renderer is generic, not a perf renderer ------------------------
  // A layer WITH a map entry and a layer WITHOUT one, neither of them perf.
  const probe = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const bandY = gCaseLive.bbox.maxY*0.5;
  const band = [[gCaseLive.bbox.minX, bandY, gCaseLive.bbox.maxX, bandY]];
  t('aux renderer: a KNOWN non-perf layer renders and gets its own legend row', () => {
    const geo = {...gCaseLive, aux: {SCORE_HALF: band}};
    draw2d(probe, geo, 'mm', '', null);
    const g = probe.querySelector('g[data-aux="SCORE_HALF"]');
    if(!g) throw new Error('SCORE_HALF was not drawn');
    eq(g.querySelectorAll('polyline').length, 1, 'run count:');
