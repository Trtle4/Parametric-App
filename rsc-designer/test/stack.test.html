<!doctype html>
<meta charset="utf-8">
<title>pallet stack model (core/stack.js) tests</title>
<pre id="out">running…</pre>
<script type="module">
/* Unit tests for core/stack.js -- the per-position pallet/slipsheet stack
   model that replaced project.pallet.stacking.doubleStack. DOM-free, pure:
   these construct a bare project shape (pallet.L/W/baseH/tareLb/stack/
   slipsheet/stacking) by hand rather than going through newProject(), so
   every hand-computed expected value in this file is independent of
   whatever newProject()'s own defaults happen to be today. */
import {resolveStack, boxesAboveBottom, baseHeightMM, baseWeightLb, baseFootprintMM,
        BASE_KINDS, STACK_DEFAULTS, PALLET_TARE_LB_DEFAULT, SLIPSHEET_DEFAULTS,
        slipsheetFootprintMM, slipsheetWeightLb,
        CORNER_POST_DEFAULTS, cornerPostConfig, cornerPostHeightMM, cornerPostReachesCaseStack,
        cornerPostSectionAreaMM2, cornerPostWeightLb, cornerPostFootprintGrowthMM,
        cornerPostCostQuantities} from '../src/core/stack.js';
import {stackAnalysis, DERATINGS} from '../src/core/bct.js';

const results = [];
function t(name, fn){ try{ fn(); results.push(`PASS  ${name}`); }catch(e){ results.push(`FAIL  ${name}: ${e.message || e}`); } }
function approx(a, e, msg = '', tol = 1e-9){ if(Math.abs(a - e) > tol) throw new Error(`${msg} expected ${e}, got ${a}`); }
function eq(a, e, msg = ''){ if(JSON.stringify(a) !== JSON.stringify(e)) throw new Error(`${msg} expected ${JSON.stringify(e)}, got ${JSON.stringify(a)}`); }

// A minimal, explicit project shape -- every field this module reads, spelled
// out, so a pin never inherits a value from newProject()'s own defaults.
function proj({baseH = 127, tareLb = 45, positions = STACK_DEFAULTS.positions,
                ssCaliper = 3, ssDensity = 950, ssWeightLb = null, ssL = null, ssW = null,
                palL = 48*25.4, palW = 40*25.4, unitWeightLb = 20, cornerPost = null} = {}){
  return {
    pallet: {
      L: palL, W: palW, baseH, tareLb,
      stack: {positions, cornerPost},
      slipsheet: {caliper: ssCaliper, density: ssDensity, weightLb: ssWeightLb, L: ssL, W: ssW},
      stacking: {ect: 32, unitWeightLb, target: 3.0}
    }
  };
}
const MM_PER_IN = 25.4, KG_PER_LB = 0.45359237;

/* ---- exhaustiveness on BASE_KINDS (same instrument as cookietray.test.html's
   interlayer pins: a default case that refuses to guess, on the ONE set of
   functions allowed to branch on position.base) ---------------------------- */
t('BASE_KINDS exhaustiveness: every declared kind resolves height/weight/footprint without throwing', () => {
  const p = proj();
  for(const kind of BASE_KINDS){
    const pos = {base: kind};
    let threw = null;
    try{ baseHeightMM(pos, p); baseWeightLb(pos, p); baseFootprintMM(pos, p); }catch(e){ threw = e; }
    if(threw) throw new Error(`base:'${kind}' (a declared enum member) threw: ${threw.message}`);
  }
});
t('BASE_KINDS exhaustiveness: an UNDECLARED base throws immediately, never silently resolves', () => {
  const p = proj();
  for(const bogus of ['crate', 'bogus', undefined, '']){
    if(BASE_KINDS.includes(bogus)) continue;
    const pos = {base: bogus};
    for(const fn of [baseHeightMM, baseWeightLb, baseFootprintMM]){
      let threw = null;
      try{ fn(pos, p); }catch(e){ threw = e; }
      if(!threw) throw new Error(`base:${JSON.stringify(bogus)} resolved without throwing in ${fn.name}`);
      if(!/base/i.test(threw.message)) throw new Error(`threw, but the message doesn't name the problem: "${threw.message}"`);
    }
  }
});

/* ---- compression formula: N*layers-1, hand-computed at N=2,3,4 (never the
   expression under test re-run against itself) ----------------------------- */
t('boxesAboveBottom hand-computed: N=1 (baseline, identical to pre-Phase-C layers-1)', () => {
  approx(boxesAboveBottom(9, 1), 8);
});
t('boxesAboveBottom hand-computed: N=2, layers=5 -> 9 (not 8, a bare doubling)', () => {
  approx(boxesAboveBottom(5, 2), 9);
});
t('boxesAboveBottom hand-computed: N=3, layers=4 -> 11', () => {
  approx(boxesAboveBottom(4, 3), 11);
});
t('boxesAboveBottom hand-computed: N=4, layers=3 -> 11', () => {
  approx(boxesAboveBottom(3, 4), 11);
});
t('resolveStack.boxesAboveBottom agrees with the hand-computed formula at N=2,3,4', () => {
  const mk = n => resolveStack(proj({positions: Array.from({length: n}, () => ({base: 'pallet'}))}),
                                {layers: n === 2 ? 5 : n === 3 ? 4 : 3, casesPerLayer: 5, loadH: 300});
  approx(mk(2).boxesAboveBottom, 9, 'N=2, layers=5');
  approx(mk(3).boxesAboveBottom, 11, 'N=3, layers=4');
  approx(mk(4).boxesAboveBottom, 11, 'N=4, layers=3');
});

/* ---- single-stack invariance: N=1 is bit-identical to the pre-Phase-C
   formula for every layer count -- the golden set's own invariance claim,
   restated at the unit level (the golden pins themselves cover the full
   chain; this covers the formula in isolation). --------------------------- */
t('single-stack (N=1) matches layers-1 for a spread of layer counts', () => {
  for(const layers of [0, 1, 2, 5, 9, 20])
    approx(boxesAboveBottom(layers, 1), Math.max(0, layers - 1), `layers=${layers}`);
});

/* ---- tare allocation: all-pallet vs pallet-bottom-slipsheets-above at the
   SAME N -- the load difference must equal exactly the removed pallet tare,
   spread over casesPerLayer. Hand-computed independently of resolveStack's
   own expression. -------------------------------------------------------- */
t('tare allocation: swapping position[1] pallet->slipsheet removes exactly (tareLb - slipsheetLb)/casesPerLayer from the load', () => {
  const casesPerLayer = 5, layers = 4, loadH = 300;
  const allPallet   = proj({positions: [{base: 'pallet'}, {base: 'pallet'}], tareLb: 45});
  const slipAbove   = proj({positions: [{base: 'pallet'}, {base: 'slipsheet'}], tareLb: 45,
                             ssCaliper: 3, ssDensity: 950});
  const fit = {layers, casesPerLayer, loadH};
  const sAll = resolveStack(allPallet, fit);
  const sSlip = resolveStack(slipAbove, fit);
  // hand-computed slipsheet weight: footprint (pallet + 1in/side) x caliper x
  // density, independent of slipsheetWeightLb's own expression -- computed
  // here from the raw geometry, not by calling the function under test.
  const L_m = (48*25.4 + 2*25.4)/1000, W_m = (40*25.4 + 2*25.4)/1000, t_m = 3/1000;
  const ssKg = L_m*W_m*t_m*950, ssLb = ssKg/0.45359237;
  approx(sAll.tareAboveLb, 45, 'all-pallet: position[1] alone contributes its tare');
  approx(sSlip.tareAboveLb, ssLb, 'slipsheet above: position[1] contributes the slipsheet weight instead', 1e-6);

  const aAll  = stackAnalysis({ectLbPerIn: 32, caliperMm: 4, L_mm: 300, W_mm: 200,
                                boxesAbove: sAll.boxesAboveBottom, tareAboveLb: sAll.tareAboveLb,
                                casesPerLayer, unitWeightLb: 20, targetRatio: 3.0, isRSC: true});
  const aSlip = stackAnalysis({ectLbPerIn: 32, caliperMm: 4, L_mm: 300, W_mm: 200,
                                boxesAbove: sSlip.boxesAboveBottom, tareAboveLb: sSlip.tareAboveLb,
                                casesPerLayer, unitWeightLb: 20, targetRatio: 3.0, isRSC: true});
  approx(aAll.boxLoadLb, aSlip.boxLoadLb, 'box load is IDENTICAL -- only the base changed, not the cases');
  const expectedDiff = (45 - ssLb)/casesPerLayer;
  approx(aAll.loadLb - aSlip.loadLb, expectedDiff, 'load difference equals exactly the removed tare, spread over casesPerLayer', 1e-6);
});

/* ---- stack height: per-position bases, mixed pallet/slipsheet, height is
   the SUM of the actual per-position contributions -- never deckMM x N,
   which would be wrong the moment one position isn't deck-height. -------- */
t('totalHeightMM: mixed pallet/slipsheet/pallet sums the ACTUAL per-position heights, not baseH x N', () => {
  const positions = [{base: 'pallet'}, {base: 'slipsheet'}, {base: 'pallet'}];
  const p = proj({positions, baseH: 100, ssCaliper: 3});
  const loadH = 250;
  const s = resolveStack(p, {layers: 4, casesPerLayer: 5, loadH});
  eq(s.baseHeightMM, [100, 3, 100], 'per-position heights: pallet, slipsheet, pallet');
  // the WRONG formula this replaces: baseH(=100) x 3 positions + 3 loads
  const wrongTotal = 100*3 + 3*loadH;
  const rightTotal = (100 + 3 + 100) + 3*loadH;
  approx(s.totalHeightMM, rightTotal, 'sum of real per-position heights + N loads');
  if(Math.abs(s.totalHeightMM - wrongTotal) < 1e-9)
    throw new Error('totalHeightMM must NOT equal the deckMM x N formula this replaces');
});
t('totalHeightMM: single pallet position (N=1) is bit-identical to baseH + loadH', () => {
  const p = proj({positions: [{base: 'pallet'}], baseH: 127});
  const s = resolveStack(p, {layers: 5, casesPerLayer: 5, loadH: 400});
  approx(s.totalHeightMM, 527, 'baseH(127) + loadH(400)');
});

/* ---- footprint: a pallet position uses the pallet's own L/W; a slipsheet
   position uses its own (lipped) footprint -- never assumed deck-sized. -- */
t('baseFootprintMM: pallet position reads pallet.L/W; slipsheet reads its own lipped footprint', () => {
  const p = proj({palL: 1219.2, palW: 1016});
  eq(baseFootprintMM({base: 'pallet'}, p), {L: 1219.2, W: 1016});
  const fp = baseFootprintMM({base: 'slipsheet'}, p);
  approx(fp.L, 1219.2 + 2*25.4, 'slipsheet L = pallet L + 1in/side');
  approx(fp.W, 1016 + 2*25.4, 'slipsheet W = pallet W + 1in/side');
});
t('slipsheet footprint override wins over the auto (pallet + 1in) default', () => {
  const p = proj({ssL: 1300, ssW: 1100});
  const fp = slipsheetFootprintMM(p);
  eq(fp, {L: 1300, W: 1100});
});
t('slipsheet weight override wins over the derived (area x caliper x density) default', () => {
  const p = proj({ssWeightLb: 12.5});
  approx(slipsheetWeightLb(p), 12.5);
});

/* ---- totalWeightLb: the whole stack's weight, for Phase D. Every base's
   own tare (INCLUDING the bottom one, unlike tareAboveLb) plus every load's
   product weight. ---------------------------------------------------------*/
t('totalWeightLb includes every base (bottom included) plus every load\'s own product weight', () => {
  const positions = [{base: 'pallet'}, {base: 'pallet'}];
  const p = proj({positions, tareLb: 45, unitWeightLb: 20});
  const s = resolveStack(p, {layers: 4, casesPerLayer: 5, loadH: 300});
  // 2 pallets x 45 lb + 2 loads x (5*4 cases) x 20 lb/case
  approx(s.totalWeightLb, 2*45 + 2*20*20, 'bottom pallet tare counted here, unlike tareAboveLb');
});

/* ---- defaults / fallbacks ------------------------------------------------ */
t('resolveStack falls back to the single-pallet-position default when pallet.stack is absent', () => {
  const p = proj();
  delete p.pallet.stack;
  const s = resolveStack(p, {layers: 5, casesPerLayer: 5, loadH: 300});
  eq(s.positions, [{base: 'pallet'}]);
  approx(s.boxesAboveBottom, 4);
});
t('baseWeightLb/baseHeightMM fall back to PALLET_TARE_LB_DEFAULT/127 when pallet.tareLb/baseH are absent', () => {
  const p = proj();
  delete p.pallet.tareLb; delete p.pallet.baseH;
  approx(baseWeightLb({base: 'pallet'}, p), PALLET_TARE_LB_DEFAULT);
  approx(baseHeightMM({base: 'pallet'}, p), 127);
});

/* ================================================================
   CORNER POSTS (task: "Corner posts") -- geometry, weight, and the
   compression path. ONE config for the whole stack (see cornerPostConfig's
   own doc in stack.js): the cost formula itself is `4 x positions x rate`,
   never a sum of N independently configured posts, so there is nothing to
   diverge between positions to begin with.
   ================================================================ */

t('cornerPostHeightMM defaults to that load\'s case-stack height (loadH) minus 1in, hand-computed', () => {
  const p = proj({cornerPost: {enabled: true}});
  const loadH = 900;
  approx(cornerPostHeightMM(p, loadH), loadH - MM_PER_IN, 'loadH - 25.4mm exactly');
});
t('cornerPostHeightMM height override wins over the auto (loadH - 1in) default', () => {
  const p = proj({cornerPost: {enabled: true, height: 500}});
  approx(cornerPostHeightMM(p, 900), 500);
});
t('cornerPostReachesCaseStack: false at the default height (1in short, by design), true once raised to meet it', () => {
  const p = proj({cornerPost: {enabled: true}});
  const loadH = 900;
  if(cornerPostReachesCaseStack(p, loadH)) throw new Error('default height (loadH - 1in) must NOT reach the case stack');
  const pTall = proj({cornerPost: {enabled: true, height: loadH}});
  if(!cornerPostReachesCaseStack(pTall, loadH)) throw new Error('height == loadH must reach the case stack');
});
t('cornerPostConfig legL/legW default to 3in each, independently overridable', () => {
  const p = proj({cornerPost: {enabled: true}});
  const cfg = cornerPostConfig(p);
  approx(cfg.legL, 3*MM_PER_IN); approx(cfg.legW, 3*MM_PER_IN);
  const p2 = proj({cornerPost: {enabled: true, legL: 40}});
  const cfg2 = cornerPostConfig(p2);
  approx(cfg2.legL, 40, 'legL overridden'); approx(cfg2.legW, 3*MM_PER_IN, 'legW still auto -- independent');
});

t('cornerPostFootprintGrowthMM is exactly 2 x caliper, at several calipers, zero when off', () => {
  for(const caliper of [1, 3, 5.5, 10]){
    const p = proj({cornerPost: {enabled: true, caliper}});
    approx(cornerPostFootprintGrowthMM(p), 2*caliper, `caliper=${caliper}`);
  }
  approx(cornerPostFootprintGrowthMM(proj({cornerPost: {enabled: false}})), 0, 'disabled -> zero');
  approx(cornerPostFootprintGrowthMM(proj({cornerPost: null})), 0, 'absent -> zero');
});

t('cornerPostWeightLb: hand-computed section-area x height x density / KG_PER_LB, zero when off', () => {
  const legL = 76.2, legW = 76.2, caliper = 3, density = 700, loadH = 900;
  const p = proj({cornerPost: {enabled: true, legL, legW, caliper, density}});
  const h = loadH - MM_PER_IN;
  const areaMM2 = legL*caliper + legW*caliper - caliper*caliper;   // hand-computed, not cornerPostSectionAreaMM2 itself
  const volM3 = (areaMM2/1e6)*(h/1000);
  const expectedLb = (volM3*density)/KG_PER_LB;
  approx(cornerPostWeightLb(p, loadH), expectedLb, '', 1e-9);
  approx(cornerPostWeightLb(proj({cornerPost: {enabled: false}}), loadH), 0, 'disabled -> zero');
});

t('tareAboveLb: corner-post weight joins positions 2..N ONLY -- a single position (N=1) gets ZERO post contribution', () => {
  const p = proj({positions: [{base: 'pallet'}], cornerPost: {enabled: true, height: 900, caliper: 3, density: 700}});
  const off = proj({positions: [{base: 'pallet'}], cornerPost: {enabled: false}});
  const fit = {layers: 4, casesPerLayer: 5, loadH: 900};
  approx(resolveStack(p, fit).tareAboveLb, resolveStack(off, fit).tareAboveLb, 'N=1: tareAboveLb identical posts on/off');
  approx(resolveStack(p, fit).tareAboveLb, 0, 'N=1 all-pallet: tareAboveLb is zero either way (no position above the bottom)');
});
t('tareAboveLb at N=3: hand-computed as (position[1]+position[2] base weight) + 2 x (4 x post weight), position[0] excluded', () => {
  const positions = [{base: 'pallet'}, {base: 'pallet'}, {base: 'pallet'}];
  const cornerPost = {enabled: true, height: 900, legL: 76.2, legW: 76.2, caliper: 3, density: 700};
  const p = proj({positions, tareLb: 45, cornerPost});
  const fit = {layers: 4, casesPerLayer: 5, loadH: 900};
  const s = resolveStack(p, fit);
  const onePostLb = cornerPostWeightLb(p, fit.loadH);
  const expected = 45 + 45 + 2*(4*onePostLb);   // positions[1],[2] base tare + their own 4 posts each
  approx(s.tareAboveLb, expected, '', 1e-9);
  approx(s.cornerPostWeightLb, 4*onePostLb, 'resolveStack exposes the per-position 4-post weight directly');
});
t('totalWeightLb: corner-post weight joins EVERY position, including the bottom (unlike tareAboveLb)', () => {
  const positions = [{base: 'pallet'}, {base: 'pallet'}];
  const cornerPost = {enabled: true, height: 900, legL: 76.2, legW: 76.2, caliper: 3, density: 700};
  const withPosts = proj({positions, tareLb: 45, cornerPost, unitWeightLb: 20});
  const without   = proj({positions, tareLb: 45, cornerPost: {enabled: false}, unitWeightLb: 20});
  const fit = {layers: 4, casesPerLayer: 5, loadH: 900};
  const onePostLb = cornerPostWeightLb(withPosts, fit.loadH);
  const diff = resolveStack(withPosts, fit).totalWeightLb - resolveStack(without, fit).totalWeightLb;
  approx(diff, 2*(4*onePostLb), 'rise = 4 x post weight x positions (N=2)', 1e-9);
});

/* ---- BCT non-contribution, two complementary assertions ----------------
   (a) At a fixed N=1 stack (no position above the bottom, so tareAboveLb is
       zero either way -- pinned above as an absolute value, not just an
       on/off comparison), the full analysis is identical posts on vs off.
   (b) bctLb -- the STRENGTH estimate -- must be a pure function of
       {ectLbPerIn, caliperMm, L_mm, W_mm}, with ZERO dependency on
       tareAboveLb at ANY magnitude, corner-post-driven or not. A "bogus
       strength term" would show up as bctLb moving when only tareAboveLb
       does; this sweeps tareAboveLb from 0 to a large corner-post-scale
       value and requires bctLb to not move at all, so it fails even a
       small strength credit slipped in anywhere tareAboveLb is threaded. */
t('BCT non-contribution (a): N=1 stack, ratio/loadLb/bctLb IDENTICAL with corner posts on vs off', () => {
  const fit = {layers: 6, casesPerLayer: 5, loadH: 900};
  const on  = resolveStack(proj({positions: [{base: 'pallet'}], cornerPost: {enabled: true, height: 900, caliper: 5, density: 900}}), fit);
  const off = resolveStack(proj({positions: [{base: 'pallet'}], cornerPost: {enabled: false}}), fit);
  const analyze = s => stackAnalysis({ectLbPerIn: 32, caliperMm: 4, L_mm: 300, W_mm: 200,
    boxesAbove: s.boxesAboveBottom, tareAboveLb: s.tareAboveLb, casesPerLayer: fit.casesPerLayer,
    unitWeightLb: 20, targetRatio: 3.0, isRSC: true});
  const aOn = analyze(on), aOff = analyze(off);
  approx(aOn.ratio, aOff.ratio, 'ratio');
  approx(aOn.loadLb, aOff.loadLb, 'loadLb');
  approx(aOn.bctLb, aOff.bctLb, 'bctLb');
  eq(DERATINGS.includes('Pallet overhang & misalignment'), true, 'sanity: the static derating list is untouched by this module');
});
t('BCT non-contribution (b): bctLb has ZERO dependency on tareAboveLb, at any magnitude (mutation-resistant)', () => {
  const base = {ectLbPerIn: 32, caliperMm: 4, L_mm: 300, W_mm: 200, boxesAbove: 20, casesPerLayer: 5, unitWeightLb: 20, targetRatio: 3.0, isRSC: true};
  const bctNoTare = stackAnalysis({...base, tareAboveLb: 0}).bctLb;
  const bctBigTare = stackAnalysis({...base, tareAboveLb: 400}).bctLb;   // a corner-post-scale tare
  approx(bctNoTare, bctBigTare, 'bctLb must not move when only tareAboveLb changes');
});

const fails = results.filter(r => r.startsWith('FAIL')).length;
document.getElementById('out').textContent = `${results.length - fails}/${results.length} passed\n\n` + results.join('\n');
window.__tests = {total: results.length, fails, results};
</script>
