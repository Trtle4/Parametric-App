<!doctype html>
<meta charset="utf-8">
<title>pallet pattern tests</title>
<pre id="out">running…</pre>
<script type="module">
/* Unit tests for core/palletpatterns.js — the ranked pallet-pattern
   candidate list (aligned / mixed-strip / pinwheel + interlocked variants).
   DOM-free module; this page is only a runner. Parity assertions pin the
   list against fitInto (containment.js, untouched) so the enumeration can
   never silently drift from the legacy single-layout solves. */
import {palletPatternList, emptyArrangement} from '../src/core/palletpatterns.js';
import {fitInto} from '../src/core/containment.js';
import {newProject, candidateCases, checkLockedCase, applyPatternSelection} from '../src/core/project.js';
import {DERATINGS} from '../src/core/bct.js';

const results = [];
function t(name, fn){
  try{ fn(); results.push(`PASS  ${name}`); }
  catch(e){ results.push(`FAIL  ${name}: ${e.message || e}`); }
}
function eq(actual, expected, msg = ''){
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if(a !== b) throw new Error(`${msg} expected ${b}, got ${a}`);
}
const ok = (cond, msg) => { if(!cond) throw new Error(msg); };
const approx = (a, e, msg = '', tol = 1e-6) => { if(Math.abs(a - e) > tol) throw new Error(`${msg} expected ${e}, got ${a}`); };
const box = (L, W, H, allowed = ['LWH', 'WLH']) => ({outer: {L, W, H}, allowedOrientations: allowed});
const Z = {wall: 0, between: 0};
const stackSig = arr => arr.placements
  .map(p => [p.x.toFixed(2), p.y.toFixed(2), p.z.toFixed(2), p.orientation].join(','))
  .sort().join(';');

/* ---------- the GMA-ish reference combo: 400×300×250 case, 48×40in deck ---------- */
const CASE = box(400, 300, 250);
const DECK = {L: 1219.2, W: 1016, H: 1397};   // 60in budget − 127 base

t('optimal enumerates multiple arrangements (aligned + mixed present)', () => {
  const l = palletPatternList(CASE, DECK, Z, 'optimal');
  ok(l.length >= 5, `expected a real repertoire, got ${l.length}`);
  ok(l.some(c => c.family === 'aligned'), 'no aligned candidates');
  ok(l.some(c => c.family === 'mixed'), 'no mixed candidates');
});

t('ranked by cases/pallet desc, then envelope density desc', () => {
  const l = palletPatternList(CASE, DECK, Z, 'optimal');
  for(let i = 1; i < l.length; i++){
    ok(l[i].total <= l[i-1].total, `total out of order at ${i}`);
    if(l[i].total === l[i-1].total)
      ok(l[i].density <= l[i-1].density + 1e-9, `density tiebreak out of order at ${i}`);
  }
});

t('list[0] matches legacy fitInto optimal (golden-pin parity)', () => {
  const l = palletPatternList(CASE, DECK, Z, 'optimal');
  const old = fitInto(CASE, DECK, Z, 'optimal');
  eq(l[0].total, old.total, 'total');
  eq(l[0].perLayer, old.perLayer, 'perLayer');
  eq(l[0].layers, old.layers, 'layers');
});

t('column list[0] matches legacy fitInto column; family pure', () => {
  const l = palletPatternList(CASE, DECK, Z, 'column');
  const old = fitInto(CASE, DECK, Z, 'column');
  eq(l[0].total, old.total, 'total');
  ok(l.every(c => c.family === 'aligned' && !c.interlock), 'non-aligned or interlocked leaked into column');
});

t('interlock list[0] matches legacy fitInto interlock; all flagged', () => {
  const l = palletPatternList(CASE, DECK, Z, 'interlock');
  const old = fitInto(CASE, DECK, Z, 'interlock');
  eq(l[0].total, old.total, 'total');
  ok(l.every(c => c.interlock), 'straight variant leaked into interlock');
});

t('interlocked variant mirrors odd layers 180° (asymmetric layout)', () => {
  const l = palletPatternList(CASE, DECK, Z, 'interlock');
  // the top mixed layout is asymmetric — its flip is a real turn
  const cand = l.find(c => c.family === 'mixed');
  ok(cand, 'no mixed interlock candidate');
  const arr = cand.build();
  const zs = [...new Set(arr.placements.map(p => p.z))].sort((a, b) => a - b);
  ok(zs.length >= 2, 'needs 2+ layers to interlock');
  const layer = z => arr.placements.filter(p => p.z === z);
  const s0 = layer(zs[0]).map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).sort().join(';');
  const s1 = layer(zs[1]).map(p => `${(-p.x).toFixed(2)},${(-p.y).toFixed(2)}`).sort().join(';');
  eq(s1, s0, 'odd layer is not the 180° turn of layer 0');
});

t('equal-count arrangements are all kept (no count dedupe), geometry all distinct', () => {
  const l = palletPatternList(box(600, 250, 200), {L: 1000, W: 1000, H: 1000}, Z, 'optimal');
  const at25 = l.filter(c => c.total === 25);
  ok(at25.length >= 2, `expected several 25-case layouts, got ${at25.length}`);
  const sigs = l.map(c => stackSig(c.build()));
  eq(new Set(sigs).size, sigs.length, 'geometric duplicates in the list');
});

t('a rotated-strip layout outranks the naive aligned grid (the point)', () => {
  const l = palletPatternList(box(600, 250, 200), {L: 1000, W: 1000, H: 1000}, Z, 'optimal');
  const bestAligned = Math.max(...l.filter(c => c.family === 'aligned').map(c => c.total));
  ok(l[0].total > bestAligned, `non-grid should win: best ${l[0].total} (${l[0].label}) vs aligned ${bestAligned}`);
  ok(l[0].family !== 'aligned', 'winner should not be aligned');
});

t('pinwheel present with a visible central void', () => {
  const l = palletPatternList(box(600, 250, 200), {L: 1000, W: 1000, H: 1000}, Z, 'optimal');
  const pw = l.find(c => c.family === 'pinwheel');
  ok(pw, 'no pinwheel candidate');
  eq(pw.perLayer % 4, 0, 'pinwheel is four rotated blocks');
  const arr = pw.build();
  const layer0 = arr.placements.filter(p => p.z === arr.placements[0].z);
  const covered = layer0.some(p => {
    const rot = p.orientation !== 'LWH';
    const fx = rot ? 250 : 600, fy = rot ? 600 : 250;
    return Math.abs(p.x) < fx/2 && Math.abs(p.y) < fy/2;
  });
  ok(!covered, 'deck centre is covered — the chimney must stay empty');
  // and the four arms really are two orientations, alternating around the rim
  eq([...new Set(layer0.map(p => p.orientation))].sort(), ['LWH', 'WLH'], 'both in-plane orientations');
});

t('density tiebreak: equal-count layouts order tighter-envelope first', () => {
  // scan a few combos for a genuine tie and assert the ordering rule held
  const combos = [
    [box(600, 250, 200), {L: 1000, W: 1000, H: 1000}],
    [CASE, DECK],
    [box(500, 320, 240), {L: 1100, W: 900, H: 1200}]
  ];
  let checked = 0;
  for(const [c, cav] of combos){
    const l = palletPatternList(c, cav, Z, 'optimal');
    for(let i = 1; i < l.length; i++)
      if(l[i].total === l[i-1].total && Math.abs(l[i].density - l[i-1].density) > 1e-9){
        ok(l[i-1].density > l[i].density, 'looser envelope ranked above tighter at a count tie');
        checked++;
      }
  }
  ok(checked > 0, 'no discriminating tie found across combos — tiebreak untested');
});

t('lone orientation (no in-plane rotation) → aligned grid only', () => {
  const l = palletPatternList(box(400, 300, 250, ['LWH']), DECK, Z, 'optimal');
  ok(l.length >= 1, 'grid should fit');
  ok(l.every(c => c.family === 'aligned'), 'rotated constructions need the transposed pair');
  const old = fitInto(box(400, 300, 250, ['LWH']), DECK, Z, 'optimal');
  eq(l[0].total, old.total, 'parity with fitInto under the same limits');
});

t('square footprint degenerates to the one grid', () => {
  const l = palletPatternList(box(300, 300, 250), DECK, Z, 'optimal');
  ok(l.every(c => c.family === 'aligned'), 'turned constructions are identities on a square');
  eq(l.length, 1, 'exactly one distinct layout');
});

t('build() arrangement is fitInto-shape-compatible + consistent', () => {
  const l = palletPatternList(CASE, DECK, Z, 'optimal');
  const arr = l[0].build();
  eq(arr.placements.length, arr.total, 'placement count == total');
  eq(arr.total, arr.perLayer*arr.layers, 'total == perLayer × layers');
  ok(arr.placements.every(p => 'x' in p && 'y' in p && 'z' in p && typeof p.orientation === 'string'), 'placement shape');
  ok(arr.envelope.L <= DECK.L + 1e-9 && arr.envelope.W <= DECK.W + 1e-9, 'envelope exceeds the deck');
  eq(emptyArrangement().total, 0, 'emptyArrangement is the zero fit');
});

/* ---------- deck validity: NO OVERHANG, EVER (the standing invariant) ----------
   Every generated arrangement must sit fully within the deck, and every
   arrangement is centred on it. These are the guards that keep both true as
   patterns are added later — a new construction that overhangs, or that
   forgets to centre, fails here rather than reaching the ranked list.
   NOTE: the shipped constructions are all floor-fitted and self-centred, so
   the rejection is currently non-binding — that is the point of a guard. */

/** The real CHILD footprint of an arrangement (cells carry `between`, the
 *  child does not), measured off the built placements. */
function footprint(cand, L, W){
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for(const p of cand.build().placements){
    const l = p.orientation[0] === 'L' ? L : W, w = p.orientation[1] === 'L' ? L : W;
    minX = Math.min(minX, p.x - l/2); maxX = Math.max(maxX, p.x + l/2);
    minY = Math.min(minY, p.y - w/2); maxY = Math.max(maxY, p.y + w/2);
  }
  return {minX, maxX, minY, maxY, L: maxX - minX, W: maxY - minY,
          cx: (minX + maxX)/2, cy: (minY + maxY)/2};
}

t('INVARIANT: no arrangement extends past the deck (sweep, all families)', () => {
  const EPS = 1e-6;
  let n = 0, fams = new Set();
  for(let L = 200; L <= 760; L += 70) for(let W = 160; W <= 620; W += 65){
    for(const cl of [{wall: 0, between: 0}, {wall: 25, between: 10}]){
      for(const fam of ['optimal', 'column', 'interlock']){
        for(const c of palletPatternList(box(L, W, 220), DECK, cl, fam)){
          const f = footprint(c, L, W);
          fams.add(c.family); n++;
          if(f.minX < -DECK.L/2 - EPS || f.maxX > DECK.L/2 + EPS ||
             f.minY < -DECK.W/2 - EPS || f.maxY > DECK.W/2 + EPS)
            throw new Error(`overhang: ${L}×${W} ${fam} "${c.label}" footprint ${f.L.toFixed(1)}×${f.W.toFixed(1)} on deck ${DECK.L}×${DECK.W}`);
        }
      }
    }
  }
  ok(n > 500, `sweep too thin (${n} arrangements)`);
  // 'sandwich' (Part 2: the split-band-with-a-central-void construction)
  // joins the set here too -- this IS the pin that already proves it never
  // overhangs, across 500+ deck/case/clearance combinations, with no
  // special-casing needed: sandwichLayouts feeds the SAME layouts array
  // every other construction does, so the deck-validity gate above already
  // covered it before this line was even touched.
  eq([...fams].sort(), ['aligned', 'mixed', 'pinwheel', 'sandwich'], 'all four families exercised:');
});

t('INVARIANT: every arrangement is centred on the deck (even margins)', () => {
  const EPS = 1e-6;
  for(let L = 200; L <= 760; L += 70) for(let W = 160; W <= 620; W += 65)
    for(const fam of ['optimal', 'column', 'interlock'])
      for(const c of palletPatternList(box(L, W, 220), DECK, Z, fam)){
        const f = footprint(c, L, W);
        if(Math.abs(f.cx) > EPS || Math.abs(f.cy) > EPS)
          throw new Error(`off-centre: ${L}×${W} ${fam} "${c.label}" centre (${f.cx.toFixed(3)}, ${f.cy.toFixed(3)}) — slack must split evenly`);
      }
});

t('INVARIANT holds through the real chain (row.patternList)', () => {
  const EPS = 1e-6;
  const p = newProject();
  let n = 0;
  for(const r of candidateCases(p, '1mm'))
    for(const c of r.patternList){
      const f = footprint(c, r.outer.L, r.outer.W);
      n++;
      if(f.minX < -p.pallet.L/2 - EPS || f.maxX > p.pallet.L/2 + EPS ||
         f.minY < -p.pallet.W/2 - EPS || f.maxY > p.pallet.W/2 + EPS)
        throw new Error(`chain overhang: ${r.arrangementLabel} "${c.label}"`);
      if(Math.abs(f.cx) > EPS || Math.abs(f.cy) > EPS)
        throw new Error(`chain off-centre: ${r.arrangementLabel} "${c.label}"`);
    }
  ok(n > 0, 'no chain arrangements checked');
});

t('a case larger than the deck yields NO layout (honest "does not fit")', () => {
  for(const [L, W] of [[1500, 1200], [1300, 900], [1219.3, 1015]]){
    for(const fam of ['optimal', 'column', 'interlock']){
      const l = palletPatternList(box(L, W, 200), DECK, Z, fam);
      eq(l.length, 0, `${L}×${W} (${fam}) must produce no arrangement, not an overhanging one:`);
    }
  }
  // ...and it must be REJECTION, not a crash or a clamped/truncated layout
  const one = palletPatternList(box(900, 1100, 200), DECK, Z, 'optimal');
  eq(one.length, 1, 'a case that fits only when turned still yields its one layout:');
  const f = footprint(one[0], 900, 1100);
  ok(f.L <= DECK.L + 1e-6 && f.W <= DECK.W + 1e-6, 'the surviving layout is within the deck');
});

t('oversized case reaches the chain as a zero-count "does not fit" row', () => {
  const p = newProject();
  p.links.find(x => x.parent === 'tertiary').locked = true;
  Object.assign(p.tertiary.params, {L: 1400, W: 1100, H: 300});
  const row = checkLockedCase(p, '1mm');
  eq(row.patternList.length, 0, 'no pattern candidates:');
  eq(row.casesPerLayer, 0, 'casesPerLayer:');
  eq(row.casesPerPallet, 0, 'casesPerPallet:');
  eq(row.cartonsPerPallet, 0, 'cartonsPerPallet:');
  // the row still resolves (no crash) so the UI can render "does not fit"
  ok(row.outer && row.geo, 'row must still carry geometry for the readout');
});

t('allowOverhang opt-in threads through without changing today\'s output', () => {
  const strict = palletPatternList(CASE, DECK, Z, 'optimal');
  const lax = palletPatternList(CASE, DECK, Z, 'optimal', {allowOverhang: true});
  // the shipped constructions are all floor-fitted, so the flag is a no-op
  // today — it exists so the future opt-in needs no generator rework
  eq(lax.map(c => `${c.total}|${c.label}`), strict.map(c => `${c.total}|${c.label}`),
     'flag must not alter the valid set:');
});

/* ---------- chain integration: the ONE list on the row + the selection ---------- */

t('candidateCases rows carry the ranked list; row numbers == list[0]', () => {
  const p = newProject();
  const rows = candidateCases(p, '1mm');
  ok(rows.length > 0, 'no rows');
  ok(rows.every(r => Array.isArray(r.patternList)), 'patternList missing on a row');
  // a candidate whose case doesn't fit the deck at all carries an EMPTY list
  // (and zero counts) — assert on a row that actually palletizes
  const r = rows.find(x => x.casesPerPallet > 0);
  ok(r, 'no fitting row');
  ok(r.patternList.length >= 1, 'fitting row with empty patternList');
  eq(r.casesPerPallet, r.patternList[0].total, 'row headline != ranked best');
  eq(r.casesFit.label, r.patternList[0].label, 'row label != ranked best');
});

t('applyPatternSelection: index 0 is a no-op; index N re-derives together', () => {
  const p = newProject();
  const rows = candidateCases(p, '1mm');
  const r = rows.find(x => x.patternList.length >= 2) || rows[0];
  ok(r.patternList.length >= 2, 'need 2+ patterns to cycle');
  p.pallet.patternIndex = 0;
  ok(applyPatternSelection(r, p) === r, 'index 0 must return the row unchanged');
  p.pallet.patternIndex = 1;
  const adj = applyPatternSelection(r, p);
  ok(adj !== r, 'must be a copy');
  const cand = r.patternList[1];
  eq(adj.casesPerPallet, cand.total, 'casesPerPallet follows the pick');
  eq(adj.cartonsPerPallet, cand.total*r.cartonsPerCase, 'cartonsPerPallet re-multiplied');
  eq(adj.casesFit.label, cand.label, 'label follows');
  eq(adj.arr.cases.placements.length, cand.total, 'render placements follow');
  eq(adj.arr.cases.count, cand.total, 'render count follows');
  ok(adj.piecesPerPallet === (r.piecesPerCarton != null ? r.piecesPerCarton*adj.cartonsPerPallet : r.piecesPerPallet),
     'piecesPerPallet rescaled');
  // the source row is untouched (the Build table keeps ranked-best numbers)
  eq(r.casesPerPallet, r.patternList[0].total, 'source row mutated');
  p.pallet.patternIndex = 0;
});

t('applyPatternSelection clamps a stale index', () => {
  const p = newProject();
  const rows = candidateCases(p, '1mm');
  const r = rows.find(x => x.patternList.length >= 1);
  ok(r, 'no row with patterns');
  p.pallet.patternIndex = 9999;
  const adj = applyPatternSelection(r, p);
  const last = r.patternList[r.patternList.length - 1];
  eq(adj.casesPerPallet, last.total, 'should clamp to the last candidate');
  p.pallet.patternIndex = 0;
});

t('family filter flows through the chain (column strips the mixed layouts)', () => {
  const p = newProject();
  p.pallet.pattern = 'column';
  const rows = candidateCases(p, '1mm');
  ok(rows[0].patternList.every(c => c.family === 'aligned'), 'non-aligned candidate under column');
  p.pallet.pattern = 'interlock';
  const rows2 = candidateCases(p, '1mm');
  ok(rows2[0].patternList.every(c => c.interlock), 'non-interlocked candidate under interlock');
});

/* ================================================================
   CORNER-POST OVERHANG (task: "Corner posts") -- a DIFFERENT condition
   from case overhang above, at a DIFFERENT severity: warn, never reject;
   never touch the BCT derating list; DO feed the trailer footprint
   elsewhere (core/trailer.js — not this module's concern to verify).
   Deliberately NOT reusing the case-overhang deck-validity gate's rejection
   path — that is exactly the bug this task calls out by name.
   ================================================================ */
(() => {
  const POST_CASE = box(400, 300, 250);
  const baseline = palletPatternList(POST_CASE, DECK, Z, 'optimal', {outboardMM: 0});
  const cand0 = baseline[0];
  const marginL = (DECK.L - cand0.envelope.L)/2, marginW = (DECK.W - cand0.envelope.W)/2;
  const marginMin = Math.min(marginL, marginW);
  ok(marginMin > 1, `vacuous fixture: margin too thin to construct clean overhang/clearance calipers (${marginMin.toFixed(3)}mm)`);
  const overhangCaliper = marginMin + 5;         // guaranteed to push the post-inflated footprint past the deck
  const clearCaliper = Math.max(0.25, marginMin/2); // guaranteed to stay within the deck

  t('post overhang: caliper past the margin sets loadOverhang on the SAME candidate that already passed the deck gate', () => {
    const l = palletPatternList(POST_CASE, DECK, Z, 'optimal', {outboardMM: 2*overhangCaliper});
    ok(l.length, 'vacuous fixture: no candidates at all');
    ok(l[0].loadOverhang, `expected loadOverhang to be set at caliper=${overhangCaliper}`);
    ok(l[0].loadOverhang.L > 0 || l[0].loadOverhang.W > 0, 'loadOverhang must name a positive proud amount in at least one dimension');
  });
  t('post overhang: the pallet PATTERN VERDICT is UNCHANGED -- same candidate count and same winning total, warn does not reject', () => {
    const l = palletPatternList(POST_CASE, DECK, Z, 'optimal', {outboardMM: 2*overhangCaliper});
    eq(l.length, baseline.length, 'candidate list length must be identical to the outboardMM:0 baseline');
    eq(l[0].total, cand0.total, 'winning candidate total must be identical');
    eq(l[0].label, cand0.label, 'winning candidate must be the SAME layout, not a different one silently substituted');
  });
  t('post overhang: the BCT derating list is UNCHANGED -- a post standing on the deck is not a cantilever, no strength penalty', () => {
    const beforeJSON = JSON.stringify(DERATINGS);
    const l = palletPatternList(POST_CASE, DECK, Z, 'optimal', {outboardMM: 2*overhangCaliper});
    ok(l[0].loadOverhang, 'vacuous fixture: this candidate must actually be proud to test derating non-interference');
    eq(JSON.stringify(DERATINGS), beforeJSON, 'DERATINGS content must be untouched by exercising the post-overhang path');
    // A candidate carries NO derating field at all -- palletpatterns.js has
    // no mechanism to attach a strength penalty to a candidate, so a caller
    // reading one from here (rather than the static bct.js list) is
    // structurally impossible, not merely untested.
    ok(!('derating' in l[0]) && !('bctDerate' in l[0]), 'a candidate must carry no derating field of any kind');
  });

  t('post overhang: a caliper WITHIN the margin emits NO warning', () => {
    const l = palletPatternList(POST_CASE, DECK, Z, 'optimal', {outboardMM: 2*clearCaliper});
    ok(l.length, 'vacuous fixture');
    eq(l[0].loadOverhang, null, `expected no loadOverhang at caliper=${clearCaliper} (margin=${marginMin.toFixed(3)}mm)`);
  });

  t('case overhang is UNTOUCHED by outboardMM: a case too big for the deck still yields NO layout regardless of corner posts', () => {
    const tooBig = box(1500, 1200, 200);
    for(const outboardMM of [0, 2*overhangCaliper]){
      const l = palletPatternList(tooBig, DECK, Z, 'optimal', {outboardMM});
      eq(l.length, 0, `outboardMM=${outboardMM}: an oversized case must still be rejected, never accepted because posts or a cap happen to be configured`);
    }
  });
})();

/* ================================================================
   PART 1 — interlock becomes a per-layer SCHEDULE (layerFlips), not a
   whole-load boolean. "Migration" here means the refactor from an
   `interlock` boolean to a `layerFlips` array must reproduce today's two
   auto-generated candidates (straight, every-odd-layer) bit-identically;
   there is no project-level boolean field to convert (interlock was only
   ever a per-candidate value, so the golden-parity tests above already
   cover the ranked-list shape). A user-set schedule (the rail's rule, or
   candidate.withSchedule directly) reaches arbitrary per-layer
   arrangements — single-layer, or a tail from some layer up — the old
   boolean never could.
   ================================================================== */

t('MIGRATION: interlock:true reproduces the alternating-odd-layer schedule bit-identically', () => {
  const l = palletPatternList(CASE, DECK, Z, 'interlock');
  const cand = l.find(c => c.family === 'mixed');
  ok(cand, 'no mixed interlock candidate');
  eq(cand.layerFlips, Array.from({length: cand.layers}, (_, ly) => !!(ly & 1)), 'layerFlips must be exactly the alternating schedule:');
  ok(cand.interlock, 'derived interlock boolean must be true');
  eq(cand.warnings, [], 'the auto-generated candidate must never warn on its own:');
});

t('MIGRATION: the straight ("column") candidate reproduces the all-false schedule bit-identically', () => {
  const l = palletPatternList(CASE, DECK, Z, 'column');
  ok(l.length, 'vacuous fixture');
  eq(l[0].layerFlips, new Array(l[0].layers).fill(false), 'layerFlips must be all false:');
  ok(!l[0].interlock, 'derived interlock boolean must be false');
});

t('SCHEDULE: all-false, a single flipped layer, and a flipped tail each produce exactly the requested per-layer arrangement', () => {
  const l = palletPatternList(CASE, DECK, Z, 'optimal');
  const cand = l.find(c => c.family === 'mixed' && !c.interlock);
  ok(cand, 'no straight mixed candidate to schedule against');
  ok(cand.layers >= 3, `vacuous fixture: need >=3 layers, got ${cand.layers}`);
  const straight = cand.build();
  const zs = [...new Set(straight.placements.map(p => p.z))].sort((a, b) => a - b);
  const sigAt = (arr, z, flip) => arr.placements.filter(p => p.z === z)
    .map(p => `${(flip ? -p.x : p.x).toFixed(2)},${(flip ? -p.y : p.y).toFixed(2)}`).sort().join(';');
  const straightSigAt = z => sigAt(straight, z, false);

  // for each schedule, every layer's placements -- UN-flipped when the
  // schedule says it was flipped -- must equal that layer's own straight
  // signature: the direct, hand-computable statement of "the schedule was
  // honoured, layer by layer".
  const check = (label, schedule) => {
    const arr = cand.withSchedule(schedule).build();
    for(let ly = 0; ly < cand.layers; ly++)
      eq(sigAt(arr, zs[ly], !!schedule[ly]), straightSigAt(zs[ly]), `${label}: layer ${ly} (schedule=${schedule[ly]}) placements:`);
  };
  check('all-false', new Array(cand.layers).fill(false));
  const single = new Array(cand.layers).fill(false); single[1] = true;
  check('single true (layer 1 only)', single);
  const tail = new Array(cand.layers).fill(false); for(let ly = 1; ly < cand.layers; ly++) tail[ly] = true;
  check('true tail (every layer from 1 up)', tail);
});

t('WARNING: withSchedule fires the isOwn180 warning when an explicit flip is requested on a self-symmetric layer', () => {
  // every ALIGNED grid is its own 180° turn by construction (a centred grid
  // negates onto itself regardless of count or squareness) -- 'column' is
  // aligned-grids-only, so its list[0] is guaranteed symmetric with no
  // special-case fixture needed.
  const l = palletPatternList(CASE, DECK, Z, 'column');

  const cand = l[0];

  const schedule = new Array(cand.layers).fill(false); schedule[1] = true;

  ok(/180/.test(withFlip.warnings[0]), `warning should mention the 180° turn, got: ${withFlip.warnings[0]}`);
  // and the arrangement really is unchanged from a straight stack, proving

  // order, and order was never a physical claim.

t('withSchedule degrades safely when the schedule length no longer matches the candidate\'s own layer count', () => {

t('LAYER SCHEDULE flows through project.pallet.layerFlips: an override changes the committed row without touching pattern/patternIndex', () => {
  const p = newProject();
  const before = candidateCases(p, '1mm').find(x => x.patternList.length >= 1);
  ok(before, 'no row with patterns');
  const cand = before.patternList.find(c => c.family === 'mixed' && !c.interlock) || before.patternList[0];
  ok(cand.layers >= 2, `vacuous fixture: need >=2 layers, got ${cand.layers}`);
  // point patternIndex AT this exact candidate so chainMetrics/list[0] and
  // this override apply to the SAME layout the test hand-derives against
  p.pallet.patternIndex = before.patternList.indexOf(cand);
  const schedule = new Array(cand.layers).fill(false); schedule[1] = true;
  p.pallet.layerFlips = schedule;
  const after = candidateCases(p, '1mm').find(x => x.patternList.length >= 1);
  const row = applyPatternSelection(after, p);
  eq(row.layerFlips, cand.withSchedule(schedule).layerFlips, 'row.layerFlips must reflect the override:');
  eq(row.casesPerPallet, cand.total, 'count is unaffected by which layers are flipped:');
  p.pallet.layerFlips = null; p.pallet.patternIndex = 0;
});

/* ---------- report ---------- */
/* ================================================================
   PART 2 — sandwiched split band with a central void. stripLayouts always
   puts its short (rotated) block at ONE end of the combined footprint; this
   construction splits the MAJORITY band into two equal halves and puts the
   short band between them -- a genuine rearrangement of the SAME cells
   stripLayouts' own search would find for a matching k, never a different
   count.

   CORRECTION (bands must be flush): the first version of this construction
   pushed the two majority halves flush to the layer's own OUTER edges,
   which put the band-normal (x) leftover as a GAP between each majority
   half and the short band -- a full-depth channel down each side of the
   middle band, not a "central void" at all. Fixed: the three bands sit
   ADJACENT (zero gap), the whole GROUP is centred on the deck (any
   band-normal leftover becomes a margin OUTSIDE the group), and the
   construction's actual void now comes from band-PARALLEL (y) slack: when
   the short band's own length falls short of its neighbours', its cases
   push to both y-ends of the neighbours' length and the shortfall becomes
   ONE void, centred, inside the short band.

   Fixture: case 65x50x100, deck 250x180 (wall 0, between 0) hand-derives
   to a clean small "3+4+3 sandwich" (k=2, rows=3, k1=1, n2u=2, n2v=2,
   n2=4) -- verified against the actual module output before being used as
   a pin, the same discipline every other hand-worked fixture in this file
   follows. rows=3 (majority, pitch CW=50) spans 150mm exactly (its own
   full capacity in the 180mm deck depth); n2v=2 (short band, pitch
   CL=65) spans only 130mm -- 20mm short of the majority's own length,
   split 10mm to each side of the short band's own two flush-pushed rows. */
const SCASE = box(65, 50, 100);
const SDECK = {L: 250, W: 180, H: 1000};

t('SANDWICH: a "3+4+3" instance matches an existing mixed candidate\'s count exactly for the SAME k, and never ranks above the true best', () => {
  const l = palletPatternList(SCASE, SDECK, Z, 'optimal');
  const sw = l.find(c => c.family === 'sandwich' && c.label === '3+4+3 sandwich');
  ok(sw, 'fixture must produce the target sandwich candidate');
  eq(sw.total, 100, 'hand-computed total (k=2 -> n1=6, n2=4, perLayer 10, 10 layers):');
  // the SAME k (n1=6, i.e. perLayer 10) stripLayouts' own search already
  // finds, as a real ranked "6+4 mixed" candidate -- this construction
  // REARRANGES those same cells, it does not invent a new count
  const sameK = l.find(c => c.family === 'mixed' && c.perLayer === sw.perLayer);
  ok(sameK, 'no mixed candidate at the same perLayer to compare against');
  eq(sw.total, sameK.total, 'sandwich total must equal the same-k mixed total exactly:');
  ok(sw.total <= l[0].total, `sandwich (${sw.total}) must never outrank the true ranked best (${l[0].total}):`);
});

t('SANDWICH: majority and short bands are ADJACENT -- zero gap at their shared edge (this is the pin that catches the reported bug)', () => {
  const l = palletPatternList(SCASE, SDECK, Z, 'optimal');
  const sw = l.find(c => c.family === 'sandwich' && c.label === '3+4+3 sandwich');
  ok(sw, 'fixture must produce the target sandwich candidate');
  const arr = sw.build();
  const z0 = [...new Set(arr.placements.map(p => p.z))].sort((a, b) => a - b)[0];
  const layer0 = arr.placements.filter(p => p.z === z0);
  const majorityX = [...new Set(layer0.filter(p => p.orientation === 'LWH').map(p => p.x))].sort((a, b) => a - b);
  eq(majorityX, [-82.5, 82.5], 'the two majority-band columns:');
  const shortX = [...new Set(layer0.filter(p => p.orientation === 'WLH').map(p => p.x))].sort((a, b) => a - b);
  eq(shortX, [-25, 25], 'the short band\'s own two columns:');
  // inner edge of the LEFT majority column (half-length 32.5mm) vs the
  // short band's own LEFT edge (half-width 25mm, its own cell CW=50) --
  // must meet EXACTLY, no gap, no overlap, on BOTH sides.
  const leftMajInner = -82.5 + SCASE.outer.L/2, shortLeftEdge = -25 - SCASE.outer.W/2;
  approx(leftMajInner - shortLeftEdge, 0, 'left shared edge (majority inner vs short band edge):', 1e-9);
  const rightMajInner = 82.5 - SCASE.outer.L/2, shortRightEdge = 25 + SCASE.outer.W/2;
  approx(rightMajInner - shortRightEdge, 0, 'right shared edge (majority inner vs short band edge):', 1e-9);
});

t('SANDWICH: the void sits INSIDE the short band, centred along the band axis (Y) -- hand-computed position and width', () => {
  const l = palletPatternList(SCASE, SDECK, Z, 'optimal');
  const sw = l.find(c => c.family === 'sandwich' && c.label === '3+4+3 sandwich');
  ok(sw, 'fixture must produce the target sandwich candidate');
  const arr = sw.build();
  const z0 = [...new Set(arr.placements.map(p => p.z))].sort((a, b) => a - b)[0];
  const layer0 = arr.placements.filter(p => p.z === z0);
  // majority band: rows=3, pitch CW=50, spans its own full 150mm (already
  // AT bandLength -- an ordinary centred block, no split, no void)
  const majorityY = [...new Set(layer0.filter(p => p.orientation === 'LWH').map(p => p.y))].sort((a, b) => a - b);
  eq(majorityY, [-50, 0, 50], 'majority rows, contiguous (pitch 50, half-width 25 -- no internal gap):');
  // short band: n2v=2, pitch CL=65, pushed to the two Y-ends of the
  // majority's 150mm length (bandLength/2 = 75) instead of centred as one
  // block -- (j+0.5)*65 in from each end: 75-32.5=42.5
  const shortY = [...new Set(layer0.filter(p => p.orientation === 'WLH').map(p => p.y))].sort((a, b) => a - b);
  eq(shortY, [-42.5, 42.5], 'the short band\'s two ROW GROUPS, pushed to the band-length ends:');
  // the void: from the top group's far edge (-42.5 - CL/2 = -75, i.e. the
  // deck-facing edge, so the NEAR edge facing the void is -42.5+32.5=-10)
  // to the bottom group's near edge (42.5-32.5=10) -- ONE 20mm void,
  // centred at y=0 (150 - 130 = 20mm shortfall, split 10/10 to each group).
  const voidLo = -42.5 + SCASE.outer.L/2, voidHi = 42.5 - SCASE.outer.L/2;
  approx(voidHi - voidLo, 20, 'void width (hand-computed shortfall, 150-130):', 1e-9);
  approx((voidLo + voidHi)/2, 0, 'void is centred on the layer\'s own centre:', 1e-9);
  // and it is the ONLY empty span inside the short band's own occupied
  // extent: the two row groups plus the void account for the FULL 150mm
  // majority-band length, with nothing left over.
  const shortBandTop = 42.5 + SCASE.outer.L/2, shortBandBottom = -42.5 - SCASE.outer.L/2;
  approx(shortBandTop - shortBandBottom, 150, 'short band + void together span the full majority length:', 1e-9);
});

t('SANDWICH: band-normal leftover is a margin OUTSIDE the group, symmetric -- never a gap between bands', () => {
  const l = palletPatternList(SCASE, SDECK, Z, 'optimal');
  const sw = l.find(c => c.family === 'sandwich' && c.label === '3+4+3 sandwich');
  ok(sw, 'fixture must produce the target sandwich candidate');
  const f = footprint(sw, SCASE.outer.L, SCASE.outer.W);
  // group width: 2*(k1*CL) + n2u*CW = 2*65 + 2*50 = 230; deck is 250, so a
  // 10mm margin on EACH side, outside the group -- never inside it.
  approx(f.L, 230, 'group footprint width (hand-computed, k*CL + n2u*CW):', 1e-9);
  approx(SDECK.L/2 - f.maxX, 10, 'right-side margin OUTSIDE the group:', 1e-9);
  approx(f.minX - (-SDECK.L/2), 10, 'left-side margin OUTSIDE the group:', 1e-9);
  approx(f.cx, 0, 'the whole group is centred on the deck:', 1e-9);
});

t('SANDWICH: no short band -> no void -> no candidate (a case/deck combo where the neighbouring band lengths match exactly)', () => {
  // 40x30 case, 250x120 deck: rows=floor(120/30)=4 (majority, 120mm), n2v=
  // floor(120/40)=3 (short band, 120mm) -- the two lengths match EXACTLY,
  // so there is nothing to sandwich around. Confirmed non-vacuous: without
  // the length-mismatch gate this combo DOES have a valid k (k=2 -> n2u=5,
  // n2=15, total 23 per layer) -- the gate is refusing a real candidate,
  // not one that could never have existed anyway.
  const NCASE = box(40, 30, 100), NDECK = {L: 250, W: 120, H: 1000};
  const l = palletPatternList(NCASE, NDECK, Z, 'optimal');
  eq(l.filter(c => c.family === 'sandwich').length, 0, 'no sandwich candidate when neighbouring band lengths already match:');
});

t('SANDWICH: count invariance across a spread of instances -- total never exceeds the true ranked best', () => {
  let n = 0;
  for(let CLn = 90; CLn <= 220; CLn += 15) for(let CWn = 60; CWn <= 180; CWn += 15){
    const l = palletPatternList(box(CLn, CWn, 100), {L: 500, W: 400, H: 1000}, Z, 'optimal');
    for(const sw of l.filter(c => c.family === 'sandwich')){
      n++;
      ok(sw.total <= l[0].total, `sandwich total (${sw.total}) exceeds the ranked best (${l[0].total}) at case ${CLn}x${CWn}`);
      const sameK = l.find(c => c.family === 'mixed' && c.perLayer === sw.perLayer);
      ok(sameK, `no same-perLayer mixed candidate to compare against at case ${CLn}x${CWn}`);
      eq(sw.total, sameK.total, `sandwich vs same-k mixed total at case ${CLn}x${CWn}:`);
    }
  }
  ok(n > 10, `sweep too thin to mean anything (${n} sandwich instances)`);
});

t('SANDWICH: the layer is its own 180° turn, and Part 1\'s isOwn180 warning fires when a flip is scheduled on it', () => {
  const l = palletPatternList(SCASE, SDECK, Z, 'optimal');
  const sw = l.find(c => c.family === 'sandwich' && c.label === '3+4+3 sandwich');
  ok(sw, 'fixture must produce the target sandwich candidate');
  ok(sw.layers >= 2, `vacuous fixture: need >=2 layers, got ${sw.layers}`);
  const schedule = new Array(sw.layers).fill(false); schedule[1] = true;
  const withFlip = sw.withSchedule(schedule);
  eq(withFlip.warnings.length, 1, `expected exactly one warning, got ${JSON.stringify(withFlip.warnings)}`);
  ok(/180/.test(withFlip.warnings[0]), `warning should mention the 180° turn, got: ${withFlip.warnings[0]}`);
  eq(stackSig(withFlip.build()), stackSig(sw.build()), 'the no-op flip must not change the arrangement (as a set):');
});

t('MUTATION: restoring the old deck-justified placement (majority flush to the DECK edge, not the short band) fails the adjacency pin while the count pin still passes', () => {
  // The exact formula the reported bug shipped with: majority flush to
  // u = ±(U/2 - (i+0.5)*a) -- the deck's own half-width, not the short
  // band's edge. Same k1/a/n2u/rows the real candidate already solved, so
  // this reconstructs precisely what the buggy build() used to emit.
  const l = palletPatternList(SCASE, SDECK, Z, 'optimal');
  const sw = l.find(c => c.family === 'sandwich' && c.label === '3+4+3 sandwich');
  ok(sw, 'fixture must produce the target sandwich candidate');
  const U = SDECK.L, a = SCASE.outer.L, k1 = 1;                    // hand-derived above (k=2, k1=k/2)
  const oldMajorityX = U/2 - (0 + 0.5)*a;                          // = 250/2 - 32.5 = 92.5
  approx(oldMajorityX, 92.5, 'sanity check on the reconstructed OLD formula:', 1e-9);
  const shortEdge = 25 + SCASE.outer.W/2;                          // short band's own edge, UNCHANGED by this mutation: 50
  const oldMajInner = oldMajorityX - SCASE.outer.L/2;              // 92.5 - 32.5 = 60
  const gap = oldMajInner - shortEdge;
  ok(Math.abs(gap) > 1, `mutation did not actually reopen a gap (gap=${gap}) -- cannot prove the adjacency pin is capable of failing`);
  approx(gap, 10, 'the OLD formula reopens exactly the reported full-depth channel (hand-computed):', 1e-9);
  // meanwhile the candidate's own COUNT is entirely unaffected -- position
  // and count are independent, which is exactly why count alone (the
  // existing "matches an existing mixed candidate" pin above) could never
  // have caught this bug, and the adjacency pin has to exist.
  eq(sw.total, 100, 'count is untouched by this mutation -- position-only bug, count-only pin cannot see it:');
});

t('SANDWICH: no two cases overlap within a layer (the existing footprint/centring invariants above already cover deck bounds and centring unmodified)', () => {
  // A general, family-agnostic overlap check -- position + footprint dims
  // only, exactly footprint()'s own idiom above (orientation[0]==='L'?L:W) --
  // run against sandwich specifically. Needing no sandwich-specific branch
  // here IS the "existing verifier needs no modification" claim; if it did,
  // the construction would be wrong.
  const noOverlap = (placements, L, W) => {
    const rects = placements.map(p => ({
      cx: p.x, cy: p.y,
      hx: (p.orientation[0] === 'L' ? L : W)/2, hy: (p.orientation[1] === 'L' ? L : W)/2
    }));
    for(let i = 0; i < rects.length; i++) for(let j = i + 1; j < rects.length; j++){
      const a = rects[i], b = rects[j];
      if(Math.abs(a.cx - b.cx) < a.hx + b.hx - 1e-6 && Math.abs(a.cy - b.cy) < a.hy + b.hy - 1e-6)
        return false;
    }
    return true;
  };
  let n = 0;
  for(let CLn = 90; CLn <= 220; CLn += 15) for(let CWn = 60; CWn <= 180; CWn += 15){
    const box_ = box(CLn, CWn, 100);
    const l = palletPatternList(box_, {L: 500, W: 400, H: 1000}, Z, 'optimal');
    for(const sw of l.filter(c => c.family === 'sandwich')){
      n++;
      const arr = sw.build();
      const z0 = [...new Set(arr.placements.map(p => p.z))][0];
      ok(noOverlap(arr.placements.filter(p => p.z === z0), CLn, CWn),
         `overlapping cases in sandwich "${sw.label}" at case ${CLn}x${CWn}`);
    }
  }
  ok(n > 10, `sweep too thin to mean anything (${n} sandwich instances)`);
});

const fails = results.filter(r => r.startsWith('FAIL')).length;
document.getElementById('out').textContent =
  `${results.length - fails}/${results.length} passed\n\n` + results.join('\n');
window.__tests = {total: results.length, fails, results};
</script>
