<!doctype html>
<meta charset="utf-8">
<title>save/load tests</title>
<pre id="out">running…</pre>
<script type="module">
/* Unit tests for core/schemaMigrations.js + core/persistence.js — the
   save/load machinery itself, DOM-free (build.js's own DOM round-trip is
   verified separately, live, in the browser).

   test/fixtures/v1/ holds the permanent v1 obligations (committed real save
   files): once shipped, a schema version's shape is frozen — see
   schemaMigrations.js's own comment block for the rule this enforces. This
   page tests the MACHINERY (migration refusal/chain, defaulting + reporting,
   unknown-field preservation, null-vs-undefined) against in-session
   documents, plus one full hand-checked chain round-trip through project.js's
   own math, PLUS every committed v1 fixture: each must load, migrate to
   current, and reproduce its hand-checked chain values forever. */
import {newProject, candidateCases, verticalToOrientations} from '../src/core/project.js';
import {serializeProject, deserializeProject} from '../src/core/persistence.js';
import {CURRENT_SCHEMA_VERSION} from '../src/core/schemaMigrations.js';

const results = [];
function t(name, fn){
  try{ fn(); results.push(`PASS  ${name}`); }
  catch(e){ results.push(`FAIL  ${name}: ${e.message || e}`); }
}
function approx(a, e, msg = ''){ if(Math.abs(a - e) > 1e-9) throw new Error(`${msg} expected ${e}, got ${a}`); }
function eq(a, e, msg = ''){ if(JSON.stringify(a) !== JSON.stringify(e)) throw new Error(`${msg} expected ${JSON.stringify(e)}, got ${JSON.stringify(a)}`); }

/* ---- basic round trip: nothing derived, nothing lost -------------------- */
t('serialize -> JSON -> deserialize reproduces the exact live project', () => {
  const project = newProject();
  const state = {project, rounding: '1mm', selectedCandidate: {nx: 4, ny: 3, nz: 1, orientation: 'LWH'}, unit: 'mm', palUnit: 'in'};
  const doc = serializeProject(state);
  eq(doc.schemaVersion, CURRENT_SCHEMA_VERSION, 'schemaVersion is written first/current:');
  const roundTripped = JSON.parse(JSON.stringify(doc));   // simulates a real file write+read
  const result = deserializeProject(roundTripped);
  eq(result.project, project, 'project is byte-identical:');
  eq(result.rounding, '1mm');
  eq(result.selectedCandidate, {nx: 4, ny: 3, nz: 1, orientation: 'LWH'});
  eq(result.unit, 'mm'); eq(result.palUnit, 'in');
  eq(result.migrationsRun, [], 'current-version file: no migrations run:');
  eq(result.defaulted, [], 'nothing missing: nothing defaulted:');
});

t('the save document has no derived fields (geometry/arrangements/candidate table)', () => {
  const doc = serializeProject({project: newProject(), rounding: '1mm', selectedCandidate: null, unit: 'mm', palUnit: 'in'});
  const json = JSON.stringify(doc);
  // spot-check: none of the derived-only field names candidateCases() rows
  // carry (geo, arr, wrapGeo, cartonOuter, cavity, casesPerPallet, ...)
  // appear anywhere in the saved document
  for(const derivedKey of ['"geo"', '"arr"', '"wrapGeo"', '"cartonOuter"', '"cavity"', '"casesPerPallet"', '"placements"'])
    if(json.includes(derivedKey)) throw new Error(`save document contains a derived field: ${derivedKey}`);
});

/* ---- schema version handling --------------------------------------------*/
t('a file newer than this app supports is refused, naming both versions', () => {
  let threw = null;
  try{ deserializeProject({schemaVersion: CURRENT_SCHEMA_VERSION + 1, project: {}}); }
  catch(e){ threw = e.message; }
  if(!threw) throw new Error('expected a refusal, got none');
  if(!threw.includes(String(CURRENT_SCHEMA_VERSION + 1)) || !threw.includes(String(CURRENT_SCHEMA_VERSION)))
    throw new Error(`refusal message doesn't name both versions: "${threw}"`);
});

t('a file with no schemaVersion at all is refused, not guessed at', () => {
  let threw = null;
  try{ deserializeProject({project: {}}); }
  catch(e){ threw = e.message; }
  if(!threw) throw new Error('expected a refusal, got none');
});

t('a file at exactly the current version passes through with an empty migration log', () => {
  const doc = serializeProject({project: newProject(), rounding: '1mm', selectedCandidate: null, unit: 'mm', palUnit: 'in'});
  const result = deserializeProject(doc);
  eq(result.migrationsRun, []);
});

t('v2 file referencing the removed tray_lid style migrates to tray, params mapped, lidTuckDepth dropped', () => {
  const base = newProject();
  const doc = {
    schemaVersion: 2,
    project: {
      ...base,
      tertiary: {styleId: 'tray_lid', params: {L: 300, W: 200, H: 80, caliper: 3, glueTab: 25, lidTuckDepth: 20},
                 allowedOrientations: ['LWH', 'WLH'], clearance: {wall: 0, between: 0}, enabled: true}
    }
  };
  const result = deserializeProject(doc);
  eq(result.project.tertiary.styleId, 'tray', 'styleId migrated:');
  // fillProjectDefaults fills missing keys against its OWN (fefco201-shaped)
  // template regardless of styleId -- pre-existing, style-agnostic behaviour,
  // unrelated to this migration; it adds harmless unused glue/slot keys here
  eq(result.project.tertiary.params,
     {L: 300, W: 200, H: 80, caliper: 3, cornerFlapDepth: 25, glue: 35, slot: 6}, 'params mapped, lidTuckDepth dropped:');
  if(result.migrationsRun.length < 1 || !result.migrationsRun.some(m => m.startsWith('v2 -> v3')))
    throw new Error('expected a v2->v3 migration step in the log');
});

t('a plain "tray" reference (never tray_lid) round-trips untouched by the v2->v3 migration', () => {
  const base = newProject();
  const doc = {
    schemaVersion: 2,
    project: {
      ...base,
      tertiary: {styleId: 'tray', params: {L: 300, W: 200, H: 80, caliper: 3, cornerFlapDepth: 40},
                 allowedOrientations: ['LWH', 'WLH'], clearance: {wall: 0, between: 0}, enabled: true}
    }
  };
  const result = deserializeProject(doc);
  eq(result.project.tertiary.styleId, 'tray');
  eq(result.project.tertiary.params, {L: 300, W: 200, H: 80, caliper: 3, cornerFlapDepth: 40, glue: 35, slot: 6});
});

/* ---- v3 -> v4: project.interlayer replaces project.tray.enabled ---------
 * The one place Phase A could lose a user's saved work: an old file that had
 * the tray ON must still open with the tray ON. Direct v3 docs (not routed
 * through the v1 fixtures, which exercise this migration only as the LAST
 * of three hops and never with tray.enabled:true at all) — each of the three
 * outcomes on its own. */
t('v3 -> v4: tray.enabled:true migrates to interlayer:\'tray\', and drops tray.enabled', () => {
  const base = newProject();
  const doc = {
    schemaVersion: 3,
    project: {...base, tray: {...base.tray, enabled: true, nCells: 5}}
  };
  const result = deserializeProject(doc);
  eq(result.project.interlayer, 'tray', 'migrated interlayer:');
  if('enabled' in result.project.tray) throw new Error('tray.enabled should have been dropped by the migration');
  eq(result.project.tray.nCells, 5, 'other tray.* fields are untouched:');
  if(!result.migrationsRun.some(m => m.startsWith('v3 -> v4'))) throw new Error('expected a v3->v4 migration step in the log');
});

t('v3 -> v4: tray.enabled:false migrates to interlayer:\'none\'', () => {
  const base = newProject();
  const doc = {
    schemaVersion: 3,
    project: {...base, tray: {...base.tray, enabled: false}}
  };
  const result = deserializeProject(doc);
  eq(result.project.interlayer, 'none', 'migrated interlayer:');
  if('enabled' in result.project.tray) throw new Error('tray.enabled should have been dropped by the migration');
});

t('v3 -> v4: a v3 file with no tray block at all migrates to interlayer:\'none\'', () => {
  const base = newProject();
  const {tray, ...projectWithoutTray} = base;
  const doc = {schemaVersion: 3, project: projectWithoutTray};
  const result = deserializeProject(doc);
  eq(result.project.interlayer, 'none', 'no tray block -> interlayer defaults to none, not thrown at:');
});

/* ---- project.uboard: a genuinely NEW top-level field (Phase B), same
 * treatment as SHELF below — additive, no migration needed, since nothing
 * about an EXISTING field's meaning changed. EVERY v4 file predates it (no
 * v4 file could ever have carried one), so this is not an edge case, it is
 * the NORMAL case for every save written before this feature landed.
 *
 * A v3/v4 file missing tray/uboard resolving interlayer correctly is NOT
 * enough — mountTray/mountUboard both bail out on a falsy project.tray/
 * project.uboard, so if fillProjectDefaults left either field undefined, a
 * user enabling that interlayer on such a file would see a permanently
 * blank, uneditable rail (the chain itself tolerates the gap via
 * `project.X || {}` fallbacks, so nothing crashes — it just silently can't
 * be configured). These pins check the ACTUAL shape landed, not just that
 * loading didn't throw. */
t('a v4 file predating U-board (every real one) gets a real, editable project.uboard on load', () => {
  const base = newProject();
  const {uboard, ...projectWithoutUboard} = base;
  const doc = {schemaVersion: 4, project: projectWithoutUboard};
  const result = deserializeProject(doc);
  if(!result.project.uboard || !result.project.uboard.params)
    throw new Error('project.uboard did not come back as a real, editable object');
  eq(result.project.uboard.params.caliper, 0.9, 'uboard defaults land:');
  if(result.project.uboard.params.f !== null) throw new Error('uboard f should default to auto (null)');
  if(!result.defaulted.includes('uboard')) throw new Error('missing uboard must be reported, not silently filled');
});
t('a v3/v4 file missing project.tray (not just tray.enabled) gets a real, editable project.tray on load', () => {
  const base = newProject();
  const {tray, ...projectWithoutTray} = base;
  const doc = {schemaVersion: 4, project: projectWithoutTray};
  const result = deserializeProject(doc);
  if(!result.project.tray || typeof result.project.tray.nCells !== 'number')
    throw new Error('project.tray did not come back as a real, editable object');
  eq(result.project.tray.nCells, 2, 'tray defaults land:');
  if(!result.defaulted.includes('tray')) throw new Error('missing tray must be reported, not silently filled');
});
t('a v5 file predating the trailer (Phase D) gets a real, editable project.trailer on load', () => {
  const base = newProject();
  const {trailer, ...projectWithoutTrailer} = base;
  const doc = {schemaVersion: 5, project: projectWithoutTrailer};
  const result = deserializeProject(doc);
  if(!result.project.trailer || typeof result.project.trailer.L !== 'number')
    throw new Error('project.trailer did not come back as a real, editable object');
  eq(result.project.trailer.L, 16002, 'trailer defaults land (53\' van interior length):');
  eq(result.project.trailer.maxPayloadLb, 45000, 'trailer defaults land (max payload):');
  if(!result.defaulted.includes('trailer')) throw new Error('missing trailer must be reported, not silently filled');
});
t('mutation check: a bogus tray/uboard default that leaves either field undefined would be caught', () => {
  // proves the two pins above actually discriminate — see CLAUDE.md's own
  // "mutation-test every pin" rule applied inline: construct the WRONG
  // fillProjectDefaults output by hand (the pre-fix behaviour) and confirm
  // it fails the same assertion the real pins make.
  const wrongResultProjectTray = undefined;
  const wrongResultProjectUboard = undefined;
  let threw = 0;
  try{ if(!wrongResultProjectTray || typeof wrongResultProjectTray.nCells !== 'number') throw new Error('x'); }catch(e){ threw++; }
  try{ if(!wrongResultProjectUboard || !wrongResultProjectUboard.params) throw new Error('x'); }catch(e){ threw++; }
  if(threw !== 2) throw new Error('the pre-fix (undefined) shape does not fail these assertions -- they would not have caught the real bug');
});

t('current-schema file round-trips interlayer exactly, no migration runs', () => {
  const project = newProject();
  project.interlayer = 'tray'; project.tray.nCells = 3;
  const doc = serializeProject({project, rounding: '1mm', selectedCandidate: null, unit: 'mm', palUnit: 'in'});
  eq(doc.schemaVersion, CURRENT_SCHEMA_VERSION, 'serialized at the current schema:');
  const result = deserializeProject(JSON.parse(JSON.stringify(doc)));
  eq(result.migrationsRun, [], 'already current: no migration runs:');
  eq(result.project.interlayer, 'tray', 'interlayer round-trips exactly:');
  eq(result.project.tray.nCells, 3);
});

/* ---- v4 -> v5: project.pallet.stack.positions replaces doubleStack ------ */
t('v4 -> v5: stacking.doubleStack:true migrates to two pallet-based positions', () => {
  const base = newProject();
  const doc = {
    schemaVersion: 4,
    project: {...base, pallet: {...base.pallet, stacking: {...base.pallet.stacking, doubleStack: true}}}
  };
  const result = deserializeProject(doc);
  eq(result.project.pallet.stack, {positions: [{base: 'pallet'}, {base: 'pallet'}]}, 'migrated stack:');
  if('doubleStack' in result.project.pallet.stacking) throw new Error('doubleStack should have been dropped by the migration');
  if(!result.migrationsRun.some(m => m.startsWith('v4 -> v5'))) throw new Error('expected a v4->v5 migration step in the log');
});
t('v4 -> v5: stacking.doubleStack:false migrates to the single-position default', () => {
  const base = newProject();
  const doc = {
    schemaVersion: 4,
    project: {...base, pallet: {...base.pallet, stacking: {...base.pallet.stacking, doubleStack: false}}}
  };
  const result = deserializeProject(doc);
  eq(result.project.pallet.stack, {positions: [{base: 'pallet'}]}, 'migrated stack:');
  if('doubleStack' in result.project.pallet.stacking) throw new Error('doubleStack should have been dropped by the migration');
});
t('v4 -> v5: a v4 file with no pallet.stacking at all migrates to the single-position default', () => {
  const base = newProject();
  const {stacking, ...palletWithoutStacking} = base.pallet;
  const doc = {schemaVersion: 4, project: {...base, pallet: palletWithoutStacking}};
  const result = deserializeProject(doc);
  eq(result.project.pallet.stack, {positions: [{base: 'pallet'}]}, 'no stacking block -> single pallet position, not thrown at:');
});

/* ---- missing fields: defaulted AND reported ----------------------------- */
t('a missing field is filled from newProject()\'s default and reported', () => {
  const doc = {schemaVersion: 1, project: {secondary: {styleId: 'a6120', params: {caliper: 0.457}, allowedOrientations: ['LWH', 'WLH']}}};
  const result = deserializeProject(doc);
  eq(result.project.secondary.clearance, newProject().secondary.clearance, 'clearance defaulted to the level default:');
  if(!result.defaulted.includes('secondary.clearance')) throw new Error('missing clearance was not reported as defaulted');
});

t('a wholly-absent top-level level defaults to that level\'s full default object', () => {
  const doc = {schemaVersion: 1, project: {}};
  const result = deserializeProject(doc);
  eq(result.project.primary, newProject().primary);
  eq(result.project.tertiary, newProject().tertiary);
  if(!result.defaulted.includes('primary')) throw new Error('absent "primary" not reported');
});

/* ---- explicit null (a deliberately disabled level) is NEVER defaulted --- */
t('primary: null (bare-envelope / carton-driven mode) is preserved, not defaulted', () => {
  const base = newProject();
  const doc = {schemaVersion: 1, project: {...base, primary: null}};
  const result = deserializeProject(doc);
  if(result.project.primary !== null) throw new Error('a deliberately disabled primary was silently re-enabled');
  if(result.defaulted.some(d => d.startsWith('primary'))) throw new Error('null primary was wrongly reported as defaulted');
});

/* ---- unknown fields ride through the round trip untouched --------------- */
t('a field this schema does not recognize is preserved through the round trip', () => {
  const base = newProject();
  const doc = {schemaVersion: 1, project: {...base, secondary: {...base.secondary, futureField: 'keep-me'}}};
  const result = deserializeProject(doc);
  eq(result.project.secondary.futureField, 'keep-me');
});

/* ---- collation.piece is a discriminated union (box vs cylinder) --------- */
t('a cylinder piece defaults its OWN missing fields, never box L/W/H', () => {
  const doc = {schemaVersion: 1, project: {primary: {collation: {
    piece: {kind: 'cylinder', diameter: 80}, perStack: 1, stackAxis: 'Z', nx: 1, ny: 1, stackGap: 0, pieceGap: 0
  }}}};
  const result = deserializeProject(doc);
  eq(result.project.primary.collation.piece, {kind: 'cylinder', diameter: 80, thickness: 6});
  if(result.defaulted.some(d => d.includes('piece.L') || d.includes('piece.W') || d.includes('piece.H')))
    throw new Error(`box fields leaked into a cylinder piece's defaulted report: ${JSON.stringify(result.defaulted)}`);
});

/* ---- Step 4: optional levels — enabled flags + plain-box content -------- */
t('a level missing "enabled" defaults to true (old save files load unchanged)', () => {
  const base = newProject();
  const doc = {schemaVersion: 1, project: {...base, secondary: {...base.secondary, enabled: undefined}}};
  // JSON round-trip drops the `enabled: undefined` key entirely, exactly
  // like a genuinely older save file that predates the field
  const result = deserializeProject(JSON.parse(JSON.stringify(doc)));
  eq(result.project.secondary.enabled, true);
  if(!result.defaulted.includes('secondary.enabled')) throw new Error('missing enabled was not reported as defaulted');
});

t('a level explicitly disabled (enabled: false) is preserved, not defaulted back to true', () => {
  const base = newProject();
  const doc = {schemaVersion: 1, project: {...base, tertiary: {...base.tertiary, enabled: false}}};
  const result = deserializeProject(doc);
  eq(result.project.tertiary.enabled, false);
  if(result.defaulted.includes('tertiary.enabled')) throw new Error('an explicit false was wrongly reported as defaulted');
});

t('a legacy plain-box content migrates to a Rectangular 1x1 collation, carrying its dims', () => {
  // the "plain box" content type was removed; a simple box envelope is now a
  // Rectangular piece, 1 per stack, 1x1. A loaded box migrates to exactly that,
  // its L/W/H carried over (missing dims filled), and the box field is dropped.
  const base = newProject();
  const doc = {schemaVersion: 1, project: {...base, primary: {...base.primary, collation: undefined, box: {L: 300}}}};
  const result = deserializeProject(JSON.parse(JSON.stringify(doc)));
  const prim = result.project.primary;
  if(prim.box !== undefined) throw new Error('the removed plain-box field should be gone after migration');
  eq(prim.collation.piece, {kind: 'box', L: 300, W: 50, H: 20}, 'box dims carried into a Rect piece:');
  eq(prim.collation.perStack, 1, 'one per stack:');
  eq(prim.collation.nx, 1, 'one across:'); eq(prim.collation.ny, 1, 'one deep:');
});

/* ---- links: element-wise, not an opaque leaf ----------------------------- */
t('a links entry missing a field (e.g. locked) still gets a usable default', () => {
  const base = newProject();
  const doc = {schemaVersion: 1, project: {...base, links: [
    {parent: 'tertiary', child: 'secondary', count: 12, arrangement: 'auto'},   // locked missing
    base.links[1]
  ]}};
  const result = deserializeProject(doc);
  eq(result.project.links[0].locked, false);
  eq(result.project.links[0].count, 12, 'present fields are not clobbered:');
});

/* ---- full hand-checked chain round trip (project.js's own math) --------- */
/* box 90x50x20, perStack 6 Z (env 90x50x120), fin folded, ends 10+3, rect
   girth; 12 cartons @ 4x3x1, wall 1.5 — identical config to golden.json's
   wrap_fin_folded pin, hand-derivation reproduced here so the save/load
   layer is checked against known-correct numbers without depending on a
   committed fixture file. Collation declared explicitly, not inherited from
   newProject()'s default — a pin that inherits a mutable default is not a
   pin (the default changes to a round product; this stays box 90x50x20). */
function chainProject(){
  const p = newProject();
  p.primary.collation = {piece: {kind: 'box', L: 90, W: 50, H: 20}, perStack: 6, stackAxis: 'Z', nx: 1, ny: 1, stackGap: 0, pieceGap: 0};
  p.primary.allowedOrientations = ['LWH'];
  // pinned: 1 envelope/carton, not inherited — links[1] default is about to change
  p.links[1].count = 1; p.links[1].arrangement = 'auto';
  p.links[0].arrangement = {nx: 4, ny: 3, nz: 1};
  return p;
}
t('save -> reload -> load reproduces the exact hand-checked chain', () => {
  const project = chainProject();
  const rowsBefore = candidateCases(project, '1mm');
  const before = rowsBefore.find(r => r.nx === 4 && r.ny === 3 && r.nz === 1 && r.orientation === 'LWH');

  const doc = serializeProject({project, rounding: '1mm', selectedCandidate: {nx: 4, ny: 3, nz: 1, orientation: 'LWH'}, unit: 'mm', palUnit: 'in'});
  const fileText = JSON.stringify(doc);                 // simulates the actual .pkg.json contents
  const reloaded = deserializeProject(JSON.parse(fileText));   // simulates reading it back after a reload

  const rowsAfter = candidateCases(reloaded.project, reloaded.rounding);
  const after = rowsAfter.find(r =>
    r.nx === reloaded.selectedCandidate.nx && r.ny === reloaded.selectedCandidate.ny &&
    r.nz === reloaded.selectedCandidate.nz && r.orientation === reloaded.selectedCandidate.orientation);
  if(!after) throw new Error('selected candidate not found after reload');

  eq(after.wrapOuter, {L: 224.14213562373095, W: 50, H: 120.03}, 'wrap outer (hand-checked); carton follows current 45° lay: L 90+2*(60+10*sin45):');
  eq(after.cartonOuter, {L: 225.914, W: 50.914, H: 122.828}, 'carton outer (hand-checked):');
  eq(after.cavity, {L: 907, W: 156, H: 123}, 'case cavity (hand-checked):');
  eq(after.outer, {L: 913, W: 162, H: 135}, 'case outer (hand-checked):');
  approx(after.boardAreaM2, 0.602919, 'board area (hand-checked):');
  eq([after.casesPerLayer, after.caseLayers, after.casesPerPallet], [7, 10, 70], 'pallet fit (hand-checked):');
  eq(after.cartonsPerPallet, 840); eq(after.piecesPerPallet, 5040);

  // and identical to the pre-save values — the actual round-trip guarantee
  eq(after.wrapOuter, before.wrapOuter, 'identical to pre-save:');
  eq(after.cartonOuter, before.cartonOuter, 'identical to pre-save:');
  eq(after.cavity, before.cavity, 'identical to pre-save:');
  eq(after.outer, before.outer, 'identical to pre-save:');
  eq(after.casesPerPallet, before.casesPerPallet, 'identical to pre-save:');
});

/* ---- item 2: a PINNED facing (not the auto default) survives save/reload,
   as a specific array value — never quietly re-defaulted to the 2-entry
   auto pair. allowedOrientations is a plain array field with no special
   persistence handling (mergeDefaults treats arrays as presence/absence
   only), so this pin is the guarantee that stays true, not a new code path. */
t('a pinned facing (allowedOrientations with ONE entry) survives save -> reload exactly', () => {
  const project = chainProject();
  project.primary.allowedOrientations = verticalToOrientations('H', false, true);   // pinned: WLH only
  eq(project.primary.allowedOrientations, ['WLH'], 'fixture is actually pinned, not auto:');

  const doc = serializeProject({project, rounding: '1mm', selectedCandidate: null, unit: 'mm', palUnit: 'in'});
  const reloaded = deserializeProject(JSON.parse(JSON.stringify(doc)));

  eq(reloaded.project.primary.allowedOrientations, ['WLH'],
    'reloaded value is the exact pinned facing, not the 2-entry auto default:');
});

/* ---- v1 fixtures: permanent obligations ---------------------------------
 * Each committed file in test/fixtures/v1/ must load, migrate to current
 * (trivially — they're already at CURRENT_SCHEMA_VERSION, so the log is
 * empty), and reproduce its hand-checked chain values forever. If a future
 * change cannot preserve one of these, that's a deliberate breaking change
 * to be raised, not silently absorbed by editing the fixture. */
async function tAsync(name, fn){
  try{ await fn(); results.push(`PASS  ${name}`); }
  catch(e){ results.push(`FAIL  ${name}: ${e.message || e}`); }
}
async function loadFixture(path){
  const res = await fetch(path);
  if(!res.ok) throw new Error(`fixture fetch failed: ${path} (${res.status})`);
  return res.json();
}
function findSelected(rows, key){
  return rows.find(r => r.nx === key.nx && r.ny === key.ny && r.nz === key.nz && r.orientation === key.orientation);
}

/* full chain: product(round, 47x12 puck, 3x1 stacks of 2) -> wrap -> carton
   (8 wraps, explicit 1x4x2 — the current default) -> case -> pallet.
   envelope 141x47x24 (H=24 -> jaw 12); carton follows the current 45deg lay, wrap
   outer ~179.14x47x24.03, carton outer ~180.914x188.914x50.828 (1*179.14 x 4*47 x
   2*24.03->50.828), case outer ~190x387x317 (12 cartons auto 1x2x6), 60 cases/pallet. Regenerated when
   the default wrap arrangement changed from 4x2x1 to 1x4x2 — this fixture's
   links[1] matched newProject()'s OLD default exactly, which is exactly the
   inheritance smell to avoid; it's pinned here as its own explicit value,
   independent of whatever newProject() defaults to from here on. */
await tAsync('v1 fixture "full-chain": loads, migrates to current, reproduces its hand-checked chain', async () => {
  const raw = await loadFixture('fixtures/v1/full-chain.pkg.json');
  const result = deserializeProject(raw);
  // this fixture predates schema v2 (finFace rename), v3 (tray_lid
  // removal), v4 (interlayer replaces tray.enabled) and v5 (pallet.stack
  // replaces doubleStack) — it MUST run all four migrations now, not stay
  // "already current": a frozen v1 file whose migration count silently
  // changed would mean a migration stopped applying to it, not that it
  // caught up
  eq(result.migrationsRun.length, 4, 'runs v1->v2 finFace, v2->v3 tray_lid, v3->v4 interlayer, v4->v5 stack:');
  if(!result.migrationsRun[0].startsWith('v1 -> v2')) throw new Error(`unexpected migration: ${result.migrationsRun[0]}`);
  if(!result.migrationsRun[1].startsWith('v2 -> v3')) throw new Error(`unexpected migration: ${result.migrationsRun[1]}`);
  if(!result.migrationsRun[2].startsWith('v3 -> v4')) throw new Error(`unexpected migration: ${result.migrationsRun[2]}`);
  if(!result.migrationsRun[3].startsWith('v4 -> v5')) throw new Error(`unexpected migration: ${result.migrationsRun[3]}`);
  eq(result.project.primary.wrap.params.finFace, 'bottom', 'migrated finFace:');
  // this fixture predates the tray/interlayer feature entirely (no tray.*
  // in the raw file at all) — the v3->v4 migration must still land a real
  // 'none', not leave the field for fillProjectDefaults to guess at.
  eq(result.project.interlayer, 'none', 'migrated interlayer, no tray in the file at all:');
  // this fixture predates openTop, perf, the pallet.stacking (BCT) block,
  // pallet.patternIndex, tray/uboard (this fixture has no tray.* in the raw
  // file at all — the OLDEST possible case for the tray gap: not merely
  // "before Phase B", before the tray feature existed either) and shelf --
  // all genuinely new fields, correctly reported as defaulted (openTop from
  // each level's OWN style, both false here for a6120/fefco201; patternIndex
  // 0 = the ranked best), not silently absent. Order follows each object's
  // own key order in newProject() (secondary declares openTop before perf;
  // tertiary the reverse), not alphabetical or insertion-into-report order —
  // a change to that order elsewhere would be a real, if harmless, thing to
  // notice.
  // pallet.stack is NOT in this list: the v4->v5 migration (which runs
  // BEFORE this defaulting pass, since this fixture predates it) already
  // derives a real pallet.stack from the absent doubleStack, so it is never
  // "missing" by the time fillProjectDefaults looks at it — only tareLb and
  // slipsheet, which that migration never touches, are genuinely new here.
  // pallet.layerFlips (the Part 1 interlock-schedule task): a genuinely new
  // field too, right after patternIndex in newProject()'s own key order —
  // null (no override) is its correct default, same "filled, not silently
  // absent" contract as every other entry here.
  eq(result.defaulted, ['secondary.openTop', 'secondary.perf', 'tertiary.perf', 'tertiary.openTop',
                         'pallet.patternIndex', 'pallet.layerFlips', 'pallet.stacking', 'pallet.tareLb', 'pallet.slipsheet',
                         'tray', 'uboard', 'shelf', 'trailer'],
     'the new openTop/perf/pallet.stacking/patternIndex/layerFlips/tareLb/slipsheet/tray/uboard/shelf/trailer fields are filled:');
  eq(result.project.tray.nCells, 2, 'tray defaulted to a real, editable object (not left undefined):');
  eq(result.project.uboard.params.caliper, 0.9, 'uboard defaulted to a real, editable object (not left undefined):');
  eq(result.project.trailer.L, 16002, 'trailer defaulted to a real, editable 53\' van (not left undefined):');
  eq(result.project.pallet.stack, {positions: [{base: 'pallet'}]}, 'pallet.stack migrated to the single-pallet-position default (absent doubleStack):');
  eq(result.project.secondary.openTop, false, 'defaulted from a6120\'s own style, closed:');
  eq(result.project.tertiary.openTop, false, 'defaulted from fefco201\'s own style, closed:');
  // THE COMPATIBILITY CLAIM, against a REAL prior save (this fixture is a
  // genuine committed v1 file, years older than shelf-compare) rather than
  // a constructed object with the key omitted: a save from before shelf
  // presentation existed opens with the documented default, not whatever
  // the last-viewed design happened to show.
  eq(result.project.shelf, {front: 'auto', rot: 0}, 'pre-existing save defaults shelf presentation to auto/0:');
  const rows = candidateCases(result.project, result.rounding);
  const r = findSelected(rows, result.selectedCandidate);
  if(!r) throw new Error('selected candidate not found in recomputed rows');
  eq(r.arr.pieces.envelope, {L: 141, W: 47, H: 24}, 'envelope (hand-checked):');
  eq(r.wrapOuter, {L: 179.14213562373095, W: 47, H: 24.03}, 'wrap outer (hand-checked, current 45° lay):');
  eq(r.cartonOuter, {L: 180.914, W: 188.914, H: 50.828}, 'carton outer (hand-checked):');
  eq(r.outer, {L: 190, W: 387, H: 317}, 'case outer (hand-checked):');
  eq(r.casesPerPallet, 60, 'cases per pallet (hand-checked):');
});
