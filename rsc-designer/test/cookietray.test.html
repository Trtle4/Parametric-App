<meta charset="utf-8">
<title>cookie tray arithmetic tests</title>
<pre id="out">running…</pre>
<script type="module">
/* Unit tests for core/cookietray.js — the arithmetic ported from the real
   Cookie-Tray app (trtle4.github.io/Cookie-Tray), a client-side SPA with no
   public source repo. There is no live oracle to run: the port is instead
   READ directly out of the deployed production JS bundle (its minified
   trayParams/deriveTrayParams/product-placement functions), and cross-
   checked NUMERICALLY against a real share link — the exact
   `?cl=48&cr=2.5&nc=2&pkm=stack&qty=7&cpc=2` link a user supplied — which
   this port reproduces exactly (cellLen=48, cradleR=2.5, cellH=28; see
   cookietray.js's own header for the full derivation). An earlier version of
   this file carried a "DIFFERENTIAL: matches the upstream Python" fixture
   (`cookietray.vectors.json`, claiming to run against `cookie_tray/params.py`
   + `calculator.py`) — that Python source was never real; the actual app has
   no Python anywhere in it. The fixture and its three pins have been removed
   rather than reconciled, since no upstream Python exists to reconcile them
   against.

   NOTE: the OCC/replicad SOLID modelling the real app also does is
   deliberately NOT ported (no CSG kernel here, and a thermoformed tray has
   no dieline at all), so there is nothing here about lofts, booleans, or
   STEP. */
import {trayParams, deriveTrayParams, trayOuter, isProud,
        TRAY_DEFAULTS, MIN_WALL, MIN_DIVIDER} from '../src/core/cookietray.js';
import {newProject, resolveActiveRow, INTERLAYERS} from '../src/core/project.js';
import {collate} from '../src/core/collation.js';
import {parseTrayLink, buildTrayLink, TRAY_KEYS, PRODUCT_KEYS, PRODUCT_DEFAULTS, CURRENT_LINK_VERSION} from '../src/core/cookietraylink.js';

const results = [];
function t(name, fn){
  try{ fn(); results.push(`PASS  ${name}`); }
  catch(e){ results.push(`FAIL  ${name}: ${e.message || e}`); }
}
function eq(actual, expected, msg = ''){
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if(a !== b) throw new Error(`${msg} expected ${b}, got ${a}`);
}
const ok = (cond, msg) => { if(!cond) throw new Error(msg); };
const near = (a, b, msg, tol = 1e-9) => {
  if(!(Math.abs(a - b) <= tol)) throw new Error(`${msg} expected ${b}, got ${a} (Δ${a - b})`);
};

t('GROUND TRUTH: a real Cookie-Tray share link reproduces its own stated cell values exactly', () => {
  // The exact link a user supplied: round product (defaults: diameter 45,
  // thickness 12), packMode=stack, 2 columns, qty 7, 2 cookies/cell => nCells
  // defaults to 3 (unstated). This is the same cross-check cookietray.js's
  // own header cites, re-run here so it stays a live pin, not just prose.
  const p = deriveTrayParams({qtyTotal: 7, nCells: 3, nCols: 2, packMode: 'stack',
    productType: 'round', cookieDiameter: 45, cookieThickness: 12});
  near(p.cellLen, 48, 'cellLen (their cl=48):');
  near(p.cradleR, 2.5, 'cradleR (their cr=2.5):');
  near(p.cellH, 28, 'cellH (their ch, unstated but derived — matches the deployed app):');
});

/* ---------- the handoff: the expression the integration rests on ---------- */

t('HANDOFF: envelope L/W is the MAX cross-section (flange), never the tapered base', () => {
  const p = trayParams({draftDeg: 8, wall: 6, cellLen: 180, cellWid: 50, cellH: 30, nCells: 3});
  ok(p.draftOffset > 0, 'this fixture must actually be drafted');
  ok(p.bottomL < p.topL && p.bottomW < p.topW, 'drafted base must be inset');
  const o = trayOuter(p);
  eq(o.L, p.outerL, 'envelope L is the flange (max section):');
  eq(o.W, p.outerW, 'envelope W is the flange (max section):');
  ok(o.L > p.bottomL && o.W > p.bottomW, 'envelope must exceed the base, never equal it');
  // the specific regression this guards: handing up the base would undersize
  ok(o.L > p.topL && o.W > p.topW, 'flange extends beyond the rim, so the envelope exceeds the rim too');
});

t('HANDOFF: envelope H is max(tray overall, floor + proud product)', () => {
  // cellWid 30 keeps the default cradle (half-width, 15) inside cellH 20
  const p = trayParams({floor: 3, cellH: 20, lipH: 2, cellWid: 30});   // overallH = 3+20+2 = 25
  eq(p.overallH, 25, 'fixture overall height:');
  eq(trayOuter(p).H, 25, 'nothing proud -> the tray\'s own height:');
  eq(trayOuter(p, 10).H, 25, 'product inside the cells -> still the tray height:');
  eq(trayOuter(p, 30).H, 33, 'proud product -> floor + standing height:');
  eq(isProud(p, 10), false, 'not proud:');
  eq(isProud(p, 30), true, 'proud:');
  // and a negative/absent standing height can never shrink the envelope
  eq(trayOuter(p, 0).H, 25, 'zero:');
  eq(trayOuter(p, -5).H, 25, 'negative is ignored, never shrinks:');
});

t('HANDOFF: longAxis Y swaps the placed footprint (rotation is applied here)', () => {
  const x = trayParams({longAxis: 'X', cellLen: 200, cellWid: 40, nCells: 2});
  const y = trayParams({longAxis: 'Y', cellLen: 200, cellWid: 40, nCells: 2});
  const ox = trayOuter(x), oy = trayOuter(y);
  ok(ox.L !== ox.W, 'fixture must be non-square for this to mean anything');
  eq([oy.L, oy.W], [ox.W, ox.L], 'Y rotates the footprint 90°:');
  eq(oy.H, ox.H, 'rotation about the vertical leaves H alone:');
  // upstream's own outer_L/outer_W stay in the UNROTATED frame — assert we
  // did not silently change that, only how the envelope is presented
  eq(y.outerL, x.outerL, 'params stay unrotated (upstream parity):');
  eq(y.footprint, x.footprint, 'footprint is rotation-invariant either way:');
});

/* ---------- guards + clamps ---------- */

t('hard guards throw with a usable message', () => {
  const throws = (inp, re, what) => {
    try{ trayParams(inp); }catch(e){ if(re.test(e.message)) return; throw new Error(`${what}: wrong message "${e.message}"`); }
    throw new Error(`${what}: expected a throw`);
  };
  throws({nCells: 0}, /nCells/, 'nCells < 1');
  throws({longAxis: 'Z'}, /longAxis/, 'bad axis');
  throws({cellH: 5, cradleR: 20, cellWid: 40}, /cellH/, 'cradle deeper than the trough');
  throws({wall: 0.1}, /wall/, 'wall under MIN_WALL');
  throws({floor: 0}, /floor/, 'zero floor');
  throws({cornerR: 0.5, wall: 6, draftDeg: 10}, /cornerR/, 'corner consumed by draft');
  throws({stripL: 0.5, nozzle: 0.42}, /stripL/, 'lip eats the strip');
  throws({divider: 0.1}, /divider/, 'divider under MIN_DIVIDER');
  throws({lipH: 0}, /lipH/, 'zero lip');
  throws({flangeT: 0}, /flangeT/, 'zero flange');
  throws({nozzle: -1}, /nozzle/, 'negative nozzle');
});

t('clamps report on warnings instead of throwing (a clamp is a valid fallback)', () => {
  const over = trayParams({cellWid: 40, cradleR: 999});
  eq(over.cradleR, 20, 'cradle clamped to half-width:');
  ok(over.warnings.some(w => /cradleR/.test(w)), 'clamp reported');
  const neg = trayParams({draftDeg: -5});
  eq(neg.draftDeg, 0, 'negative draft clamped to none:');
  ok(neg.warnings.some(w => /draft/i.test(w)), 'clamp reported');
  // the fillet clamp is silent upstream, so it is silent here too
  const fil = trayParams({cellWid: 40, cellLen: 100, cellFillet: 999});
  near(fil.cellFillet, 19.99, 'fillet clamped to geometric validity:');
  ok(!fil.warnings.some(w => /fillet/i.test(w)), 'fillet clamp must stay silent (upstream parity)');
});

t('thin wall reduces the draft ANGLE rather than the taper stopping partway', () => {
  const p = trayParams({wall: 1.0, draftDeg: 12, cellH: 50, floor: 3});
  near(p.draftOffset, Math.max(0, 1.0 - MIN_WALL), 'inset limited by the wall:');
  ok(p.effectiveDraftDeg > 0 && p.effectiveDraftDeg < 12, 'angle shrank instead of the taper stopping');
  ok(p.warnings.some(w => /Draft reduced/i.test(w)), 'reduction reported');
  // and the shrunken angle reproduces the inset exactly over the FULL height
  near(p.H*Math.tan(p.effectiveDraftDeg*Math.PI/180), p.draftOffset, 'angle is continuous over H:', 1e-9);
});

/* ---------- the inverse path ---------- */

t('inverse: qty distributes into cells, and cellLen follows the pitch', () => {
  const p = deriveTrayParams({qtyTotal: 24, cookieDiameter: 45, cookieThickness: 12,
                              nCells: 3, sideClearance: 1.5, endClearance: 3});
  eq(p.nCells, 3, 'cells:');
  near(p.cellWid, 45 + 2*1.5, 'cellWid = diameter + 2×side clearance:');
  near(p.cellLen, 8*12 + 3, 'cellLen = perCell × pitch + end clearance:');
  near(p.cradleR, p.cellWid/2, 'round product cradles at the full half-width:');
});

t('inverse: perCell and nCells are the two directions of the same split', () => {
  const a = deriveTrayParams({qtyTotal: 24, cookieDiameter: 45, cookieThickness: 12, perCell: 8});
  eq(a.nCells, 3, 'perCell -> nCells:');
  const b = deriveTrayParams({qtyTotal: 25, cookieDiameter: 45, cookieThickness: 12, nCells: 3});
  near(b.cellLen, 9*12 + 3, 'a remainder rounds the per-cell count UP:');
  // exactly one of the two must be supplied
  let threw = 0;
  for(const bad of [{}, {nCells: 2, perCell: 5}])
    try{ deriveTrayParams({qtyTotal: 10, cookieDiameter: 45, cookieThickness: 12, ...bad}); }
    catch(e){ threw++; }
  eq(threw, 2, 'both/neither rejected:');
});

t('inverse: a rectangle gets the fixed 5mm cradle, not a half-width one', () => {
  const r = deriveTrayParams({qtyTotal: 12, productType: 'rectangle', productWidth: 60,
                              productHeight: 20, productThickness: 10, nCells: 2});
  near(r.cellWid, 60 + 2*1.5, 'cellWid from product width:');
  near(r.cradleR, 5, 'rectangles get the modest fixed cradle:');
  ok(r.cradleR < r.cellWid/2, 'and it is well under the half-width');
  // a round product this wide cradles at 31.5, so the trough has to be deep
  // enough for it — the same guard, doing its job
  const round = deriveTrayParams({qtyTotal: 12, cookieDiameter: 60, cookieThickness: 10,
                                  nCells: 2, cellH: 35});
  near(round.cradleR, round.cellWid/2, 'round still hugs the full half-width:');
});

t('inverse: cradle clearance shaves the cradle but never past zero', () => {
  const p = deriveTrayParams({qtyTotal: 8, cookieDiameter: 40, cookieThickness: 10,
                              nCells: 2, cradleClearance: 2});
  near(p.cradleR, 40/2 + 1.5 - 2, 'clearance subtracts:');
  const huge = deriveTrayParams({qtyTotal: 8, productType: 'rectangle', productWidth: 40,
                                 productHeight: 10, productThickness: 10, nCells: 2,
                                 cradleClearance: 500});
  ok(huge.cradleR > 0, 'never clamps to zero or negative');
});

t('inverse: bad product specs are rejected, not silently defaulted', () => {
  const bad = [
    {qtyTotal: 0, cookieDiameter: 40, cookieThickness: 10, nCells: 2},
    {qtyTotal: 8, cookieThickness: 10, nCells: 2},                       // no diameter
    {qtyTotal: 8, cookieDiameter: -5, cookieThickness: 10, nCells: 2},
    {qtyTotal: 8, productType: 'rectangle', productWidth: 40, nCells: 2},// no height/thickness
    {qtyTotal: 8, productType: 'triangle', nCells: 2}
    // NOTE: an earlier case here passed `cellH: 0` expecting rejection.
    // Ground truth (the real app's own inverse function) does not read
    // cellH as an input at all -- it is always a derived OUTPUT in this
    // direction (deriveTrayParams computes it; it is never an override),
    // so there is nothing for this function to validate or reject.
  ];
  for(const b of bad){
    let threw = false;
    try{ deriveTrayParams(b); }catch(e){ threw = true; }
    ok(threw, `should reject ${JSON.stringify(b)}`);
  }
});

/* ---------- module hygiene ---------- */

t('the result is frozen (derived can never drift from its inputs)', () => {
  const p = trayParams();
  ok(Object.isFrozen(p), 'result must be frozen');
  const before = p.topL;
  try{ p.cellLen = 9999; }catch(e){ /* strict-mode throw is fine too */ }
  eq(p.topL, before, 'derived unchanged after an attempted write:');
});

t('defaults reproduce the upstream default tray', () => {
  const p = trayParams();
  eq(p.nCells, 3, 'cells:'); eq(p.cellLen, 170, 'cellLen:'); eq(p.cellWid, 48, 'cellWid:');
  near(p.topL, 176, 'topL:'); near(p.topW, 156, 'topW:');
  near(p.H, 30.5, 'H:'); near(p.outerL, 186, 'outerL:'); near(p.outerW, 166, 'outerW:');
  near(p.overallH, 33.5, 'overallH:');
  eq(MIN_WALL, 0.8, 'MIN_WALL:'); eq(MIN_DIVIDER, 0.8, 'MIN_DIVIDER:');
  ok(Object.isFrozen(TRAY_DEFAULTS), 'defaults frozen');
});

t('cradleR and divider default from other inputs, exactly as upstream', () => {
  const p = trayParams({cellWid: 50, wall: 4});
  eq(p.cradleR, 25, 'cradleR defaults to cellWid/2:');
  eq(p.divider, 4, 'divider defaults to wall:');
  eq(p.pitch, 54, 'pitch = cellWid + divider:');
  // and topW uses `wall` outside, `divider` between
  const q = trayParams({nCells: 3, cellWid: 50, wall: 4, divider: 2});
  eq(q.topW, 3*50 + 2*4 + 2*2, 'topW mixes wall (outside) and divider (between):');
});

/* ==================================================================
   CHAIN INTEGRATION — the tray as an optional level between the product
   collation and the wrap. The highest-risk piece is the proud-height
   handoff: the tray is an INNER open-top level, and solveSecondaryInner
   (the generic inner solve) never reads openTop, so routing the tray
   through it would silently cap the product at the tray rim. The tray has
   its own stage precisely to avoid that, and these tests are what prove it.
   ================================================================== */

const trayProject = (patch = {}) => {
  const p = newProject();
  p.interlayer = 'tray';
  Object.assign(p.tray, {nCells: 2}, patch);
  return p;
};

t('CHAIN: tray is OFF by default and the chain is untouched', () => {
  const off = newProject();
  eq(off.interlayer, 'none', 'default interlayer:');
  eq(off.tray.openTop, true, 'openTop is a fact of the part:');
  const a = resolveActiveRow(newProject(), '1mm');
  const b = resolveActiveRow(newProject(), '1mm');
  eq(a.cartonsPerPallet, b.cartonsPerPallet, 'deterministic:');
  // with the tray off the wrap still wraps the bare collation envelope
  const col = collate(newProject().primary.collation);
  ok(Math.abs(a.wrapOuter.W - col.envelope.W) < 1.0,
     `wrap should follow the collation (W ${col.envelope.W}) when no tray is present, got ${a.wrapOuter.W}`);
});

t('CHAIN: enabling the tray hands the WRAP the tray envelope, not the collation', () => {
  const col = collate(newProject().primary.collation);
  const r = resolveActiveRow(trayProject(), '1mm');
  const p = trayParams({nCells: 2, cellLen: col.envelope.L + 3, cellWid: col.envelope.W + 3,
                        cellH: (col.envelope.W + 3)/2, cradleR: (col.envelope.W + 3)/2});
  near(r.wrapOuter.W, p.outerW, 'wrap W is the tray flange width:', 1e-6);
  ok(r.wrapOuter.W > col.envelope.W, 'and it is bigger than the bare collation');
});

t('PROUD: a product standing above the cells sets the envelope height, not the rim', () => {
  const col = collate(newProject().primary.collation);      // H = 24
  // a deliberately SHALLOW trough so the product genuinely stands proud
  const r = resolveActiveRow(trayProject({params: {cellH: 10}}), '1mm');
  const cellWid = col.envelope.W + 3;
  const p = trayParams({nCells: 2, cellLen: col.envelope.L + 3, cellWid,
                        cellH: 10, cradleR: Math.min(cellWid/2, 10)});
  const rim = p.overallH;                                   // 2.5 + 10 + 3 = 15.5
  const productTop = p.floor + col.envelope.H;              // 2.5 + 24 = 26.5
  ok(productTop > rim, `fixture must actually be proud (top ${productTop} vs rim ${rim})`);
  eq(isProud(p, col.envelope.H), true, 'isProud:');
  // THE assertion: the wrap was sized to the product top, never the tray rim.
  // The wrap adds a little film compensation, so compare against the floor.
  ok(r.wrapOuter.H >= productTop - 1e-6,
     `wrap H ${r.wrapOuter.H} must reflect the product top ${productTop}`);
  // and it must be on the PRODUCT-TOP side of the rim, not the rim itself:
  // capping at the rim is exactly what the open-top trap would produce
  ok(r.wrapOuter.H > rim + 1e-6,
     `wrap H ${r.wrapOuter.H} is at or below the tray rim ${rim} — the proud height was LOST ` +
     `(this is the solveSecondaryInner open-top trap)`);
});

t('PROUD: standing above the cells is never reported as "does not fit"', () => {
  for(const cellH of [10, 6, 4]){                            // ever more proud
    const r = resolveActiveRow(trayProject({params: {cellH}}), '1mm');
    ok(r, `no row at cellH ${cellH}`);
    eq(r.primaryFits, true, `cellH ${cellH} primaryFits:`);
    eq(r.wrapFits, true, `cellH ${cellH} wrapFits:`);
    eq(r.secondaryFits, true, `cellH ${cellH} secondaryFits:`);
    eq(r.tertiaryFits, true, `cellH ${cellH} tertiaryFits:`);
    ok(r.cartonsPerPallet > 0, `cellH ${cellH} must still palletize`);
  }
});

t('PROUD: a shallower trough gives a SHORTER pack (height tracks the product, then the tray)', () => {
  const col = collate(newProject().primary.collation);
  const deep = resolveActiveRow(trayProject(), '1mm');                        // auto depth
  const shallow = resolveActiveRow(trayProject({params: {cellH: 10}}), '1mm'); // proud
  ok(shallow.wrapOuter.H < deep.wrapOuter.H,
     `shallower tray should pack shorter: ${shallow.wrapOuter.H} vs ${deep.wrapOuter.H}`);
  // once proud, the height is pinned to the product and stops following the tray
  const a = resolveActiveRow(trayProject({params: {cellH: 6}}), '1mm');
  const b = resolveActiveRow(trayProject({params: {cellH: 4}}), '1mm');
  near(a.wrapOuter.H, b.wrapOuter.H, 'proud height is the product, not the trough:', 1e-6);
});

t('HANDOFF in the chain: the wrap gets the flange width, never the drafted base', () => {
  const r = resolveActiveRow(trayProject({params: {draftDeg: 8, wall: 6}}), '1mm');
  const col = collate(newProject().primary.collation);
  const cellWid = col.envelope.W + 3;
  const p = trayParams({nCells: 2, cellLen: col.envelope.L + 3, cellWid,
                        cellH: cellWid/2, cradleR: cellWid/2, draftDeg: 8, wall: 6});
  ok(p.draftOffset > 0, 'fixture must be drafted');
  ok(p.bottomW < p.topW, 'and its base must be inset');
  near(r.wrapOuter.W, p.outerW, 'wrap took the flange (max section):', 1e-6);
  ok(r.wrapOuter.W > p.bottomW + 1e-6, 'and NOT the tapered base');
});

t('CHAIN: cell count multiplies the piece count (tray owns cells, collation owns per-cell)', () => {
  const col = collate(newProject().primary.collation);       // 6 per cell
  const two  = resolveActiveRow(trayProject({nCells: 2}), '1mm');
  const four = resolveActiveRow(trayProject({nCells: 4}), '1mm');
  ok(two.piecesPerCarton % (2*col.count) === 0, 'pieces/carton is a multiple of the tray load');
  eq(four.piecesPerCarton, two.piecesPerCarton*2, 'doubling the cells doubles pieces per carton:');
});

t('CHAIN: a cell too small in PLAN is a real misfit (footprint constrains)', () => {
  const col = collate(newProject().primary.collation);       // L 141, W 47
  // override the cell narrower than the product actually is
  const bad = trayProject({params: {cellWid: col.envelope.W - 10, cellH: 8}});
  const r = resolveActiveRow(bad, '1mm');
  ok(r, 'still resolves (a misfit is reported, not thrown)');
  // the tray stage flags it; height never does
  const ok2 = resolveActiveRow(trayProject({params: {cellH: 4}}), '1mm');
  eq(ok2.primaryFits, true, 'a merely-proud tray is NOT a misfit:');
});

t('CHAIN: downstream levels all still solve off the tray envelope', () => {
  const r = resolveActiveRow(trayProject({params: {cellH: 10}}), '1mm');
  ok(r.wrapOuter && r.wrapOuter.L > 0, 'wrap solved');
  ok(r.cartonOuter && r.cartonOuter.L > 0, 'carton solved');
  ok(r.outer && r.outer.L > 0, 'case solved');
  ok(r.casesPerPallet > 0 && r.cartonsPerPallet > 0, 'pallet solved');
  ok(r.cubeUtilPct > 0, 'cube utilisation computed');
  ok(Array.isArray(r.patternList) && r.patternList.length > 0, 'pallet patterns enumerated');
});

t('CHAIN: the auto cradle follows a shallow trough instead of throwing', () => {
  // upstream defaults cradleR to the half-width, which its own guard rejects
  // once the trough is shallower — the auto path must not expose that
  for(const cellH of [12, 8, 5, 3]){
    let threw = null;
    try{ resolveActiveRow(trayProject({params: {cellH}}), '1mm'); }catch(e){ threw = e.message; }
    ok(!threw, `cellH ${cellH} should not throw, got: ${threw}`);
  }
  // an EXPLICIT cradle override is still honoured, guard and all
  let threw = false;
  try{ resolveActiveRow(trayProject({params: {cellH: 5, cradleR: 25}}), '1mm'); }catch(e){ threw = true; }
  ok(threw, 'an explicit over-deep cradle must still be rejected');
});

/* ==================================================================
   Cookie-Tray share-link round trip. Their app keeps its whole config in
   the querystring with compact keys and DEFAULTS OMITTED; we speak the
   same scheme in both directions so a link crosses either way.
   ================================================================== */

t('LINK: parses the documented share-link shape', () => {
  const r = parseTrayLink('https://trtle4.github.io/Cookie-Tray/?n=4&cl=219&ch=30&cr=24&qty=72&ncp=4');
  ok(r, 'should parse');
  eq(r.nCells, 4, 'n:');
  eq(r.params.cellLen, 219, 'cl:');
  eq(r.params.cellH, 30, 'ch:');
  eq(r.params.cradleR, 24, 'cr:');
  eq(r.product.qtyTotal, 72, 'qty:');
  eq(r.product.nCellsProduct, 4, 'ncp:');
});

t('LINK: absent keys take COOKIE-TRAY defaults, not our auto-derivation', () => {
  // their omit-defaults convention means a missing key is their DEFAULT
  // value, so importing must pin it — treating it as "auto" would rebuild a
  // different tray than the link describes
  const r = parseTrayLink('?n=2&cl=200');
  eq(r.params.wall, 3, 'wall falls back to their default:');
  eq(r.params.floor, 2.5, 'floor:');
  eq(r.params.draftDeg, 5, 'draft:');
  eq(r.params.lipH, 3, 'lip:');
  eq(r.params.longAxis, 'X', 'long axis:');
  // ...but a default of null (derive) is dropped, preserving auto semantics
  ok(!('cradleR' in r.params) || typeof r.params.cradleR === 'number',
     'a null default must not be stored as null');
});

/** Build a querystring the way Cookie-Tray's OWN encodeGroup actually would:
 *  a field whose value equals its default is OMITTED, never sent — the
 *  encoder's own rule (`if (typeof d === "number" && Math.abs(num - d) <
 *  1e-9) continue`), reproduced here so a fixture can exhibit the sparse-
 *  link condition instead of hand-writing a complete key set (a fixture
 *  with every key present never reaches the code path the omission bug
 *  lives in — CLAUDE.md's own fixture-hygiene rule). `spec` may be a
 *  PARTIAL product spec; only the keys given are considered, matching a
 *  caller who's stating a full product but expects defaults to fall away. */
function encodeProductLikeCookieTray(spec){
  const out = new URLSearchParams();
  for(const [long, short] of Object.entries(PRODUCT_KEYS)){
    if(!(long in spec)) continue;
    const v = spec[long], d = PRODUCT_DEFAULTS[long];
    if(typeof v === 'number' && typeof d === 'number' && Math.abs(v - d) < 1e-9) continue;
    if(typeof v === 'string' && v === d) continue;
    out.set(short, typeof v === 'number' ? String(v) : v);
  }
  return out.toString();
}
/** Same omission rule, for the TRAY half (TRAY_KEYS/TRAY_DEFAULTS) — a
 *  sibling to encodeProductLikeCookieTray above, needed because nCols
 *  ('nc') lives in TRAY_KEYS, not PRODUCT_KEYS. */
function encodeTrayLikeCookieTray(spec){
  const out = new URLSearchParams();
  for(const [long, short] of Object.entries(TRAY_KEYS)){
    if(!(long in spec)) continue;
    const v = spec[long], d = TRAY_DEFAULTS[long];
    if(typeof v === 'number' && typeof d === 'number' && Math.abs(v - d) < 1e-9) continue;
    if(typeof v === 'string' && v === d) continue;
    out.set(short, typeof v === 'number' ? String(v) : v);
  }
  return out.toString();
}

/* THEIR resolution rule, modelled honestly. Cookie-Tray's decoder keeps only
   the keys actually present (verified against the deployed bundle: it iterates
   its key maps and skips `!params.has(short)`), and an absent CELL DIMENSION
   then means AUTO — their app re-derives it from the product spec, using its
   OWN clearances, which no URL key can carry. An absent SHELL param falls back
   to their static default table.

   Our importer (parseTrayLink) deliberately resolves absences to their static
   defaults instead, because that is right for a link THEY generated. Using it
   to check our own export therefore validates our encoder against our
   encoder — which is exactly why the export bug survived a green round-trip
   pin. This models their side instead. */
const THEIR_CLEARANCE = {sideClearance: 1.5, endClearance: 3, cradleClearance: 0};
const AUTO_CELL_KEYS = ['cellLen', 'cellWid', 'cellH', 'cradleR'];
function resolveAsCookieTray(url){
  const qs = new URLSearchParams(url.split('?')[1]);
  const num = (k, d) => qs.has(k) ? parseFloat(qs.get(k)) : d;
  // product half: present keys, else their static defaults
  const pd = PRODUCT_DEFAULTS;
  const spec = {
    productType: qs.get('pty') || pd.productType,
    packMode: qs.get('pkm') || pd.packMode,
    cookieDiameter: num('pdia', pd.cookieDiameter), cookieThickness: num('pthk', pd.cookieThickness),
    productWidth: num('pw', pd.productWidth), productHeight: num('ph', pd.productHeight),
    productThickness: num('ptk', pd.productThickness),
    qtyTotal: num('qty', pd.qtyTotal),
    nCells: num('ncp', pd.nCellsProduct),
    ...THEIR_CLEARANCE                       // NOT expressible in a link — always theirs
  };
  // shell half: present keys, else their static defaults (TRAY_DEFAULTS mirrors them)
  const shell = {};
  for(const [long, short] of Object.entries(TRAY_KEYS)){
    if(AUTO_CELL_KEYS.includes(long) || long === 'nCells') continue;
    shell[long] = qs.has(short)
      ? (long === 'longAxis' ? qs.get(short) : parseFloat(qs.get(short)))
      : TRAY_DEFAULTS[long];
  }
  // what THEY derive for the auto-capable dims, from the product half alone.
  // LAZY on purpose: their derive only runs for fields the link leaves to auto,
  // so a link that states everything never reaches it (and can never be
  // rejected by a guard that only the auto values would have tripped).
  let _derived = null;
  const derived = () => (_derived ||= deriveTrayParams({...shell, ...spec, cellH: num('ch', 28)}));
  const cell = {};
  for(const k of AUTO_CELL_KEYS)
    cell[k] = qs.has(TRAY_KEYS[k]) ? parseFloat(qs.get(TRAY_KEYS[k])) : derived()[k];
  const nCells = qs.has('n') ? Math.round(parseFloat(qs.get('n'))) : derived().nCells;
  return trayParams({...shell, ...cell, nCells});
}

/* The fixed-point test above only proves export -> import is stable WITHIN
   this app. This is the direction that was never checked: hand our link's
   PRODUCT half to the ported derive_params — what Cookie-Tray does when it
   re-derives from a product spec — and require the tray it builds to be the
   tray we display. Deliberately does NOT feed `cl`/`cw` back in: honouring our
   own explicit cell dims would make it vacuous, and it is precisely when they
   re-derive that a second derivation over here shows up as a different tray. */
const crossAppTray = colPatch => {
  const p = trayProject();
  Object.assign(p.primary.collation, {
    piece: {kind: 'cylinder', diameter: 47, thickness: 12},
    pieceOrientation: 'on-edge', stackAxis: 'X', perStack: 10, nx: 1, ny: 1
  }, colPatch);
  const mine = resolveActiveRow(p, '1mm').tray;
  const qs = new URLSearchParams(buildTrayLink(p, mine).split('?')[1]);
  const numOr = (k, d) => qs.has(k) ? +qs.get(k) : d;
  const spec = {
    qtyTotal: numOr('qty', 24), nCells: numOr('ncp', 3),
    productType: qs.get('pty') || 'round',
    cookieDiameter: numOr('pdia', 45), cookieThickness: numOr('pthk', 12),
    productWidth: numOr('pw', 45), productHeight: numOr('ph', 20),
    productThickness: numOr('ptk', 12),
    cellH: numOr('ch', 28)
  };
  // every structural tray key the link carries, honoured as an override — but
  // never the cell dims, which are what derive_params exists to recompute
  for(const [long, short] of Object.entries(TRAY_KEYS)){
    if(['nCells', 'cellLen', 'cellWid', 'cellH', 'cradleR', 'longAxis'].includes(long)) continue;
    if(qs.has(short)) spec[long] = +qs.get(short);
  }
  return {mine, theirs: deriveTrayParams(spec)};
};
const sameTrayBothSides = (label, colPatch) => {
  const {mine, theirs} = crossAppTray(colPatch);
  near(theirs.cellLen, mine.params.cellLen, `${label} — cell length across the two apps:`, 1e-9);
  near(theirs.cellWid, mine.params.cellWid, `${label} — cell WIDTH across the two apps:`, 1e-9);
  near(theirs.outerL, mine.params.outerL, `${label} — tray outer L:`, 1e-9);
  near(theirs.outerW, mine.params.outerW, `${label} — tray outer W:`, 1e-9);
  // and therefore the envelope the rest of the chain is built on
  const theirEnv = trayOuter(theirs, mine.standingH);
  near(theirEnv.L, mine.outer.L, `${label} — envelope L:`, 1e-9);
  near(theirEnv.W, mine.outer.W, `${label} — envelope W:`, 1e-9);
  near(theirEnv.H, mine.outer.H, `${label} — envelope H:`, 1e-9);
};

/* ==================================================================
   THE 2D GRID (task: "there can be a grid even asymmetrical") + packMode
   ("stack" vs "standing"). GROUND-TRUTH CORRECTION: an earlier version of
   this section modelled the grid as N independent ROWS, each its own
   cell SIZE — guessed, before this app's source was reachable. Reading the
   real deployed app's own production JS bundle (there is no public source
   repo — see the file header) showed the actual model is the opposite
   split: cell SIZE (cellLen/cellWid/cellH/cradleR) is UNIFORM across the
   whole tray; only pocket COUNT varies row to row, via `nCols` (uniform) or
   `nColsPerRow` (a per-row override array, one entry per row — cookietray.js
   `p.cols`). A shorter row is CENTERED within the tray's own length, which
   follows the WIDEST row (`topL`). Likewise "lay-flat" is not a parallel
   `orientation`/`ori` field: it's the real `packMode` ('standing'|'stack'),
   which already maps onto this app's EXISTING collation `stackAxis` ('X' vs
   'Z') with no new field at all (trayAutoCells's doc) — the earlier `ori`
   key and its cellWid-widens-when-flat physical model were both invented,
   not real; the real rule (deriveTrayParams' `Bf`) is `packPitchOf` is
   ALWAYS thickness, and packMode instead swaps WHICH of cellLen/cellH scales
   with the stacked/spread count. Box orientation is still deliberately
   unchanged — see collation.js and cookietray.js's packPitchOf doc; that
   reasoning didn't depend on the row model and still holds. */

t('GRID: a 2-row grid sums the WIDEST row\'s own pocket span (pockets + colDividers), and the shorter row centres within it', () => {
  const p = trayParams({wall: 3, divider: 3, colDivider: 2, cellLen: 50, cellWid: 40, cellH: 20,
    nCells: 2, nColsPerRow: [3, 1]});
  eq(p.cols, [3, 1], 'cols mirrors nColsPerRow exactly:');
  eq(p.maxCols, 3, 'maxCols is the widest row:');
  const row0Span = 3*50 + 2*2;                          // 3 pockets, 2 colDividers between them
  near(p.topL, row0Span + 2*3, 'topL = widest row\'s span + 2*wall (row 1\'s single pocket centres within it):');
  near(p.topW, 2*40 + 2*3 + 1*3, 'topW is the plain row formula -- ROW count and divider only, unaffected by pockets:');
});

t('GRID: nColsPerRow absent (or the wrong length) falls back to the uniform nCols for every row', () => {
  const uniform = trayParams({cellLen: 50, cellWid: 40, cellH: 20, nCells: 3, nCols: 2});
  eq(uniform.cols, [2, 2, 2], 'every row gets the uniform nCols:');
  // trayParams() itself is the one place that validates nColsPerRow -- a
  // caller who hands it a length that does not match nCells (project.js's
  // solveTrayStage already guards against this before it ever gets here,
  // falling back to null) gets a real rejection, not a silent coercion.
  let threw = null;
  try{ trayParams({cellLen: 50, cellWid: 40, cellH: 20, nCells: 3, nCols: 2, nColsPerRow: [1, 1]}); }
  catch(e){ threw = e; }
  ok(threw, 'a length that does not match nCells must be rejected:');
});

t('GRID: cell size is UNIFORM -- H depends on the ONE cellH, never on row or pocket count', () => {
  const one = trayParams({cellLen: 50, cellWid: 40, cellH: 22, nCells: 1});
  const grid = trayParams({cellLen: 50, cellWid: 40, cellH: 22, nCells: 3, nColsPerRow: [3, 1, 2]});
  near(one.H, grid.H, 'H is the same regardless of how many rows/pockets share that one cellH:');
});

t('GRID: cradleR clamps against the UNIFORM cellWid/2, and a too-shallow cellH throws (no per-row exception)', () => {
  const p = trayParams({cellLen: 50, cellWid: 40, cellH: 30, cradleR: 100, nCells: 2, nCols: 2});
  near(p.cradleR, 20, 'cradleR clamps to cellWid/2 (40/2):');
  ok(p.warnings.some(w => /cradleR/i.test(w)), `the clamp should warn, got: ${JSON.stringify(p.warnings)}`);
  let threw = null;
  try{ trayParams({cellLen: 50, cellWid: 40, cellH: 5, cradleR: 20, nCells: 2, nCols: 2}); }
  catch(e){ threw = e; }
  ok(threw, 'a cellH shallower than cradleR must throw regardless of the grid:');
});

t('LINK: a custom per-row grid round-trips through ncr; a uniform grid never sends it', () => {
  const p = trayProject();
  p.tray.nCells = 2;
  (p.tray.params || (p.tray.params = {})).nCols = 3;
  p.tray.nColsPerRow = [3, 1];
  Object.assign(p.primary.collation, {piece: {kind: 'cylinder', diameter: 44, thickness: 11},
    pieceOrientation: 'on-edge', stackAxis: 'X', perStack: 8, nx: 1, ny: 1, stackGap: 0, pieceGap: 0});
  const mine = resolveActiveRow(p, '1mm').tray;
  const link = buildTrayLink(p, mine);
  ok(link.includes('ncr='), 'a custom per-row grid must carry ncr:');
  const parsed = parseTrayLink(link);
  eq(parsed.nColsPerRow, [3, 1], 'ncr round-trips to the same array:');
  eq(parsed.unknownKeys.length, 0, `no unknown keys expected, got: ${parsed.unknownKeys.join(',')}`);

  const uniformP = trayProject();
  const uniformMine = resolveActiveRow(uniformP, '1mm').tray;
  ok(!buildTrayLink(uniformP, uniformMine).includes('ncr='), 'a uniform grid must not carry ncr:');
});

t('LINK: a real Cookie-Tray link (no ncr/pkm) still imports exactly as before -- packMode defaults to standing', () => {
  const bareLink = 'https://trtle4.github.io/Cookie-Tray/?n=4&cl=219&ch=30&cr=24&qty=72&ncp=4';
  const parsed = parseTrayLink(bareLink);

  eq(parsed.product.packMode, 'standing', 'packMode defaults to standing -- Cookie-Tray\'s own default:');
  eq(parsed.unknownKeys.length, 0, `a real link must carry no unknown keys, got: ${parsed.unknownKeys.join(',')}`);
});

t('LINK: packMode round-trips via pkm, and swaps which of cellLen/cellH scales with the stacked count', () => {
  const p = trayProject();
  Object.assign(p.primary.collation, {piece: {kind: 'cylinder', diameter: 44, thickness: 11},
    pieceOrientation: 'flat', stackAxis: 'Z', perStack: 8, nx: 1, ny: 1, stackGap: 0, pieceGap: 0});

t('PACKMODE: standing paces cellLen by thickness and cellH by diameter; stack does the opposite -- cellWid is unaffected either way', () => {
  const mk = (orient, axis) => {
    const p = trayProject();
    Object.assign(p.primary.collation, {piece: {kind: 'cylinder', diameter: 44, thickness: 11},
      pieceOrientation: orient, stackAxis: axis, perStack: 8, nx: 1, ny: 1, stackGap: 0, pieceGap: 0});
    return resolveActiveRow(p, '1mm').tray;
  };
  const standing = mk('on-edge', 'X'), stack = mk('flat', 'Z');
  near(standing.params.cellWid, stack.params.cellWid, 'cellWid (across) is diameter-based regardless of packMode:', 1e-6);
  near(standing.params.cellLen, 8*11 + 3, 'standing: cellLen = perCol*thickness + endClearance:', 1e-6);
  near(standing.params.cellH, 44 + 4, 'standing: cellH = diameter + 4 (their fixed margin):', 1e-6);
  near(stack.params.cellLen, 44 + 3, 'stack: cellLen = diameter + endClearance:', 1e-6);
  near(stack.params.cellH, 8*11 + 4, 'stack: cellH = perCol*thickness + 4:', 1e-6);
});

t('GRID: a custom per-row pocket split still fits its own auto-derived product, and a too-narrow override is a misfit', () => {
  const p = trayProject();
  p.tray.nCells = 2; p.tray.nColsPerRow = [2, 1];
  Object.assign(p.primary.collation, {pieceOrientation: 'on-edge', stackAxis: 'X', perStack: 10, nx: 1, ny: 1});
  const okTray = resolveActiveRow(p, '1mm').tray;
  eq(okTray.fits, true, 'an auto-derived grid always fits its own auto-derived product:');

  const p2 = trayProject();
  p2.tray.nCells = 1;
  Object.assign(p2.primary.collation, {pieceOrientation: 'on-edge', stackAxis: 'X', perStack: 10, nx: 1, ny: 2});   // 2 stacks across
  const badTray = resolveActiveRow(p2, '1mm').tray;
  eq(badTray.fits, false, 'a collation wider than one stack must fail regardless of the grid:');
  ok(/one stack per cell/.test(badTray.misfitReason), `misfit reason should name the cause, got: "${badTray.misfitReason}"`);
});

t('GRID: a product taller than the cells still fits (footprint constrains, height does not) and reports proud', () => {
  const p = trayProject();
  Object.assign(p.tray.params || (p.tray.params = {}), {cellH: 5, cradleR: 2});   // shallow, forced
  Object.assign(p.primary.collation, {piece: {kind: 'cylinder', diameter: 44, thickness: 60},
    pieceOrientation: 'on-edge', stackAxis: 'X', perStack: 1, nx: 1, ny: 1, stackGap: 0, pieceGap: 0});
  const tray = resolveActiveRow(p, '1mm').tray;
  eq(tray.fits, true, 'a tall product must still fit -- height is never a fit criterion at tray level:');
  eq(tray.proud, true, 'and must be reported proud:');
});

/* ---- enum exhaustiveness: resolveWrapContents' switch is the ONE site
   allowed to branch on project.interlayer. Every declared enum member
   must resolve without throwing; anything NOT in the enum (Phase B's
   'uboard' before it lands, or a typo) must throw immediately, loudly,
   from the very first chain resolve that touches it -- never silently
   fall through to whichever branch happens to run last. This is the
   plain-JS instrument for exhaustiveness this codebase has (no compiler,
   no lint rule to hold a switch exhaustive): a default case that refuses
   to guess, on the ONE switch site that exists. */
t('interlayer exhaustiveness: every declared enum member resolves without throwing', () => {
  for(const kind of INTERLAYERS){
    const p = newProject();
    p.interlayer = kind;
    if(kind === 'tray'){ p.tray.nCells = 2; }
    let threw = null;
    try{ resolveActiveRow(p, '1mm'); }catch(e){ threw = e; }
    if(threw) throw new Error(`interlayer:'${kind}' (a declared enum member) threw: ${threw.message}`);
  }
});
t('interlayer exhaustiveness: an UNDECLARED value throws immediately, never silently resolves', () => {
  for(const bogus of ['uboard', 'bogus', undefined, '']){
    if(INTERLAYERS.includes(bogus)) continue;
    const p = newProject();
    p.interlayer = bogus;
    let threw = null;
    try{ resolveActiveRow(p, '1mm'); }catch(e){ threw = e; }
    if(!threw) throw new Error(`interlayer:${JSON.stringify(bogus)} resolved without throwing -- an unhandled enum value must fail loudly, not silently pick a branch`);
    if(!/interlayer/i.test(threw.message)) throw new Error(`threw, but the message doesn't name the problem: "${threw.message}"`);
  }
});
