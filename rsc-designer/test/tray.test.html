<!doctype html>
<meta charset="utf-8">
<title>tray (FEFCO 0300, four-corner glued tray) tests</title>
<pre id="out">running…</pre>
<script type="module">
/* Unit tests for the FEFCO 0300 die-cut tray, REBUILT from the reference
   dieline DXF. Construction: a rectangular base, four walls folding up, and
   four corner tabs on the top/bottom walls that fold in against the plain
   left/right walls, separated by a full-depth corner cut gap. NO taper, no
   diagonal, no flared flap.

   Reference case, hand-derived: L=100 W=60 H=30 t=3 cornerGap=8
   -> base offset to (H,H): base [30,30]-[130,90]
      blank [0,0]-[160,120] = (L+2H) x (W+2H)
      hg = cornerGap/2 = 4
      left slot centred x=30 -> x in [26,34]; right slot x=130 -> [126,134]
      corner tab width = H - hg = 26; main bottom panel width = L - g = 92  */
import {trayGeometry} from '../src/core/styles/tray.js';

const results = [];
function t(name, fn){
  try{ fn(); results.push(`PASS  ${name}`); }
  catch(e){ results.push(`FAIL  ${name}: ${e.message || e}`); }
}
function approx(actual, expected, msg = ''){
  if(Math.abs(actual - expected) > 1e-9) throw new Error(`${msg} expected ${expected}, got ${actual}`);
}
function approxPt(actual, expected, msg = ''){
  approx(actual[0], expected[0], msg + '.x'); approx(actual[1], expected[1], msg + '.y');
}
function hasCrease(g, a){ return g.crease.some(c => c.every((v, i) => Math.abs(v - a[i]) < 1e-9)); }

const g = trayGeometry({L: 100, W: 60, H: 30, caliper: 3, cornerGap: 8});

t('bbox is the full blank extent (L+2H) x (W+2H), starting at the origin', () => {
  approx(g.bbox.minX, 0); approx(g.bbox.minY, 0);
  approx(g.bbox.maxX, 160, 'maxX = L+2H'); approx(g.bbox.maxY, 120, 'maxY = W+2H');
});

t('compensation: open tray gains board at the bottom ONLY -- H +t, L/W +2t, never the RSC +4t', () => {
  approx(g.outer.L, 106, 'L +2t'); approx(g.outer.W, 66, 'W +2t'); approx(g.outer.H, 33, 'H +t');
  approx(g.meta.boardLayersBottom, 1); approx(g.meta.boardLayersTop, 0);
});

t('perimeter is the 20-vertex four-corner-notched outline, exactly', () => {
  if(g.cut.length !== 20) throw new Error(`expected 20 cut points, got ${g.cut.length}`);
  const expected = [
    [0, 0],
    [26, 0], [26, 30], [34, 30], [34, 0],            // bottom-left slot
    [126, 0], [126, 30], [134, 30], [134, 0],        // bottom-right slot
    [160, 0],
    [160, 120],
    [134, 120], [134, 90], [126, 90], [126, 120],    // top-right slot
    [34, 120], [34, 90], [26, 90], [26, 120],        // top-left slot
    [0, 120]
  ];
  g.cut.forEach((pt, i) => approxPt(pt, expected[i], `cut[${i}]`));
});

t('each corner gap is a FULL-DEPTH cut: from the free edge to the base crease, separating tab from wall', () => {
  // the bottom-left slot's two sides go from y=0 (free edge) up to y=30 (=H,
  // the base crease line). A gap that stopped short (y not reaching 30) would
  // leave tab and wall joined -- the exact failure this must catch.
  approxPt(g.cut[2], [26, 30], 'left slot inner-left corner reaches the crease line y=H');
  approxPt(g.cut[3], [34, 30], 'left slot inner-right corner reaches the crease line y=H');
  approx(g.cut[3][1] - g.cut[1][1], 30, 'slot full depth = H (30), not short');
  approx(g.cut[3][0] - g.cut[2][0], 8, 'slot width = cornerGap');
});

t('corner tab width = H - cornerGap/2 (H minus a fold clearance, per the DXF), NOT H exactly', () => {
  approx(g.cut[1][0], 26, 'tab reaches to bx0 - cornerGap/2');
  approx(30 - 8/2, 26, 'H - cornerGap/2');
});

t('four base-bounding creases: bottom/top length L, left/right length W (girth = 2(L+W))', () => {
  if(!hasCrease(g, [30, 30, 130, 30]) || !hasCrease(g, [30, 90, 130, 90]))
    throw new Error('base bottom/top fold lines (length L) missing');
  if(!hasCrease(g, [30, 30, 30, 90]) || !hasCrease(g, [130, 30, 130, 90]))
    throw new Error('base left/right fold lines (length W) missing');
});

t('four corner-tab folds: the horizontal crease extensions over the tabs, length H each', () => {
  // together with the base bottom/top folds these reproduce the reference's
  // full-width horizontal crease lines (0 -> L+2H at y=H and y=W+H)
  if(!hasCrease(g, [0, 30, 30, 30]) || !hasCrease(g, [130, 30, 160, 30]))
    throw new Error('bottom corner-tab folds missing');
  if(!hasCrease(g, [0, 90, 30, 90]) || !hasCrease(g, [130, 90, 160, 90]))
    throw new Error('top corner-tab folds missing');
  approx(g.crease.length, 8, 'exactly 8 crease segments (4 base + 4 tab)');
});

t('left and right walls are plain: no fold along their own free edges, verticals span exactly W', () => {
  if(g.crease.some(c => c[0] === 0 && c[2] === 0)) throw new Error('a left wall should carry no fold of its own');
  if(g.crease.some(c => c[0] === 160 && c[2] === 160)) throw new Error('a right wall should carry no fold of its own');
  const verts = g.crease.filter(c => c[0] === c[2]);
  verts.forEach(c => { approx(Math.min(c[1], c[3]), 30, 'vert crease bottom = by0'); approx(Math.max(c[1], c[3]), 90, 'vert crease top = by1'); });
});

t('cornerGap is exposed and clamped; the flap-depth concept is gone', () => {
  approx(g.meta.cornerGap, 8, 'the resolved gap is reported');
  if('cornerFlapDepth' in g.meta) throw new Error('cornerFlapDepth must no longer exist on the tray');
  const clamped = trayGeometry({L: 100, W: 60, H: 30, caliper: 3, cornerGap: 999});
  if(clamped.meta.cornerGap > 100) throw new Error('cornerGap must clamp');
  const dflt = trayGeometry({L: 100, W: 60, H: 30, caliper: 3});
  approx(dflt.meta.cornerGap, 6, 'default gap = 2*caliper');
});

t('proportions match the reference: L=207 W=115 H=63 -> blank 333 x 241', () => {
  const r = trayGeometry({L: 207, W: 115, H: 63, caliper: 3, cornerGap: 13});
  approx(r.bbox.maxX, 207 + 2*63, 'blank width = L+2H = 333');
  approx(r.bbox.maxY, 115 + 2*63, 'blank height = W+2H = 241');
});

const fails = results.filter(r => r.startsWith('FAIL')).length;
document.getElementById('out').textContent =
  `${results.length - fails}/${results.length} passed\n\n` + results.join('\n');
window.__tests = {total: results.length, fails, results};
</script>
